name: Deploy

on:
  push:
    branches: [ main, deploy ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Build Docker image
        run: |
          docker build -t rt:latest .

      - name: Save Docker image
        run: |
          docker save rt:latest | gzip > app.tar.gz

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "app.tar.gz"
          target: "~/app/"
          strip_components: 0

      - name: Deploy using Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 30s
          command_timeout: 10m
          script: |
            bash -c '
            APP_DIR="$HOME/app"
            CONTAINER_NAME="rt_app"
            IMAGE_NAME="rt"
            PORT=81

            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "Loading Docker image..."
            docker load < app.tar.gz

            rm app.tar.gz

            echo "Stopping old container..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $PORT:80 \
              -e NODE_ENV=production \
              $IMAGE_NAME:latest

            echo "Waiting for service to start..."
            sleep 15

            echo "Container status:"
            docker ps | grep $CONTAINER_NAME

            echo "Performing health check..."
            for i in {1..6}; do
              if curl -f http://localhost:$PORT/health; then
                echo "Deployment successful!"
                echo "Application is running at: http://your-server-ip:$PORT"
                exit 0
              fi
              echo "Health check attempt $i/6 failed, retrying in 10s..."
              sleep 10
            done

            echo "Health check failed after 6 attempts!"
            docker logs $CONTAINER_NAME
            exit 1
            '
