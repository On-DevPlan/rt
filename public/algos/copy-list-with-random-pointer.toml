# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 随机链表的复制
# 链表节点除了 next 指针外，还有一个 random 指针
# random 指向链表中的任意节点（也可以是 None）
#
# 要求：深拷贝整个链表
#   - 为每个旧节点创建新节点
#   - 新节点的 next 指向新链表中对应的后继
#   - 新节点的 random 指向新链表中对应的 random 目标
#   - 不能修改原链表
#
# 示例:
#   输入: [[7,null],[13,0],[11,4],[10,2],[1,0]]
#   表示节点 0(val=7,random=None), 节点 1(val=13,random=0), ...
#   输出: 同样结构的全新链表"""
explanation = "**问题分析**\n\n- 普通链表只有 `next`，**线性结构**，一次遍历即可拷贝\n- 加上 `random` 后，`random` 指针可以**乱跳**到任意节点（包括 `None`）\n- 直接拷贝会出问题：第一次遍历建好新节点后，新节点的 `random` 该指向谁？\n\n**难点：跨节点的指针映射**\n\n| 指针 | 能否直接拷贝 | 原因 |\n|------|--------------|------|\n| `next` | 可以 | 沿链表方向，`old.next` 对应 `new.next` |\n| `random` | **不行** | `old.random` 是旧节点，无法直接赋给新节点 |\n\n> **核心问题**：需要建立**旧节点 → 新节点**的映射关系，把 `random` 重定向到新链表中对应的目标。\n\n**两种主流解法**\n\n| 方法 | 时间 | 空间 | 思路 |\n|------|------|------|------|\n| **哈希表映射** | O(n) | O(n) | `old → new` 存表，再二次遍历连指针 |\n| **原地交错** | O(n) | O(1) | 把新节点插在旧节点后面，最后再拆开 |\n\n> 本题采用**哈希表法**——思路最清晰，容易理解。"
visualizationType = "intro"

