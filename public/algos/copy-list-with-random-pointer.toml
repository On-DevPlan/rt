explanation = "**第 1 步：定义节点与函数签名**\n\n```python\nclass Node:\n    def __init__(self, x: int, next: 'Node' = None, random: 'Node' = None):\n        self.val = int(x)\n        self.next = next\n        self.random = random\n```\n\n- `Node` 含三个属性：`val`、`next`、`random`\n- `random` 默认 `None`（LeetCode 测试样例中常用 `null` 表示）\n- `copyRandomList(head)` 返回新链表的头节点\n\n> 类型注解使用 `Optional[Node]` 允许 `head` 为 `None`（空链表）。"
