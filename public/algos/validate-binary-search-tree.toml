# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 98. 验证二叉搜索树
# 给定一个二叉树 root，判断其是否是一个有效的二叉搜索树（BST）
#
# BST 定义（左闭右开，严格大小关系）:
#   节点左子树所有节点值 < 当前节点值
#   节点右子树所有节点值 > 当前节点值
#   左右子树本身也必须是 BST
#
# 关键陷阱:
#   不能只看直接子节点，必须保证整棵子树都满足大小关系
#
# 示例 1（true）:
#   root = [2, 1, 3]
#
#         2
#        / \\
#       1   3
#
# 示例 2（false，5 错位、3 错位）:
#   root = [5, 1, 4, null, null, 3, 6]
#
#         5
#        / \\
#       1   4
#          / \\
#         3   6"""
explanation = "**问题分析**\n\n**目标**：判断一棵二叉树是否满足 BST 性质。\n\n**BST 严格定义**\n\n- 节点的左子树所有节点值 **<** 节点值\n- 节点的右子树所有节点值 **>** 节点值\n- 左右子树也必须是 BST\n\n**最常见错误：只看直接子节点**\n\n```\n        5\n       / \\\\\n      1   4\n         / \\\\\n        3   6\n```\n\n- 根 `5`：`1 < 5 < 4`？ ✗ 直接子节点比较就错\n- 即使根的直接子节点 OK，**3 在 4 的左子树里却 < 5** 也会失败\n\n**核心思路：DFS + (low, high) 上下界传递**\n\n- 每个节点 `val` 必须严格在 `(low, high)` 开区间内\n- 递归到左子树时：新的 `(low, node.val)`\n- 递归到右子树时：新的 `(node.val, high)`\n\n| 输入 | 输出 |\n|------|------|\n| `[2, 1, 3]` | `true` |\n| `[5, 1, 4, null, null, 3, 6]` | `false` |"
visualizationType = "intro"

# ── Step 1: 签名 + TreeNode + dfs 框架 + base case ────────────
[[algorithm.steps]]
id = 1
title = "签名与 dfs 框架"
titleEn = "Signature & dfs Skeleton"
code = """# 98. 验证二叉搜索树
# 给定一个二叉树 root，判断其是否是一个有效的二叉搜索树（BST）
#
# BST 定义（左闭右开，严格大小关系）:
#   节点左子树所有节点值 < 当前节点值
#   节点右子树所有节点值 > 当前节点值
#   左右子树本身也必须是 BST
#
# 关键陷阱:
#   不能只看直接子节点，必须保证整棵子树都满足大小关系
#
# 示例 1（true）:
#   root = [2, 1, 3]
#
#         2
#        / \\
#       1   3
#
# 示例 2（false，5 错位、3 错位）:
#   root = [5, 1, 4, null, null, 3, 6]
#
#         5
#        / \\
#       1   4
#          / \\
#         3   6

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isValidBST(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否是有效的 BST\"\"\"
    def dfs(node: Optional[TreeNode], low: float, high: float) -> bool:
        if not node:
            return True"""
explanation = "**第 1 步：定义签名 + TreeNode + dfs 框架**\n\n**TreeNode**：标准二叉树节点。\n\n**`isValidBST`**\n\n- 入参：根节点 `root`\n- 返回：`bool`\n\n**内部函数 `dfs(node, low, high)`**\n\n- `node`：当前检查的节点\n- `low`：节点值必须严格大于的下界（不含）\n- `high`：节点值必须严格小于的上界（不含）\n\n**base case**\n\n```python\nif not node:\n    return True\n```\n\n空树 / 空孩子天然合法（BST 的\"零元素\"也满足所有约束）。\n\n**为什么用 `float('-inf')` / `float('inf')` 作初始边界？**\n\n根节点没有任何祖先约束，所以用一个**绝对开区间 `(-inf, +inf)`** 包裹，方便代码统一处理而不用特判。"
visualizationType = "code-only"

# ── Step 2: 边界检查 ──────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "边界检查"
titleEn = "Bounds Check"
code = """# 98. 验证二叉搜索树
# 给定一个二叉树 root，判断其是否是一个有效的二叉搜索树（BST）
#
# BST 定义（左闭右开，严格大小关系）:
#   节点左子树所有节点值 < 当前节点值
#   节点右子树所有节点值 > 当前节点值
#   左右子树本身也必须是 BST
#
# 关键陷阱:
#   不能只看直接子节点，必须保证整棵子树都满足大小关系
#
# 示例 1（true）:
#   root = [2, 1, 3]
#
#         2
#        / \\
#       1   3
#
# 示例 2（false，5 错位、3 错位）:
#   root = [5, 1, 4, null, null, 3, 6]
#
#         5
#        / \\
#       1   4
#          / \\
#         3   6

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isValidBST(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否是有效的 BST\"\"\"
    def dfs(node: Optional[TreeNode], low: float, high: float) -> bool:
        if not node:
            return True
        if node.val <= low or node.val >= high:
            return False"""
explanation = "**第 2 步：节点值越界检查**\n\n**核心约束：严格开区间**\n\n```python\nif node.val <= low or node.val >= high:\n    return False\n```\n\n| 情况 | 含义 | 结论 |\n|------|------|------|\n| `node.val <= low` | 当前值不严格大于祖先下界 | 违反 BST |\n| `node.val >= high` | 当前值不严格小于祖先上界 | 违反 BST |\n| 否则 | 当前值落在 `(low, high)` 内 | 通过本节点检查 |\n\n**为什么是 `<=` / `>=` 而非 `<` / `>`？**\n\nBST 要求**严格**大小关系：\n- 左子树节点值 `<` 节点值，所以节点值必须 `>` 左祖先值\n- 右子树节点值 `>` 节点值，所以节点值必须 `<` 右祖先值\n\n**示例**\n\n对 `[5, 1, 4, null, null, 3, 6]`：\n\n```\ndfs(4, -inf, 5):\n  4 < 5 但 4 > -inf ✓\n  dfs(3, -inf, 4):\n    3 > 4? 否 → 越界（3 不严格小于 4）❌ 正确返回 False\n```\n\n> 这正是示例 2 失败的原因——节点 `3` 在 `4` 的左子树中却 ≥ `4`。"
visualizationType = "code-only"

# ── Step 3: 递归左/右子树（更新边界） ──────────────────────────
[[algorithm.steps]]
id = 3
title = "递归子树"
titleEn = "Recurse Subtrees"
code = """# 98. 验证二叉搜索树
# 给定一个二叉树 root，判断其是否是一个有效的二叉搜索树（BST）
#
# BST 定义（左闭右开，严格大小关系）:
#   节点左子树所有节点值 < 当前节点值
#   节点右子树所有节点值 > 当前节点值
#   左右子树本身也必须是 BST
#
# 关键陷阱:
#   不能只看直接子节点，必须保证整棵子树都满足大小关系
#
# 示例 1（true）:
#   root = [2, 1, 3]
#
#         2
#        / \\
#       1   3
#
# 示例 2（false，5 错位、3 错位）:
#   root = [5, 1, 4, null, null, 3, 6]
#
#         5
#        / \\
#       1   4
#          / \\
#         3   6

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isValidBST(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否是有效的 BST\"\"\"
    def dfs(node: Optional[TreeNode], low: float, high: float) -> bool:
        if not node:
            return True
        if node.val <= low or node.val >= high:
            return False
        return (dfs(node.left, low, node.val) and
                dfs(node.right, node.val, high))"""
explanation = "**第 3 步：递归左右子树，并收紧边界**\n\n```python\nreturn (dfs(node.left,  low, node.val) and\n        dfs(node.right, node.val, high))\n```\n\n**边界更新规则**\n\n| 子树 | 新的 (low, high) | 理由 |\n|------|------------------|------|\n| 左子树 | `(low, node.val)` | 左子树所有节点必须 < node.val |\n| 右子树 | `(node.val, high)` | 右子树所有节点必须 > node.val |\n\n**示例 1：root = [2, 1, 3]**\n\n```\ndfs(2, -inf, +inf)  →  -inf < 2 < +inf ✓\n ├─ dfs(1, -inf, 2) →  -inf < 1 <  2 ✓ (no children)\n └─ dfs(3, 2, +inf) →  2 < 3 < +inf ✓ (no children)\n返回 True ✓\n```\n\n**示例 2：root = [5, 1, 4, ..., 3, 6]**\n\n```\ndfs(5, -inf, +inf)  →  -inf < 5 < +inf ✓\n ├─ dfs(1, -inf, 5) →  ✓\n └─ dfs(4, 5, +inf) →  5 < 4? ✗ 返回 False\n                       ↑\n              注意：低界变成 5，因为 4 是 5 的右孩子\n              4 不严格大于 5 → 失败\n```\n\n> 这就是上下界传递的威力——`4` 错位问题在 `dfs(4, 5, +inf)` 这一层就被抓住。"
visualizationType = "code-only"

# ── Step 4: 启动 dfs 并返回结果 ───────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 98. 验证二叉搜索树
# 给定一个二叉树 root，判断其是否是一个有效的二叉搜索树（BST）
#
# BST 定义（左闭右开，严格大小关系）:
#   节点左子树所有节点值 < 当前节点值
#   节点右子树所有节点值 > 当前节点值
#   左右子树本身也必须是 BST
#
# 关键陷阱:
#   不能只看直接子节点，必须保证整棵子树都满足大小关系
#
# 示例 1（true）:
#   root = [2, 1, 3]
#
#         2
#        / \\
#       1   3
#
# 示例 2（false，5 错位、3 错位）:
#   root = [5, 1, 4, null, null, 3, 6]
#
#         5
#        / \\
#       1   4
#          / \\
#         3   6

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isValidBST(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否是有效的 BST\"\"\"
    def dfs(node: Optional[TreeNode], low: float, high: float) -> bool:
        if not node:
            return True
        if node.val <= low or node.val >= high:
            return False
        return (dfs(node.left, low, node.val) and
                dfs(node.right, node.val, high))
    return dfs(root, float('-inf'), float('inf'))"""
explanation = "**最终结果**\n\n✅ 上下界 DFS 完成\n\n```\n输入: root = [2, 1, 3]\n输出: true\n\n输入: root = [5, 1, 4, null, null, 3, 6]\n输出: false\n```\n\n**完整算法流程**\n\n1. 定义内部 `dfs(node, low, high)`，初始调用时 `low=-inf, high=+inf`\n2. 空节点返回 `True`\n3. 当前 `node.val` 必须严格在 `(low, high)` 内，否则返回 `False`\n4. 递归左子树边界 `(low, node.val)`，递归右子树边界 `(node.val, high)`\n5. 左右子树都合法才返回 `True`\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | **O(n)** — 每个节点访问一次 |\n| 空间复杂度 | **O(h)** — 递归栈深度，h 为树高 |\n| 最坏情况 | h = n（链状树） |\n\n**关键技巧**\n\n- **上下界传递**：用 `(low, high)` 开区间把整棵子树的不等式约束串起来\n- **严格不等号** `<= / >=`：BST 要求严格大小关系\n- **`float('-inf')` 边界**：根节点无祖先约束，初始边界取无穷大方便统一处理\n- **另一种思路**：BST 中序遍历得到严格递增序列，可作为对照解法"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 2, 3]", result = "true", highlightedIndices = [0, 1, 2] }

[algorithm.summary]
timeComplexity = "O(n)"
spaceComplexity = "O(h)  # 递归栈"
approach = "DFS + (low, high) 上下界"
keyInsight = "BST 性质 = 子树所有节点都要满足严格大小关系；递归时给左右子树分别传递 (low, node.val) 和 (node.val, high)"
