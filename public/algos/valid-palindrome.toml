# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 验证回文串
# 给定一个字符串 s，验证它是否是回文串
# 只考虑字母和数字字符，忽略大小写
#
# 示例 1:
#   s = "A man, a plan, a canal: Panama"
#   结果: true（处理后为 "amanaplanacanalpanama"）
#
# 示例 2:
#   s = "race a car"
#   结果: false（处理后为 "raceacar"）
#
# 关键点:
#   - 忽略非字母数字字符（空格、逗号、冒号等）
#   - 字母不区分大小写"""
explanation = "**问题分析**\n\n判断字符串是否为回文，但有两个过滤条件：\n\n- 只保留**字母和数字**字符\n- 比较时**忽略大小写**（`A` 和 `a` 视为相同）\n\n**示例 1**\n\n```\n输入: \"A man, a plan, a canal: Panama\"\n清洗: \"amanaplanacanalpanama\"\n判断: 倒序仍是它自己 → true\n```\n\n**示例 2**\n\n```\n输入: \"race a car\"\n清洗: \"raceacar\"\n倒序: \"racaecar\"\n判断: 不相等 → false\n```\n\n> 关键洞察：**双指针从两端向中间**收敛，逐对比较清洗后的字符。无需预处理整串。"
visualizationType = "intro"

