#   - 中序遍历: [左子树, 根, 右子树] → 找到根的位置即可切分左右子树
#   - 配合哈希表把「中序定位」从 O(n) 降到 O(1)
#
# 示例:
#   inorder   = [9, 3, 15, 20, 7]
#   postorder = [9, 15, 7, 20, 3]
#
#   重建的树:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   层序: [3, 9, 20, null, null, 15, 7]

from typing import List, Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def buildTree(inorder: List[int], postorder: List[int]) -> Optional[TreeNode]:
    \"\"\"由中序+后序遍历重建二叉树。\"\"\"
    idx_map = {v: i for i, v in enumerate(inorder)}
    def build(in_l: int, in_r: int, post_l: int, post_r: int) -> Optional[TreeNode]:
        if in_l > in_r:
            return None
        root_val = postorder[post_r]
        root = TreeNode(root_val)
        idx = idx_map[root_val]
        left_size = idx - in_l
        root.left = build(in_l, idx - 1, post_l, post_l + left_size - 1)
        root.right = build(idx + 1, in_r, post_l + left_size, post_r - 1)
        return root
    return build(0, len(inorder) - 1, 0, len(postorder) - 1)"""
explanation = "**最终结果**\n\n```\n输入: inorder = [9,3,15,20,7], postorder = [9,15,7,20,3]\n输出: [3, 9, 20, null, null, 15, 7]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点定位 + 创建 O(1)，共 n 个节点 |\n| 空间复杂度 | O(n) — 哈希表 + 递归栈（栈深度 = 树高 ≤ n） |\n\n**关键洞察**\n\n- **后序末尾 = 当前根**：递归时直接取 `postorder[post_r]`\n- **中序定位 = 切分左右**：找到根在中序中的位置后，左侧是左子树中序，右侧是右子树中序\n- **`left_size` 桥接两个数组**：用 `left_size` 把中序的切分映射到后序的边界\n- **与 105 题镜像**：105 用前序 + 中序，根在开头；本题用后序 + 中序，根在末尾，递归边界镜像对称\n\n> 这类「遍历反推树」问题的核心：**选根 → 切分 → 递归**。"
