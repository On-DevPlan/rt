    \"\"\"由中序+后序遍历重建二叉树。\"\"\"
    idx_map = {v: i for i, v in enumerate(inorder)}
    def build(in_l: int, in_r: int, post_l: int, post_r: int) -> Optional[TreeNode]:
        if in_l > in_r:
            return None"""
explanation = "**第 1 步：定义结构与哈希表**\n\n- `TreeNode`：标准二叉树节点类\n- `buildTree` 主入口：接收两个数组，返回根节点\n- **`idx_map`**：中序值 → 索引的哈希表，加速根定位\n\n**闭包 `build(in_l, in_r, post_l, post_r)`**\n\n| 参数 | 含义 |\n|------|------|\n| `in_l`, `in_r` | 当前子树在中序中的左右边界 |\n| `post_l`, `post_r` | 当前子树在后序中的左右边界 |\n| `if in_l > in_r` | 区间为空，返回 `None`（base case） |\n\n> 使用闭包共享 `idx_map`，避免作为参数层层传递。"
visualizationType = "code-only"

# ── Step 2: 选根 + 创建 root + 查 idx + 算 left_size ─────────
[[algorithm.steps]]
id = 2
title = "选根与切分"
titleEn = "Pick Root & Partition"
code = """# 106. 从中序与后序遍历序列构造二叉树
# 给定一棵二叉树的中序遍历和后序遍历，请重建这棵二叉树
# 假设树中节点值互不相同
#
# 关键观察:
#   - 后序遍历: [左子树, 右子树, 根] → 最后一个元素 = 当前子树的根
#   - 中序遍历: [左子树, 根, 右子树] → 找到根的位置即可切分左右子树
#   - 配合哈希表把「中序定位」从 O(n) 降到 O(1)
#
# 示例:
#   inorder   = [9, 3, 15, 20, 7]
#   postorder = [9, 15, 7, 20, 3]
#
#   重建的树:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   层序: [3, 9, 20, null, null, 15, 7]

from typing import List, Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def buildTree(inorder: List[int], postorder: List[int]) -> Optional[TreeNode]:
    \"\"\"由中序+后序遍历重建二叉树。\"\"\"
    idx_map = {v: i for i, v in enumerate(inorder)}
    def build(in_l: int, in_r: int, post_l: int, post_r: int) -> Optional[TreeNode]:
        if in_l > in_r:
            return None
        root_val = postorder[post_r]
        root = TreeNode(root_val)
        idx = idx_map[root_val]
        left_size = idx - in_l"""
explanation = "**第 2 步：选根 + 切分**\n\n```python\nroot_val = postorder[post_r]   # 后序末尾 = 当前根\nroot = TreeNode(root_val)      # 构造根节点\nidx = idx_map[root_val]        # O(1) 在中序中找到根位置\nleft_size = idx - in_l         # 左子树节点数\n```\n\n**以根调用为例（初始状态）**\n\n```\ninorder   = [9, 3, 15, 20, 7]   in_l=0, in_r=4\npostorder = [9, 15, 7, 20, 3]   post_l=0, post_r=4\n\nroot_val = postorder[4] = 3\nidx      = idx_map[3]   = 1\nleft_size = 1 - 0 = 1   → 左子树 1 个节点\n```\n\n**切分结果**\n\n| 区域 | 中序 | 后序 |\n|------|------|------|\n| 左子树 | `[9]` (in_l..idx-1) | `[9]` (post_l..post_l+left_size-1) |\n| 根 | `[3]` | `[3]` (post_r) |\n| 右子树 | `[15,20,7]` (idx+1..in_r) | `[15,7,20]` (post_l+left_size..post_r-1) |\n\n> 关键：`left_size` 同时决定左子树在两个数组中的边界。"
visualizationType = "code-only"

# ── Step 3: 递归调用 + 赋值 left/right ────────────────────────
[[algorithm.steps]]
id = 3
title = "递归构建"
titleEn = "Recursive Build"
code = """# 106. 从中序与后序遍历序列构造二叉树
# 给定一棵二叉树的中序遍历和后序遍历，请重建这棵二叉树
# 假设树中节点值互不相同
#
# 关键观察:
#   - 后序遍历: [左子树, 右子树, 根] → 最后一个元素 = 当前子树的根
#   - 中序遍历: [左子树, 根, 右子树] → 找到根的位置即可切分左右子树
#   - 配合哈希表把「中序定位」从 O(n) 降到 O(1)
#
# 示例:
#   inorder   = [9, 3, 15, 20, 7]
#   postorder = [9, 15, 7, 20, 3]
#
#   重建的树:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   层序: [3, 9, 20, null, null, 15, 7]

from typing import List, Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def buildTree(inorder: List[int], postorder: List[int]) -> Optional[TreeNode]:
    \"\"\"由中序+后序遍历重建二叉树。\"\"\"
    idx_map = {v: i for i, v in enumerate(inorder)}
    def build(in_l: int, in_r: int, post_l: int, post_r: int) -> Optional[TreeNode]:
        if in_l > in_r:
            return None
        root_val = postorder[post_r]
        root = TreeNode(root_val)
        idx = idx_map[root_val]
        left_size = idx - in_l
        root.left = build(in_l, idx - 1, post_l, post_l + left_size - 1)
        root.right = build(idx + 1, in_r, post_l + left_size, post_r - 1)
        return root
    return build(0, len(inorder) - 1, 0, len(postorder) - 1)"""
explanation = "**第 3 步：递归构建左右子树**\n\n```python\nroot.left  = build(in_l, idx - 1, post_l, post_l + left_size - 1)\nroot.right = build(idx + 1, in_r, post_l + left_size, post_r - 1)\nreturn root\n```\n\n**边界对照表**\n\n| 子树 | 中序范围 | 后序范围 |\n|------|----------|----------|\n| 左 | `[in_l, idx-1]` | `[post_l, post_l+left_size-1]` |\n| 右 | `[idx+1, in_r]` | `[post_l+left_size, post_r-1]` |\n\n> 注意：后序中**根在末尾**，所以右子树的右边界是 `post_r - 1`（已用）。\n\n**完整递归链（以示例追踪）**\n\n```\nbuild(0,4, 0,4)  root=3, idx=1, left_size=1\n├── build(0,0, 0,0)  root=9,  idx=0, left_size=0  → left/right=None\n└── build(2,4, 1,3)  root=20, idx=3, left_size=1\n    ├── build(2,2, 1,1)  root=15 → 叶子\n    └── build(4,4, 2,2)  root=7  → 叶子\n```\n\n最后返回 `build(0,4, 0,4)`，得到整棵树。"
visualizationType = "code-only"

