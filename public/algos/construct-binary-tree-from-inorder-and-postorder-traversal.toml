# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 106. 从中序与后序遍历序列构造二叉树
# 给定一棵二叉树的中序遍历和后序遍历，请重建这棵二叉树
# 假设树中节点值互不相同
#
# 关键观察:
#   - 后序遍历: [左子树, 右子树, 根] → 最后一个元素 = 当前子树的根
#   - 中序遍历: [左子树, 根, 右子树] → 找到根的位置即可切分左右子树
#   - 配合哈希表把「中序定位」从 O(n) 降到 O(1)
#
# 示例:
#   inorder   = [9, 3, 15, 20, 7]
#   postorder = [9, 15, 7, 20, 3]
#
#   重建的树:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   层序: [3, 9, 20, null, null, 15, 7]"""
explanation = "**问题分析**\n\n已知一棵二叉树的**中序**和**后序**遍历，重建原树。\n\n**示例输入**\n\n```\ninorder   = [9, 3, 15, 20, 7]\npostorder = [9, 15, 7, 20, 3]\n```\n\n**关键思路：后序定根 + 中序切分**\n\n| 遍历 | 顺序 |\n|------|------|\n| **后序** | `[左, 右, 根]` → 末尾 = 根 |\n| **中序** | `[左, 根, 右]` → 根的位置切分左右 |\n\n**执行流程**\n\n1. `postorder[-1] = 3` → 当前根 = 3\n2. 在中序中找到 3 的位置 `idx = 1`\n3. `inorder[0:1] = [9]` 是左子树，`inorder[2:] = [15,20,7]` 是右子树\n4. 递归处理左右子树\n\n> 哈希表 `idx_map` 把中序定位从 O(n) 降到 O(1)，整体复杂度 O(n)。"
visualizationType = "intro"

