# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 三角形最小路径和
# 给定一个三角形，找出自顶向下的最小路径和
# 每一步只能移动到下一行相邻的节点
#
# 示例:
#   triangle = [[2],[3,4],[6,5,7],[4,1,8,3]]
#   最小路径和: 2 + 3 + 5 + 1 = 11
#   路径: [2, 3, 5, 1]
#
# 相邻节点定义：
#   如果当前在第 i 行第 j 列，下一行可以走到第 i+1 行的 j 或 j+1 列"""
explanation = "**问题分析**\n\n给定三角形数组，从顶部出发，每次只能移动到下一行相邻位置，求到达底部的最小路径和。\n\n**示例三角形：**\n\n```\n        2\n       3 4\n      6 5 7\n     4 1 8 3\n```\n\n**从顶向下路径示例：**\n\n| 路径 | 和 |\n|------|-----|\n| 2 → 3 → 6 → 4 | 15 |\n| 2 → 3 → 6 → 1 | 12 |\n| 2 → 3 → 5 → 1 | 11 ✓ |\n| 2 → 4 → 7 → 8 | 21 |\n\n**思路：自底向上动态规划**\n\n| 方法 | 时间 | 空间 |\n|------|------|----------|\n| 自顶向下（递归+备忘录） | O(n²) | O(n²) |\n| **自底向上（空间优化）** | **O(n²)** | **O(n)** |\n\n> 从倒数第二行开始，每个元素累加其下方两个邻居中的较小值。"
visualizationType = "intro"

