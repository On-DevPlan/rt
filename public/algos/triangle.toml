visualizationType = "code-only"

# ── Step 2: 初始化 dp 数组 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化 dp"
titleEn = "Initialize DP"
code = """# 三角形最小路径和
# 给定一个三角形，找出自顶向下的最小路径和
# 每一步只能移动到下一行相邻的节点
#
# 示例:
#   triangle = [[2],[3,4],[6,5,7],[4,1,8,3]]
#   最小路径和: 2 + 3 + 5 + 1 = 11
#   路径: [2, 3, 5, 1]

from typing import List

def minimumTotal(triangle: List[List[int]]) -> int:
    \"\"\"返回三角形从顶到底的最小路径和。\"\"\"
    dp = triangle[-1][:]  # 复制最后一行作为初始 dp 数组"""
explanation = "**第 2 步：初始化动态规划数组**\n\n**关键思想：自底向上**\n\n从最后一行开始向上递推，`dp[i]` 表示从当前位置到底部的最小路径和。\n\n**初始状态（最后一行）：**\n\n```\ntriangle[-1] = [4, 1, 8, 3]\ndp           = [4, 1, 8, 3]\n```\n\n最后一行的每个元素到底部的路径和就是它自己。\n\n**为什么只需要一维数组？**\n\n- 每个元素只依赖下一行的 `dp[i]` 和 `dp[i+1]`\n- 可以原地更新，从左到右覆盖即可\n- 空间从 O(n²) 优化到 O(n)"
visualizationType = "code-only"

# ── Step 3: 外层循环（从下往上） ────────────────────────────────
[[algorithm.steps]]
id = 3
title = "从下往上遍历"
titleEn = "Traverse Bottom-Up"
code = """# 三角形最小路径和
# 给定一个三角形，找出自顶向下的最小路径和
# 每一步只能移动到下一行相邻的节点
#
# 示例:
#   triangle = [[2],[3,4],[6,5,7],[4,1,8,3]]
#   最小路径和: 2 + 3 + 5 + 1 = 11
#   路径: [2, 3, 5, 1]

from typing import List

def minimumTotal(triangle: List[List[int]]) -> int:
    \"\"\"返回三角形从顶到底的最小路径和。\"\"\"
    dp = triangle[-1][:]  # 复制最后一行作为初始 dp 数组

    for row in range(len(triangle) - 2, -1, -1):"""
explanation = "**第 3 步：从倒数第二行向上遍历**\n\n**循环范围：** `range(len(triangle) - 2, -1, -1)`\n\n| 变量 | 值（示例） | 说明 |\n|------|------------|------|\n| len(triangle) | 4 | 共 4 行 |\n| len(triangle) - 2 | 2 | 从第 2 行开始（倒数第二行） |\n| -1 | 停止条件 | 不包括 -1，即处理到第 0 行 |\n| -1 | 步长 | 从上往下递减 |\n\n**执行顺序：**\n\n```\nrow = 2: 处理 [6, 5, 7]\nrow = 1: 处理 [3, 4]\nrow = 0: 处理 [2]\n```\n\n> 从下往上计算，每一行都基于下一行的结果。"
visualizationType = "code-only"

# ── Step 4: 内层循环（更新 dp） ────────────────────────────────
[[algorithm.steps]]
id = 4
title = "更新 dp 数组"
titleEn = "Update DP Array"
code = """# 三角形最小路径和
# 给定一个三角形，找出自顶向下的最小路径和
# 每一步只能移动到下一行相邻的节点
#
# 示例:
#   triangle = [[2],[3,4],[6,5,7],[4,1,8,3]]
#   最小路径和: 2 + 3 + 5 + 1 = 11
#   路径: [2, 3, 5, 1]

from typing import List

def minimumTotal(triangle: List[List[int]]) -> int:
    \"\"\"返回三角形从顶到底的最小路径和。\"\"\"
    dp = triangle[-1][:]  # 复制最后一行作为初始 dp 数组

    for row in range(len(triangle) - 2, -1, -1):
        for i in range(len(triangle[row])):
            dp[i] = triangle[row][i] + min(dp[i], dp[i + 1])"""
explanation = "**第 4 步：更新 dp 数组**\n\n**核心状态转移：**\n\n```\ndp[i] = triangle[row][i] + min(dp[i], dp[i+1])\n```\n\n当前元素到底部的最小路径和 = **当前元素值** + **下方两个邻居路径和的较小值**。\n\n**示例执行：**\n\n```\n初始 dp = [4, 1, 8, 3]  （最后一行）\n\nrow = 2: [6, 5, 7]\n  i=0: dp[0] = 6 + min(4, 1) = 6 + 1 = 7\n  i=1: dp[1] = 5 + min(1, 8) = 5 + 1 = 6\n  i=2: dp[2] = 7 + min(8, 3) = 7 + 3 = 10\n  dp = [7, 6, 10, 3]\n\nrow = 1: [3, 4]\n  i=0: dp[0] = 3 + min(7, 6) = 3 + 6 = 9\n  i=1: dp[1] = 4 + min(6, 10) = 4 + 6 = 10\n  dp = [9, 10, 10, 3]\n\nrow = 0: [2]\n  i=0: dp[0] = 2 + min(9, 10) = 2 + 9 = 11\n  dp = [11, 10, 10, 3]\n```"
visualizationType = "code-only"

# ── Step 5: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 5
title = "完成"
titleEn = "Complete"
code = """# 三角形最小路径和
# 给定一个三角形，找出自顶向下的最小路径和
# 每一步只能移动到下一行相邻的节点
#
# 示例:
#   triangle = [[2],[3,4],[6,5,7],[4,1,8,3]]
#   最小路径和: 2 + 3 + 5 + 1 = 11
#   路径: [2, 3, 5, 1]

from typing import List

def minimumTotal(triangle: List[List[int]]) -> int:
    \"\"\"返回三角形从顶到底的最小路径和。\"\"\"
    dp = triangle[-1][:]  # 复制最后一行作为初始 dp 数组

    for row in range(len(triangle) - 2, -1, -1):
        for i in range(len(triangle[row])):
            dp[i] = triangle[row][i] + min(dp[i], dp[i + 1])

    return dp[0]"""
explanation = "**最终结果**\n\n✅ 计算完成，返回 `dp[0]`\n\n```\n输入: [[2],[3,4],[6,5,7],[4,1,8,3]]\n输出: 11\n路径: [2, 3, 5, 1]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|-----|\n| 时间复杂度 | O(n²) — n 为行数，每层遍历所有元素 |\n| 空间复杂度 | O(n) — 只需要一维 dp 数组 |\n\n**关键技巧：自底向上 + 空间优化**\n\n- **自底向上**：避免了递归栈和备忘录的额外开销\n- **空间优化**：每一层只依赖下一层的两个邻居，可以原地更新\n- **终止条件**：第一行计算完后，`dp[0]` 就是答案\n\n**为什么这样设计？**\n\n1. **无后效性**：每个状态只依赖下一行，与路径无关\n2. **最优子结构**：局部最优（min(dp[i], dp[i+1])）推导全局最优\n3. **空间局部性**：从左到右覆盖，不需要额外存储"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[[2], [3, 4], [6, 5, 7], [4, 1, 8, 3]]", result = "11", highlightedIndices = [0, 0, 1, 2] }

