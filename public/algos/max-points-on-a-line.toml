# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 149. 直线上最多的点数
# 给定平面上 n 个点的坐标，找出最多点数共线的直线
#
# 核心思路：
#   固定每个点作为基准点，计算它与其它所有点的斜率
#   相同斜率的点在同一条直线上
#   用哈希表统计每个斜率出现的次数，找出最大值
#
# 斜率表示：
#   用 (dy, dx) 表示斜率，避免浮点精度问题
#   约分：dy/g, dx/g，其中 g = gcd(dx, dy)
#   垂直线：dx = 0，用特殊标记 'inf'
#
# 示例：
#   points = [[1,1],[2,2],[3,3]]
#   固定 [1,1]，与 [2,2] 斜率 (1,1)，与 [3,3] 斜率 (1,1)
#   两个点斜率相同，都在直线 y=x 上
#   结果：3 个点共线"""
explanation = "**问题分析**\n\n给定二维平面上的点集，找出最多有多少点在同一条直线上。\n\n**核心思路：斜率哈希表**\n\n```\n固定点 P1，计算 P1 与其他点的斜率\n相同斜率 → 共线\n用哈希表统计斜率频次\n```\n\n| 方法 | 时间 | 空间 |\n|------|------|------|\n| 暴力枚举所有直线 | O(n³) | O(1) |\n| **斜率哈希表** | **O(n²)** | **O(n)** |\n\n**斜率表示技巧**\n\n- 用 `(dy/g, dx/g)` 代替浮点数，避免精度误差\n- `g = gcd(dx, dy)` 约分到最简\n- 垂直线用 `'inf'` 标记\n\n> 固定每个点，哈希表统计斜率，最大频次+1 即为经过该点的最多点数。"
visualizationType = "intro"

