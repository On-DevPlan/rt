# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 搜索插入位置
# 在升序数组中查找目标值，如果存在则返回索引
# 如果不存在，返回应该插入的位置（保持数组有序）
#
# 示例:
#   nums = [1, 3, 5, 6], target = 5
#   输出: 2（target 在索引 2）
#
#   nums = [1, 3, 5, 6], target = 2
#   输出: 1（应该插入到索引 1）
#
# 关键: 数组有序，可以用二分查找"""
explanation = "**问题重述** — 在升序数组 nums 中查找目标值 target，若存在返回其索引；若不存在，返回应插入的位置（使数组保持有序）。\n\n**输入与输出**\n- 输入：升序数组 nums（无重复升序），目标值 target\n- 输出：target 的索引（若存在）或插入位置索引（若不存在）\n- 边界情况：target 小于所有元素返回 0；target 大于所有元素返回 len(nums)；空数组返回 0\n\n**示例走查**（testCase: `nums = [1,3,5,6], target = 5`，expectedOutput: `2`）\n- 二分查找找第一个 ≥ 5 的位置：初始 left=0, right=4\n- 第 1 轮：mid=2, nums[2]=5 ≥ 5 → right=2（目标在左半，含 mid）\n- 第 2 轮：left=0, right=2, mid=1, nums[1]=3 < 5 → left=2\n- 终止：left=2 == right=2，返回 2（nums[2]=5，命中）\n- 若 target=2：第 1 轮 mid=2, nums[2]=5 ≥ 2 → right=2；第 2 轮 left=0, right=2, mid=1, nums[1]=3 ≥ 2 → right=1；left=0, right=1, mid=0, nums[0]=1 < 2 → left=1；终止 left=1，返回 1（插入位置）\n\n**关键洞察**\n- 本质是找「第一个 ≥ target 的下标」，即左边界二分，不是经典的相等判断二分\n- 循环不变量：答案始终在 [left, right) 区间内，终止时 left == right 即为答案\n- 即使 target 不存在，返回的 left 就是最小插入位置（该位置所有元素 < target，其后所有元素 ≥ target）\n\n**方法预览**\n- 数据结构：左闭右开区间 [left, right)，双指针\n- 时间复杂度：O(log n)，每次循环区间减半\n- 空间复杂度：O(1)，仅用两个指针"
visualizationType = "intro"

