# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 搜索插入位置
# 在升序数组中查找目标值，如果存在则返回索引
# 如果不存在，返回应该插入的位置（保持数组有序）
#
# 示例:
#   nums = [1, 3, 5, 6], target = 5
#   输出: 2（target 在索引 2）
#
#   nums = [1, 3, 5, 6], target = 2
#   输出: 1（应该插入到索引 1）
#
# 关键: 数组有序，可以用二分查找"""
explanation = "**问题分析**\n\n给定一个**升序数组** `nums` 和目标值 `target`：\n- 如果 `target` 存在，返回其索引\n- 如果不存在，返回应该插入的位置\n\n**为什么用二分查找？**\n\n| 方法 | 时间 |\n|------|------|\n| 线性扫描 | O(n) |\n| **二分查找** | **O(log n)** |\n\n数组有序且需要查找/插入位置，二分查找是最佳选择。\n\n**核心思路：左边界二分**\n\n找到第一个 **≥ target** 的位置，就是答案。"
visualizationType = "intro"

