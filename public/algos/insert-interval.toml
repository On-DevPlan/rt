    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- `intervals`：已排序且互不重叠的区间列表\n- `newInterval`：待插入的单个新区间 `[start, end]`\n- 返回**新的**有序、互不重叠的区间列表\n- 用类型注解 `List[List[int]]` 明确二维整数列表\n- 文档字符串说明合并行为"
