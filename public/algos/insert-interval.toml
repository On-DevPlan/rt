# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 插入区间
# 给定一组互不重叠、且按 start 升序排列的区间 intervals
# 再给一个新区间 newInterval，将它插入 intervals 中
# 若与已有区间重叠，则合并；要求整体仍按 start 升序，且互不重叠
#
# 示例:
#   intervals = [[1,3],[6,9]], newInterval = [2,5]
#   结果: [[1,5],[6,9]]
#
#   intervals = [[1,2],[3,5],[6,7],[8,10],[12,16]], newInterval = [4,8]
#   结果: [[1,2],[3,10],[12,16]]"""
explanation = "**问题分析**\n\n- `intervals` 已按 `start` 升序排列，且互不重叠\n- 把 `newInterval` 插入并按需合并，结果仍需有序\n\n**关键观察**\n\n由于原数组有序，可以把问题**切成三段**，每段独立处理：\n\n| 阶段 | 含义 |\n|------|------|\n| 左侧 | `intervals[i].end < newInterval.start`，一定不重叠 |\n| 中间 | 与 `newInterval` 重叠的连续段，合并成一个新区间 |\n| 右侧 | `intervals[i].start > newInterval.end`，一定不重叠 |\n\n> 难点在于正确判断\"重叠\"：区间 `[a,b]` 与 `[c,d]` 重叠当且仅当 `a <= d` 且 `c <= b`。"
visualizationType = "intro"

