# ── Step 2: 初始化与左侧无重叠区间 ──────────────────────────
[[algorithm.steps]]
id = 2
title = "收集左侧"
titleEn = "Collect Left Part"
code = """# 插入区间
# 给定一组互不重叠、且按 start 升序排列的区间 intervals
# 再给一个新区间 newInterval，将它插入 intervals 中
# 若与已有区间重叠，则合并；要求整体仍按 start 升序，且互不重叠
#
# 示例:
#   intervals = [[1,3],[6,9]], newInterval = [2,5]
#   结果: [[1,5],[6,9]]
#
#   intervals = [[1,2],[3,5],[6,7],[8,10],[12,16]], newInterval = [4,8]
#   结果: [[1,2],[3,10],[12,16]]

from typing import List

def insert(intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
    \"\"\"插入新区间并按需合并，返回有序且互不重叠的区间列表。\"\"\"
    res = []
    i = 0
    n = len(intervals)
    # 1. 左侧无重叠：intervals[i].end < newInterval.start
    while i < n and intervals[i][1] < newInterval[0]:
        res.append(intervals[i])
        i += 1"""
explanation = "**第 2 步：收集左侧无重叠区间**\n\n```\nintervals = [[1,3], [6,9]], newInterval = [2,5]\n```\n\n判断条件 `intervals[i][1] < newInterval[0]`：\n\n- 当前区间的 `end` **严格小于** `newInterval.start` → 一定不重叠\n- 把它原样追加到 `res`，指针 `i` 前移\n\n| 当前区间 | end < 2? | 动作 |\n|----------|----------|------|\n| `[1,3]`  | 否 (3 ≥ 2) | 跳出循环 |\n| `[6,9]`  | 是 | append |\n\n> 循环结束时，`i` 指向**第一个可能与 newInterval 重叠**的位置。"
visualizationType = "code-only"

# ── Step 3: 与 newInterval 合并 ──────────────────────────────
[[algorithm.steps]]
id = 3
title = "合并重叠"
titleEn = "Merge Overlaps"
code = """# 插入区间
# 给定一组互不重叠、且按 start 升序排列的区间 intervals
# 再给一个新区间 newInterval，将它插入 intervals 中
# 若与已有区间重叠，则合并；要求整体仍按 start 升序，且互不重叠
#
# 示例:
#   intervals = [[1,3],[6,9]], newInterval = [2,5]
#   结果: [[1,5],[6,9]]
#
#   intervals = [[1,2],[3,5],[6,7],[8,10],[12,16]], newInterval = [4,8]
#   结果: [[1,2],[3,10],[12,16]]

from typing import List

def insert(intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
    \"\"\"插入新区间并按需合并，返回有序且互不重叠的区间列表。\"\"\"
    res = []
    i = 0
    n = len(intervals)
    # 1. 左侧无重叠：intervals[i].end < newInterval.start
    while i < n and intervals[i][1] < newInterval[0]:
        res.append(intervals[i])
        i += 1
    # 2. 与 newInterval 重叠区间合并
    while i < n and intervals[i][0] <= newInterval[1]:
        newInterval[0] = min(newInterval[0], intervals[i][0])
        newInterval[1] = max(newInterval[1], intervals[i][1])
        i += 1
    res.append(newInterval)"""
explanation = "**第 3 步：合并所有重叠区间**\n\n判断条件 `intervals[i][0] <= newInterval[1]`：\n\n- 当前区间的 `start` **不超过** `newInterval.end` → 存在重叠\n- 原地更新 `newInterval` 的左右端点：\n  - `newInterval[0] = min(newInterval[0], intervals[i][0])`\n  - `newInterval[1] = max(newInterval[1], intervals[i][1])`\n- 循环结束后，把合并好的 `newInterval` 追加到 `res`\n\n**示例执行：**\n\n```\nintervals = [[1,3],[6,9]], newInterval = [2,5]\ni=0: [1,3].start=1 <= 5  → newInterval = [min(2,1), max(5,3)] = [1,5], i=1\ni=1: [6,9].start=6 >  5  → 跳出\nres.append([1,5])\n```\n\n> 合并用**原地改写 newInterval** 的方式，无需额外空间。"
visualizationType = "code-only"

# ── Step 4: 收集右侧并返回 ──────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 插入区间
# 给定一组互不重叠、且按 start 升序排列的区间 intervals
# 再给一个新区间 newInterval，将它插入 intervals 中
# 若与已有区间重叠，则合并；要求整体仍按 start 升序，且互不重叠
#
# 示例:
#   intervals = [[1,3],[6,9]], newInterval = [2,5]
#   结果: [[1,5],[6,9]]
#
#   intervals = [[1,2],[3,5],[6,7],[8,10],[12,16]], newInterval = [4,8]
#   结果: [[1,2],[3,10],[12,16]]

from typing import List

def insert(intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
    \"\"\"插入新区间并按需合并，返回有序且互不重叠的区间列表。\"\"\"
    res = []
    i = 0
    n = len(intervals)
    # 1. 左侧无重叠：intervals[i].end < newInterval.start
    while i < n and intervals[i][1] < newInterval[0]:
        res.append(intervals[i])
        i += 1
    # 2. 与 newInterval 重叠区间合并
    while i < n and intervals[i][0] <= newInterval[1]:
        newInterval[0] = min(newInterval[0], intervals[i][0])
        newInterval[1] = max(newInterval[1], intervals[i][1])
        i += 1
    res.append(newInterval)
    # 3. 右侧剩余
    while i < n:
        res.append(intervals[i])
        i += 1
    return res"""
explanation = "**最终结果**\n\n✅ 三段式完成插入 + 合并\n\n```\n输入: intervals = [[1,3],[6,9]], newInterval = [2,5]\n输出: [[1,5],[6,9]]\n\n输入: intervals = [[1,2],[3,5],[6,7],[8,10],[12,16]], newInterval = [4,8]\n输出: [[1,2],[3,10],[12,16]]\n```\n\n**第三段：右侧剩余**\n\n`i` 已经指向第一个 `start > newInterval.end` 的位置；由于原数组有序，剩下的区间**全部不重叠**，直接 append 即可。\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个区间最多访问一次 |\n| 空间复杂度 | O(1) — 不计输出 |\n\n**关键技巧：三段切分**\n\n- 利用 `intervals` 已有序这一前提，避免排序\n- 用两个 `while` 精确划出\"不重叠 / 重叠 / 不重叠\"三段\n- 合并时**就地更新 `newInterval`**，省去额外区间对象"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[[1,3],[6,9]]", result = "[[1,5],[6,9]]", highlightedIndices = [0, 1] }

[algorithm.summary]
timeComplexity = "O(n)"
spaceComplexity = "O(1)"
approach = "三段式：左侧无重叠 + 合并重叠段 + 右侧剩余"
keyInsight = "利用原数组已排序，按 newInterval 的左右端点把问题切成三段，每段用一次线性扫描解决"
