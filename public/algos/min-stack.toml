# ── Step0:理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id =0
title = "理解问题"
titleEn = "Understand the Problem"
code = """#最小栈
# 设计一个支持以下操作的栈，且所有操作的时间复杂度均为 O(1):
#1. push(val): 将元素压入栈
#2. pop():弹出栈顶元素
#3. top(): 获取栈顶元素
#4. getMin(): 获取栈中当前的最小元素
#
#关键挑战:
# - 普通栈只能 O(1)访问栈顶，找最小值需要遍历 O(n)
# - 必须让 getMin 也是 O(1)
#
# 示例:
# push(-2), push(0), push(-3)
# getMin() -> -3
# pop(), top() ->0
# getMin() -> -2"""
explanation = "**问题分析**\n\n设计一个栈数据结构，除了常规 `push`/`pop`/`top`，还要支持 **O(1) 的 `getMin`**。\n\n**核心难点**\n\n- 普通栈只能 O(1)访问栈顶\n-每次扫描栈找最小值是 O(n)，不满足要求\n\n**思路：辅助栈**\n\n| 方法 | getMin复杂度 | 说明 |\n|------|---------------|------|\n|每次扫描主栈 | O(n) | 太慢 |\n| **辅助栈同步最小值** | **O(1)** | 主栈每压入一个 x，辅助栈压入 `min(x,辅助栈顶)` |\n\n>关键技巧：让辅助栈的栈顶永远等于主栈当前所有元素的最小值。"
visualizationType = "intro"

