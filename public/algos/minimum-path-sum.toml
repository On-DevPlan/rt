# ── Step 3: 跳过起点 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "跳过起点"
titleEn = "Skip Start Point"
code = """# 64. 最小路径和
# 从左上角到右下角的最小路径和
#
# 问题描述:
#   给定一个 m×n 的网格，每个格子有一个非负整数
#   找出从左上角到右下角的路径，使路径上数字之和最小
#   每次只能向右或向下移动
#
# 示例:
#   grid = [[1,3,1],
#           [1,5,1],
#           [4,2,1]]
#   最小路径和: 7 (1→3→1→1→1)

from typing import List

def minPathSum(grid: List[List[int]]) -> int:
    \"\"\"返回从左上角到右下角的最小路径和。\"\"\"
    m, n = len(grid), len(grid[0])
    for i in range(m):
        for j in range(n):
            if i == 0 and j == 0:
                continue"""
explanation = "**第 3 步：遍历网格，跳过起点**\n\n使用双重循环遍历每个格子：\n\n```\ni = 0, j = 0: 起点 (0,0)，跳过\ni = 0, j = 1: 第一行，第二列\ni = 0, j = 2: 第一行，第三列\ni = 1, j = 0: 第二行，第一列\n...\n```\n\n**为什么跳过起点？**\n\n- 起点 `(0, 0)` 的最小路径和就是它本身，不需要修改\n- 其他格子需要累加上方或左方的最小值"
visualizationType = "code-only"

# ── Step 4: 边界条件处理 ───────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "处理边界"
titleEn = "Handle Boundaries"
code = """# 64. 最小路径和
# 从左上角到右下角的最小路径和
#
# 问题描述:
#   给定一个 m×n 的网格，每个格子有一个非负整数
#   找出从左上角到右下角的路径，使路径上数字之和最小
#   每次只能向右或向下移动
#
# 示例:
#   grid = [[1,3,1],
#           [1,5,1],
#           [4,2,1]]
#   最小路径和: 7 (1→3→1→1→1)

from typing import List

def minPathSum(grid: List[List[int]]) -> int:
    \"\"\"返回从左上角到右下角的最小路径和。\"\"\"
    m, n = len(grid), len(grid[0])
    for i in range(m):
        for j in range(n):
            if i == 0 and j == 0:
                continue
            elif i == 0:
                grid[i][j] += grid[i][j - 1]
            elif j == 0:
                grid[i][j] += grid[i - 1][j]
            else:
                grid[i][j] += min(grid[i - 1][j], grid[i][j - 1])"""
explanation = "**第 4 步：动态规划转移**\n\n**状态转移方程：**\n\n```\ndp[i][j] = grid[i][j] + min(dp[i-1][j], dp[i][j-1])\n```\n\n**三种情况：**\n\n| 位置 | 条件 | 转移方程 | 说明 |\n|------|------|----------|------|\n| 第一行 | `i == 0` | `grid[0][j] += grid[0][j-1]` | 只能从左边来 |\n| 第一列 | `j == 0` | `grid[i][0] += grid[i-1][0]` | 只能从上边来 |\n| 其他格子 | 一般情况 | `grid[i][j] += min(grid[i-1][j], grid[i][j-1])` | 取上方和左方的最小值 |\n\n**示例执行（逐步修改 grid）：**\n\n```\n初始: [[1,3,1],      →  [[1,4,5],\n       [1,5,1],           [2,5,1],\n       [4,2,1]]           [4,2,1]]\n\n→   [[1,4,5],      →  [[1,4,5],\n     [2,7,6],           [2,7,6],\n     [4,2,1]]           [6,8,7]]\n```\n\n> 最终 `grid[2][2] = 7`，即最小路径和。"
visualizationType = "code-only"

# ── Step 5: 完成 ───────────────────────────────────────────────
[[algorithm.steps]]
id = 5
title = "完成"
titleEn = "Complete"
code = """# 64. 最小路径和
# 从左上角到右下角的最小路径和
#
# 问题描述:
#   给定一个 m×n 的网格，每个格子有一个非负整数
#   找出从左上角到右下角的路径，使路径上数字之和最小
#   每次只能向右或向下移动
#
# 示例:
#   grid = [[1,3,1],
#           [1,5,1],
#           [4,2,1]]
#   最小路径和: 7 (1→3→1→1→1)

from typing import List

def minPathSum(grid: List[List[int]]) -> int:
    \"\"\"返回从左上角到右下角的最小路径和。\"\"\"
    m, n = len(grid), len(grid[0])
    for i in range(m):
        for j in range(n):
            if i == 0 and j == 0:
                continue
            elif i == 0:
                grid[i][j] += grid[i][j - 1]
            elif j == 0:
                grid[i][j] += grid[i - 1][j]
            else:
                grid[i][j] += min(grid[i - 1][j], grid[i][j - 1])
    return grid[m - 1][n - 1]"""
explanation = "**最终结果**\n\n✅ 动态规划完成\n\n```\n输入: grid = [[1,3,1],[1,5,1],[4,2,1]]\n输出: 7\n\n最优路径: 1 → 3 → 1 → 1 → 1\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(m×n) — 遍历每个格子一次 |\n| 空间复杂度 | O(1) — 原地修改 grid |\n\n**关键优化：原地修改**\n\n- 直接在 `grid` 上存储 `dp` 值，无需额外空间\n- `grid[i][j]` 最终存储的是「到达 `(i,j)` 的最小路径和」\n- 答案就是 `grid[m-1][n-1]`"
visualizationType = "result"
