# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 64. 最小路径和
# 从左上角到右下角的最小路径和
#
# 问题描述:
#   给定一个 m×n 的网格，每个格子有一个非负整数
#   找出从左上角到右下角的路径，使路径上数字之和最小
#   每次只能向右或向下移动
#
# 示例:
#   grid = [[1,3,1],
#           [1,5,1],
#           [4,2,1]]
#   最小路径和: 7 (1→3→1→1→1)"""
explanation = "**问题分析**\n\n给定 3×3 网格：\n\n```\n1 → 3 → 1\n↓   ↓   ↓\n1   5   1\n↓   ↓   ↓\n4 → 2 → 1\n```\n\n**关键约束**\n\n| 约束 | 说明 |\n|------|------|\n| 起点 | `(0, 0)` — 左上角 |\n| 终点 | `(m-1, n-1)` — 右下角 |\n| 移动方向 | 只能**向右**或**向下** |\n| 目标 | 路径数字之和最小 |\n\n**示例路径：**\n\n```\n1 → 3 → 1 → 1 → 1  = 7\n```\n\n**为什么用动态规划？**\n\n- 到达每个格子的最小路径和，只依赖于它**上方**和**左方**的格子\n- 子问题重叠：多个路径会经过同一个格子\n- 最优子结构：全局最优解依赖局部最优解"
visualizationType = "intro"

