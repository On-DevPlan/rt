[algorithm]
id = "longest-palindromic-substring"
title = "最长回文子串"
titleEn = "Longest Palindromic Substring"
difficulty = "medium"
tags = ["string", "dynamic-programming"]
testCase = "s = \"babad\""
expectedOutput = "\"bab\" 或 \"aba\""

# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 最长回文子串
# 找出字符串中最长的回文子串
#
# 回文串: 正读和反读都相同的字符串，如 "aba"、"abba"
#
# 示例:
#   s = "babad"
#   输出: "bab" 或 "aba" （都是长度为 3 的回文子串）
#
#   s = "cbbd"
#   输出: "bb"
#
# 关键思路: 中心扩展法
#   - 从每个字符（或两个字符中间）向两边扩展
#   - 奇数长度: 从字符扩展，如 "aba" 以 'b' 为中心
#   - 偶数长度: 从中间扩展，如 "abba" 以两个 'b' 之间为中心"""
explanation = "**问题分析**\n\n给定字符串 `s`，找出最长的回文子串。\n\n**什么是回文串？**\n\n正读和反读都相同的字符串：\n- 奇数长度：`\"aba\"`、`\"abcba\"`\n- 偶数长度：`\"abba\"`、`\"abccba\"`\n\n**中心扩展法核心思想**\n\n``\"\nbabad\n ↑\n从 'a' 向两边扩展: 'b' != 'd' → 不是回文\n从 'b' 向两边扩展: 'a' == 'a' → \"aba\" 是回文！\n```\n\n| 方法 | 时间 | 空间 |\n|------|------|------|\n| 暴力枚举 | O(n³) | O(1) |\n| 动态规划 | O(n²) | O(n²) |\n| **中心扩展** | **O(n²)** | **O(1)** |\n\n> 中心扩展法不需要额外空间，只需遍历每个可能的中心点并向两边扩展。"
visualizationType = "intro"

