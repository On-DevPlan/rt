        pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 函数接收字符串 `s`，返回最长回文子串\n- 处理边界条件：空字符串直接返回 `\"\"`\n- 初始化 `start = 0` 和 `max_len = 1`：记录最长回文子串的起始位置和长度\n- 准备遍历每个字符作为中心点\n\n**变量说明**\n\n| 变量 | 用途 |\n|------|------|\n| `start` | 最长回文子串的起始索引 |\n| `max_len` | 最长回文子串的长度 |\n| `i` | 当前中心点位置 |"
visualizationType = "code-only"

# ── Step 2: 奇数长度扩展 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "奇数长度扩展"
titleEn = "Odd Length Expansion"
code = """# 最长回文子串
# 找出字符串中最长的回文子串
#
# 回文串: 正读和反读都相同的字符串，如 "aba"、"abba"
#
# 示例:
#   s = \"babad\"
#   输出: \"bab\" 或 \"aba\" （都是长度为 3 的回文子串）
#
#   s = \"cbbd\"
#   输出: \"bb\"
#
# 关键思路: 中心扩展法
#   - 从每个字符（或两个字符中间）向两边扩展
#   - 奇数长度: 从字符扩展，如 \"aba\" 以 'b' 为中心
#   - 偶数长度: 从中间扩展，如 \"abba\" 以两个 'b' 之间为中心

def longestPalindrome(s: str) -> str:
    \"\"\"返回最长回文子串。\"\"\"
    if not s:
        return \"\"
    start, max_len = 0, 1
    for i in range(len(s)):
        # 奇数长度: l = r = i
        l, r = i, i
        while l >= 0 and r < len(s) and s[l] == s[r]:
            if r - l + 1 > max_len:
                start, max_len = l, r - l + 1
            l -= 1
            r += 1"""
explanation = "**第 2 步：处理奇数长度回文**\n\n奇数长度回文以单个字符为中心，如 `\"aba\"` 以 `'b'` 为中心。\n\n**扩展逻辑**\n\n```python\nl, r = i, i  # 左右指针从同一位置开始\nwhile l >= 0 and r < len(s) and s[l] == s[r]:\n    if r - l + 1 > max_len:\n        start, max_len = l, r - l + 1\n    l -= 1\n    r += 1\n```\n\n| 步骤 | 说明 |\n|------|------|\n| 1. 初始化 `l = r = i` | 从当前字符向两边扩展 |\n| 2. 检查边界和字符相等 | `l >= 0 and r < len(s) and s[l] == s[r]` |\n| 3. 更新最长回文 | `if r - l + 1 > max_len: ...` |\n| 4. 继续扩展 | `l -= 1; r += 1` |\n\n**示例：** `\"babad\"`，`i = 1`（字符 `'a'`）\n\n```\n初始: l = 1, r = 1 → s[1] = 'a'\n第1次扩展: l = 0, r = 2 → s[0] = 'b' == s[2] = 'b' ✓ → \"bab\"\n第2次扩展: l = -1 → 越界，停止\n找到回文 \"bab\"，长度为 3\n```"
visualizationType = "code-only"

# ── Step 3: 偶数长度扩展 ──────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "偶数长度扩展"
titleEn = "Even Length Expansion"
code = """# 最长回文子串
# 找出字符串中最长的回文子串
#
# 回文串: 正读和反读都相同的字符串，如 "aba"、"abba"
#
# 示例:
#   s = \"babad\"
#   输出: \"bab\" 或 \"aba\" （都是长度为 3 的回文子串）
#
#   s = \"cbbd\"
#   输出: \"bb\"
#
# 关键思路: 中心扩展法
#   - 从每个字符（或两个字符中间）向两边扩展
#   - 奇数长度: 从字符扩展，如 \"aba\" 以 'b' 为中心
#   - 偶数长度: 从中间扩展，如 \"abba\" 以两个 'b' 之间为中心

def longestPalindrome(s: str) -> str:
    \"\"\"返回最长回文子串。\"\"\"
    if not s:
        return \"\"
    start, max_len = 0, 1
    for i in range(len(s)):
        # 奇数长度: l = r = i
        l, r = i, i
        while l >= 0 and r < len(s) and s[l] == s[r]:
            if r - l + 1 > max_len:
                start, max_len = l, r - l + 1
            l -= 1
            r += 1
        # 偶数长度: l = i, r = i + 1
        l, r = i, i + 1
        while l >= 0 and r < len(s) and s[l] == s[r]:
            if r - l + 1 > max_len:
                start, max_len = l, r - l + 1
            l -= 1
            r += 1"""
explanation = "**第 3 步：处理偶数长度回文**\n\n偶数长度回文以两个字符之间的空隙为中心，如 `\"abba\"` 以中间两个 `'b'` 之间为中心。\n\n**扩展逻辑**\n\n```python\nl, r = i, i + 1  # 右指针从下一个字符开始\nwhile l >= 0 and r < len(s) and s[l] == s[r]:\n    if r - l + 1 > max_len:\n        start, max_len = l, r - l + 1\n    l -= 1\n    r += 1\n```\n\n| 步骤 | 说明 |\n|------|------|\n| 1. 初始化 `l = i, r = i + 1` | 从两个字符之间向两边扩展 |\n| 2. 检查边界和字符相等 | `l >= 0 and r < len(s) and s[l] == s[r]` |\n| 3. 更新最长回文 | `if r - l + 1 > max_len: ...` |\n| 4. 继续扩展 | `l -= 1; r += 1` |\n\n**示例：** `\"cbbd\"`，`i = 1`（字符 `'b'`）\n\n```\n初始: l = 1, r = 2 → s[1] = 'b' == s[2] = 'b' ✓ → \"bb\"\n第1次扩展: l = 0, r = 3 → s[0] = 'c' != s[3] = 'd' ✗ → 停止\n找到回文 \"bb\"，长度为 2\n```\n\n> 奇数和偶数扩展都需要尝试，确保覆盖所有可能的回文。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 最长回文子串
# 找出字符串中最长的回文子串
#
# 回文串: 正读和反读都相同的字符串，如 "aba"、"abba"
#
# 示例:
#   s = \"babad\"
#   输出: \"bab\" 或 \"aba\" （都是长度为 3 的回文子串）
#
#   s = \"cbbd\"
#   输出: \"bb\"
#
# 关键思路: 中心扩展法
#   - 从每个字符（或两个字符中间）向两边扩展
#   - 奇数长度: 从字符扩展，如 \"aba\" 以 'b' 为中心
#   - 偶数长度: 从中间扩展，如 \"abba\" 以两个 'b' 之间为中心

def longestPalindrome(s: str) -> str:
    \"\"\"返回最长回文子串。\"\"\"
    if not s:
        return \"\"
    start, max_len = 0, 1
    for i in range(len(s)):
        # 奇数长度: l = r = i
        l, r = i, i
        while l >= 0 and r < len(s) and s[l] == s[r]:
            if r - l + 1 > max_len:
                start, max_len = l, r - l + 1
            l -= 1
            r += 1
        # 偶数长度: l = i, r = i + 1
        l, r = i, i + 1
        while l >= 0 and r < len(s) and s[l] == s[r]:
            if r - l + 1 > max_len:
                start, max_len = l, r - l + 1
            l -= 1
            r += 1
    return s[start:start + max_len]"""
explanation = "**最终结果**\n\n✅ 中心扩展法完成\n\n```\n输入: s = \"babad\"\n输出: \"bab\" （或 \"aba\"）\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n²) — n 个中心点，每个最多扩展 n 次 |\n| 空间复杂度 | O(1) — 只用了常数个变量 |\n\n**为什么需要奇数和偶数扩展？**\n\n``\"\n奇数中心 (单个字符):  \"a\" \"aba\" \"abcba\"\n偶数中心 (两个字符间): \"aa\" \"abba\" \"abccba\"\n``\"\n\n只有同时处理两种情况，才能覆盖所有可能的回文。\n\n**执行示例：** `\"babad\"`\n\n| i (中心) | 奇数扩展 | 偶数扩展 |\n|----------|----------|----------|\n| 0 ('b') | \"b\" (长 1) | 无 |\n| 1 ('a') | **\"bab\" (长 3)** ✓ | 无 |\n| 2 ('b') | \"aba\" (长 3) | 无 |\n| 3 ('a') | \"a\" (长 1) | 无 |\n| 4 ('d') | \"d\" (长 1) | 无 |\n\n最终返回 `s[0:3] = \"bab\"`。"
