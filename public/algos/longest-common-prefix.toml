# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 最长公共前缀
# 给定一个字符串数组 strs，找出其中所有字符串共有的最长前缀
# 若不存在公共前缀，返回空字符串 ""
#
# 示例:
#   strs = ["flower", "flow", "flight"]
#   结果: "fl"
#
#   strs = ["dog", "racecar", "car"]
#   结果: ""（没有任何公共前缀）"""
explanation = "**问题重述**\n\n给定一个字符串数组 `strs`，找出所有字符串共有的最长前缀；若不存在公共前缀则返回空字符串。\n\n**输入与输出**\n\n- 输入：`strs: List[str]`，字符串数组\n- 输出：最长公共前缀（字符串）\n- 边界：空数组返回 `\"\"`；只有一个字符串返回自身；所有字符串完全不同返回 `\"\"`\n\n**示例走查**\n\n测试用例：`strs = [\"flower\", \"flow\", \"flight\"]`\n\n- 基准串 `flower`，从左到右逐列比较：\n- 第 0 列：`f, f, f` → 相同，继续\n- 第 1 列：`l, l, l` → 相同，继续\n- 第 2 列：`o, o, i` → `flow[i]='i'` 与 `flower[i]='o'` 不同，停止\n- 前 2 个字符 `"fl"` 为最长公共前缀\n\n期望输出：`\"fl\"`\n\n**关键洞察**\n\n公共前缀一定是某个字符串的前缀，因此只需固定一个基准串（如第一个），逐位与其他串同位置字符比较。发现不匹配或越界时立即切片返回，无需遍历完所有串。\n\n**方法预览**\n\n逐列比较：以 `strs[0]` 为基准，按列遍历并与其他所有串比较。\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(m·n)，m 为基准串长度 |\n| 空间复杂度 | O(1) |"
visualizationType = "intro"

