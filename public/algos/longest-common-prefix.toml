# ── Step 2: 边界检查 + 取基准 ─────────────────────────────────
[[algorithm.steps]]
id = 2
title = "边界与基准"
titleEn = "Edge Cases and Pivot"
code = """# 最长公共前缀
# 给定一个字符串数组 strs，找出其中所有字符串共有的最长前缀
# 若不存在公共前缀，返回空字符串 ""
#
# 示例:
#   strs = ["flower", "flow", "flight"]
#   结果: "fl"
#
#   strs = ["dog", "racecar", "car"]
#   结果: ""（没有任何公共前缀）

from typing import List

def longestCommonPrefix(strs: List[str]) -> str:
    \"\"\"返回字符串数组的最长公共前缀。\"\"\"
    if not strs:
        return ''
    pivot = strs[0]"""
explanation = "**第 2 步：处理边界 + 选定基准串**\n\n```python\nif not strs:\n    return ''       # 空数组：无公共前缀\npivot = strs[0]     # 以第 0 个串为基准，按列比对其它串\n```\n\n**为什么选 `strs[0]` 作基准？**\n\n公共前缀一定是某个串的前缀，最长公共前缀必然也是 `strs[0]` 的前缀。固定 `strs[0]` 后，只需逐位检查其它串同位字符是否一致即可。\n\n> 例如 `[\"flower\",\"flow\",\"flight\"]`，基准 `flower`，公共前缀 `fl` 也是 `flower` 的前 2 个字符。"
visualizationType = "code-only"

# ── Step 3: 逐列扫描 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "逐列扫描"
titleEn = "Scan Column by Column"
code = """# 最长公共前缀
# 给定一个字符串数组 strs，找出其中所有字符串共有的最长前缀
# 若不存在公共前缀，返回空字符串 ""
#
# 示例:
#   strs = ["flower", "flow", "flight"]
#   结果: "fl"
#
#   strs = ["dog", "racecar", "car"]
#   结果: ""（没有任何公共前缀）

from typing import List

def longestCommonPrefix(strs: List[str]) -> str:
    \"\"\"返回字符串数组的最长公共前缀。\"\"\"
    if not strs:
        return ''
    pivot = strs[0]
    for i in range(len(pivot)):
        c = pivot[i]
        for s in strs[1:]:
            if i >= len(s) or s[i] != c:
                return pivot[:i]"""
explanation = "**第 3 步：按列比较其他串**\n\n**外层循环**：遍历基准串的每一位 `i`\n\n**内层循环**：检查所有其他串在位置 `i` 处的字符是否等于 `pivot[i]`\n\n**两种触发返回的条件：**\n\n| 条件 | 含义 |\n|------|------|\n| `i >= len(s)` | 当前串在位置 `i` 之前已结束（基准更长） |\n| `s[i] != c` | 当前串在位置 `i` 字符不匹配 |\n\n> 任一条件命中，立刻返回 `pivot[:i]`——基准串的前 `i` 个字符就是答案。\n\n**示例执行（`strs = [\"flower\",\"flow\",\"flight\"]`）：**\n\n```\ni=0: pivot[0]='f',  其它 'f','f'  → 一致，继续\ni=1: pivot[1]='l',  其它 'l','l'  → 一致，继续\ni=2: pivot[2]='o',  flow[2]?   i(2)>=len(flow)(3)? 否\n                  但 s[2]='o'≠'w'? flow[2]='w'≠'o'  命中 → 返回 pivot[:2]=\"fl\"\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 最长公共前缀
# 给定一个字符串数组 strs，找出其中所有字符串共有的最长前缀
# 若不存在公共前缀，返回空字符串 ""
#
# 示例:
#   strs = ["flower", "flow", "flight"]
#   结果: "fl"
#
#   strs = ["dog", "racecar", "car"]
#   结果: ""（没有任何公共前缀）

from typing import List

def longestCommonPrefix(strs: List[str]) -> str:
    \"\"\"返回字符串数组的最长公共前缀。\"\"\"
    if not strs:
        return ''
    pivot = strs[0]
    for i in range(len(pivot)):
        c = pivot[i]
        for s in strs[1:]:
            if i >= len(s) or s[i] != c:
                return pivot[:i]
    return pivot"""
explanation = "**最终结果**\n\n✅ 完整的最长公共前缀函数\n\n**为何最后还要 `return pivot`？**\n\n外层循环正常结束（基准串的每一位都被所有串匹配），说明整个 `pivot` 都是公共前缀，直接返回 `pivot`。\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(m·n) — `m` 为基准串长度，`n` 为数组大小 |\n| 空间复杂度 | O(1) — 仅用常数个变量 |\n\n**关键技巧：固定基准 + 逐列比较**\n\n- 以 `strs[0]` 为基准，避免重复判断\n- 提前 break：发现不匹配立即返回切片\n- 兼顾「长度不一致」与「字符不一致」两种失败情况"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[\"flower\", \"flow\", \"flight\"]", result = "\"fl\"", highlightedIndices = [0, 1] }

