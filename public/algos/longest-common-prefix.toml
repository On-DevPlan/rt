# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 最长公共前缀
# 给定一个字符串数组 strs，找出其中所有字符串共有的最长前缀
# 若不存在公共前缀，返回空字符串 ""
#
# 示例:
#   strs = ["flower", "flow", "flight"]
#   结果: "fl"
#
#   strs = ["dog", "racecar", "car"]
#   结果: ""（没有任何公共前缀）"""
explanation = "**问题分析**\n\n- 输入：一个字符串数组 `strs`\n- 输出：所有字符串的**最长公共前缀**\n- 若数组为空或前缀不存在，返回 `\"\"`\n\n**三种解法对比**\n\n| 方法 | 时间 | 空间 | 思路 |\n|------|------|------|------|\n| **逐列比较** | O(m·n) | O(1) | 固定第 0 个串，按列比对其他串 |\n| 排序后比首尾 | O(m·n log n) | O(1)~O(n) | 排序后最长前缀一定在首尾之间 |\n| 分治递归 | O(m·n) | O(m·n) | 拆两半分别求前缀，再合并 |\n\n> 推荐**逐列比较**：最直观、最省空间，O(m·n) 时间 O(1) 空间即可解决。"
visualizationType = "intro"

