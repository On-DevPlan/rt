explanation = "**第 2 步：prev 指针 + dfs 框架**\n\n- `prev = [None]`：用长度为 1 的列表包一层，模拟「在嵌套函数里可写的外层变量」\n  - `prev[0]` 永远指向「上一次访问的节点」\n  - 初始化为 `None`，因为第一个访问的节点的 `right` 设为 `None`\n- 内部 `dfs(node)`：递归处理子树\n\n> **为什么用 list 而非 nonlocal？**\n> nonlocal 语法在某些老旧 Python 版本中支持不一致；用 list 容器是更通用的写法。"
