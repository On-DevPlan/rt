# ── Step 3: dfs 递归体（反向遍历 + 重组指针） ────────────────
[[algorithm.steps]]
id = 3
title = "反向 DFS 与重组指针"
titleEn = "Reverse DFS and Re-link"
code = """# 二叉树展开为链表
# 给定二叉树 root，将它原地展开为单链表
# 链表节点的顺序对应二叉树的先序遍历
# 要求：
#   - 所有节点 left 指针置 None
#   - 使用 right 指针作为链表的 next
#   - 原地修改，不创建新节点
#
# 示例:
#   root = [1,2,5,3,4,null,6]
#        1
#       / \\
#      2   5
#     / \\   \\
#    3   4   6
#
#   结果: 1 → 2 → 3 → 4 → 5 → 6
#   [1,null,2,null,3,null,4,null,5,null,6]

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def flatten(root: Optional[TreeNode]) -> None:
    \"\"\"将二叉树原地展平为链表（先序顺序）\"\"\"
    pass
    prev = [None]  # 用 list 包装，模拟闭包内可写的全局变量
    def dfs(node: Optional[TreeNode]) -> None:
        pass
        if not node:
            return
        dfs(node.right)  # 关键：先右后左 → 反向先序
        dfs(node.left)
        node.right = prev[0]  # 当前的 right 指向上一个访问的节点
        node.left = None      # left 必须置 None（链表要求）
        prev[0] = node        # 更新 prev
    dfs(root)"""
explanation = "**第 3 步：反向 DFS + 重组指针**\n\n**遍历顺序：先右后左（反向先序）**\n\n| 步骤 | 顺序 | 说明 |\n|------|------|------|\n| 1 | `dfs(node.right)` | 先处理右子树 |\n| 2 | `dfs(node.left)` | 再处理左子树 |\n| 3 | `node.right = prev[0]` | 接到「上一个访问的节点」 |\n| 4 | `node.left = None` | 断开左指针 |\n| 5 | `prev[0] = node` | 更新 prev |\n\n**为什么反向遍历？**\n\n先序遍历：根 → 左 → 右。反过来就是 **右 → 左 → 根**。\n- 访问到 `node` 时，prev 已经是「在原树中先序排在 `node` 之后的节点」\n- 直接 `node.right = prev[0]` 即可，无需去「寻找右子树末尾」\n\n> 这种「反向链接」思路在链表/树重链中非常常见（如 206 反转链表）。"
visualizationType = "code-only"

