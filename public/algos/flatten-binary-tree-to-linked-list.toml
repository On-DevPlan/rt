explanation = "**最终结果**\n\n输入树：\n\n```\n        1\n       / \\\n      2   5\n     / \\   \\\n    3   4   6\n```\n\n展平后：\n\n```\n1 → 2 → 3 → 4 → 5 → 6\n```\n\n**复杂度分析**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点访问一次 |\n| 空间复杂度 | O(h) — 递归栈深度，h 为树高 |\n\n**核心要点**\n\n- **反向遍历**：先序反过来走，`prev` 就是「下一个应链接的节点」\n- **原地修改**：不创建新节点，仅调整 `right/left` 指针\n- **`prev` 容器**：用 `list` 模拟可变的全局变量，避免 nonlocal 的兼容问题"
