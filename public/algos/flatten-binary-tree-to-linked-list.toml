# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 二叉树展开为链表
# 给定二叉树 root，将它原地展开为单链表
# 链表节点的顺序对应二叉树的先序遍历
# 要求：
#   - 所有节点 left 指针置 None
#   - 使用 right 指针作为链表的 next
#   - 原地修改，不创建新节点
#
# 示例:
#   root = [1,2,5,3,4,null,6]
#        1
#       / \\
#      2   5
#     / \\   \\
#    3   4   6
#
#   结果: 1 → 2 → 3 → 4 → 5 → 6
#   [1,null,2,null,3,null,4,null,5,null,6]"""
explanation = "**问题分析**\n\n把二叉树原地（in-place）拉成单链表，顺序是先序遍历：\n\n- 所有节点的 `left` 指针必须置 `None`\n- 使用 `right` 指针作为链表 `next`\n- 不能创建新节点，只能改指针\n\n**关键挑战：不能丢失子树**\n\n把左子树挂到 `root.right` 之前，必须先**把原来的右子树接到左子树末尾**。\n\n| 方法 | 思路 | 复杂度 |\n|------|------|--------|\n| 前序遍历存列表再重链 | 先存到数组，再串成链表 | O(n) 时间 + O(n) 空间 |\n| **后序 DFS + prev** | 反向遍历（先右后左）天然得到 prev | **O(n) 时间 + O(h) 空间** |\n\n> 反向遍历时，prev 始终是「下一个应挂在 node.right 的节点」。"
visualizationType = "intro"

