titleEn = "Edge Case and Init"
code = """# 删除有序数组中的重复项 II
# 给你一个有序数组 nums
# 原地删除重复出现的元素，使每个元素最多出现两次
# 返回删除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   相对顺序必须保持
#   返回新长度 k，前 k 个元素满足「最多出现两次」
#
# 示例:
#   nums = [0, 0, 1, 1, 1, 1, 2, 3, 3]
#   返回 7, nums 前七个元素为 [0, 0, 1, 1, 2, 3, 3]

from typing import List

def remove_duplicates(nums: List[int]) -> int:
    \"\"\"原地删除重复项，使每个元素最多出现两次，返回新长度。\"\"\"
    if not nums:
        return 0

    k = 2  # 前两个元素默认保留（最多可以有两个）"""
explanation = "**第 2 步：边界 + 初始化**\n\n```python\nif not nums:    # 空数组\n    return 0\n\nk = 2           # 前两个元素默认保留\n                # 因为最多允许出现两次，前两个一定没问题\n```\n\n**与「删除重复项 I」的区别**\n\n| 版本 | k 初始值 | 比较对象 |\n|------|----------|----------|\n| 最多 1 次 | `k = 1` | `nums[i] != nums[k-1]` |\n| **最多 2 次** | **`k = 2`** | `nums[i] != nums[k-2]` |\n\n> 规律：最多保留 m 次，则 `k = m`，比较 `nums[i]` 和 `nums[k-m]`。"
visualizationType = "code-only"

# ── Step 3: 遍历 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历判断"
titleEn = "Iterate and Judge"
code = """# 删除有序数组中的重复项 II
# 给你一个有序数组 nums
# 原地删除重复出现的元素，使每个元素最多出现两次
# 返回删除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   相对顺序必须保持
#   返回新长度 k，前 k 个元素满足「最多出现两次」
#
# 示例:
#   nums = [0, 0, 1, 1, 1, 1, 2, 3, 3]
#   返回 7, nums 前七个元素为 [0, 0, 1, 1, 2, 3, 3]

from typing import List

def remove_duplicates(nums: List[int]) -> int:
    \"\"\"原地删除重复项，使每个元素最多出现两次，返回新长度。\"\"\"
    if not nums:
        return 0

    k = 2  # 前两个元素默认保留（最多可以有两个）

    for i in range(2, len(nums)):
        if nums[i] != nums[k - 2]:
            nums[k] = nums[i]
            k += 1
    return k"""
explanation = "**第 3 步：遍历，比较 `nums[i]` 与 `nums[k-2]`**\n\n```\nfor i in range(2, len(nums)):     ← 从第 3 个元素开始遍历\n    if nums[i] != nums[k - 2]:     ← 与 k 往前数 2 个比较\n        nums[k] = nums[i]          ← 不同则保留\n        k += 1\nreturn k\n```\n\n**为什么比较 `nums[k-2]`？**\n\n因为允许最多 2 个相同元素，如果 `nums[i] == nums[k-2]`，说明已经有 2 个相同的了，当前元素是第 3 个，必须跳过。\n\n**执行过程**：\n\n```\nnums = [0, 0, 1, 1, 1, 1, 2, 3, 3]\nk=2\n\ni=2: nums[2]=1 != nums[0]=0 → nums[2]=1, k=3\ni=3: nums[3]=1 != nums[1]=0 → nums[3]=1, k=4\ni=4: nums[4]=1 == nums[2]=1 → 跳过（已经有 2 个 1 了）\ni=5: nums[5]=1 == nums[2]=1 → 跳过\ni=6: nums[6]=2 != nums[4]=1 → nums[4]=2, k=5\ni=7: nums[7]=3 != nums[3]=1 → nums[5]=3, k=6\ni=8: nums[8]=3 != nums[4]=2 → nums[6]=3, k=7\n\n返回 k=7, nums = [0, 0, 1, 1, 2, 3, 3, ...] ✓\n```"
visualizationType = "code-only"

