# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 删除有序数组中的重复项 II
# 给你一个有序数组 nums
# 原地删除重复出现的元素，使每个元素最多出现两次
# 返回删除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   相对顺序必须保持
#   返回新长度 k，前 k 个元素满足「最多出现两次」
#
# 示例:
#   nums = [0, 0, 1, 1, 1, 1, 2, 3, 3]
#   返回 7, nums 前七个元素为 [0, 0, 1, 1, 2, 3, 3]"""
explanation = "**问题分析**\n\n与「删除重复项 I」的区别：**允许每个元素最多出现两次**。\n\n`nums = [0, 0, 1, 1, 1, 1, 2, 3, 3]`\n- `0` 出现 2 次 → 保留\n- `1` 出现 4 次 → 保留前 2 个\n- `2` 出现 1 次 → 保留\n- `3` 出现 2 次 → 保留\n- 返回长度 `7`\n\n**关键思路**\n\n因为数组有序，重复元素连续。判断当前元素是否应保留，只需看它是否等于 `k-2` 位置的元素：\n- 如果 `nums[i] == nums[k-2]`，说明已经有 2 个相同的了，跳过\n- 否则保留\n\n> 这个技巧可以推广到「最多保留 k 次」：比较 `nums[i]` 和 `nums[k-k]`。"
visualizationType = "intro"

