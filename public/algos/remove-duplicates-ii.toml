[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 删除有序数组中的重复项 II
# 给你一个有序数组 nums
# 原地删除重复出现的元素，使每个元素最多出现两次
# 返回删除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   相对顺序必须保持
#   返回新长度 k，前 k 个元素满足「最多出现两次」
#
# 示例:
#   nums = [0, 0, 1, 1, 1, 1, 2, 3, 3]
#   返回 7, nums 前七个元素为 [0, 0, 1, 1, 2, 3, 3]

from typing import List

def remove_duplicates(nums: List[int]) -> int:
    \"\"\"原地删除重复项，使每个元素最多出现两次，返回新长度。\"\"\"
    if not nums:
        return 0

    k = 2  # 前两个元素默认保留（最多可以有两个）

    for i in range(2, len(nums)):
        if nums[i] != nums[k - 2]:
            nums[k] = nums[i]
            k += 1
    return k"""
explanation = "**最终结果**\n\n✅ `[0, 0, 1, 1, 1, 1, 2, 3, 3]` → 返回 `7`，前七位 `[0, 0, 1, 1, 2, 3, 3]`\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 一次遍历 |\n| 空间复杂度 | O(1) — 只用了两个指针 |\n\n**通用化推广**\n\n这个模式可以推广到「最多保留 k 次」：\n\n```python\ndef remove_k(nums, k):\n    if len(nums) <= k:\n        return len(nums)\n    slow = k\n    for fast in range(k, len(nums)):\n        if nums[fast] != nums[slow - k]:\n            nums[slow] = nums[fast]\n            slow += 1\n    return slow\n```\n\n> `k=1` 就是「去重 I」，`k=2` 就是本题，一个模板通吃所有版本。"
visualizationType = "result"
