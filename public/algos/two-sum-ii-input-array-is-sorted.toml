# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 两数之和 II - 输入有序数组
# 给定一个下标从 1 开始、按非递减顺序排列的整数数组 numbers
# 找出两个数，使它们之和等于 target，返回它们的 1-indexed 下标
#
# 关键条件:
#   - numbers 已按非递减排序
#   - 每种输入恰好有且仅有一个解
#   - 不能使用同一个元素两次（下标不同即可）
#   - 返回的下标必须是从 1 开始的（即 1-indexed）
#
# 示例:
#   numbers = [2, 7, 11, 15], target = 9
#   2 + 7 = 9，所以返回 [1, 2]"""
explanation = "**问题分析**\n\n给定一个**已排序**的数组 `numbers` 和目标值 `target`，需要找两个数之和等于 `target`，并返回它们 **1-indexed** 的下标。\n\n**与「两数之和 I」的关键区别**\n\n| 维度 | Two Sum I | Two Sum II |\n|------|-----------|------------|\n| 数组顺序 | 无序 | **非递减**（已排序） |\n| 返回下标 | 0-indexed | **1-indexed** |\n| 最优思路 | 哈希表 O(n) | **双指针 O(n)** |\n| 额外空间 | O(n) | O(1) |\n\n> 因为数组**已排序**，双指针可以充分利用「有序性」，比哈希表更省空间。\n\n**为什么双指针能奏效？**\n\n设 `l=0, r=n-1`，`sum = numbers[l] + numbers[r]`：\n\n- `sum > target` → 太大了，r 应该左移让 `numbers[r]` 变小\n- `sum < target` → 太小了，l 应该右移让 `numbers[l]` 变大\n- `sum == target` → 命中，l 和 r 的值就是要找的"
visualizationType = "intro"

