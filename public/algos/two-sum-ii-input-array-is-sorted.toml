#   2 + 7 = 9，所以返回 [1, 2]

from typing import List

def twoSum(numbers: List[int], target: int) -> List[int]:
    \"\"\"在已排序数组中找出两数之和等于 target 的 1-indexed 下标。\"\"\"
    l, r = 0, len(numbers) - 1  # 头尾两个指针
    while l < r:
        s = numbers[l] + numbers[r]
        if s == target:
            return [l + 1, r + 1]  # 1-indexed
        elif s < target:
            l += 1
        else:
            r -= 1
    return []"""
explanation = "**最终结果**\n\n✅ 双指针法找到两数之和\n\n```\n输入: numbers = [2, 7, 11, 15], target = 9\n输出: [1, 2]\n含义: numbers[0] + numbers[1] = 2 + 7 = 9\n```\n\n**算法复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | O(n) | 每个指针最多移动 n 次 |\n| 空间复杂度 | O(1) | 只用两个指针变量 |\n\n**与「Two Sum I」对比**\n\n| 方法 | 时间 | 空间 | 适用场景 |\n|------|------|------|----------|\n| 哈希表（Two Sum I） | O(n) | O(n) | 任意数组 |\n| **双指针（本题）** | **O(n)** | **O(1)** | **已排序数组** |\n\n> **关键洞察**：数组**有序性**是双指针法的核心前提——只有排好序才能保证「和太大时一定可以让 r 左移、和太小时一定可以让 l 右移」单调收敛。"
visualizationType = "result"
