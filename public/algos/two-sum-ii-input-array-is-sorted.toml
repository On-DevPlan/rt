# ── Step 2: 初始化双指针 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化双指针"
titleEn = "Initialize Two Pointers"
code = """# 两数之和 II - 输入有序数组
# 给定一个下标从 1 开始、按非递减顺序排列的整数数组 numbers
# 找出两个数，使它们之和等于 target，返回它们的 1-indexed 下标
#
# 关键条件:
#   - numbers 已按非递减排序
#   - 每种输入恰好有且仅有一个解
#   - 不能使用同一个元素两次（下标不同即可）
#   - 返回的下标必须是从 1 开始的（即 1-indexed）
#
# 示例:
#   numbers = [2, 7, 11, 15], target = 9
#   2 + 7 = 9，所以返回 [1, 2]

from typing import List

def twoSum(numbers: List[int], target: int) -> List[int]:
    \"\"\"在已排序数组中找出两数之和等于 target 的 1-indexed 下标。\"\"\"
    l, r = 0, len(numbers) - 1  # 头尾两个指针"""
explanation = "**第 2 步：初始化头尾双指针**\n\n```python\nl, r = 0, len(numbers) - 1\n```\n\n| 指针 | 初始位置 | 含义 |\n|------|----------|------|\n| `l` | `0` | 指向**最小**的数（数组头部） |\n| `r` | `len(numbers) - 1` | 指向**最大**的数（数组尾部） |\n\n**为什么这样初始化？**\n\n- 头尾相加能得到「当前能取到的最大和」\n- 通过移动两端指针，可以在 **O(n)** 步内扫遍所有可能的二元组合\n- 不需要任何额外空间（哈希表需要 O(n)）\n\n**示例初始状态**\n\n```\nnumbers = [2, 7, 11, 15]\nindex    0  1   2   3\n          ↑           ↑\n          l           r\n```"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "比较并移动指针"
titleEn = "Compare and Move Pointers"
code = """# 两数之和 II - 输入有序数组
# 给定一个下标从 1 开始、按非递减顺序排列的整数数组 numbers
# 找出两个数，使它们之和等于 target，返回它们的 1-indexed 下标
#
# 关键条件:
#   - numbers 已按非递减排序
#   - 每种输入恰好有且仅有一个解
#   - 不能使用同一个元素两次（下标不同即可）
#   - 返回的下标必须是从 1 开始的（即 1-indexed）
#
# 示例:
#   numbers = [2, 7, 11, 15], target = 9
#   2 + 7 = 9，所以返回 [1, 2]

from typing import List

def twoSum(numbers: List[int], target: int) -> List[int]:
    \"\"\"在已排序数组中找出两数之和等于 target 的 1-indexed 下标。\"\"\"
    l, r = 0, len(numbers) - 1  # 头尾两个指针
    while l < r:
        s = numbers[l] + numbers[r]
        if s == target:
            return [l + 1, r + 1]  # 1-indexed
        elif s < target:
            l += 1
        else:
            r -= 1
    return []"""
explanation = "**第 3 步：核心循环**\n\n循环条件 `l < r`：保证 `l` 和 `r` 不指向同一个元素。\n\n**比较逻辑**\n\n设 `s = numbers[l] + numbers[r]`：\n\n| 条件 | 操作 | 原因 |\n|------|------|------|\n| `s == target` | 返回 `[l+1, r+1]` | 命中，1-indexed 下标 |\n| `s < target` | `l += 1` | 和太小，让 `numbers[l]` 变大 |\n| `s > target` | `r -= 1` | 和太大，让 `numbers[r]` 变小 |\n\n**示例执行（numbers = [2, 7, 11, 15], target = 9）**\n\n| 步 | l | r | numbers[l] | numbers[r] | s | 比较 | 操作 |\n|---|----|----|------------|------------|----|------|------|\n| 1 | 0 | 3 | 2 | 15 | 17 | s > 9 | r -= 1 → r=2 |\n| 2 | 0 | 2 | 2 | 11 | 13 | s > 9 | r -= 1 → r=1 |\n| 3 | 0 | 1 | 2 | 7 | **9** | s == 9 | **返回 [1, 2]** |\n\n> 注意：返回的是 `l+1` 和 `r+1`（**1-indexed**），不是 `l` 和 `r`。"
visualizationType = "code-only"

