    pass
    n = len(matrix)"""
explanation = "**第 2 步：获取矩阵阶数**\n\n`n = len(matrix)` 取得矩阵的阶数，后续两层循环都要用到 `n`。\n\n- 矩阵是 `n × n`，所以行数 = 列数 = `n`\n- 转置时遍历上三角 `range(i+1, n)`\n- 反转时遍历每行 `range(n)`"
visualizationType = "code-only"

# ── Step 3: 主对角线转置 + 行反转 ─────────────────────────────
[[algorithm.steps]]
id = 3
title = "转置 + 行反转"
titleEn = "Transpose and Reverse Rows"
code = """# 旋转图像
# 给定一个 n × n 的二维矩阵 matrix
# 要求原地将图像顺时针旋转 90°
#
# 示例:
#   输入:  [[1,2,3],[4,5,6],[7,8,9]]
#   输出:  [[7,4,1],[8,5,2],[9,6,3]]
#
# 约束:
#   n == matrix.length == matrix[i].length
#   1 <= n <= 200
#   -1000 <= matrix[i][j] <= 1000
#   必须原地旋转（不使用额外矩阵）

from typing import List

def rotate(matrix: List[List[int]]) -> None:
    \"\"\"原地顺时针旋转矩阵 90°。\"\"\"
    pass
    n = len(matrix)
    for i in range(n):
        for j in range(i + 1, n):
            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]
    for i in range(n):
        matrix[i].reverse()"""
explanation = "**第 3 步：两步组合完成旋转**\n\n**① 主对角线转置**\n\n交换 `matrix[i][j]` 与 `matrix[j][i]`，内层从 `j = i + 1` 开始**只遍历上三角**，避免重复交换。\n\n```\n原矩阵:           转置后:\n1  2  3           1  4  7\n4  5  6    →      2  5  8\n7  8  9           3  6  9\n```\n\n**② 每行左右反转**\n\n调用 Python 内置 `list.reverse()`，原地反转每一行。\n\n```\n转置后:           反转每行后:\n1  4  7           7  4  1\n2  5  8    →      8  5  2\n3  6  9           9  6  3\n```\n\n**为什么「转置 + 水平翻转」= 顺时针 90°？**\n\n> 转置把 `(i, j)` 映射到 `(j, i)`，再把每行反转把 `(j, i)` 映射到 `(j, n-1-i)`，\n> 合并两步相当于 `(i, j) → (j, n-1-i)`，正是顺时针 90° 旋转的坐标变换公式。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 旋转图像
# 给定一个 n × n 的二维矩阵 matrix
# 要求原地将图像顺时针旋转 90°
#
# 示例:
#   输入:  [[1,2,3],[4,5,6],[7,8,9]]
#   输出:  [[7,4,1],[8,5,2],[9,6,3]]
#
# 约束:
#   n == matrix.length == matrix[i].length
#   1 <= n <= 200
#   -1000 <= matrix[i][j] <= 1000
#   必须原地旋转（不使用额外矩阵）

from typing import List

def rotate(matrix: List[List[int]]) -> None:
    \"\"\"原地顺时针旋转矩阵 90°。\"\"\"
    pass
    n = len(matrix)
    for i in range(n):
        for j in range(i + 1, n):
            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]
    for i in range(n):
        matrix[i].reverse()"""
explanation = "**最终结果**\n\n✅ 原地顺时针旋转 90° 完成\n\n```\n输入:  [[1,2,3],[4,5,6],[7,8,9]]\n输出:  [[7,4,1],[8,5,2],[9,6,3]]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n²) — 转置遍历上三角约 n²/2 次，每行反转 O(n) × n = O(n²) |\n| 空间复杂度 | O(1) — 仅使用常数级别临时变量 |\n\n**对比思路：直接四元素交换**\n\n```python\nfor i in range(n // 2):\n    for j in range(i, n - i - 1):\n        tmp = matrix[n - 1 - j][i]\n        matrix[n - 1 - j][i] = matrix[n - 1 - i][n - 1 - j]\n        matrix[n - 1 - i][n - 1 - j] = matrix[j][n - 1 - i]\n        matrix[j][n - 1 - i] = matrix[i][j]\n        matrix[i][j] = tmp\n```\n\n| 思路 | 优点 | 缺点 |\n|------|------|------|\n| **先转置再反转** | 思路直观、代码简洁 | 写操作次数略多（≈ 2n² 次） |\n| **直接四元素交换** | 总交换次数更少（≈ n² 次） | 索引推导复杂，易出错 |\n\n**关键技巧**\n\n- 将「旋转」分解为两个简单操作：转置 + 反转\n- 利用「顺时针 90° = 转置 + 水平翻转」的等价变换\n- 上三角循环 `range(i+1, n)` 避免重复交换"
visualizationType = "result"
