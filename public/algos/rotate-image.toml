    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 接收一个 `n × n` 的二维列表 `matrix`\n- 返回值类型为 `None`，要求**原地修改** `matrix`\n- 使用类型注解 `List[List[int]]` 明确输入类型\n- 文档字符串简要说明函数用途\n\n> 先用 `pass` 占位，后续步骤逐步实现。"
