# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 旋转图像
# 给定一个 n × n 的二维矩阵 matrix
# 要求原地将图像顺时针旋转 90°
#
# 示例:
#   输入:  [[1,2,3],[4,5,6],[7,8,9]]
#   输出:  [[7,4,1],[8,5,2],[9,6,3]]
#
# 约束:
#   n == matrix.length == matrix[i].length
#   1 <= n <= 200
#   -1000 <= matrix[i][j] <= 1000
#   必须原地旋转（不使用额外矩阵）"""
explanation = "**问题分析**\n\n给定一个 `n × n` 的二维矩阵，要求**原地**将其顺时针旋转 90°。\n\n**示例**\n\n```\n输入:                  输出:\n1  2  3                7  4  1\n4  5  6                8  5  2\n7  8  9                9  6  3\n```\n\n**难点**\n\n- 不能使用额外的二维矩阵（空间 O(1)）\n- 必须推导出元素的新位置关系\n\n**两种经典思路**\n\n| 思路 | 步骤 | 操作数 |\n|------|------|--------|\n| **先转置再反转** | ① 主对角线转置 ② 每行左右反转 | 2 次循环 |\n| **直接四元素交换** | 沿外层/内层一圈同时旋转 4 个元素 | 嵌套循环 |\n\n> 本实现采用「**先转置再反转**」，更直观易理解。两种思路时间复杂度均为 O(n²)，空间 O(1)。"
visualizationType = "intro"

