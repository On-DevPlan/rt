# ── Step 2: 初始化哨兵和双指针 ──────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 82. 删除排序链表中的重复元素 II
# 给定已排序的链表头节点 head，删除所有出现重复的数字
# 只保留原始链表中没有重复出现的数字
#
# 与「保留一个」的 83 题不同，本题要删除所有重复节点
#
# 示例:
#   head = [1,2,3,3,4,4,5]
#   结果: [1,2,5]
#
#   head = [1,1,1,2,3]
#   结果: [2,3]

from typing import Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def deleteDuplicates(head: Optional[ListNode]) -> Optional[ListNode]:
    \"\"\"删除所有重复节点，仅保留唯一元素\"\"\"
    dummy = ListNode(0, head)
    prev = dummy
    cur = head"""
explanation = "**第 2 步：初始化 dummy 哨兵和双指针**\n\n```\n链表: 1 → 2 → 3 → 3 → 4 → 4 → 5\n       ↑              ↑\n     head           head\n\ndummy → head\n  ↓\n  0 → 1 → 2 → 3 → 3 → 4 → 4 → 5\n  ↑    ↑\n prev cur\n```\n\n| 变量 | 含义 |\n|------|------|\n| `dummy` | 哨兵节点，简化对头节点删除的处理 |\n| `prev` | 指向**已确定无重复**的最后一个节点 |\n| `cur` | 当前正在检查的节点 |\n\n> 为什么需要 dummy？因为头节点也可能被删除（如 `head=[1,1,2]`），哨兵保证 `prev` 始终存在。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "检测与跳过"
titleEn = "Detect and Skip"
code = """# 82. 删除排序链表中的重复元素 II
# 给定已排序的链表头节点 head，删除所有出现重复的数字
# 只保留原始链表中没有重复出现的数字
#
# 与「保留一个」的 83 题不同，本题要删除所有重复节点
#
# 示例:
#   head = [1,2,3,3,4,4,5]
#   结果: [1,2,5]
#
#   head = [1,1,1,2,3]
#   结果: [2,3]

from typing import Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def deleteDuplicates(head: Optional[ListNode]) -> Optional[ListNode]:
    \"\"\"删除所有重复节点，仅保留唯一元素\"\"\"
    dummy = ListNode(0, head)
    prev = dummy
    cur = head
    while cur:
        # 检测当前节点是否重复
        has_duplicate = cur.next and cur.next.val == cur.val
        if has_duplicate:
            dup_val = cur.val
            while cur and cur.val == dup_val:
                cur = cur.next  # 跳过整段重复节点
            prev.next = cur
        else:
            prev = cur
            cur = cur.next
    return dummy.next"""
explanation = "**第 3 步：双层循环检测并跳过整段重复**\n\n**外层循环** — 遍历整个链表：\n\n```\nwhile cur:\n```\n\n**内层逻辑** — 判断是否重复：\n\n| 条件 | 操作 |\n|------|------|\n| `cur.next` 存在且 `cur.next.val == cur.val` | **进入跳过模式** |\n| 否则 | `prev = cur; cur = cur.next` |\n\n**跳过模式**：用 `dup_val` 记录重复值，把 `cur` 一路推进到第一个**不同值**的节点，然后让 `prev.next` 指向它，整段重复节点全部跳过。\n\n**示例执行（head=[1,2,3,3,4,4,5]）**\n\n```\ncur=1, 无重复 → prev=1, cur=2\ncur=2, 无重复 → prev=2, cur=3\ncur=3, 重复 → 跳过两个3 → cur=4\ncur=4, 重复 → 跳过两个4 → cur=5\ncur=5, 无重复 → prev=5, cur=None\n返回: [1,2,5] ✓\n```"
visualizationType = "code-only"

