explanation = "**最终结果**\n\n```\n输入:  head = [1, 2, 3, 3, 4, 4, 5]\n输出:  [1, 2, 5]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点最多访问两次 |\n| 空间复杂度 | O(1) — 仅用 dummy/prev/cur 三个指针 |\n\n**核心要点**\n\n- **dummy 哨兵**：统一处理头节点被删除的情况\n- **prev 永远指向无重复段尾部**：保证 `prev.next` 是有效操作\n- **跳过整段重复**：用内层 while 把所有相同值节点全部跳过去"
