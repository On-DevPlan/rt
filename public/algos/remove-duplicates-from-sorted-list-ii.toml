# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 82. 删除排序链表中的重复元素 II
# 给定已排序的链表头节点 head，删除所有出现重复的数字
# 只保留原始链表中没有重复出现的数字
#
# 与「保留一个」的 83 题不同，本题要删除所有重复节点
#
# 示例:
#   head = [1,2,3,3,4,4,5]
#   结果: [1,2,5]
#
#   head = [1,1,1,2,3]
#   结果: [2,3]"""
explanation = "**问题重述**\n\n给定一个已按升序排列的链表 `head`，要求删除链表中**所有**出现过重复的数字节点，只保留原始链表中唯一出现一次的数字。注意与「保留一个重复节点」的版本不同，本题连重复数字的任意一个实例都要移除。\n\n**输入与输出**\n\n- **输入**：`head = [1, 2, 3, 3, 4, 4, 5]`。\n- **输出**：`[1, 2, 5]`，因为 `3` 和 `4` 都重复出现，全部被删除；`1、2、5` 只出现一次，保留。\n- **反例**：`head = [1, 1, 1, 2, 3]` 应输出 `[2, 3]`，头节点 `1` 重复，也要删除。\n- **边界情况**：空链表返回 `None`；全部节点都重复时返回 `None`。\n\n**示例走查**\n\n以 `head = [1, 2, 3, 3, 4, 4, 5]` 为例：\n\n1. 链表已排序，相同值连续出现：`3` 连续两次、`4` 连续两次。\n2. 使用哨兵节点 `dummy` 指向头节点，避免头节点被删除时的特殊处理。\n3. 用 `prev` 跟踪已确认无重复的最后一个节点，用 `cur` 遍历链表：\n   - `1` 和 `2` 均无重复，`prev` 依次后移。\n   - 遇到第一个 `3` 时，发现下一个节点也是 `3`，进入「跳过整段重复」模式，把两个 `3` 全部跳过。\n   - 同理跳过两个 `4`。\n   - 最后 `5` 无重复，链接到 `prev` 后面。\n4. 返回 `dummy.next`，即 `[1, 2, 5]`。\n\n**关键洞察**\n\n- 排序链表保证相同值相邻，因此只要发现 `cur.next.val == cur.val`，就说明出现了一段重复节点。\n- 必须整段跳过这些重复节点，而不是只跳过一个；同时需要 `dummy` 哨兵来统一处理头节点被删除的情况。\n\n**方法预览**\n\n| 项目 | 说明 |\n|------|------|\n| 数据结构 | 链表 + 哨兵节点 |\n| 时间复杂度 | O(n)，每个节点最多访问两次 |\n| 空间复杂度 | O(1)，仅使用 `dummy、prev、cur` 等指针 |\n| 关键操作 | 检测 `cur.next.val == cur.val` 后，内层循环跳过所有相同值节点 |"
visualizationType = "intro"

