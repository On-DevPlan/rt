[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 两数之和 (Two Sum)
# 给定一个整数数组 nums 和一个整数目标值 target
# 找出数组中和为 target 的两个数，返回它们的下标
#
# 示例:
#   nums = [2, 7, 11, 15], target = 9
#   因为 nums[0] + nums[1] = 2 + 7 = 9
#   所以返回 [0, 1]"""
explanation = "**问题重述** — 给定整数数组 `nums` 和目标值 `target`，找出两个数之和等于 `target` 的元素，返回它们的下标（顺序不敏感）。\n\n**输入与输出**\n- 输入：`nums = [2, 7, 11, 15]`，`target = 9`\n- 输出：`[0, 1]`（因为 `nums[0] + nums[1] = 2 + 7 = 9`）\n- 边界：每个元素只能使用一次；题目保证恰好有一组解；返回任意顺序均可\n\n**示例走查**\n```\ntestCase: nums = [2, 7, 11, 15], target = 9\nexpectedOutput: [0, 1]\n\n遍历推导:\n  i=0, num=2:  complement = 9-2 = 7 → 7 不在已见中 → 记录 {2:0}\n  i=1, num=7:  complement = 9-7 = 2 → 2 已在 → 命中！返回 [0, 1] ✓\n```\n\n**关键洞察**\n- 朴素 O(n²) 双重循环太慢，应利用「遍历时检查补数」的思路，将内层查找优化到 O(1)\n- 用哈希表将「值 → 索引」存入字典，遍历到当前元素时查其补数是否已见过\n- 不能先建表再遍历（那样内外层都是 O(n)，仍有 O(n²) 问题），必须边遍历边查找\n\n**方法预览**\n- 算法：哈希表单次遍历（一次遍历，O(n)）\n- 数据结构：字典 `seen`，键为数值，值为下标\n- 复杂度：时间 O(n)，空间 O(n)"
visualizationType = "intro"

