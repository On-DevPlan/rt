[[algorithm.steps]]
id = 3
title = "遍历与查找"
titleEn = "Iterate & Lookup"
code = """# 两数之和 (Two Sum)
# 给定一个整数数组 nums 和一个整数目标值 target
# 找出数组中和为 target 的两个数，返回它们的下标
#
# 示例:
#   nums = [2, 7, 11, 15], target = 9
#   因为 nums[0] + nums[1] = 2 + 7 = 9
#   所以返回 [0, 1]

from typing import List

def two_sum(nums: List[int], target: int) -> List[int]:
    \"\"\"找出数组中两数之和等于 target 的两个索引。\"\"\"
    seen = {}  # value -> index 的映射

    for i, num in enumerate(nums):
        complement = target - num
        # 检查 complement 是否已在 seen 中
        if complement in seen:
            return [seen[complement], i]
        seen[num] = i
    return []"""
explanation = "**第 3 步：编写核心逻辑**\n\n遍历数组，对每个元素：\n\n1. **枚举**：`enumerate(nums)` 同时获取索引 `i` 和值 `num`\n2. **计算补数**：`complement = target - num`\n3. **查找字典**：`complement in seen`\n   - 找到 → 返回 `[seen[complement], i]`\n   - 未找到 → 将 `num` 和 `i` 存入 `seen`\n\n**以 `i=0`, `num=2` 为例：**\n```python\ncomplement = 9 - 2 = 7\n7 in seen = False → seen[2] = 0\n# seen = {2: 0}\n```"
visualizationType = "array-iteration"
visualizationData = { mapContents = "{}", arrayState = "[2, 7, 11, 15]", currentIndex = 0, currentValue = 2, complement = 7, found = false }

[[algorithm.steps]]
id = 4
title = "命中结果"
titleEn = "Match Found"
code = """# 两数之和 (Two Sum)
# 给定一个整数数组 nums 和一个整数目标值 target
# 找出数组中和为 target 的两个数，返回它们的下标
#
# 示例:
#   nums = [2, 7, 11, 15], target = 9
#   因为 nums[0] + nums[1] = 2 + 7 = 9
#   所以返回 [0, 1]

from typing import List

def two_sum(nums: List[int], target: int) -> List[int]:
    \"\"\"找出数组中两数之和等于 target 的两个索引。\"\"\"
    seen = {}  # value -> index 的映射

    for i, num in enumerate(nums):
        complement = target - num
        # 检查 complement 是否已在 seen 中
        if complement in seen:
            return [seen[complement], i]
        seen[num] = i
    return []"""
explanation = "**第 4 步：继续遍历 — `i=1`, `num=7`**\n\n```python\ncomplement = 9 - 7 = 2\n2 in seen = True!   ← 之前存入了 {2: 0}\n```\n\n✅ **命中！**\n- `seen[2]` = 0\n- 当前索引 `i` = 1\n- 返回 `[0, 1]`\n\n**字典状态**\n```\nseen = {2: 0}   ← 上一轮存入\n           ↑\n     7 的补数是 2，命中！\n```\n\n遍历到 7 时，它的补数 2 已经在字典中，立即得到答案！"
visualizationType = "map-found"
visualizationData = { mapContents = "{2 → 0}", arrayState = "[2, 7, 11, 15]", currentIndex = 1, currentValue = 7, complement = 2, found = true, foundIndex = 0, result = "[0, 1]" }

