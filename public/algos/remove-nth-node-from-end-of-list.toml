# ── Step 2: 初始化哨兵与指针 ──────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 删除链表的倒数第 N 个结点 (LeetCode 19)
# 给定一个链表的头节点 head 和整数 n
# 删除链表的倒数第 n 个节点，并返回新链表的头节点
#
# 约束:
#   1 <= n <= 链表长度
#   链表至少包含一个节点
#
# 示例:
#   head = [1, 2, 3, 4, 5], n = 2
#   倒数第 2 个节点是 4，删除后结果: [1, 2, 3, 5]

from typing import Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def removeNthFromEnd(head: Optional[ListNode], n: int) -> Optional[ListNode]:
    \"\"\"删除链表的倒数第 n 个节点，返回新头节点。\"\"\"
    dummy = ListNode(0, head)  # 哨兵头，简化边界处理
    fast = slow = dummy        # 快慢指针都从 dummy 出发"""
explanation = "**第 2 步：创建哨兵头和双指针**\n\n| 变量 | 作用 | 初值 |\n|------|------|------|\n| `dummy` | 哨兵头节点（值为 0） | `ListNode(0, head)` |\n| `fast` | 快指针 | `dummy` |\n| `slow` | 慢指针 | `dummy` |\n\n**为什么要 `dummy` 哨兵？**\n\n- 链表头可能被删除（如 `n = 长度` 时删的就是头）\n- 没有 `dummy` 要单独判断 `head` 的情况\n- 有了 `dummy`，`slow.next` 就是要删的节点，统一处理\n\n**为什么 fast/slow 都从 dummy 出发？**\n\n- 先让 `fast` 走 `n` 步，然后两指针同步前进\n- 当 `fast.next is None` 时，`slow` 正好指向**待删节点的前一个**\n- 这样 `slow.next` 就是**待删节点**"
visualizationType = "code-only"

# ── Step 3: 快指针先走 + 同步前进 ────────────────────────────
[[algorithm.steps]]
id = 3
title = "快慢指针同步"
titleEn = "Two Pointers Move"
code = """# 删除链表的倒数第 N 个结点 (LeetCode 19)
# 给定一个链表的头节点 head 和整数 n
# 删除链表的倒数第 n 个节点，并返回新链表的头节点
#
# 约束:
#   1 <= n <= 链表长度
#   链表至少包含一个节点
#
# 示例:
#   head = [1, 2, 3, 4, 5], n = 2
#   倒数第 2 个节点是 4，删除后结果: [1, 2, 3, 5]

from typing import Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def removeNthFromEnd(head: Optional[ListNode], n: int) -> Optional[ListNode]:
    \"\"\"删除链表的倒数第 n 个节点，返回新头节点。\"\"\"
    dummy = ListNode(0, head)  # 哨兵头，简化边界处理
    fast = slow = dummy        # 快慢指针都从 dummy 出发
    for _ in range(n):
        fast = fast.next       # 快指针先走 n 步
    while fast.next:           # 同步前进直到 fast 到达末尾
        fast = fast.next
        slow = slow.next"""
explanation = "**第 3 步：让 fast 先走 n 步，再同步前进**\n\n**步骤 1：让 fast 先走 `n` 步**\n\n```\n初始: dummy → 1 → 2 → 3 → 4 → 5 → None\n        slow\n        fast\n\nfast 走 2 步后:\ndummy → 1 → 2 → 3 → 4 → 5 → None\n        slow              fast\n```\n\n此时 `fast` 和 `slow` 间距恒为 `n`。\n\n**步骤 2：同步前进，直到 `fast.next is None`**\n\n```\n当 fast 到末尾时:\ndummy → 1 → 2 → 3 → 4 → 5 → None\n              slow              fast\n       ↑   ↑   ↑\n       距 fast 仍是 2 步\n```\n\n`slow` 停在**待删节点的前一个**位置。\n\n**示例追踪**（`n=2`）：\n\n| 轮 | fast 位置 | slow 位置 | 距离 |\n|----|-----------|-----------|------|\n| 初始 | dummy | dummy | 0 |\n| 快走 2 步 | 节点 3 | dummy | 2 |\n| 同步 1 | 节点 4 | 节点 1 | 2 |\n| 同步 2 | 节点 5 | 节点 2 | 2 |\n| 同步 3 | None | 节点 3 | 循环退出 |\n\n> 退出时 `slow` 指向节点 3，`slow.next` 是节点 4 —— 即**待删节点**。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 删除链表的倒数第 N 个结点 (LeetCode 19)
# 给定一个链表的头节点 head 和整数 n
# 删除链表的倒数第 n 个节点，并返回新链表的头节点
#
# 约束:
#   1 <= n <= 链表长度
#   链表至少包含一个节点
#
# 示例:
#   head = [1, 2, 3, 4, 5], n = 2
#   倒数第 2 个节点是 4，删除后结果: [1, 2, 3, 5]

from typing import Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def removeNthFromEnd(head: Optional[ListNode], n: int) -> Optional[ListNode]:
    \"\"\"删除链表的倒数第 n 个节点，返回新头节点。\"\"\"
    dummy = ListNode(0, head)  # 哨兵头，简化边界处理
    fast = slow = dummy        # 快慢指针都从 dummy 出发
    for _ in range(n):
        fast = fast.next       # 快指针先走 n 步
    while fast.next:           # 同步前进直到 fast 到达末尾
        fast = fast.next
        slow = slow.next
    slow.next = slow.next.next  # 删除节点
    return dummy.next           # 返回新头节点（可能是原 head）"""
explanation = "**最终结果**\n\n```\n输入: head = [1,2,3,4,5], n = 2\n删除节点 4（slow.next）\n输出: [1,2,3,5]\n```\n\n**删除操作**\n\n```\ndummy → 1 → 2 → 3 → 4 → 5 → None\n              slow  ↑\n                    slow.next.next (即 5)\nslow.next = slow.next.next  # 跳过节点 4\n```\n\n**返回 `dummy.next` 的原因**\n\n- `dummy` 是哨兵，不是原链表的一部分\n- 当 `n = 链表长度` 时，删除的就是原 `head`\n- 此时 `dummy.next` 已指向**新的 head**\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(L) — L 为链表长度，只遍历一次 |\n| 空间复杂度 | O(1) — 只用了若干指针 |\n\n**关键技巧**\n\n- **哨兵头**：`dummy` 统一处理「删除头节点」边界\n- **双指针间距**：`fast` 先走 `n` 步保持间距恒定\n- **循环条件 `fast.next`**：让 `slow` 停在**待删节点的前一个**\n\n> 此解法相比「先求长度再删除」省去了一次遍历，更优雅。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 2, 3, 4, 5]", result = "[1, 2, 3, 5]", highlightedIndices = [3] }

