# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 删除链表的倒数第 N 个结点 (LeetCode 19)
# 给定一个链表的头节点 head 和整数 n
# 删除链表的倒数第 n 个节点，并返回新链表的头节点
#
# 约束:
#   1 <= n <= 链表长度
#   链表至少包含一个节点
#
# 示例:
#   head = [1, 2, 3, 4, 5], n = 2
#   倒数第 2 个节点是 4，删除后结果: [1, 2, 3, 5]"""
explanation = "**问题分析**\n\n给单链表 `head` 和整数 `n`，删除**倒数第 `n` 个**节点。\n\n```\nhead = [1, 2, 3, 4, 5], n = 2\n\n正序索引: 0  1  2  3  4\n链表:    1→ 2→ 3→ 4→ 5→ None\n倒序索引: 5  4  3  2  1   ← 倒数第 2 个 = 节点 4\n\n删除 4 → [1, 2, 3, 5]\n```\n\n**难点：什么是「倒数」？**\n\n- 不知道链表长度 → 没法直接定位\n- 单链表**没有反向指针**，无法从尾向前数\n\n**核心思路：双指针 + 哨兵头**\n\n| 方法 | 时间 | 空间 | 说明 |\n|------|------|------|------|\n| 先求长度再删除 | O(L) | O(1) | 两遍遍历 |\n| **双指针 (快慢)** | **O(L)** | **O(1)** | **一遍遍历即可** |\n\n> 用 `dummy` 哨兵头统一处理「删除头节点」的边界，让代码更简洁。"
visualizationType = "intro"

