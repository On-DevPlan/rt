# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# O(1) 时间插入、删除和获取随机元素
# 设计一个 RandomizedSet 类，支持以下操作，且平均时间复杂度为 O(1):
#   1. insert(val): 元素不存在则插入，返回 true; 已存在则返回 false
#   2. remove(val): 元素存在则删除，返回 true; 不存在则返回 false
#   3. getRandom(): 随机返回集合中的一个元素，每个元素被选中的概率相同
#
# 关键挑战:
#   - 数组支持 O(1) 随机访问，但删除任意位置是 O(n)
#   - 哈希表支持 O(1) 查找，但不能随机访问
#   - 需要把两者结合，取长补短"""
explanation = "**问题分析**\n\n实现一个数据结构，同时支持：\n\n| 操作 | 要求 |\n|------|------|\n| `insert(val)` | 平均 O(1) |\n| `remove(val)` | 平均 O(1) |\n| `getRandom()` | O(1) 且等概率 |\n\n**核心难点**\n\n- 数组能 O(1) 随机访问，但**任意位置删除**是 O(n)\n- 哈希表能 O(1) 查找，但不能随机访问\n\n**思路：数组 + 哈希表组合**\n\n1. `data` 数组存所有元素，支持 O(1) `random.choice`\n2. `idx` 哈希表存 `val -> 数组下标`，支持 O(1) 查找\n3. 删除时，把待删元素与末尾交换再 `pop`，把 O(n) 删除降为 O(1)\n\n> 关键技巧：**末尾交换删除法**——用空间换时间，把任意位置删除转换为末尾删除。"
visualizationType = "intro"

