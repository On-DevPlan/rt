def climbStairs(n: int) -> int:
    \"\"\"返回爬 n 级楼梯的不同方法数。\"\"\"
    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 接收参数 `n`：楼梯级数\n- 返回值类型为 `int`：方法总数\n- 使用类型注解明确参数类型\n- 文档字符串描述函数用途"
