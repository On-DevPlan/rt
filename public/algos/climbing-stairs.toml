# ── Step 2: 边界条件 ──────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "处理边界"
titleEn = "Handle Edge Cases"
code = """# 70. 爬楼梯
# 计算爬 n 级楼梯的不同方法数（每次只能爬 1 或 2 级）
#
# 示例:
#   n = 1 → 1 种: [1]
#   n = 2 → 2 种: [1+1, 2]
#   n = 3 → 3 种: [1+1+1, 1+2, 2+1]
#   n = 4 → 5 种: [1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2]
#
# 关键观察：
#   到达第 i 级的方法数 = 到达第 i-1 级 + 到达第 i-2 级
#   因为最后一步要么从 i-1 走 1 级，要么从 i-2 走 2 级

def climbStairs(n: int) -> int:
    \"\"\"返回爬 n 级楼梯的不同方法数。\"\"\"
    if n <= 2:
        return n"""
explanation = "**第 2 步：处理边界条件**\n\n当 `n <= 2` 时，可以直接返回结果：\n\n| n | 答案 | 原因 |\n|---|------|------|\n| 1 | 1 | 只能 1 步 |\n| 2 | 2 | 1+1 或 2 |\n\n> 这是斐波那契数列的「基础情况」，无需递推计算。"
visualizationType = "code-only"

# ── Step 3: 初始化变量 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "初始化变量"
titleEn = "Initialize Variables"
code = """# 70. 爬楼梯
# 计算爬 n 级楼梯的不同方法数（每次只能爬 1 或 2 级）
#
# 示例:
#   n = 1 → 1 种: [1]
#   n = 2 → 2 种: [1+1, 2]
#   n = 3 → 3 种: [1+1+1, 1+2, 2+1]
#   n = 4 → 5 种: [1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2]
#
# 关键观察：
#   到达第 i 级的方法数 = 到达第 i-1 级 + 到达第 i-2 级
#   因为最后一步要么从 i-1 走 1 级，要么从 i-2 走 2 级

def climbStairs(n: int) -> int:
    \"\"\"返回爬 n 级楼梯的不同方法数。\"\"\"
    if n <= 2:
        return n

    prev2 = 1  # dp[i-2]，初始为 dp[1] = 1
    prev1 = 2  # dp[i-1]，初始为 dp[2] = 2"""
explanation = "**第 3 步：初始化前两个值**\n\n只需维护「前两个状态」，空间优化到 O(1)：\n\n```\ndp[1] = 1  → prev2\n             ↓\ndp[2] = 2  → prev1\n             ↓\ndp[3] = dp[2] + dp[1] = 3\n```\n\n| 变量 | 含义 | 初始值 |\n|------|------|--------|\n| `prev2` | dp[i-2] | 1 (dp[1]) |\n| `prev1` | dp[i-1] | 2 (dp[2]) |\n\n> 不需要整个数组，每次计算只需「前两项」即可。"
visualizationType = "code-only"

# ── Step 4: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "递推计算"
titleEn = "Iterate and Calculate"
code = """# 70. 爬楼梯
# 计算爬 n 级楼梯的不同方法数（每次只能爬 1 或 2 级）
#
# 示例:
#   n = 1 → 1 种: [1]
#   n = 2 → 2 种: [1+1, 2]
#   n = 3 → 3 种: [1+1+1, 1+2, 2+1]
#   n = 4 → 5 种: [1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2]
#
# 关键观察：
#   到达第 i 级的方法数 = 到达第 i-1 级 + 到达第 i-2 级
#   因为最后一步要么从 i-1 走 1 级，要么从 i-2 走 2 级

def climbStairs(n: int) -> int:
    \"\"\"返回爬 n 级楼梯的不同方法数。\"\"\"
    if n <= 2:
        return n

    prev2 = 1  # dp[i-2]，初始为 dp[1] = 1
    prev1 = 2  # dp[i-1]，初始为 dp[2] = 2

    for _ in range(3, n + 1):
        curr = prev1 + prev2  # dp[i] = dp[i-1] + dp[i-2]
        prev2 = prev1          # 滚动更新
        prev1 = curr"""
explanation = "**第 4 步：迭代计算**\n\n从第 3 级开始递推，直到第 `n` 级：\n\n```python\nfor i in range(3, n + 1):\n    curr = prev1 + prev2  # 当前值\n    prev2 = prev1         # 前一个 → 前两个\n    prev1 = curr          # 当前 → 前一个\n```\n\n**执行示例（n=5）**\n\n| 迭代 | prev2 | prev1 | curr = prev1 + prev2 |\n|------|-------|-------|----------------------|\n| 初始 | 1 | 2 | — |\n| i=3 | 2 | 3 | 2+1=3 |\n| i=4 | 3 | 5 | 3+2=5 |\n| i=5 | 5 | 8 | 5+3=8 |\n\n最终返回 `prev1 = 8`。"
visualizationType = "code-only"

# ── Step 5: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 5
title = "完成"
titleEn = "Complete"
code = """# 70. 爬楼梯
# 计算爬 n 级楼梯的不同方法数（每次只能爬 1 或 2 级）
#
# 示例:
#   n = 1 → 1 种: [1]
#   n = 2 → 2 种: [1+1, 2]
#   n = 3 → 3 种: [1+1+1, 1+2, 2+1]
#   n = 4 → 5 种: [1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2]
#
# 关键观察：
#   到达第 i 级的方法数 = 到达第 i-1 级 + 到达第 i-2 级
#   因为最后一步要么从 i-1 走 1 级，要么从 i-2 走 2 级

def climbStairs(n: int) -> int:
    \"\"\"返回爬 n 级楼梯的不同方法数。\"\"\"
    if n <= 2:
        return n

    prev2 = 1  # dp[i-2]，初始为 dp[1] = 1
    prev1 = 2  # dp[i-1]，初始为 dp[2] = 2

    for _ in range(3, n + 1):
        curr = prev1 + prev2  # dp[i] = dp[i-1] + dp[i-2]
        prev2 = prev1          # 滚动更新
        prev1 = curr

    return prev1"""
explanation = "**最终结果**\n\n✅ 动态规划完成\n\n```\n输入: n = 3\n输出: 3\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 单次遍历 |\n| 空间复杂度 | O(1) — 只用两个变量 |\n\n**核心思想**\n\n1. **递推关系**：`dp[i] = dp[i-1] + dp[i-2]`\n2. **空间优化**：不用数组，只存前两个值\n3. **本质**：就是斐波那契数列，只是初始值不同\n\n> 这是最经典的一维动态规划入门题，掌握这个模式可以解决很多类似问题。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 2, 3]", result = "3", highlightedIndices = [0, 1, 2] }

