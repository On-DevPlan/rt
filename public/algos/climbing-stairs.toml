# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 70. 爬楼梯
# 计算爬 n 级楼梯的不同方法数（每次只能爬 1 或 2 级）
#
# 示例:
#   n = 1 → 1 种: [1]
#   n = 2 → 2 种: [1+1, 2]
#   n = 3 → 3 种: [1+1+1, 1+2, 2+1]
#   n = 4 → 5 种: [1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2]
#
# 关键观察：
#   到达第 i 级的方法数 = 到达第 i-1 级 + 到达第 i-2 级
#   因为最后一步要么从 i-1 走 1 级，要么从 i-2 走 2 级"""
explanation = "**问题分析**\n\n爬楼梯问题是典型的**动态规划**问题，本质是**斐波那契数列**。\n\n**关键思路**\n\n要到达第 `i` 级楼梯，只有两种方式：\n- 从第 `i-1` 级爬 1 级\n- 从第 `i-2` 级爬 2 级\n\n因此：`dp[i] = dp[i-1] + dp[i-2]`\n\n| n | 方法数 | 组合 |\n|---|--------|------|\n| 1 | 1 | [1] |\n| 2 | 2 | [1+1, 2] |\n| 3 | 3 | [1+1+1, 1+2, 2+1] |\n| 4 | 5 | [1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2] |\n\n> 可以看出这是一个斐波那契数列：1, 2, 3, 5, 8, 13..."
visualizationType = "intro"

# ── Step 1: 函数签名 ──────────────────────────────────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 70. 爬楼梯
