# ── Step 2: 初始化 dummy 与 pre 指针 ─────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 反转链表 II
# 给定单链表的头节点 head，以及两个整数 left 和 right（1-indexed）
# 反转从 left 到 right 这一段链表节点，返回头节点
#
# 要求:
#   使用一次遍历完成原地反转
#   left 和 right 满足 1 <= left < right <= n
#
# 示例:
#   head = [1, 2, 3, 4, 5], left = 2, right = 4
#   结果: [1, 4, 3, 2, 5]

from typing import Optional

class ListNode:
    def __init__(self, x):
        self.val = x
        self.next = None

def reverseBetween(head: Optional[ListNode], left: int, right: int) -> Optional[ListNode]:
    \"\"\"反转链表中 [left, right] 区间内的节点，返回头节点。\"\"\"
    dummy = ListNode(0)
    dummy.next = head
    pre = dummy
    for _ in range(left - 1):
        pre = pre.next"""
explanation = "**第 2 步：创建 dummy 并定位 pre 指针**\n\n```\nleft=2 时:\n\ndummy -> 1 -> 2 -> 3 -> 4 -> 5\n ↑      ↑    ↑\ndummy   pre  cur(下一步)\n```\n\n| 变量 | 含义 | 移动方式 |\n|------|------|----------|\n| `dummy` | 哑节点，统一处理 left=1 | 固定不动 |\n| `pre` | 反转区间**前驱节点** | 走 `left - 1` 步 |\n| `cur` | 反转区间**首节点** | 下一行声明 |\n\n> 走 `left - 1` 步后，`pre` 指向 left 的前一个节点；反转完成后 `pre.next` 指向新区间头。"
visualizationType = "code-only"

# ── Step 3: 头插法反转区间 ────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "头插法反转"
titleEn = "Reverse via Head Insertion"
code = """# 反转链表 II
# 给定单链表的头节点 head，以及两个整数 left 和 right（1-indexed）
# 反转从 left 到 right 这一段链表节点，返回头节点
#
# 要求:
#   使用一次遍历完成原地反转
#   left 和 right 满足 1 <= left < right <= n
#
# 示例:
#   head = [1, 2, 3, 4, 5], left = 2, right = 4
#   结果: [1, 4, 3, 2, 5]

from typing import Optional

class ListNode:
    def __init__(self, x):
        self.val = x
        self.next = None

def reverseBetween(head: Optional[ListNode], left: int, right: int) -> Optional[ListNode]:
    \"\"\"反转链表中 [left, right] 区间内的节点，返回头节点。\"\"\"
    dummy = ListNode(0)
    dummy.next = head
    pre = dummy
    for _ in range(left - 1):
        pre = pre.next
    cur = pre.next
    for _ in range(right - left):
        nxt = cur.next
        cur.next = nxt.next
        nxt.next = pre.next
        pre.next = nxt
    return dummy.next"""
explanation = "**第 3 步：头插法核心循环**\n\n执行 `(right - left)` 次，每次把 `cur.next` 节点取出，插入到 `pre` 之后。\n\n**单次迭代图示（以 left=2, right=4 第一次迭代为例）**\n\n```\n插入前:  pre -> cur -> nxt -> ...\n          1     2     3\n\n操作:\n  cur.next = nxt.next   # 2 -> 4\n  nxt.next = pre.next   # 3 -> 2\n  pre.next = nxt        # 1 -> 3\n\n插入后:  pre -> nxt -> cur -> ...\n          1     3     2 -> 4\n```\n\n**三次迭代后**\n\n```\n原始:  1 -> 2 -> 3 -> 4 -> 5\n        ↑   ↑\n       pre cur\n\niter1: 1 -> 3 -> 2 -> 4 -> 5\niter2: 1 -> 4 -> 3 -> 2 -> 5\niter3: 1 -> 4 -> 3 -> 2 -> 5  (cur.next=None, 循环结束)\n```\n\n> `return dummy.next`：当 left=1 时，dummy 是真正的前驱，必须通过它返回。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 反转链表 II
# 给定单链表的头节点 head，以及两个整数 left 和 right（1-indexed）
# 反转从 left 到 right 这一段链表节点，返回头节点
#
# 要求:
#   使用一次遍历完成原地反转
#   left 和 right 满足 1 <= left < right <= n
#
# 示例:
#   head = [1, 2, 3, 4, 5], left = 2, right = 4
#   结果: [1, 4, 3, 2, 5]

from typing import Optional

class ListNode:
    def __init__(self, x):
        self.val = x
        self.next = None

def reverseBetween(head: Optional[ListNode], left: int, right: int) -> Optional[ListNode]:
    \"\"\"反转链表中 [left, right] 区间内的节点，返回头节点。\"\"\"
    dummy = ListNode(0)
    dummy.next = head
    pre = dummy
    for _ in range(left - 1):
        pre = pre.next
    cur = pre.next
    for _ in range(right - left):
        nxt = cur.next
        cur.next = nxt.next
        nxt.next = pre.next
        pre.next = nxt
    return dummy.next"""
explanation = "**最终结果**\n\n✅ 链表区间反转完成\n\n```\n输入: head = [1, 2, 3, 4, 5], left = 2, right = 4\n输出: [1, 4, 3, 2, 5]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 最多遍历到 right 节点 |\n| 空间复杂度 | O(1) — 仅使用 dummy / pre / cur / nxt 四个指针 |\n\n**关键技巧：头插法**\n\n- 与传统逐个反转 `next` 指针不同，头插法只改 `pre.next` 与 `cur.next`\n- 不需要单独记录反转前后的边界节点，逻辑更简洁\n- dummy 节点让 `left = 1` 的边界情况无需特判\n\n**易错点**\n\n- 必须 `return dummy.next`，不能直接 `return head`（若 left=1，head 已被移位）\n- 内层循环执行 `right - left` 次而非 `right - left + 1` 次\n- 每次插入的是 `cur.next`（即未反转的下一个节点），不是 `cur` 本身"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 4, 3, 2, 5]", result = "[1,4,3,2,5]", highlightedIndices = [1, 2, 3] }

