# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 反转链表 II
# 给定单链表的头节点 head，以及两个整数 left 和 right（1-indexed）
# 反转从 left 到 right 这一段链表节点，返回头节点
#
# 要求:
#   使用一次遍历完成原地反转
#   left 和 right 满足 1 <= left < right <= n
#
# 示例:
#   head = [1, 2, 3, 4, 5], left = 2, right = 4
#   结果: [1, 4, 3, 2, 5]"""
explanation = "**问题重述**\n\n给定一个单链表的头节点 `head`，以及两个 1-indexed 的整数 `left` 和 `right`（满足 `1 <= left < right <= n`）。只反转链表中从第 `left` 个节点到第 `right` 个节点这一段，其余节点保持原有顺序，最后返回新的头节点。\n\n**输入与输出**\n\n- 输入：头节点 `head`、区间起点 `left`、区间终点 `right`\n- 输出：反转区间后的链表头节点\n- 边界：`left = 1` 时头节点会改变；`left = right` 时相当于不反转；链表为空或只有一个节点时直接返回\n\n**示例走查**\n\n以 `head = [1, 2, 3, 4, 5]`、`left = 2`、`right = 4` 为例：\n\n- 第 1 个节点 `1` 保持不变，作为反转区间的前驱\n- 反转区间 `[2, 3, 4]`，反转后变为 `[4, 3, 2]`\n- 第 5 个节点 `5` 保持不变，接在反转后的区间末尾\n\n最终链表为 `[1, 4, 3, 2, 5]`，即返回 `[1,4,3,2,5]`。\n\n**关键洞察**\n\n- 反转后，原区间首节点 `left` 会变成新区间尾节点，原区间尾节点 `right` 会变成新区间首节点\n- 使用哑节点 `dummy` 可以统一处理 `left = 1` 的边界情况，避免对头节点做特判\n- 头插法每次把 `cur.next` 插入到 `pre` 之后，只需常数次指针调整\n\n**方法预览**\n\n| 项目 | 说明 |\n|------|------|\n| 算法 | dummy 节点 + 头插法三指针 |\n| 时间复杂度 | O(n)，最多遍历到 `right` 节点 |\n| 空间复杂度 | O(1)，仅使用几个指针 |"
visualizationType = "intro"

