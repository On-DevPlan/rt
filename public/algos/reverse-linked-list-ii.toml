# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 反转链表 II
# 给定单链表的头节点 head，以及两个整数 left 和 right（1-indexed）
# 反转从 left 到 right 这一段链表节点，返回头节点
#
# 要求:
#   使用一次遍历完成原地反转
#   left 和 right 满足 1 <= left < right <= n
#
# 示例:
#   head = [1, 2, 3, 4, 5], left = 2, right = 4
#   结果: [1, 4, 3, 2, 5]"""
explanation = "**问题分析**\n\n给定链表一段区间 `[left, right]`，需要原地反转。\n\n**关键约束**\n\n- 只能遍历一次（避免 O(n) 额外栈空间）\n- 反转完成后，`[1, left-1]` 和 `[right+1, n]` 两段保持原顺序\n- 节点本身不能断开重连到错误位置\n\n**示例图示**\n\n```\n原始:  dummy -> 1 -> 2 -> 3 -> 4 -> 5\n反转:  dummy -> 1 -> 4 -> 3 -> 2 -> 5\n        \\\\\\\\___反转区间___///\n```\n\n> 关键观察：反转后，原区间头节点(left)成为新区间尾节点，区间尾节点(right)成为新区间头节点。"
visualizationType = "intro"

