    pass"""
explanation = "**第 1 步：定义链表节点与函数签名**\n\n- `ListNode`：标准单链表节点，包含 `val` 和 `next`\n- `reverseBetween` 接收 `head`、`left`、`right`，返回新头节点\n- 使用 `Optional[ListNode]` 表示 `head` 可能为 `None`\n\n> 加入哑节点（dummy）可以统一处理 `left = 1` 的边界情况，避免特判。"
