code = """# 222. 完全二叉树的节点个数
# 给定一棵完全二叉树的根节点 root，返回该树的节点总数
#
# 完全二叉树定义:
#   除最后一层外，每一层节点数都达到最大值
#   最后一层节点都集中在左侧
#
# 示例:
#   root = [1,2,3,4,5,6]  →  6
#
#       1
#      / \\
#     2   3
#    / \\  /
#   4  5 6"""
explanation = "**问题分析**\n\n给定一棵**完全二叉树**的根节点，求节点总数。\n\n**示例**\n\n```\n        1\n       / \\\n      2   3\n     / \\  /\n    4  5 6\n```\n\n| 解法 | 时间 | 是否利用性质 |\n|------|------|--------------|\n| 普通遍历 | O(n) | 否 |\n| **完全二叉树 + 高度比较** | **O(h²) = O((log n)²)** | **是** |\n\n> 完全二叉树的左右子树至少有一个是满二叉树，利用这一点可以避免遍历整个树。"
