# ── Step 3: 贪心匹配 ──────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "贪心匹配"
titleEn = "Greedy Match"
code = """# 整数转罗马数字
# 给定一个整数 num，将其转换为罗马数字
# 范围: 1 <= num <= 3999
#
# 罗马数字规则:
#   I=1, V=5, X=10, L=50, C=100, D=500, M=1000
#   减法规则: IV=4, IX=9, XL=40, XC=90, CD=400, CM=900
#
# 示例:
#   3    -> III
#   4    -> IV
#   9    -> IX
#   58   -> LVIII
#   1994 -> MCMXCIV

def intToRoman(num: int) -> str:
    \"\"\"将 1..3999 的整数转换为罗马数字字符串。\"\"\"
    values = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1]
    symbols = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I']
    res = []
    for i, v in enumerate(values):
        while num >= v:
            res.append(symbols[i])
            num -= v
    return ''.join(res)"""
explanation = "**第 3 步：贪心匹配循环**\n\n外层 `for` 遍历每种面值（从大到小），内层 `while` 尽可能多地使用当前面值：\n\n```python\nfor i, v in enumerate(values):\n    while num >= v:\n        res.append(symbols[i])\n        num -= v\n```\n\n**示例：1994**\n\n| 步 | i | v | 进入 while? | res | num |\n|----|---|---|------------|------|-----|\n| 1 | 0 | 1000 | 是 (1994>=1000) | [M] | 994 |\n| 2 | 0 | 1000 | 否 | [M] | 994 |\n| 3 | 1 | 900 | 是 (994>=900) | [M, CM] | 94 |\n| 4 | 1 | 900 | 否 | [M, CM] | 94 |\n| 5 | 4 | 100 | 否 | [M, CM] | 94 |\n| 6 | 5 | 90 | 是 (94>=90) | [M, CM, XC] | 4 |\n| 7 | 11 | 4 | 是 (4>=4) | [M, CM, XC, IV] | 0 |\n\n> 最后 `return ''.join(res)` 拼接为 `\"MCMXCIV\"`。"
visualizationType = "code-only"

