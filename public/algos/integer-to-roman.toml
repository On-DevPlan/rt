[[algorithm.steps]]
id = 2
title = "初始化查表"
titleEn = "Initialize Lookup Table"
code = """# 整数转罗马数字
# 给定一个整数 num，将其转换为罗马数字
# 范围: 1 <= num <= 3999
#
# 罗马数字规则:
#   I=1, V=5, X=10, L=50, C=100, D=500, M=1000
#   减法规则: IV=4, IX=9, XL=40, XC=90, CD=400, CM=900
#
# 示例:
#   3    -> III
