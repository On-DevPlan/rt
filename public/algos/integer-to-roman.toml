[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 整数转罗马数字
# 给定一个整数 num，将其转换为罗马数字
# 范围: 1 <= num <= 3999
#
# 罗马数字规则:
#   I=1, V=5, X=10, L=50, C=100, D=500, M=1000
#   减法规则: IV=4, IX=9, XL=40, XC=90, CD=400, CM=900
#
# 示例:
#   3    -> III
#   4    -> IV
#   9    -> IX
#   58   -> LVIII
#   1994 -> MCMXCIV

def intToRoman(num: int) -> str:
    \"\"\"将 1..3999 的整数转换为罗马数字字符串。\"\"\"
    values = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1]
    symbols = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I']
    res = []
    for i, v in enumerate(values):
        while num >= v:
            res.append(symbols[i])
            num -= v
    return ''.join(res)"""
explanation = "**最终结果**\n\n✅ 整数转罗马数字完成\n\n```\n输入: num = 1994\n输出: MCMXCIV\n```\n\n**算法复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | O(1) | values 表大小固定为 13，每个面值最多循环 3 次 |\n| 空间复杂度 | O(1) | 只用两张固定大小数组 + 累积列表 |\n\n**关键技巧：贪心 + 减法合一**\n\n- 不需要为减法写单独分支，把 `900/400/90/40/9/4` 也作为\"面值\"入表\n- 因为面值降序，贪心选择**每一步都是局部最优**，且能拼出全局最优\n- 对 `1..3999` 范围，时间/空间都是常数"
