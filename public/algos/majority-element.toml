# ── Step 2: 初始化 ────────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化候选人和计票"
titleEn = "Initialize Candidate and Count"
code = """# 多数元素
# 给定一个大小为 n 的数组 nums
# 找出其中的多数元素
#
# 多数元素：在数组中出现次数大于 n/2 的元素
# 题目保证多数元素一定存在
#
# 示例:
#   nums = [2, 2, 1, 1, 1, 2, 2]
#   数组长度 7，多数元素 2 出现 4 次 > 7/2 = 3.5
#   返回 2

from typing import List

def majority_element(nums: List[int]) -> int:
    \"\"\"找出数组中的多数元素（出现次数 > n/2）。\"\"\"
    candidate = nums[0]  # 先选第一个元素为候选人
    count = 1            # 已有一票"""
explanation = "**第 2 步：初始化**\n\n```python\ncandidate = nums[0]  # 第一个元素为初始候选人\ncount = 1            # 候选人已有 1 票\n```\n\n**投票规则**\n\n| 操作 | 条件 |\n|------|------|\n| `count += 1` | 当前元素 == `candidate` |\n| `count -= 1` | 当前元素 != `candidate` |\n| 换候选人 | `count == 0` 时，选当前元素为新候选人 |\n\n> 原理：多数元素出现次数 > 其他所有元素之和，抵消后一定还有剩余。"
visualizationType = "code-only"

# ── Step 3: 遍历投票 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历投票"
titleEn = "Vote Counting"
code = """# 多数元素
# 给定一个大小为 n 的数组 nums
# 找出其中的多数元素
#
# 多数元素：在数组中出现次数大于 n/2 的元素
# 题目保证多数元素一定存在
#
# 示例:
#   nums = [2, 2, 1, 1, 1, 2, 2]
#   数组长度 7，多数元素 2 出现 4 次 > 7/2 = 3.5
#   返回 2

from typing import List

def majority_element(nums: List[int]) -> int:
    \"\"\"找出数组中的多数元素（出现次数 > n/2）。\"\"\"
    candidate = nums[0]  # 先选第一个元素为候选人
    count = 1            # 已有一票

    for num in nums[1:]:
        if count == 0:
            candidate = num
            count = 1
        elif num == candidate:
            count += 1
        else:
            count -= 1
    return candidate"""
explanation = "**第 3 步：投票循环**\n\n```\nfor num in nums[1:]:          ← 从第二个元素开始遍历\n    if count == 0:             ← 票数归零，换候选人\n        candidate = num\n        count = 1\n    elif num == candidate:     ← 相同，加票\n        count += 1\n    else:                      ← 不同，抵消\n        count -= 1\nreturn candidate               ← 最后剩下的就是多数元素\n```\n\n**执行过程**（`nums = [2, 2, 1, 1, 1, 2, 2]`）：\n\n```\ncandidate=2, count=1\n\nnum=2: == candidate → count=2\nnum=1: != candidate → count=1\nnum=1: != candidate → count=0  ← 归零！\nnum=1: count==0 → candidate=1, count=1  ← 换人\nnum=2: != candidate(1) → count=0  ← 又归零\nnum=2: count==0 → candidate=2, count=1  ← 再换人\n\n返回 candidate=2 ✓\n```\n\n注意在 `num=1` 时候选人的切换——虽然中间换过人，但多数元素 `2` 最终胜出。"
visualizationType = "code-only"

