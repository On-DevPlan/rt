# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 多数元素
# 给定一个大小为 n 的数组 nums
# 找出其中的多数元素
#
# 多数元素：在数组中出现次数大于 n/2 的元素
# 题目保证多数元素一定存在
#
# 示例:
#   nums = [2, 2, 1, 1, 1, 2, 2]
#   数组长度 7，多数元素 2 出现 4 次 > 7/2 = 3.5
#   返回 2"""
explanation = "**问题重述**\n\n给定一个大小为 `n` 的数组 `nums`，找出其中的多数元素。多数元素是指在数组中出现次数严格大于 `n/2` 的元素，题目保证它一定存在。\n\n**输入与输出**\n\n- 输入：`nums = [2,2,1,1,1,2,2]`，长度 `n = 7`。\n- 输出：`2`，因为 `2` 出现了 `4` 次，满足 `4 > 7/2 = 3.5`。\n- 边界：若数组只有一个元素，则该元素就是多数元素。\n\n**示例走查**\n\n以 `nums = [2,2,1,1,1,2,2]` 为例：\n\n1. 统计各元素出现次数：`2` 出现 `4` 次，`1` 出现 `3` 次。\n2. 由于 `4 > 7/2 = 3.5`，`2` 就是多数元素。\n3. 返回 `2`。\n\n**关键洞察**\n\n多数元素的出现次数超过其他所有元素出现次数之和。因此可以把不同元素两两抵消，最后剩下的必然是多数元素。这一思想就是 Boyer-Moore 投票算法的核心。\n\n**方法预览**\n\n| 方法 | 思路 | 时间复杂度 | 空间复杂度 |\n|------|------|----------|----------|\n| 哈希计数 | 用字典统计每个元素出现次数 | `O(n)` | `O(n)` |\n| 排序取中 | 排序后中间位置一定是多数元素 | `O(n log n)` | `O(1)` |\n| Boyer-Moore 投票 | 相同加票、不同减票、归零换人 | `O(n)` | `O(1)` |\n\n> 推荐 Boyer-Moore 投票：只需维护 `candidate` 和 `count` 两个变量，是空间最优解。"
visualizationType = "intro"

