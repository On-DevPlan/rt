timeComplexity = "O(m*n*4^L)  # L 单词最大长度"
spaceComplexity = "O(total chars in words)"
approach = "Trie 预建 + DFS 回溯"
keyInsight = "Trie 沿路径匹配剪枝；找到单词后 is_end=False 防止重复；board 原地标记 + 恢复避免 visited 数组"