# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 427. 建立四叉树
# 给定一个 n × n 的二维网格 grid（n 为 2 的幂），每个格子值为 0 或 1
# 用四叉树表示该网格：
#   - 叶子节点：当前区域所有格子值相同，val=该值, isLeaf=true
#   - 内部节点：当前区域不全相同，isLeaf=false, 四个子节点代表四个子区域
#
# 四叉树节点结构：
#   - val (bool)
#   - isLeaf (bool)
#   - topLeft, topRight, bottomLeft, bottomRight (Node)
#
# 示例：
#   grid = [[0,1],[1,0]]
#   根节点 isLeaf=false, val=true
#   四个子节点均为叶子：[[0],[1],[1],[0]]
#   序列化结果: [[0,1],[1,0],[1,1],[1,1],[1,0]]"""
explanation = "**问题分析**\n\n给定一个 `n × n` 的 0/1 网格（`n = 2^k`），用四叉树表示它：\n\n| 节点类型 | 含义 |\n|----------|------|\n| 叶子节点 | 当前区域所有格子值相同 |\n| 内部节点 | 当前区域不全相同，递归划分 4 个子区域 |\n\n**输出格式：** 题目返回的不是 `Node` 对象，而是 **层序遍历** 的二维数组 `[val, isLeaf, topLeft, topRight, bottomLeft, bottomRight]`。\n\n> 本步骤聚焦 `construct` 函数本身的递归构造逻辑，序列化由题目框架完成。\n\n**关键思路：分治 + 4 子区域**\n\n1. 检查当前区域 `(r0,c0)-(r1,c1)` 是否全同\n2. 全同 → 创建叶子节点\n3. 否则 → 计算中点，递归构建 4 个子节点"
visualizationType = "intro"

# ── Step 1: Node 类与函数签名 ─────────────────────────────────
[[algorithm.steps]]
id = 1
title = "Node 类与签名"
titleEn = "Node Class and Signature"
code = """# 427. 建立四叉树
# 给定一个 n × n 的二维网格 grid（n 为 2 的幂），每个格子值为 0 或 1
# 用四叉树表示该网格：
#   - 叶子节点：当前区域所有格子值相同，val=该值, isLeaf=true
#   - 内部节点：当前区域不全相同，isLeaf=false, 四个子节点代表四个子区域
#
# 四叉树节点结构：
#   - val (bool)
#   - isLeaf (bool)
#   - topLeft, topRight, bottomLeft, bottomRight (Node)
#
# 示例：
#   grid = [[0,1],[1,0]]
#   根节点 isLeaf=false, val=true
#   四个子节点均为叶子：[[0],[1],[1],[0]]
#   序列化结果: [[0,1],[1,0],[1,1],[1,1],[1,0]]

from typing import List

class Node:
    \"\"\"四叉树节点\"\"\"
    def __init__(self, val, isLeaf, topLeft=None, topRight=None, bottomLeft=None, bottomRight=None):
        self.val = val
        self.isLeaf = isLeaf
        self.topLeft = topLeft
        self.topRight = topRight
        self.bottomLeft = bottomLeft
        self.bottomRight = bottomRight

def construct(grid: List[List[int]]) -> Node:
    \"\"\"由 n×n 网格构造四叉树，返回根节点\"\"\"
    def build(r0: int, c0: int, r1: int, c1: int) -> Node:
        # 单格：直接返回叶子
        if r0 == r1 and c0 == c1:
            return Node(grid[r0][c0] == 1, True)
        return Node(True, False)
    n = len(grid)
    return build(0, 0, n - 1, n - 1)"""
explanation = "**第 1 步：定义 Node 类与函数签名**\n\n**Node 类**\n\n```python\nclass Node:\n    def __init__(self, val, isLeaf,\n                 topLeft=None, topRight=None,\n                 bottomLeft=None, bottomRight=None):\n        ...\n```\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `val` | bool | 节点值（叶子时为该格值，内部节点值未定义） |\n| `isLeaf` | bool | 是否为叶子节点 |\n| `topLeft` / `topRight` | Node | 上半部分左/右子节点 |\n| `bottomLeft` / `bottomRight` | Node | 下半部分左/右子节点 |\n\n**辅助函数 `build(r0, c0, r1, c1)`**\n\n- 用四个边界索引描述当前矩形区域\n- `(r0, c0)` = 左上角，`(r1, c1)` = 右下角\n- **base case：** 当 `r0 == r1` 且 `c0 == c1`（即单格）→ 创建叶子\n\n> 内部节点构造和递归在后续步骤补充。"
visualizationType = "code-only"

# ── Step 2: 全同性检查 ────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "全同性检查"
titleEn = "Uniformity Check"
code = """# 427. 建立四叉树
# 给定一个 n × n 的二维网格 grid（n 为 2 的幂），每个格子值为 0 或 1
# 用四叉树表示该网格：
#   - 叶子节点：当前区域所有格子值相同，val=该值, isLeaf=true
#   - 内部节点：当前区域不全相同，isLeaf=false, 四个子节点代表四个子区域
#
# 四叉树节点结构：
#   - val (bool)
#   - isLeaf (bool)
#   - topLeft, topRight, bottomLeft, bottomRight (Node)
#
# 示例：
#   grid = [[0,1],[1,0]]
#   根节点 isLeaf=false, val=true
#   四个子节点均为叶子：[[0],[1],[1],[0]]
#   序列化结果: [[0,1],[1,0],[1,1],[1,1],[1,0]]

from typing import List

class Node:
    \"\"\"四叉树节点\"\"\"
    def __init__(self, val, isLeaf, topLeft=None, topRight=None, bottomLeft=None, bottomRight=None):
        self.val = val
        self.isLeaf = isLeaf
        self.topLeft = topLeft
        self.topRight = topRight
        self.bottomLeft = bottomLeft
        self.bottomRight = bottomRight

def construct(grid: List[List[int]]) -> Node:
    \"\"\"由 n×n 网格构造四叉树，返回根节点\"\"\"
    def build(r0: int, c0: int, r1: int, c1: int) -> Node:
        # 单格：直接返回叶子
        if r0 == r1 and c0 == c1:
            return Node(grid[r0][c0] == 1, True)
        # 检查当前区域是否全同
        first = grid[r0][c0] == 1
        same = True
        for i in range(r0, r1 + 1):
            for j in range(c0, c1 + 1):
                if (grid[i][j] == 1) != first:
                    same = False
                    break
            if not same:
                break
        if same:
            return Node(first, True)
        return Node(first, False)
    n = len(grid)
    return build(0, 0, n - 1, n - 1)"""
explanation = "**第 2 步：判断区域是否全同**\n\n用双层循环扫描当前区域：\n\n```python\nfirst = grid[r0][c0] == 1     # 取左上角的值作为基准\nsame = True\nfor i in range(r0, r1 + 1):\n    for j in range(c0, c1 + 1):\n        if (grid[i][j] == 1) != first:\n            same = False\n            break\n    if not same:\n        break\n```\n\n**关键点**\n\n- 一旦发现不同值，立即 `break` 跳出（**剪枝**，避免继续扫描）\n- 用 `(grid[i][j] == 1) != first` 比较 bool，避免 `^` 异或带来的可读性问题\n- 全同时返回叶子；否则继续递归\n\n> 对 `grid = [[0,1],[1,0]]` 而言，整片区域不全同 → 需要继续划分。"
visualizationType = "code-only"

# ── Step 3: 中点划分 + 4 子节点递归 ───────────────────────────
[[algorithm.steps]]
id = 3
title = "中点划分 + 递归"
titleEn = "Midpoint Split and Recursion"
code = """# 427. 建立四叉树
# 给定一个 n × n 的二维网格 grid（n 为 2 的幂），每个格子值为 0 或 1
# 用四叉树表示该网格：
#   - 叶子节点：当前区域所有格子值相同，val=该值, isLeaf=true
#   - 内部节点：当前区域不全相同，isLeaf=false, 四个子节点代表四个子区域
#
# 四叉树节点结构：
#   - val (bool)
#   - isLeaf (bool)
#   - topLeft, topRight, bottomLeft, bottomRight (Node)
#
# 示例：
#   grid = [[0,1],[1,0]]
#   根节点 isLeaf=false, val=true
#   四个子节点均为叶子：[[0],[1],[1],[0]]
#   序列化结果: [[0,1],[1,0],[1,1],[1,1],[1,0]]

from typing import List

class Node:
    \"\"\"四叉树节点\"\"\"
    def __init__(self, val, isLeaf, topLeft=None, topRight=None, bottomLeft=None, bottomRight=None):
        self.val = val
        self.isLeaf = isLeaf
        self.topLeft = topLeft
        self.topRight = topRight
        self.bottomLeft = bottomLeft
        self.bottomRight = bottomRight

def construct(grid: List[List[int]]) -> Node:
    \"\"\"由 n×n 网格构造四叉树，返回根节点\"\"\"
    def build(r0: int, c0: int, r1: int, c1: int) -> Node:
        # 单格：直接返回叶子
        if r0 == r1 and c0 == c1:
            return Node(grid[r0][c0] == 1, True)
        # 检查当前区域是否全同
        first = grid[r0][c0] == 1
        same = True
        for i in range(r0, r1 + 1):
            for j in range(c0, c1 + 1):
                if (grid[i][j] == 1) != first:
                    same = False
                    break
            if not same:
                break
        if same:
            return Node(first, True)
        # 不全同：中点划分 + 4 子节点递归
        rm = (r0 + r1) // 2
        cm = (c0 + c1) // 2
        tl = build(r0, c0, rm, cm)
        tr = build(r0, cm + 1, rm, c1)
        bl = build(rm + 1, c0, r1, cm)
        br = build(rm + 1, cm + 1, r1, c1)
        return Node(first, False, tl, tr, bl, br)
    n = len(grid)
    return build(0, 0, n - 1, n - 1)"""
explanation = "**第 3 步：中点划分 + 四向递归**\n\n**中点公式**\n\n```\nrm = (r0 + r1) // 2\ncm = (c0 + c1) // 2\n```\n\n**4 个子区域划分**\n\n```\n        c0    cm   c1\n   r0  +-----+-----+    tl = (r0,  c0 ) - (rm,  cm)\n        |  TL |  TR |    tr = (r0,  cm+1) - (rm,  c1)\n   rm  +-----+-----+    bl = (rm+1,c0 ) - (r1,  cm)\n        |  BL |  BR |    br = (rm+1,cm+1) - (r1,  c1)\n   r1  +-----+-----+\n```\n\n**递归调用**\n\n```python\ntl = build(r0,     c0,     rm, cm)\ntr = build(r0,     cm + 1, rm, c1)\nbl = build(rm + 1, c0,     r1, cm)\nbr = build(rm + 1, cm + 1, r1, c1)\nreturn Node(first, False, tl, tr, bl, br)\n```\n\n> 对 2×2 网格 `(0,0)-(1,1)`：rm=cm=0；4 个子区域都是单格，全部变成叶子。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 427. 建立四叉树
# 给定一个 n × n 的二维网格 grid（n 为 2 的幂），每个格子值为 0 或 1
# 用四叉树表示该网格：
#   - 叶子节点：当前区域所有格子值相同，val=该值, isLeaf=true
#   - 内部节点：当前区域不全相同，isLeaf=false, 四个子节点代表四个子区域
#
# 四叉树节点结构：
#   - val (bool)
#   - isLeaf (bool)
#   - topLeft, topRight, bottomLeft, bottomRight (Node)
#
# 示例：
#   grid = [[0,1],[1,0]]
#   根节点 isLeaf=false, val=true
#   四个子节点均为叶子：[[0],[1],[1],[0]]
#   序列化结果: [[0,1],[1,0],[1,1],[1,1],[1,0]]

from typing import List

class Node:
    \"\"\"四叉树节点\"\"\"
    def __init__(self, val, isLeaf, topLeft=None, topRight=None, bottomLeft=None, bottomRight=None):
        self.val = val
        self.isLeaf = isLeaf
        self.topLeft = topLeft
        self.topRight = topRight
        self.bottomLeft = bottomLeft
        self.bottomRight = bottomRight

def construct(grid: List[List[int]]) -> Node:
    \"\"\"由 n×n 网格构造四叉树，返回根节点\"\"\"
    def build(r0: int, c0: int, r1: int, c1: int) -> Node:
        # 单格：直接返回叶子
        if r0 == r1 and c0 == c1:
            return Node(grid[r0][c0] == 1, True)
        # 检查当前区域是否全同
        first = grid[r0][c0] == 1
        same = True
        for i in range(r0, r1 + 1):
            for j in range(c0, c1 + 1):
                if (grid[i][j] == 1) != first:
                    same = False
                    break
            if not same:
                break
        if same:
            return Node(first, True)
        # 不全同：中点划分 + 4 子节点递归
        rm = (r0 + r1) // 2
        cm = (c0 + c1) // 2
        tl = build(r0, c0, rm, cm)
        tr = build(r0, cm + 1, rm, c1)
        bl = build(rm + 1, c0, r1, cm)
        br = build(rm + 1, cm + 1, r1, c1)
        return Node(first, False, tl, tr, bl, br)
    n = len(grid)
    return build(0, 0, n - 1, n - 1)"""
explanation = "**最终结果**\n\n执行过程（以 `grid = [[0,1],[1,0]]` 为例）：\n\n```\nbuild(0,0,1,1)\n├─ 全局不全同 → 中点 (rm=0, cm=0)\n├─ tl = build(0,0,0,0) → Node(0==1=False, isLeaf=True)   即 0\n├─ tr = build(0,1,0,1) → Node(1==1=True,  isLeaf=True)   即 1\n├─ bl = build(1,0,1,0) → Node(1==1=True,  isLeaf=True)   即 1\n└─ br = build(1,1,1,1) → Node(0==1=False, isLeaf=True)   即 0\n返回 Node(first=True, isLeaf=False, tl, tr, bl, br)\n```\n\n序列化（层序）：`[[0,1],[1,0],[1,1],[1,1],[1,0]]` ✓\n\n**复杂度分析**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n² log n) — 每层扫描 O(n²)，共 log n 层 |\n| 空间复杂度 | O(log n) — 递归栈深度 |\n\n**关键洞察**\n\n- **全同性剪枝**：遇到全同区域立即返回叶子，避免无效递归\n- **中点划分**：`rm/cm` 整数除法正好对应 4 个等分子区域\n- **`isLeaf` 标志**：让序列化时能正确判断是否展开子节点"
