# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 分发糖果
# n 个孩子站成一排，每个孩子有一个评分 ratings[i]
# 分糖果满足两个条件：
#   1. 每个孩子至少分到 1 个糖果
#   2. 评分高的孩子必须比相邻孩子获得更多糖果
# 求最少需要多少糖果
#
# 示例:
#   ratings = [1, 0, 2]
#   一种最优分配: [2, 1, 2]  共 5 个糖果"""
explanation = "**问题重述**\n\n`n` 个孩子站成一排，每个孩子有一个评分 `ratings[i]`。你需要给他们分发糖果，满足两个条件：每个孩子至少得到 `1` 个糖果；评分更高的孩子必须比相邻的孩子拿到更多糖果。目标是求出**最少**需要的糖果总数。\n\n**输入与输出**\n\n- 输入：`ratings` —— 整数数组，长度 `n`，表示每个孩子的评分。\n- 输出：一个整数，表示满足条件的最少糖果总数。\n- 边界：`n ≥ 1`；当所有孩子评分相同时，每人 `1` 个糖果即可，答案为 `n`。\n\n**示例走查**\n\n以题目给出的 `ratings = [1, 0, 2]` 为例：\n\n- 初始时给每个孩子 `1` 个糖果：`candy = [1, 1, 1]`。\n- 从左向右看：`ratings[2] = 2 > ratings[1] = 0`，所以 `candy[2]` 至少要比 `candy[1]` 多 `1`，更新为 `candy = [1, 1, 2]`。\n- 从右向左看：`ratings[0] = 1 > ratings[1] = 0`，所以 `candy[0]` 至少要比 `candy[1]` 多 `1`，`max(1, 2) = 2`，更新为 `candy = [2, 1, 2]`。\n- 糖果总数为 `2 + 1 + 2 = 5`，因此 `expectedOutput = \"5\"`。\n\n**关键洞察**\n\n> 每个孩子的糖果数同时受左右两个邻居的约束，而单次遍历只能处理一个方向。因此需要**两次遍历**：第一次从左到右保证右邻居评分更高时糖果更多，第二次从右到左保证左邻居评分更高时糖果更多，并用 `max` 合并两侧约束的较大值。\n\n**方法预览**\n\n| 项目 | 内容 |\n|------|------|\n| 算法 | 贪心 + 两次线性扫描 |\n| 时间复杂度 | O(n) |\n| 空间复杂度 | O(n) |"
visualizationType = "intro"

