# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 分发糖果
# n 个孩子站成一排，每个孩子有一个评分 ratings[i]
# 分糖果满足两个条件：
#   1. 每个孩子至少分到 1 个糖果
#   2. 评分高的孩子必须比相邻孩子获得更多糖果
# 求最少需要多少糖果
#
# 示例:
#   ratings = [1, 0, 2]
#   一种最优分配: [2, 1, 2]  共 5 个糖果"""
explanation = "**问题分析**\n\n`n` 个孩子排成一排，每人一个评分。要求：\n\n- 每个孩子至少 1 个糖果\n- 评分高的孩子比左右邻居拿到更多\n\n求**最少**糖果总数。\n\n**关键观察：双向约束**\n\n- 左→右规则：`ratings[i] > ratings[i-1]` ⇒ `candy[i] > candy[i-1]`\n- 右→左规则：`ratings[i] > ratings[i+1]` ⇒ `candy[i] > candy[i+1]`\n\n> 单次遍历只能处理一个方向。**两次遍历**才能同时满足两侧约束。"
visualizationType = "intro"

