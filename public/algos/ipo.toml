# ── Step 3: 循环与入堆 ─────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "循环与入堆"
titleEn = "Loop and Push"
code = """# 502. IPO
# 最多做 k 个项目，初始资本 w，返回最大资本
#
# 给定：
#   k: 最多能做的项目数量
#   w: 初始资本
#   profits[i]: 第 i 个项目的利润
#   capital[i]: 做 第 i 个项目需要的最低资本
#
# 规则：
#   - 只能选择 capital <= 当前资本 的项目
#   - 完成项目后，资本增加 profits[i]
#   - 最多做 k 个项目
#
# 目标：返回最终最大资本
#
# 示例:
#   k = 2, w = 0, profits = [1,2,3], capital = [0,1,1]
#   初始资本 0，只能做 capital[0]=0 的项目（利润 1）
#   做完后资本 = 0 + 1 = 1
#   现在可以做 capital[1]=1 和 capital[2]=1 的项目
#   选利润最大的（3），资本 = 1 + 3 = 4
#   最终资本 = 4

import heapq
from typing import List

def findMaximizedCapital(k: int, w: int, profits: List[int], capital: List[int]) -> int:
    \"\"\"返回最终资本\"\"\"
    projects = sorted(zip(capital, profits))
    heap = []
    i = 0
    for _ in range(k):
        while i < len(projects) and projects[i][0] <= w:
            heapq.heappush(heap, -projects[i][1])
            i += 1"""
explanation = "**第 3 步：外层循环 + 内层入堆**\n\n**外层循环**\n\n```python\nfor _ in range(k):\n```\n\n最多执行 `k` 次（最多做 `k` 个项目）。\n\n**内层循环：将能做的项目入堆**\n\n```python\nwhile i < len(projects) and projects[i][0] <= w:\n    heapq.heappush(heap, -projects[i][1])\n    i += 1\n```\n\n- `projects[i][0] <= w`：项目的资本需求 <= 当前资本\n- `heapq.heappush(heap, -projects[i][1])`：入堆**负利润**（Python heapq 是最小堆）\n- `i += 1`：向后遍历\n\n**示例：k=2, w=0**\n\n```\n第 1 轮:\n  w=0\n  i=0: projects[0][0]=0 <= 0 → 入堆 -1, heap=[-1], i=1\n  i=1: projects[1][0]=1 <= 0? 否，退出\n  堆: [-1] (对应利润 1)\n\n第 2 轮:\n  w=1 (假设第 1 轮选了利润 1)\n  i=1: projects[1][0]=1 <= 1 → 入堆 -2, heap=[-2,-1], i=2\n  i=2: projects[2][0]=1 <= 1 → 入堆 -3, heap=[-3,-1,-2], i=3\n  堆: [-3,-1,-2] (对应利润 3,1,2，堆顶 -3 最大)\n```"
visualizationType = "code-only"

# ── Step 4: 取最大利润 ────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "取最大利润"
titleEn = "Pop Max Profit"
code = """# 502. IPO
# 最多做 k 个项目，初始资本 w，返回最大资本
#
# 给定：
#   k: 最多能做的项目数量
#   w: 初始资本
#   profits[i]: 第 i 个项目的利润
#   capital[i]: 做 第 i 个项目需要的最低资本
#
# 规则：
#   - 只能选择 capital <= 当前资本 的项目
#   - 完成项目后，资本增加 profits[i]
#   - 最多做 k 个项目
#
# 目标：返回最终最大资本
#
# 示例:
#   k = 2, w = 0, profits = [1,2,3], capital = [0,1,1]
#   初始资本 0，只能做 capital[0]=0 的项目（利润 1）
#   做完后资本 = 0 + 1 = 1
#   现在可以做 capital[1]=1 和 capital[2]=1 的项目
#   选利润最大的（3），资本 = 1 + 3 = 4
#   最终资本 = 4

import heapq
from typing import List

def findMaximizedCapital(k: int, w: int, profits: List[int], capital: List[int]) -> int:
    \"\"\"返回最终资本\"\"\"
    projects = sorted(zip(capital, profits))
    heap = []
    i = 0
    for _ in range(k):
        while i < len(projects) and projects[i][0] <= w:
            heapq.heappush(heap, -projects[i][1])
            i += 1
        if not heap:
            break
        w -= heapq.heappop(heap)"""
explanation = "**第 4 步：从堆中取最大利润**\n\n```python\nif not heap:\n    break\nw -= heapq.heappop(heap)\n```\n\n| 步骤 | 说明 |\n|------|------|\n| `if not heap` | 堆空 → 无项目可做，提前退出 |\n| `heapq.heappop(heap)` | 弹出堆顶（最小负数 = 最大正利润） |\n| `w -=` | 减去负数 = 加上正数 |\n\n**为什么是 `w -= heapq.heappop(heap)`？**\n\n```python\n堆中存的是负利润: heap = [-3, -2, -1]\nheappop 返回最小值: -3\nw -= (-3) = w + 3  # 资本增加 3\n```\n\n**完整示例**\n\n```\nk=2, w=0, profits=[1,2,3], capital=[0,1,1]\n\n第 1 轮:\n  入堆: heap = [-1]\n  取最大: w = 0 - (-1) = 1\n\n第 2 轮:\n  入堆: heap = [-3, -2] (新增两个能做的项目)\n  取最大: w = 1 - (-3) = 4\n\n返回: w = 4 ✓\n```"
visualizationType = "code-only"

# ── Step 5: 完成 ────────────────────────────────────────────────
[[algorithm.steps]]
id = 5
title = "完成"
titleEn = "Complete"
code = """# 502. IPO
# 最多做 k 个项目，初始资本 w，返回最大资本
#
# 给定：
#   k: 最多能做的项目数量
#   w: 初始资本
#   profits[i]: 第 i 个项目的利润
#   capital[i]: 做 第 i 个项目需要的最低资本
#
# 规则：
#   - 只能选择 capital <= 当前资本 的项目
#   - 完成项目后，资本增加 profits[i]
#   - 最多做 k 个项目
#
# 目标：返回最终最大资本
#
# 示例:
#   k = 2, w = 0, profits = [1,2,3], capital = [0,1,1]
#   初始资本 0，只能做 capital[0]=0 的项目（利润 1）
#   做完后资本 = 0 + 1 = 1
#   现在可以做 capital[1]=1 和 capital[2]=1 的项目
#   选利润最大的（3），资本 = 1 + 3 = 4
#   最终资本 = 4

import heapq
from typing import List

def findMaximizedCapital(k: int, w: int, profits: List[int], capital: List[int]) -> int:
    \"\"\"返回最终资本\"\"\"
    projects = sorted(zip(capital, profits))
    heap = []
    i = 0
    for _ in range(k):
        while i < len(projects) and projects[i][0] <= w:
            heapq.heappush(heap, -projects[i][1])
            i += 1
        if not heap:
            break
        w -= heapq.heappop(heap)
    return w"""
explanation = "**最终结果**\n\n✅ 算法完成\n\n```\n输入: k=2, w=0, profits=[1,2,3], capital=[0,1,1]\n输出: 4\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O((n + k) log n) — 排序 O(n log n) + k 轮堆操作 |\n| 空间复杂度 | O(n) — 堆存储 |\n\n**核心思想**\n\n1. **按资本排序**：确保按顺序遍历项目\n2. **最大堆维护**：动态存储「当前能做的项目」，按利润排序\n3. **贪心选择**：每次选最大利润，局部最优 → 全局最优\n\n> 用负数模拟最大堆是 Python heapq 的常用技巧。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[0, 1, 1]", result = "4", highlightedIndices = [1, 2] }

