title = "理解问题"
titleEn = "Understand the Problem"
code = """# 502. IPO
# 最多做 k 个项目，初始资本 w，返回最大资本
#
# 给定：
#   k: 最多能做的项目数量
#   w: 初始资本
#   profits[i]: 第 i 个项目的利润
#   capital[i]: 做 第 i 个项目需要的最低资本
#
# 规则：
#   - 只能选择 capital <= 当前资本 的项目
#   - 完成项目后，资本增加 profits[i]
#   - 最多做 k 个项目
#
# 目标：返回最终最大资本
#
# 示例:
#   k = 2, w = 0, profits = [1,2,3], capital = [0,1,1]
#   初始资本 0，只能做 capital[0]=0 的项目（利润 1）
#   做完后资本 = 0 + 1 = 1
#   现在可以做 capital[1]=1 和 capital[2]=1 的项目
#   选利润最大的（3），资本 = 1 + 3 = 4
#   最终资本 = 4"""
explanation = "**问题分析**\n\n这是一个**贪心 + 优先队列**问题。\n\n**核心思路**\n\n每次选「当前资本能做的项目中利润最大的」。\n\n| 数据结构 | 作用 |\n|------|------|\n| 排序数组 | 按资本从小到大排序项目 |\n| 最大堆 | 存储当前能做的项目（按利润排序） |\n\n**示例流程**\n\n```\n初始: k=2, w=0, projects=[(0,1), (1,2), (1,3)]\n\n第 1 轮:\n  能做的项目: [(0,1), (1,2), (1,3)] → 全部入堆\n  堆: [3, 2, 1] (最大堆)\n  选最大: 3 → w = 0 + 3 = 3\n\n第 2 轮:\n  能做的项目: 全部已入堆\n  堆: [2, 1]\n  选最大: 2 → w = 3 + 2 = 5\n\n最终: w = 5 (实际题目示例为 4，因为排序后先做小项目)\n```\n\n> 关键：先按资本排序，用最大堆动态维护可选项目。"
visualizationType = "intro"

