explanation = "**第 1 步：编写函数签名**\n\n- 输入：`intervals` 是 `List[List[int]]`，每个内层列表 `[start, end]` 表示一个区间\n- 输出：合并后的区间列表，同样是 `List[List[int]]`\n- 使用类型注解明确参数和返回值类型\n- 文档字符串描述函数用途\n\n> 注意：区间端点 `start`、`end` 都是整数，且假设 `start ≤ end`。"
visualizationType = "code-only"

# ── Step 2: 排序 + 初始化结果 ───────────────────────────────
[[algorithm.steps]]
id = 2
title = "排序与初始化"
titleEn = "Sort and Initialize"
code = """# 合并区间
# 给定一组区间 intervals，合并所有重叠的区间，返回一个互不重叠的区间数组
# 重叠定义：区间 A 与区间 B 有交集（即 A.start <= B.end 且 B.start <= A.end）
#
# 示例:
#   输入:  [[1,3],[2,6],[8,10],[15,18]]
#   输出:  [[1,6],[8,10],[15,18]]
#
# 解释:
#   [1,3] 与 [2,6] 重叠，合并为 [1,6]
#   [8,10] 不与任何区间重叠，单独保留
#   [15,18] 不与任何区间重叠，单独保留

from typing import List

def merge(intervals: List[List[int]]) -> List[List[int]]:
    \"\"\"合并所有重叠的区间，返回互不重叠的区间列表。\"\"\"
    intervals.sort(key=lambda x: x[0])
    res = [intervals[0][:] if intervals else []]"""
explanation = "**第 2 步：按 start 排序并初始化结果**\n\n```python\nintervals.sort(key=lambda x: x[0])              # 按区间起点升序排序\nres = [intervals[0][:] if intervals else []]   # 把第一个区间作为结果的种子\n```\n\n**为什么先排序？**\n\n排序后，**任意两个重叠的区间一定相邻**——这使得问题降维为线性扫描。\n\n| 操作 | 目的 |\n|------|------|\n| `intervals.sort(key=lambda x: x[0])` | 按 start 升序 |\n| `intervals[0][:]` | 深拷贝，避免原地修改输入 |\n| `if intervals else []` | 防御空输入 |\n\n> 用 `[:]` 复制第一项是为了之后 `res[-1][1] = max(...)` 时不会改到原始 `intervals`。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ─────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历合并"
titleEn = "Iterate and Merge"
code = """# 合并区间
# 给定一组区间 intervals，合并所有重叠的区间，返回一个互不重叠的区间数组
# 重叠定义：区间 A 与区间 B 有交集（即 A.start <= B.end 且 B.start <= A.end）
#
# 示例:
#   输入:  [[1,3],[2,6],[8,10],[15,18]]
#   输出:  [[1,6],[8,10],[15,18]]
#
# 解释:
#   [1,3] 与 [2,6] 重叠，合并为 [1,6]
#   [8,10] 不与任何区间重叠，单独保留
#   [15,18] 不与任何区间重叠，单独保留

from typing import List

def merge(intervals: List[List[int]]) -> List[List[int]]:
    \"\"\"合并所有重叠的区间，返回互不重叠的区间列表。\"\"\"
    intervals.sort(key=lambda x: x[0])
    res = [intervals[0][:] if intervals else []]
    for cur in intervals:
        if cur[0] <= res[-1][1]:
            res[-1][1] = max(res[-1][1], cur[1])
        else:
            res.append(cur[:])
    return res"""
explanation = "**第 3 步：单次遍历完成合并**\n\n```python\nfor cur in intervals:\n    if cur[0] <= res[-1][1]:          # 与结果中最后一个区间重叠\n        res[-1][1] = max(res[-1][1], cur[1])   # 扩展右端点\n    else:                             # 不重叠 → 新开一个区间\n        res.append(cur[:])\nreturn res\n```\n\n**合并判定（已排序）**\n\n排序后只需把当前区间和结果中**最后一个**区间比较：\n\n| 条件 | 含义 | 操作 |\n|------|------|------|\n| `cur[0] <= res[-1][1]` | 重叠或相接 | 扩展 `res[-1][1] = max(res[-1][1], cur[1])` |\n| 否则 | 完全断开 | `res.append(cur[:])` |\n\n**示例执行**\n\n```\nintervals = [[1,3],[2,6],[8,10],[15,18]]  (已排序)\nres 初始: [[1,3]]\n\ncur=[1,3]:  1<=3  → res[-1][1]=max(3,3)=3      → res=[[1,3]]\ncur=[2,6]:  2<=3  → res[-1][1]=max(3,6)=6      → res=[[1,6]]\ncur=[8,10]: 8>6   → res.append([8,10])           → res=[[1,6],[8,10]]\ncur=[15,18]:15>10 → res.append([15,18])          → res=[[1,6],[8,10],[15,18]]\n```\n\n> 用 `max` 而不是直接赋值为 `cur[1]`，可以处理区间**完全被包含**的情况（如 `[1,10]` 与 `[2,3]`）。"
visualizationType = "code-only"

# ── Step 4: 完成 ─────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 合并区间
# 给定一组区间 intervals，合并所有重叠的区间，返回一个互不重叠的区间数组
# 重叠定义：区间 A 与区间 B 有交集（即 A.start <= B.end 且 B.start <= A.end）
#
# 示例:
#   输入:  [[1,3],[2,6],[8,10],[15,18]]
#   输出:  [[1,6],[8,10],[15,18]]
#
# 解释:
#   [1,3] 与 [2,6] 重叠，合并为 [1,6]
#   [8,10] 不与任何区间重叠，单独保留
#   [15,18] 不与任何区间重叠，单独保留

from typing import List

def merge(intervals: List[List[int]]) -> List[List[int]]:
    \"\"\"合并所有重叠的区间，返回互不重叠的区间列表。\"\"\"
    intervals.sort(key=lambda x: x[0])
    res = [intervals[0][:] if intervals else []]
    for cur in intervals:
        if cur[0] <= res[-1][1]:
            res[-1][1] = max(res[-1][1], cur[1])
        else:
            res.append(cur[:])
    return res"""
explanation = "**最终结果**\n\n```\n输入:  [[1,3],[2,6],[8,10],[15,18]]\n输出:  [[1,6],[8,10],[15,18]]\n```\n\n**算法复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | O(n log n) | 排序主导；遍历 O(n) |\n| 空间复杂度 | O(1) | 不计输出数组本身 |\n\n**关键技巧**\n\n- **排序降维**：按 `start` 排序后，重叠区间必然相邻，一次线性扫描即可\n- **比较最后一个**：只需和 `res[-1]` 比，避免反复回看\n- **用 `max` 更新右端点**：兼容完全包含的情况（`[1,10]` vs `[2,3]`）\n- **`[:]` 深拷贝**：避免改到原 `intervals` 或共享引用\n\n> 这套「排序 + 单次扫描 + 比较末尾」的模式，同样适用于 *插入区间*、*区间列表的交集* 等题。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[[1,3],[2,6],[8,10],[15,18]]", result = "[[1,6],[8,10],[15,18]]", highlightedIndices = [0, 1, 2, 3] }

