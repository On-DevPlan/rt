# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 合并区间
# 给定一组区间 intervals，合并所有重叠的区间，返回一个互不重叠的区间数组
# 重叠定义：区间 A 与区间 B 有交集（即 A.start <= B.end 且 B.start <= A.end）
#
# 示例:
#   输入:  [[1,3],[2,6],[8,10],[15,18]]
#   输出:  [[1,6],[8,10],[15,18]]
#
# 解释:
#   [1,3] 与 [2,6] 重叠，合并为 [1,6]
#   [8,10] 不与任何区间重叠，单独保留
#   [15,18] 不与任何区间重叠，单独保留"""
explanation = "**问题分析**\n\n给定一组区间 `intervals`，要求合并所有**有重叠**的区间，使结果中任意两个区间都不相交。\n\n**关键观察**\n\n- 如果两个区间 `[a, b]` 和 `[c, d]` 重叠，则必有 `a ≤ d` 且 `c ≤ b`\n- 按 `start` 排序后，**重叠的区间必然相邻**——这让合并可以在一次线性扫描中完成\n- 排序 + 单次遍历是这类问题最常见的范式\n\n**示例**\n\n```\n输入: [[1,3],[2,6],[8,10],[15,18]]\n\n排序后（已是有序）: [[1,3],[2,6],[8,10],[15,18]]\n合并过程:\n  [1,3] 与 [2,6]: 2 <= 3 → 合并为 [1, 6]\n  [1,6] 与 [8,10]: 8 >  6 → 新开 [8, 10]\n  [8,10] 与 [15,18]: 15 > 10 → 新开 [15, 18]\n\n输出: [[1,6],[8,10],[15,18]]\n```"
visualizationType = "intro"

