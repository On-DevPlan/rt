# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 103. 二叉树的锯齿形层序遍历
# 给定二叉树 root，返回其节点值的锯齿形层序遍历
# （即先从左往右，再从右往左进行下一层遍历，以此类推，层与层之间交替进行）
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   结果: [[3],[20,9],[15,7]]
#
# 树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15   7"""
explanation = "**问题分析**\n\n给定二叉树 `root = [3,9,20,null,null,15,7]`，按层遍历但**方向交替**：\n\n- 第 0 层：左 → 右 → `[3]`\n- 第 1 层：右 → 左 → `[20, 9]`\n- 第 2 层：左 → 右 → `[15, 7]`\n\n**关键思路：BFS + 奇偶层反转**\n\n| 步骤 | 说明 |\n|------|------|\n| 1 | 标准 BFS 层序遍历收集每层节点 |\n| 2 | 用标志位 `left_to_right` 控制方向 |\n| 3 | 奇数层调用 `reverse()` 反转该层 |\n\n> BFS 本身的层序顺序不变，仅在收集完成后判断该层方向是否需要反转。"
visualizationType = "intro"

# ── Step 1: 函数签名 + TreeNode + 边界 ─────────────────────────
[[algorithm.steps]]
id = 1
title = "签名与节点"
titleEn = "Signature & Node"
code = """# 103. 二叉树的锯齿形层序遍历
# 给定二叉树 root，返回其节点值的锯齿形层序遍历
# （即先从左往右，再从右往左进行下一层遍历，以此类推，层与层之间交替进行）
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   结果: [[3],[20,9],[15,7]]
#
# 树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15   7

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def zigzagLevelOrder(root: Optional[TreeNode]) -> List[List[int]]:
    \"\"\"返回二叉树的锯齿形层序遍历\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    left_to_right = True
    return res"""
explanation = "**第 1 步：编写签名与初始化**\n\n- 引入类型注解 `Optional`、`List`\n- 引入 `deque` 用于 BFS 队列\n- 定义 `TreeNode` 节点类（二叉树基础结构）\n- 函数签名：`zigzagLevelOrder(root) -> List[List[int]]`\n- **边界处理**：根节点为空直接返回 `[]`\n- **初始化**：\n  - `res`：存放最终结果\n  - `q`：BFS 队列，初始装入根节点\n  - `left_to_right`：方向标志，控制每层顺序\n\n> `left_to_right=True` 表示当前层（左→右）；每处理完一层后翻转标志。"
visualizationType = "code-only"

# ── Step 2: while 循环 + size + level 临时列表 ──────────────────
[[algorithm.steps]]
id = 2
title = "BFS 外层循环"
titleEn = "BFS Outer Loop"
code = """# 103. 二叉树的锯齿形层序遍历
# 给定二叉树 root，返回其节点值的锯齿形层序遍历
# （即先从左往右，再从右往左进行下一层遍历，以此类推，层与层之间交替进行）
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   结果: [[3],[20,9],[15,7]]
#
# 树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15   7

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def zigzagLevelOrder(root: Optional[TreeNode]) -> List[List[int]]:
    \"\"\"返回二叉树的锯齿形层序遍历\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    left_to_right = True
    while q:
        size = len(q)
        level = []
    return res"""
explanation = "**第 2 步：BFS 外层循环**\n\n**循环条件** `while q`：只要队列非空就继续。\n\n**关键变量**\n\n| 变量 | 含义 |\n|------|------|\n| `size` | 当前层节点数 = `len(q)`（必须先取，因为后续 `popleft` 会改变 q） |\n| `level` | 存放当前层节点值的临时列表 |\n\n> `size` 在循环开始时锁定，保证内层 for 循环恰好处理完当前层的所有节点。"
visualizationType = "code-only"

# ── Step 3: for 循环 + 收集 val + 入队子节点 + 奇偶反转 ─────────
[[algorithm.steps]]
id = 3
title = "遍历与反转"
titleEn = "Traverse & Reverse"
code = """# 103. 二叉树的锯齿形层序遍历
# 给定二叉树 root，返回其节点值的锯齿形层序遍历
# （即先从左往右，再从右往左进行下一层遍历，以此类推，层与层之间交替进行）
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   结果: [[3],[20,9],[15,7]]
#
# 树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15   7

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def zigzagLevelOrder(root: Optional[TreeNode]) -> List[List[int]]:
    \"\"\"返回二叉树的锯齿形层序遍历\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    left_to_right = True
    while q:
        size = len(q)
        level = []
        for _ in range(size):
            node = q.popleft()
            level.append(node.val)
            if node.left:
                q.append(node.left)
            if node.right:
                q.append(node.right)
        if not left_to_right:
            level.reverse()
        res.append(level)
        left_to_right = not left_to_right
    return res"""
explanation = "**第 3 步：内层遍历 + 方向控制**\n\n**内层 for 循环**（遍历当前层）：\n\n1. `node = q.popleft()` 取出队首节点\n2. `level.append(node.val)` 收集节点值\n3. 先左后右入队子节点\n\n**奇偶层反转**：\n\n```python\nif not left_to_right:\n    level.reverse()\n```\n\n| `left_to_right` | 该层方向 | 操作 |\n|----------------|----------|------|\n| `True` | 左→右 | 不反转 |\n| `False` | 右→左 | `level.reverse()` |\n\n> 每层处理完后翻转 `left_to_right`，确保下一层方向相反。"
visualizationType = "code-only"

# ── Step 4: 完整代码 + 结果展示 ────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 103. 二叉树的锯齿形层序遍历
# 给定二叉树 root，返回其节点值的锯齿形层序遍历
# （即先从左往右，再从右往左进行下一层遍历，以此类推，层与层之间交替进行）
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   结果: [[3],[20,9],[15,7]]
#
# 树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15   7

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def zigzagLevelOrder(root: Optional[TreeNode]) -> List[List[int]]:
    \"\"\"返回二叉树的锯齿形层序遍历\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    left_to_right = True
    while q:
        size = len(q)
        level = []
        for _ in range(size):
            node = q.popleft()
            level.append(node.val)
            if node.left:
                q.append(node.left)
            if node.right:
                q.append(node.right)
        if not left_to_right:
            level.reverse()
        res.append(level)
        left_to_right = not left_to_right
    return res"""
explanation = "**最终结果**\n\n```\n输入:  root = [3,9,20,null,null,15,7]\n\n         3\n        / \\\n       9   20\n          /  \\\n         15   7\n\n执行过程:\n  第 0 层 (left_to_right=True):  level=[3]        → res=[[3]]\n  第 1 层 (left_to_right=False): level=[9,20]     → reverse → [20,9]   → res=[[3],[20,9]]\n  第 2 层 (left_to_right=True):  level=[15,7]     → res=[[3],[20,9],[15,7]]\n\n输出: [[3], [20, 9], [15, 7]] ✓\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点访问一次 |\n| 空间复杂度 | O(w) — w 为最大层宽，队列最大长度 |\n\n**关键技巧：方向标志 + 收集后反转**\n\n- BFS 层序顺序不变（始终按队列出队顺序），保证子节点入队正确\n- 仅在层收集完成后判断是否需要 `reverse()`\n- 用 `left_to_right` 布尔标志翻转，避免引入额外索引变量"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[[3], [20, 9], [15, 7]]", result = "[[3], [20, 9], [15, 7]]", highlightedIndices = [0, 1, 2, 3, 4] }

