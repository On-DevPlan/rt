[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 108. 将有序数组转换为二叉搜索树
# 给定一个升序排列的整数数组 nums
# 将其转换为一棵高度平衡的二叉搜索树（BST）
#
# 关键定义:
#   - BST: 左子树 < 根 < 右子树
#   - 高度平衡: 每个节点的左右子树高度差不超过 1
#
# 示例:
#   nums = [-10, -3, 0, 5, 9]
#   可能的 BST 根节点: 0（左半 [-10,-3]，右半 [5,9]）
#   结果: [0, -3, 9, -10, null, 5]

from typing import Optional, List

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def sortedArrayToBST(nums: List[int]) -> Optional[TreeNode]:
    \"\"\"将升序数组转换为高度平衡的 BST\"\"\"
    def build(l: int, r: int) -> Optional[TreeNode]:
        if l > r:
            return None
        mid = (l + r) // 2  # ← 中点（左中点）
        root = TreeNode(nums[mid])
        root.left = build(l, mid - 1)
        root.right = build(mid + 1, r)
        return root
    return build(0, len(nums) - 1)"""
explanation = "**最终结果**\n\n✅ 分治 + 中点为根 构造完成\n\n```\n输入: nums = [-10, -3, 0, 5, 9]\n输出树:\n        0\n       / \\\n     -3   9\n     /   /\n   -10  5\n\n层序遍历: [0, -3, 9, -10, null, 5]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点访问一次 |\n| 空间复杂度 | O(log n) — 递归栈深度等于树高 |\n\n**关键洞察**\n\n- 升序数组 + 中点为根 = 同时满足 BST 性质与高度平衡\n- 分治天然把问题拆为两个子问题，递归基为 `l > r`（空子树）\n- 整棵树的中序遍历恰好等于原数组"
visualizationType = "result"
