# ── Step 2: base case + 中点为根 ──────────────────────────────
[[algorithm.steps]]
id = 2
title = "中点为根"
titleEn = "Mid as Root"
code = """# 108. 将有序数组转换为二叉搜索树
# 给定一个升序排列的整数数组 nums
# 将其转换为一棵高度平衡的二叉搜索树（BST）
#
# 关键定义:
#   - BST: 左子树 < 根 < 右子树
#   - 高度平衡: 每个节点的左右子树高度差不超过 1
#
# 示例:
#   nums = [-10, -3, 0, 5, 9]
#   可能的 BST 根节点: 0（左半 [-10,-3]，右半 [5,9]）
#   结果: [0, -3, 9, -10, null, 5]

from typing import Optional, List

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def sortedArrayToBST(nums: List[int]) -> Optional[TreeNode]:
    \"\"\"将升序数组转换为高度平衡的 BST\"\"\"
    def build(l: int, r: int) -> Optional[TreeNode]:
        if l > r:
            return None
        mid = (l + r) // 2  # ← 中点（左中点）
        root = TreeNode(nums[mid])
    return None"""
explanation = "**第 2 步：base case + 中点为根**\n\n```python\nif l > r:\n    return None\nmid = (l + r) // 2\nroot = TreeNode(nums[mid])\n```\n\n| 关键行 | 作用 |\n|--------|------|\n| `if l > r: return None` | 递归终止：空区间返回 `None` |\n| `mid = (l + r) // 2` | 选左中点作为根索引 |\n| `root = TreeNode(nums[mid])` | 用 `nums[mid]` 创建根节点 |\n\n**为什么中点能保证平衡？**\n\n- 中点把数组分成两个子数组，长度差 ≤ 1\n- 递归到叶子时，左右子树高度差最多 1 → 整树高度平衡"
visualizationType = "code-only"

# ── Step 3: 递归构建左右子树 + 返回根 ───────────────────────
[[algorithm.steps]]
id = 3
title = "递归子树"
titleEn = "Recurse Subtrees"
code = """# 108. 将有序数组转换为二叉搜索树
# 给定一个升序排列的整数数组 nums
# 将其转换为一棵高度平衡的二叉搜索树（BST）
#
# 关键定义:
#   - BST: 左子树 < 根 < 右子树
#   - 高度平衡: 每个节点的左右子树高度差不超过 1
#
# 示例:
#   nums = [-10, -3, 0, 5, 9]
#   可能的 BST 根节点: 0（左半 [-10,-3]，右半 [5,9]）
#   结果: [0, -3, 9, -10, null, 5]

from typing import Optional, List

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def sortedArrayToBST(nums: List[int]) -> Optional[TreeNode]:
    \"\"\"将升序数组转换为高度平衡的 BST\"\"\"
    def build(l: int, r: int) -> Optional[TreeNode]:
        if l > r:
            return None
        mid = (l + r) // 2  # ← 中点（左中点）
        root = TreeNode(nums[mid])
        root.left = build(l, mid - 1)
        root.right = build(mid + 1, r)
        return root
    return None"""
explanation = "**第 3 步：递归构建左右子树**\n\n```python\nroot.left = build(l, mid - 1)\nroot.right = build(mid + 1, r)\nreturn root\n```\n\n**递归范围划分**\n\n| 子树 | 数组范围 | 含义 |\n|------|---------|------|\n| `root.left` | `nums[l..mid-1]` | 严格小于 `nums[mid]` |\n| `root.right` | `nums[mid+1..r]` | 严格大于 `nums[mid]` |\n\n**示例追踪** (`nums = [-10, -3, 0, 5, 9]`)\n\n```\nbuild(0, 4): mid=2, root=0\n  ├─ build(0, 1): mid=0, root=-10\n  │   └─ build(1, 1): mid=1, root=-3\n  └─ build(3, 4): mid=3, root=5\n      └─ build(4, 4): mid=4, root=9\n```"
visualizationType = "code-only"

