# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 108. 将有序数组转换为二叉搜索树
# 给定一个升序排列的整数数组 nums
# 将其转换为一棵高度平衡的二叉搜索树（BST）
#
# 关键定义:
#   - BST: 左子树 < 根 < 右子树
#   - 高度平衡: 每个节点的左右子树高度差不超过 1
#
# 示例:
#   nums = [-10, -3, 0, 5, 9]
#   可能的 BST 根节点: 0（左半 [-10,-3]，右半 [5,9]）
#   结果: [0, -3, 9, -10, null, 5]"""
explanation = "**问题重述**\n\n给定一个**升序排列**的整数数组 `nums`，要求将其转换为一棵**高度平衡的二叉搜索树（BST）**，并返回这棵树的根节点。\n\n**输入与输出**\n\n- 输入：`nums`（升序整数数组，可能为空）\n- 输出：高度平衡 BST 的根节点 `TreeNode`（空数组返回 `None`）\n- 关键约束：BST 需满足「左子树 < 根 < 右子树」；高度平衡要求每个节点左右子树高度差不超过 1\n- 边界情况：空数组返回 `None`；单元素数组直接作为根节点\n\n**示例走查**\n\n以测试用例 `nums = [-10,-3,0,5,9]` 为例：\n\n- 数组中点索引为 2，值为 0，选作根节点\n- 左半部分 `[-10,-3]` 递归构建左子树：中点为 -3，其左子节点为 -10\n- 右半部分 `[5,9]` 递归构建右子树：中点为 5，其右子节点为 9\n- 层序遍历输出：`[0,-3,9,-10,null,5]`\n\n因此 `expectedOutput = [0,-3,9,-10,null,5]`。\n\n**关键洞察**\n\n- 升序数组恰好是 BST 的「中序遍历」序列\n- 选中点作根，可将数组均分为左右两部分，自然满足高度平衡\n- 递归子数组 `[l..mid-1]` 和 `[mid+1..r]`，分别构建左、右子树\n\n**方法预览**\n\n| 方法 | 数据结构 | 时间复杂度 | 空间复杂度 |\n|------|----------|------------|------------|\n| 分治 + 中点为根 | 递归栈 | O(n) | O(log n) |\n\n> 不需要真正排序或旋转，升序性已经蕴含了 BST 的中序结构。"
visualizationType = "intro"

