timeComplexity = "O(log n)"
spaceComplexity = "O(1)"
approach = "统计因子 5 的个数"
keyInsight = "末尾 0 由 2×5 产生，2 的因子比 5 多，所以只统计 5；通过 n //= 5 循环累计每轮的 5 的因子个数"
