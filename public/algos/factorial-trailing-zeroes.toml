    \"\"\"返回 n! 末尾 0 的个数。\"\"\"
    count = 0"""
explanation = "**第 2 步：初始化计数器**\n\n`count = 0` 用于累加 5 的因子总数。"
visualizationType = "code-only"

# ── Step 3: 循环统计 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "循环统计"
titleEn = "Count Loop"
code = """# 172. 阶乘后的零
# 给定一个整数 n，返回 n! 结果中尾随零的数量
#
# 尾随零的定义：末尾连续的 0
# 例如：5! = 120，末尾有 1 个 0
#
# 示例:
#   n = 5  → 5! = 120      → 1 个 0
#   n = 10 → 10! = 3628800 → 2 个 0
#   n = 25 → 25! = ...     → 6 个 0（含额外的 5²=25 贡献）

def trailingZeroes(n: int) -> int:
    \"\"\"返回 n! 末尾 0 的个数。\"\"\"
    count = 0
    while n:
        n //= 5
        count += n"""
explanation = "**第 3 步：循环统计因子 5**\n\n**核心逻辑：**\n\n```python\nwhile n:        # 当 n 还大于 0\n    n //= 5    # n 除以 5（向下取整）\n    count += n # 累加当前轮的 5 的因子个数\n```\n\n**为什么这样能统计所有因子 5？**\n\n每轮循环的含义：\n\n| 轮次 | n 值 | 意义 | count 增加 |\n|------|------|------|------------|\n| 第 1 轮 | n //= 5 | 有多少个数是 5 的倍数 | n（如 25//5=5） |\n| 第 2 轮 | n //= 5 | 有多少个数是 25 的倍数（额外贡献一个 5） | n（如 5//5=1） |\n| 第 3 轮 | n //= 5 | 有多少个数是 125 的倍数 | n（如 1//5=0） |\n\n**示例：n = 25**\n\n```\n初始：count = 0\n第 1 轮：n = 25 // 5 = 5, count = 0 + 5 = 5\n第 2 轮：n = 5  // 5 = 1, count = 5 + 1 = 6\n第 3 轮：n = 1  // 5 = 0, count = 6 + 0 = 6\n结束 → count = 6 ✓\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 172. 阶乘后的零
# 给定一个整数 n，返回 n! 结果中尾随零的数量
#
# 尾随零的定义：末尾连续的 0
# 例如：5! = 120，末尾有 1 个 0
#
# 示例:
#   n = 5  → 5! = 120      → 1 个 0
#   n = 10 → 10! = 3628800 → 2 个 0
#   n = 25 → 25! = ...     → 6 个 0（含额外的 5²=25 贡献）

def trailingZeroes(n: int) -> int:
    \"\"\"返回 n! 末尾 0 的个数。\"\"\"
    count = 0
    while n:
        n //= 5
        count += n
    return count"""
explanation = "**最终结果**\n\n✅ 循环结束，返回 `count`\n\n**测试用例验证**\n\n| n | 执行过程 | count | 验证 |\n|---|---------|-------|------|\n| 5 | 5//5=1, 1//5=0 | 1 | 5! = 120 ✓ |\n| 10 | 10//5=2, 2//5=0 | 2 | 10! = 3628800 ✓ |\n| 25 | 25//5=5, 5//5=1, 1//5=0 | 6 | 25! 有 6 个 0 ✓ |\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(log n) — 每轮 n //= 5，log₅(n) 轮 |\n| 空间复杂度 | O(1) — 只用 count 变量 |\n\n**核心思想总结**\n\n> 末尾 0 = 2 × 5，2 的因子比 5 多 → 只统计因子 5\n> \n> 循环 `n //= 5` 实际上在计算：⌊n/5⌋ + ⌊n/25⌋ + ⌊n/125⌋ + ...\n> \n> 每项对应 5 的幂次贡献的额外因子"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "5", result = "1", highlightedIndices = [0] }

