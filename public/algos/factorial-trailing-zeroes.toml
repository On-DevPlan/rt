    \"\"\"返回 n! 末尾 0 的个数。\"\"\"
    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 输入：整数 `n`，计算 `n!` 的末尾 0 的个数\n- 输出：整数，末尾 0 的数量\n- 文档字符串说明函数用途\n\n**算法思路**\n\n不用真正计算阶乘（会溢出），而是**统计 1 到 n 中所有数贡献的因子 5 的个数**。"
visualizationType = "code-only"

# ── Step 2: 初始化计数器 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化计数"
titleEn = "Initialize Counter"
code = """# 172. 阶乘后的零
# 给定一个整数 n，返回 n! 结果中尾随零的数量
#
# 尾随零的定义：末尾连续的 0
# 例如：5! = 120，末尾有 1 个 0
#
# 示例:
#   n = 5  → 5! = 120      → 1 个 0
