# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 172. 阶乘后的零
# 给定一个整数 n，返回 n! 结果中尾随零的数量
#
# 尾随零的定义：末尾连续的 0
# 例如：5! = 120，末尾有 1 个 0
#
# 示例:
#   n = 5  → 5! = 120      → 1 个 0
#   n = 10 → 10! = 3628800 → 2 个 0
#   n = 25 → 25! = ...     → 6 个 0（含额外的 5²=25 贡献）"""
explanation = "**问题分析**\n\n阶乘 `n! = 1 × 2 × 3 × ... × n`，求末尾有多少个连续的 0。\n\n**核心观察：0 从哪里来？**\n\n末尾的 0 由因子 `10 = 2 × 5` 产生。在阶乘中：\n- 因子 2：每 2 个数就有一个（2, 4, 6, ...）→ 充足\n- 因子 5：每 5 个数才有一个（5, 10, 15, ...）→ 稀缺\n\n**关键结论：只数 5 的个数**\n\n因为 2 的因子远多于 5，所以末尾 0 的数量 = 因子 5 的总数。\n\n**如何统计 5 的因子？**\n\n| 数字范围 | 贡献的 5 的因子 | 累计 |\n|----------|-----------------|------|\n| 1-5 | 5（1 个） | 1 |\n| 1-10 | 5, 10（2 个） | 2 |\n| 1-25 | 5,10,15,20,25（6 个） | 6 |\n\n注意：25 = 5²，贡献 2 个因子 5！"
visualizationType = "intro"

