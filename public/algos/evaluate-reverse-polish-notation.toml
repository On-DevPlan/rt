# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 逆波兰表达式求值
# 给定一个字符串数组 tokens，表示逆波兰表达式（后缀表达式）
# 求该表达式的值，并作为整数返回
#
# 运算符: + - * /，每个运算对象可以是整数或另一个表达式
# 整数运算只保留整数部分，即「向 0 截断」
#
# 示例 1:
#   tokens = ["2","1","+","3","*"]
#   ((2 + 1) * 3) = 9
#
# 示例 2:
#   tokens = ["4","13","5","/","+"]
#   (4 + (13 / 5)) = 4 + 2 = 6"""
explanation = "**问题分析**\n\n**逆波兰表达式（后缀表达式）** 把运算符写在操作数之后：\n\n```\n中缀: (2 + 1) * 3\n后缀: 2 1 + 3 *\n```\n\n**特点**：无需括号即可无歧义地表示运算顺序，非常适合用**栈**处理。\n\n**思路**\n\n| 输入 | 动作 |\n|------|------|\n| 数字 | 入栈 |\n| 运算符 | 弹出两个操作数，运算后将结果入栈 |\n\n> 扫描完成后，栈中唯一元素即为表达式的值。\n\n**关键细节**\n\n- 弹出的**第一个数是右操作数**，**第二个数是左操作数**\n- `4 / 2 = 2`、`(-4) / 2 = -2`、`4 / (-2) = -2`，**向 0 截断**"
visualizationType = "intro"

# ── Step 1: 函数签名 + 栈初始化 ─────────────────────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 逆波兰表达式求值
