    \"\"\"返回是否为回文数。\"\"\"
    if x < 0 or (x % 10 == 0 and x != 0):
        return False
    reversed = 0"""
explanation = "**第 1 步：排除特殊情况并初始化**\n\n**排除以下情况：**\n\n- 负数：x < 0 → 直接返回 false\n- 末位是 0 但不是 0 本身：x % 10 == 0 and x != 0 → 直接返回 false\n\n**为什么排除末位是 0？**\n\n示例：10 反转后是 01 = 1 ≠ 10，120 反转后是 021 = 21 ≠ 120\n\n**初始化 reversed 变量**，用于存储反转的后半部分数字。"
visualizationType = "code-only"

# ── Step 2: 添加循环条件 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "反转后半部分"
titleEn = "Reverse Half"
code = """# 9. 回文数
# 判断整数是否是回文数（不转字符串）
# 回文数：正读反读都相同的数，如 121、12321
#
# 特殊情况：
#   负数不是回文数（如 -121）
#   末位是 0 且不是 0 本身的数不是回文数（如 10、120）
#
# 示例：
#   121 → true（回文）
#   -121 → false（负号不对称）
#   10 → false（反转后是 01 = 1，不等于 10）

def isPalindrome(x: int) -> bool:
    \"\"\"返回是否为回文数。\"\"\"
    if x < 0 or (x % 10 == 0 and x != 0):
        return False
    reversed = 0
    while x > reversed:"""
explanation = "**第 2 步：反转后半部分数字**\n\n**循环条件 while x > reversed：**\n\n- 当 x > reversed 时，继续反转\n- 当 x <= reversed 时，说明已经反转了一半或一半多，停止\n\n**示例 x=121：**\n\n初始：x=121, reversed=0\n第 1 次：x=12, reversed=1  (121 > 1)\n第 2 次：x=1, reversed=12  (12 > 12? 否，停止)\n\n停止时 x=1, reversed=12，已反转一半多"
visualizationType = "code-only"

# ── Step 3: 反转逻辑 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "反转操作"
titleEn = "Reverse Operation"
code = """# 9. 回文数
# 判断整数是否是回文数（不转字符串）
# 回文数：正读反读都相同的数，如 121、12321
#
# 特殊情况：
#   负数不是回文数（如 -121）
#   末位是 0 且不是 0 本身的数不是回文数（如 10、120）
#
# 示例：
#   121 → true（回文）
#   -121 → false（负号不对称）
#   10 → false（反转后是 01 = 1，不等于 10）

def isPalindrome(x: int) -> bool:
    \"\"\"返回是否为回文数。\"\"\"
    if x < 0 or (x % 10 == 0 and x != 0):
        return False
    reversed = 0
    while x > reversed:
        reversed = reversed * 10 + x % 10
        x //= 10"""
explanation = "**第 3 步：执行反转操作**\n\n每次循环执行两个操作：\n\n- reversed = reversed * 10 + x % 10  # 取 x 的末位，加到 reversed 后面\n- x //= 10  # x 去掉末位\n\n**示例 x = 121：**\n\n| 步骤 | x | reversed | x % 10 | 计算 |\n|------|-----------|----------|--------|----------|\n| 初始 | 121 | 0 | — | — |\n| 第 1 次 | 12 | 1 | 1 | 0 * 10 + 1 = 1 |\n| 第 2 次 | 1 | 12 | 2 | 1 * 10 + 2 = 12 |\n| 停止 | — | — | — | x(1) <= reversed(12) |\n\n**示例 x = 12321（奇数位）：**\n\n初始：x=12321, reversed=0\n第 1 次：x=1232, reversed=1\n第 2 次：x=123, reversed=12\n停止时 x=123, reversed=12，x(123) > reversed(12)? 否"
visualizationType = "code-only"

# ── Step 4: 判断结果 ──────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 9. 回文数
# 判断整数是否是回文数（不转字符串）
# 回文数：正读反读都相同的数，如 121、12321
#
# 特殊情况：
#   负数不是回文数（如 -121）
#   末位是 0 且不是 0 本身的数不是回文数（如 10、120）
#
# 示例：
#   121 → true（回文）
#   -121 → false（负号不对称）
#   10 → false（反转后是 01 = 1，不等于 10）

def isPalindrome(x: int) -> bool:
    \"\"\"返回是否为回文数。\"\"\"
    if x < 0 or (x % 10 == 0 and x != 0):
        return False
    reversed = 0
    while x > reversed:
        reversed = reversed * 10 + x % 10
        x //= 10
    return x == reversed or x == reversed // 10"""
explanation = "**最终结果**\n\n**判断逻辑：**\n\n- return x == reversed or x == reversed // 10\n\n| 情况 | 条件 | 示例 |\n|------|------|----------|\n| 偶数位 | x == reversed | 1221 → x=12, reversed=12 ✓ |\n| 奇数位 | x == reversed // 10 | 121 → x=1, reversed=12, 12//10=1 ✓ |\n\n**验证示例：**\n\n121：停止时 x=1, reversed=12，1 == 12//10? 1 == 1? 是 → true ✓\n12321：停止时 x=123, reversed=12，123 == 12//10? 123 == 1? 否 → false ✓\n10：末位是 0 且 x!=0 → 直接返回 false ✓\n\n**算法复杂度：**\n\n时间复杂度：O(log n) — 每次循环 x 减少一位\n空间复杂度：O(1) — 只用了一个变量\n\n**为什么反转一半而不是全部？**\n\n- 完全反转可能导致整数溢出\n- 反转一半即可判断回文，无需全部反转"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "121", result = "true", highlightedIndices = [0, 2] }

