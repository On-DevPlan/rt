# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 9. 回文数
# 判断整数是否是回文数（不转字符串）
# 回文数：正读反读都相同的数，如 121、12321
#
# 特殊情况：
#   负数不是回文数（如 -121）
#   末位是 0 且不是 0 本身的数不是回文数（如 10、120）
#
# 示例：
#   121 → true（回文）
#   -121 → false（负号不对称）
#   10 → false（反转后是 01 = 1，不等于 10）"""
explanation = "**问题分析**\n\n判断一个整数是否是回文数，**不能使用字符串转换**。\n\n**关键思路：反转一半数字**\n\n| 方法 | 时间 | 空间 |\n|------|------|------|\n| 转字符串 | O(n) | O(n) |\n| 完全反转数字 | O(log n) | O(1) — 可能溢出 |\n| **反转一半** | **O(log n)** | **O(1)** ✓ |\n\n**核心思想**：\n\n- 只反转后半部分数字\n- 反转过程中：reversed = reversed * 10 + x % 10，然后 x //= 10\n- 终止条件：x <= reversed（已经反转了一半或一半多）\n- 比较：偶数位 x == reversed，奇数位 x == reversed // 10"
visualizationType = "intro"

