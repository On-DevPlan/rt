# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 101. 对称二叉树
# 判断一棵二叉树是否是镜像对称的
# 镜像对称 = 沿中轴线左右折叠后能完全重合
#
# 示例:
#   root = [1,2,2,3,4,4,3]
#         1
#        / \\
#       2   2
#      / \\ / \\
#     3  4 4  3
#   结果: true（左子树是右子树的镜像）

# 关键观察:
#   - 根节点的左右子树必须互为镜像
#   - 外侧节点对 ↔ 外侧节点对：(left.left, right.right)
#   - 内侧节点对 ↔ 内侧节点对：(left.right, right.left)"""
explanation = """
**问题重述**

给定一棵二叉树的根节点 `root`，判断该树沿中轴线是否镜像对称——即沿根节点的垂直中轴左右折叠后，两侧能否完全重合。

**输入与输出**

- 输入：二叉树根节点 `root`（以层序数组形式给出，如 `[1,2,2,3,4,4,3]`）。
- 输出：布尔值 `true`（对称）或 `false`（不对称）。
- 边界：空树视为对称；单个节点也视为对称。

**示例走查**

以题目给出的 `root = [1,2,2,3,4,4,3]` 为例，预期输出为 `expectedOutput = "true"`

构造出的树：
```
        1
       ┌ ┐
       │ │
      2   2
     ┌ ┼ ┐
     │ │ │
    3  4 4  3
```

1. 根节点左右子树的根值都是 `2`，相同。
2. 左子树外侧节点 `3` 与右子树外侧节点 `3` 相等。
3. 左子树内侧节点 `4` 与右子树内侧节点 `4` 相等。

所有镜像位置均匹配，返回 `true`，与预期输出一致。

**关键洞察**

判断整棵树对称 = 判断左子树和右子树是否互为镜像。比较时必须交叉比较，而非直接比较左右子树是否相同：

- 外侧对外侧：`left.left` ↔ `right.right`
- 内侧对内侧：`left.right` ↔ `right.left`

**方法预览**

递归（DFS）或队列（BFS）实现镜像比较。

| 指标 | 值 |
|------|------|
| 算法 | 递归镜像比较 |
| 时间复杂度 | O(n) |
| 空间复杂度 | O(h)（递归栈） |
"""
visualizationType = "intro"

# ── Step 1: 函数签名 ──────────────────────────────────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 101. 对称二叉树
# 判断一棵二叉树是否是镜像对称的
# 镜像对称 = 沿中轴线左右折叠后能完全重合
#
# 示例:
#   root = [1,2,2,3,4,4,3]
#         1
#        / \\
#       2   2
#      / \\ / \\
#     3  4 4  3
#   结果: true（左子树是右子树的镜像）

# 关键观察:
#   - 根节点的左右子树必须互为镜像
#   - 外侧节点对 ↔ 外侧节点对：(left.left, right.right)
#   - 内侧节点对 ↔ 内侧节点对：(left.right, right.left)

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isSymmetric(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否镜像对称\"\"\"
    def isMirror(p: Optional[TreeNode], q: Optional[TreeNode]) -> bool:
        if p is None and q is None:
            return True
        pass"""
explanation = "**第 1 步：定义数据结构和函数签名**\n\n- `TreeNode`：标准二叉树节点（含 `val`、`left`、`right`）\n- `isSymmetric(root)`：主函数入口，调用内部 `isMirror`\n- `isMirror(p, q)`：递归比较两个节点是否互为镜像\n\n**为什么需要嵌套函数？**\n\n> 主问题 `isSymmetric` 等价于「`root.left` 与 `root.right` 是否互为镜像」，\n> 借助内部函数可以避免对外暴露 `p, q` 两个参数。\n\n**第 1 个 base case**：\n\n```python\nif p is None and q is None:\n    return True\n```\n\n两侧都为空 → 对称（递归终止条件之一）。"
visualizationType = "code-only"

# ── Step 2: 第二、三个 base case ─────────────────────────────
[[algorithm.steps]]
id = 2
title = "补全 base case"
titleEn = "Complete Base Cases"
code = """# 101. 对称二叉树
# 判断一棵二叉树是否是镜像对称的
# 镜像对称 = 沿中轴线左右折叠后能完全重合
#
# 示例:
#   root = [1,2,2,3,4,4,3]
#         1
#        / \\
#       2   2
#      / \\ / \\
#     3  4 4  3
#   结果: true（左子树是右子树的镜像）

# 关键观察:
#   - 根节点的左右子树必须互为镜像
#   - 外侧节点对 ↔ 外侧节点对：(left.left, right.right)
#   - 内侧节点对 ↔ 内侧节点对：(left.right, right.left)

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isSymmetric(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否镜像对称\"\"\"
    def isMirror(p: Optional[TreeNode], q: Optional[TreeNode]) -> bool:
        if p is None and q is None:
            return True
        if p is None or q is None:
            return False
        if p.val != q.val:
            return False
        pass"""
explanation = "**第 2 步：补全其余 base case**\n\n**第 2 个 base case**：\n\n```python\nif p is None or q is None:\n    return False\n```\n\n一侧为空、另一侧非空 → **结构不对称**。\n\n**第 3 个 base case**：\n\n```python\nif p.val != q.val:\n    return False\n```\n\n两侧都非空但值不同 → **值不对称**。\n\n> 三个 base case 顺序不可调换：必须先排除 `None`，再比较 `val`，\n> 否则 `p.val` 在 `p is None` 时会报 `AttributeError`。"
visualizationType = "code-only"

# ── Step 3: 递归调用 ─────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "递归镜像"
titleEn = "Recursive Mirror"
code = """# 101. 对称二叉树
# 判断一棵二叉树是否是镜像对称的
# 镜像对称 = 沿中轴线左右折叠后能完全重合
#
# 示例:
#   root = [1,2,2,3,4,4,3]
#         1
#        / \\
#       2   2
#      / \\ / \\
#     3  4 4  3
#   结果: true（左子树是右子树的镜像）

# 关键观察:
#   - 根节点的左右子树必须互为镜像
#   - 外侧节点对 ↔ 外侧节点对：(left.left, right.right)
#   - 内侧节点对 ↔ 内侧节点对：(left.right, right.left)

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isSymmetric(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否镜像对称\"\"\"
    def isMirror(p: Optional[TreeNode], q: Optional[TreeNode]) -> bool:
        if p is None and q is None:
            return True
        if p is None or q is None:
            return False
        if p.val != q.val:
            return False
        return isMirror(p.left, q.right) and isMirror(p.right, q.left)
    return isMirror(root.left, root.right)"""
explanation = "**第 3 步：递归比较镜像位置**\n\n```python\nreturn isMirror(p.left, q.right) and isMirror(p.right, q.left)\n```\n\n**对称递归的关键**：交叉比较\n\n| 递归调用 | 对应位置 |\n|----------|---------|\n| `isMirror(p.left, q.right)` | 外侧：左的左 ↔ 右的右 |\n| `isMirror(p.right, q.left)` | 内侧：左的右 ↔ 右的左 |\n\n**主函数调用**\n\n```python\nreturn isMirror(root.left, root.right)\n```\n\n> 整个算法在一次递归中同时下钻到外侧和内侧，\n> 一旦任意一侧不匹配立即返回 `False`。"
visualizationType = "code-only"

