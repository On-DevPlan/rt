[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 101. 对称二叉树
# 判断一棵二叉树是否是镜像对称的
# 镜像对称 = 沿中轴线左右折叠后能完全重合
#
# 示例:
#   root = [1,2,2,3,4,4,3]
#         1
#        / \\
#       2   2
#      / \\ / \\
#     3  4 4  3
#   结果: true（左子树是右子树的镜像）

# 关键观察:
#   - 根节点的左右子树必须互为镜像
#   - 外侧节点对 ↔ 外侧节点对：(left.left, right.right)
#   - 内侧节点对 ↔ 内侧节点对：(left.right, right.left)

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def isSymmetric(root: Optional[TreeNode]) -> bool:
    \"\"\"判断二叉树是否镜像对称\"\"\"
    def isMirror(p: Optional[TreeNode], q: Optional[TreeNode]) -> bool:
        if p is None and q is None:
            return True
        if p is None or q is None:
            return False
        if p.val != q.val:
            return False
        return isMirror(p.left, q.right) and isMirror(p.right, q.left)
    return isMirror(root.left, root.right)"""
explanation = "**最终结果**\n\n**示例执行** `root = [1,2,2,3,4,4,3]`\n\n```\n        1            ← 根\n       / \\\n      2   2          ← 左右值相同 ✓\n     / \\\\ / \\\\\n    3  4 4  3        ← 外侧 3↔3 ✓, 内侧 4↔4 ✓\n```\n\n**递归路径**\n\n| 步骤 | 比较 | 结果 |\n|------|------|------|\n| 1 | `isMirror(2左, 2右)` | 值相等 → 继续 |\n| 2 | `isMirror(3, 3)` | True |\n| 3 | `isMirror(4, 4)` | True |\n| 最终 | 全 True | **返回 `True`** |\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点访问一次 |\n| 空间复杂度 | O(h) — 递归栈深度，h 为树高 |\n\n**关键技巧：交叉递归**\n\n- 同步比较两个节点，避免拆成「判断相同树 + 反转」的两次遍历\n- 三个 base case 顺序敏感，先 `None` 后 `val`\n- BFS 用队列实现也可达到同样 O(n) 时间 / O(n) 空间"
visualizationType = "result"
