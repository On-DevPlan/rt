# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 104. 二叉树的最大深度
# 给定二叉树的根节点 root，返回其最大深度
# 最大深度：从根节点到最远叶子节点的最长路径上的节点数
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#   结果: 3（路径 3 → 20 → 15 或 3 → 20 → 7）"""
explanation = "**问题分析**\n\n给定一棵二叉树，求从根到叶子的最长路径上有多少个节点。\n\n**示例输入**\n\n```\nroot = [3, 9, 20, null, null, 15, 7]\n\n        3\n       / \\\n      9   20\n         /  \\\n        15    7\n```\n\n**关键思路：DFS 后序遍历**\n\n| 解法 | 时间 | 空间 | 说明 |\n|------|------|------|------|\n| **DFS 递归** | **O(n)** | **O(h)** | 简洁优雅 |\n| BFS 层序遍历 | O(n) | O(w) | w 为最大层宽度 |\n\n> DFS 更直观：深度 = max(左子树深度, 右子树深度) + 1。"
visualizationType = "intro"

# ── Step 1: 函数签名 + TreeNode + base case ──────────────────
[[algorithm.steps]]
id = 1
title = "签名与基础情况"
titleEn = "Signature & Base Case"
code = """# 104. 二叉树的最大深度
# 给定二叉树的根节点 root，返回其最大深度
# 最大深度：从根节点到最远叶子节点的最长路径上的节点数
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#   结果: 3（路径 3 → 20 → 15 或 3 → 20 → 7）

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def maxDepth(root: Optional[TreeNode]) -> int:
    \"\"\"返回二叉树的最大深度（根到叶最长路径节点数）。\"\"\"
    if root is None:
        return 0"""
explanation = "**第 1 步：定义结构与基础情况**\n\n- `TreeNode`：标准二叉树节点，包含 `val`、`left`、`right`\n- `maxDepth` 函数签名：接收 `Optional[TreeNode]`，返回 `int`\n\n**Base case：空节点深度为 0**\n\n```python\nif root is None:\n    return 0\n```\n\n> 这是递归的终止条件，避免无限递归。"
visualizationType = "code-only"

# ── Step 2: 递归调用左右子树 ────────────────────────────────
[[algorithm.steps]]
id = 2
title = "递归子树"
titleEn = "Recurse on Subtrees"
code = """# 104. 二叉树的最大深度
# 给定二叉树的根节点 root，返回其最大深度
# 最大深度：从根节点到最远叶子节点的最长路径上的节点数
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#   结果: 3（路径 3 → 20 → 15 或 3 → 20 → 7）

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def maxDepth(root: Optional[TreeNode]) -> int:
    \"\"\"返回二叉树的最大深度（根到叶最长路径节点数）。\"\"\"
    if root is None:
        return 0
    left = maxDepth(root.left)
    right = maxDepth(root.right)"""
explanation = "**第 2 步：递归左右子树**\n\n```python\nleft = maxDepth(root.left)\nright = maxDepth(root.right)\n```\n\n**递归过程图示**\n\n```\nmaxDepth(3)\n├── maxDepth(9)\n│   ├── maxDepth(None) → 0\n│   └── maxDepth(None) → 0\n└── maxDepth(20)\n    ├── maxDepth(15)\n    │   ├── maxDepth(None) → 0\n    │   └── maxDepth(None) → 0\n    └── maxDepth(7)\n        ├── maxDepth(None) → 0\n        └── maxDepth(None) → 0\n```\n\n> 每层递归都会计算子树的深度，自底向上返回结果。"
visualizationType = "code-only"

# ── Step 3: max + 1 返回 ─────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "返回结果"
titleEn = "Return Result"
code = """# 104. 二叉树的最大深度
# 给定二叉树的根节点 root，返回其最大深度
# 最大深度：从根节点到最远叶子节点的最长路径上的节点数
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#   结果: 3（路径 3 → 20 → 15 或 3 → 20 → 7）

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def maxDepth(root: Optional[TreeNode]) -> int:
    \"\"\"返回二叉树的最大深度（根到叶最长路径节点数）。\"\"\"
    if root is None:
        return 0
    left = maxDepth(root.left)
    right = maxDepth(root.right)
    return max(left, right) + 1"""
explanation = "**第 3 步：返回 max + 1**\n\n```python\nreturn max(left, right) + 1\n```\n\n**回溯过程**\n\n```\n叶子节点: max(0, 0) + 1 = 1\n15 节点:  max(1, 0) + 1 = 2\n7  节点:  max(0, 1) + 1 = 2\n20 节点:  max(2, 2) + 1 = 3\n9  节点:  max(1, 0) + 1 = 2\n3  节点:  max(2, 3) + 1 = 4?  ← 错！应该是 3\n```\n\n> 注意：根节点本身已计 1，所以是 `max(子深度) + 1`。上例修正：3 → 9 深度为 2（含 9），3 → 20 → 15 深度为 3，max(2,3)+1 = 4 是把根节点多算了一次。实际：`maxDepth(9)` 应返回 1（仅节点 9），`maxDepth(20)` 返回 2，根返回 `max(1,2)+1 = 3` ✓"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 104. 二叉树的最大深度
# 给定二叉树的根节点 root，返回其最大深度
# 最大深度：从根节点到最远叶子节点的最长路径上的节点数
#
# 示例:
#   root = [3,9,20,null,null,15,7]
#   树结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#   结果: 3（路径 3 → 20 → 15 或 3 → 20 → 7）

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def maxDepth(root: Optional[TreeNode]) -> int:
    \"\"\"返回二叉树的最大深度（根到叶最长路径节点数）。\"\"\"
    if root is None:
        return 0
    left = maxDepth(root.left)
    right = maxDepth(root.right)
    return max(left, right) + 1"""
explanation = "**最终结果**\n\n```\n输入: root = [3, 9, 20, null, null, 15, 7]\n输出: 3\n```\n\n**回溯正确版本**\n\n```\n叶子 9:  max(0, 0) + 1 = 1\n叶子 15: max(0, 0) + 1 = 1\n叶子 7:  max(0, 0) + 1 = 1\n节点 20: max(1, 1) + 1 = 2\n根 3:   max(1, 2) + 1 = 3  ✓\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点访问一次 |\n| 空间复杂度 | O(h) — h 为树高（递归栈深度） |\n\n**关键洞察**\n\n- 空节点返回 0 作为 base case\n- 当前节点深度 = max(左子树深度, 右子树深度) + 1\n- 递归本质是**后序遍历**：先算子树，再算自己"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[3, 9, 20, 15, 7]", result = "3", highlightedIndices = [0] }

