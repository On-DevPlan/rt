# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 123. 买卖股票的最佳时机 III
# 最多完成 2 笔交易，求最大利润
#
# 关键约束:
#   - 每天可以买入或卖出（但不能同一天同时买卖）
#   - 最多 2 笔完整交易（买入+卖出=1笔）
#   - 必须先买入才能卖出
#   - 卖出后才能开始下一笔交易
#
# 示例:
#   prices = [3, 3, 5, 0, 0, 3, 1, 4]
#   第1笔: 第4天买入(0), 第6天卖出(3) → 利润 3
#   第2笔: 第7天买入(1), 第8天卖出(4) → 利润 3
#   总利润: 6"""
explanation = "**问题重述**\n\n给定一个长度为 `n` 的股价数组 `prices`，其中 `prices[i]` 表示第 `i` 天的股价。你最多可以完成 **2 笔完整交易**（一笔交易 = 一次买入 + 一次卖出），求能获得的最大利润；如果无法盈利，返回 `0`。\n\n**输入与输出**\n\n- 输入：`prices` —— 整数数组，长度 `1 ≤ n ≤ 10^5`，元素为非负整数。\n- 输出：一个整数，表示最多 2 笔交易的最大利润。\n- 边界：若股价单调递减，则最佳策略是不交易，利润为 `0`；同一天不能同时买入和卖出，卖出后才能开始下一笔交易。\n\n**示例走查**\n\n以题目给出的 `prices = [3, 3, 5, 0, 0, 3, 1, 4]` 为例：\n\n- 最优策略为两笔独立的交易：\n  - 第 1 笔：第 4 天（价格为 `0`）买入，第 6 天（价格为 `3`）卖出，利润 `3 - 0 = 3`。\n  - 第 2 笔：第 7 天（价格为 `1`）买入，第 8 天（价格为 `4`）卖出，利润 `4 - 1 = 3`。\n- 总利润：`3 + 3 = 6`，因此 `expectedOutput = \"6\"`。\n\n**关键洞察**\n\n> 不能简单地找两段最大子段和相加，因为第 2 笔买入的资金来自第 1 笔卖出的收益，两笔交易的状态会相互影响。因此需要用状态机思想，同时维护「第 1 次持有 / 第 1 次卖出 / 第 2 次持有 / 第 2 次卖出」四个状态，每天取「保持」和「转换」的最大值。\n\n**方法预览**\n\n| 项目 | 内容 |\n|------|------|\n| 算法 | 动态规划 / 状态机 |\n| 时间复杂度 | O(n) |\n| 空间复杂度 | O(1) |\n| 核心状态 | `hold1`、`released1`、`hold2`、`released2` |"
visualizationType = "intro"

