# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 123. 买卖股票的最佳时机 III
# 最多完成 2 笔交易，求最大利润
#
# 关键约束:
#   - 每天可以买入或卖出（但不能同一天同时买卖）
#   - 最多 2 笔完整交易（买入+卖出=1笔）
#   - 必须先买入才能卖出
#   - 卖出后才能开始下一笔交易
#
# 示例:
#   prices = [3, 3, 5, 0, 0, 3, 1, 4]
#   第1笔: 第4天买入(0), 第6天卖出(3) → 利润 3
#   第2笔: 第7天买入(1), 第8天卖出(4) → 利润 3
#   总利润: 6"""
explanation = "**问题分析**\n\n给定股票价格数组，最多完成 **2 笔交易**（每笔=买入+卖出），求最大利润。\n\n**状态定义**（关键洞察）\n\n用 4 个状态跟踪全程最优值：\n\n| 状态 | 含义 |\n|------|------|\n| `hold1` | 第1次持有股票时的最大收益（负数=支出） |\n| `released1` | 第1次卖出后的最大收益（正数=利润） |\n| `hold2` | 第2次持有股票时的最大收益 |\n| `released2` | 第2次卖出后的最大收益（最终答案） |\n\n> **核心思想**：每个状态都取「保持原状态」和「转换到新状态」的最大值，确保全程最优。"
visualizationType = "intro"

