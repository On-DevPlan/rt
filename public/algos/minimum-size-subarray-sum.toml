[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 长度最小的子数组
# 给定一个含正整数的数组 nums 和一个正整数 target
# 找出长度最小的连续子数组，使其元素之和 >= target
# 如果不存在这样的子数组，返回 0
#
# 示例:
#   target = 7, nums = [2, 3, 1, 2, 4, 3]
#   子数组 [4, 3] 的和 = 7，长度 = 2
#   这是满足条件的最短长度

from typing import List

def minSubArrayLen(target: int, nums: List[int]) -> int:
    \"\"\"返回和 >= target 的最短连续子数组长度，不存在则返回 0。\"\"\"
    n = len(nums)
    left = 0  # 窗口左边界
    cur = 0  # 当前窗口元素之和
    ans = float(\"inf\")  # 记录最短长度，初始化为正无穷

    for right in range(n):
        cur += nums[right]  # 右指针扩展，把 nums[right] 纳入窗口
        while cur >= target:  # 当前窗口已满足条件，尝试缩小
            ans = min(ans, right - left + 1)  # 记录当前窗口长度
            cur -= nums[left]  # 移除最左侧元素
            left += 1  # 左指针右移，窗口缩小

    return 0 if ans == float(\"inf\") else ans"""
explanation = "**最终结果**\n\n✅ 滑动窗口求出最短长度\n\n```\n输入: target = 7, nums = [2, 3, 1, 2, 4, 3]\n输出: 2\n对应的子数组: [4, 3]（下标 3~4，和为 7）\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个元素最多被 left/right 各访问一次 |\n| 空间复杂度 | O(1) — 只用了若干指针与状态变量 |\n\n**关键技巧：滑动窗口**\n\n- 利用「正整数」的单调性，右扩单调增、左缩单调减\n- 两个指针都**只增不减**，全程 `O(n)` 步\n- `while cur >= target` 不断尝试**缩到最短**，配合 `min(ans, ...)` 记录全局最优"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[2, 3, 1, 2, 4, 3]", result = "2", highlightedIndices = [3, 4] }

