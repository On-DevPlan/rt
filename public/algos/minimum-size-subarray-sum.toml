from typing import List

def minSubArrayLen(target: int, nums: List[int]) -> int:
    \"\"\"返回和 >= target 的最短连续子数组长度，不存在则返回 0。\"\"\"
    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 入参 `target: int` — 目标和\n- 入参 `nums: List[int]` — 由正整数组成的数组\n- 返回 `int` — 最短子数组长度，不存在则返回 `0`\n- 使用类型注解明确参数和返回类型\n- 文档字符串说明函数用途\n- 函数体先用 `pass` 占位"
visualizationType = "code-only"

# ── Step 2: 初始化双指针与状态 ──────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化窗口"
titleEn = "Initialize Window"
code = """# 长度最小的子数组
# 给定一个含正整数的数组 nums 和一个正整数 target
# 找出长度最小的连续子数组，使其元素之和 >= target
# 如果不存在这样的子数组，返回 0
#
# 示例:
#   target = 7, nums = [2, 3, 1, 2, 4, 3]
#   子数组 [4, 3] 的和 = 7，长度 = 2
#   这是满足条件的最短长度

from typing import List

def minSubArrayLen(target: int, nums: List[int]) -> int:
    \"\"\"返回和 >= target 的最短连续子数组长度，不存在则返回 0。\"\"\"
    n = len(nums)
    left = 0  # 窗口左边界
    cur = 0  # 当前窗口元素之和
    ans = float(\"inf\")  # 记录最短长度，初始化为正无穷"""
explanation = "**第 2 步：声明滑动窗口的状态变量**\n\n| 变量 | 含义 | 初值 |\n|------|------|------|\n| `n` | 数组长度 | `len(nums)` |\n| `left` | 窗口左边界索引 | `0` |\n| `cur` | 当前窗口 `[left, right]` 的元素之和 | `0` |\n| `ans` | 全局最短长度 | `float(\"inf\")` |\n\n**为什么 `ans` 用 `inf` 初始化？**\n\n- 保证任何**真实长度**（包括 `1`）都比它小\n- 循环结束后如果 `ans` 仍是 `inf`，说明**没有**满足条件的子数组\n\n> 滑动窗口的两个指针 `left` 和 `right`（在循环中作为 `for right in range(n)`）共同界定当前考察的连续区间。"
visualizationType = "code-only"

# ── Step 3: 滑动窗口主循环 ─────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "滑动窗口"
titleEn = "Sliding Window"
code = """# 长度最小的子数组
# 给定一个含正整数的数组 nums 和一个正整数 target
# 找出长度最小的连续子数组，使其元素之和 >= target
# 如果不存在这样的子数组，返回 0
#
# 示例:
#   target = 7, nums = [2, 3, 1, 2, 4, 3]
#   子数组 [4, 3] 的和 = 7，长度 = 2
#   这是满足条件的最短长度

from typing import List

def minSubArrayLen(target: int, nums: List[int]) -> int:
    \"\"\"返回和 >= target 的最短连续子数组长度，不存在则返回 0。\"\"\"
    n = len(nums)
    left = 0  # 窗口左边界
    cur = 0  # 当前窗口元素之和
    ans = float(\"inf\")  # 记录最短长度，初始化为正无穷

    for right in range(n):
        cur += nums[right]  # 右指针扩展，把 nums[right] 纳入窗口
        while cur >= target:  # 当前窗口已满足条件，尝试缩小
            ans = min(ans, right - left + 1)  # 记录当前窗口长度
            cur -= nums[left]  # 移除最左侧元素
            left += 1  # 左指针右移，窗口缩小"""
explanation = "**第 3 步：滑动窗口主循环**\n\n**两层逻辑**\n\n1. **外层 `for right`**：右指针遍历数组，把 `nums[right]` 加入窗口\n2. **内层 `while cur >= target`**：当前窗口满足条件时，**持续收缩**左边界\n\n**为什么内层是 `while` 而不是 `if`？**\n\n- 缩小一次后窗口可能**仍然**满足 `cur >= target`\n- 元素都是正数，所以收缩是**单调减少**的，可以安全地继续缩\n- 直到 `cur < target` 才停止，保证窗口**刚好不满足**或**刚好满足**\n\n**示例执行（target=7, nums=[2,3,1,2,4,3]）**\n\n| 步骤 | right | left | cur | 窗口 | ans |\n|------|-------|------|-----|------|-----|\n| 扩 | 0 | 0 | 2 | [2] | inf |\n| 扩 | 1 | 0 | 5 | [2,3] | inf |\n| 扩 | 2 | 0 | 6 | [2,3,1] | inf |\n| 扩 | 3 | 0 | 8 | [2,3,1,2] | inf |\n| 收 | 3 | 1 | 6 | [3,1,2] | 4 |\n| 扩 | 4 | 1 | 10 | [3,1,2,4] | 4 |\n| 收 | 4 | 2 | 9 | [1,2,4] | 4 |\n| 收 | 4 | 3 | 7 | [2,4] | 3 |\n| 收 | 4 | 4 | 4 | [4] | 2 |\n| 扩 | 5 | 4 | 7 | [4,3] | 2 |\n| 收 | 5 | 5 | 3 | [3] | 2 |"
visualizationType = "code-only"

