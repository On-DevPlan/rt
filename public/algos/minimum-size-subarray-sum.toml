# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 长度最小的子数组
# 给定一个含正整数的数组 nums 和一个正整数 target
# 找出长度最小的连续子数组，使其元素之和 >= target
# 如果不存在这样的子数组，返回 0
#
# 示例:
#   target = 7, nums = [2, 3, 1, 2, 4, 3]
#   子数组 [4, 3] 的和 = 7，长度 = 2
#   这是满足条件的最短长度"""
explanation = "**问题分析**\n\n给定正整数数组 `nums` 和正整数 `target`，求**长度最小**的连续子数组，使其和 `>= target`。\n\n**关键约束**\n\n- 数组元素都是**正整数**（关键！）\n- 子数组必须**连续**\n- 找不到则返回 `0`\n\n**暴力思路 vs 最优思路**\n\n| 方法 | 思路 | 时间 |\n|------|------|------|\n| 暴力枚举所有子数组 | 两层循环 + 求和 | O(n³) |\n| 前缀和 + 二分查找 | 固定左端点，二分右端点 | O(n log n) |\n| **滑动窗口** | 双指针同向移动 | **O(n)** |\n\n> 核心思想：因为元素都是**正数**，右指针扩大时窗口和只会增加、左指针缩小时只会减少，**单调性**保证了可以线性扫描。"
visualizationType = "intro"

