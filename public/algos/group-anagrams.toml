# ── Step 2: 初始化 defaultdict ───────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化哈希表"
titleEn = "Initialize Hash Map"
code = """# 字母异位词分组
# 给定一个字符串数组 strs，把所有字母异位词（anagram）分到同一组。
# 字母异位词: 由相同字符以相同数量重新排列形成的字符串。
#
# 示例:
#   输入: ["eat","tea","tan","ate","nat","bat"]
#   输出: [["bat"],["nat","tan"],["ate","eat","tea"]]
#
# 返回的顺序不重要，只要同一组内的字符串互为字母异位词即可。

from typing import List
from collections import defaultdict

def groupAnagrams(strs: List[str]) -> List[List[str]]:
    \"\"\"把字符串数组中互为字母异位词的字符串分到同一组。\"\"\"
    groups = defaultdict(list)  # key: 排序后的字符串; value: 原字符串列表"""
explanation = "**第 2 步：用 defaultdict 建立分组表**\n\n```python\ngroups = defaultdict(list)\n```\n\n| 维度 | 内容 |\n|------|------|\n| key 类型 | `str`，即排序后的字符串 |\n| value 类型 | `List[str]`，所有互为异位词的字符串集合 |\n| 默认值 | `list`（首次访问时自动创建空列表） |\n\n**为什么用 defaultdict(list)？**\n\n普通 `dict` 在 `groups[key].append(s)` 时，如果 `key` 不存在会抛 `KeyError`。\n`defaultdict(list)` 会在第一次访问不存在的 key 时**自动创建一个空列表**，代码更简洁。\n\n> 备选方案：用 `set()` 替代 `list()` 也能去重，但题目要求保留原字符串的顺序和重复，本题使用 `list`。"
visualizationType = "map-create"
visualizationData = { mapContents = "{}", arrayState = "[\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]", currentIndex = -1 }

# ── Step 3: 遍历分组 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历分组"
titleEn = "Iterate and Group"
code = """# 字母异位词分组
# 给定一个字符串数组 strs，把所有字母异位词（anagram）分到同一组。
# 字母异位词: 由相同字符以相同数量重新排列形成的字符串。
#
# 示例:
#   输入: ["eat","tea","tan","ate","nat","bat"]
#   输出: [["bat"],["nat","tan"],["ate","eat","tea"]]
#
# 返回的顺序不重要，只要同一组内的字符串互为字母异位词即可。

from typing import List
from collections import defaultdict

def groupAnagrams(strs: List[str]) -> List[List[str]]:
    \"\"\"把字符串数组中互为字母异位词的字符串分到同一组。\"\"\"
    groups = defaultdict(list)  # key: 排序后的字符串; value: 原字符串列表
    for s in strs:
        key = ''.join(sorted(s))  # 排序后的字符串作为签名 key
        groups[key].append(s)"""
explanation = "**第 3 步：遍历每个字符串，按签名 key 归组**\n\n```python\nfor s in strs:\n    key = ''.join(sorted(s))\n    groups[key].append(s)\n```\n\n**三步操作**\n\n1. `sorted(s)`：把字符串按字符排序，例如 `\"eat\"` → `['a','e','t']`\n2. `''.join(...)`：把字符列表拼回字符串 `\"aet\"`\n3. `groups[key].append(s)`：把**原字符串**（不是 key）追加到对应组\n\n**示例执行追踪**\n\n| i | s | sorted(s) | key | groups 状态 |\n|---|------|-----------|---------|-------------|\n| 0 | \"eat\" | a,e,t | `\"aet\"` | `{aet → [eat]}` |\n| 1 | \"tea\" | a,e,t | `\"aet\"` | `{aet → [eat, tea]}` |\n| 2 | \"tan\" | a,n,t | `\"ant\"` | `{aet → [eat, tea], ant → [tan]}` |\n| 3 | \"ate\" | a,e,t | `\"aet\"` | `{aet → [eat, tea, ate], ant → [tan]}` |\n| 4 | \"nat\" | a,n,t | `\"ant\"` | `{aet → [eat, tea, ate], ant → [tan, nat]}` |\n| 5 | \"bat\" | a,b,t | `\"abt\"` | `{aet → [...], ant → [...], abt → [bat]}` |\n\n> 异位词因为排序结果相同，会自动归到同一个 key 下的列表。"
visualizationType = "array-iteration"
visualizationData = { mapContents = "{aet → [eat, tea, ate], ant → [tan, nat], abt → [bat]}", arrayState = "[\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]", currentIndex = 5 }

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 字母异位词分组
# 给定一个字符串数组 strs，把所有字母异位词（anagram）分到同一组。
# 字母异位词: 由相同字符以相同数量重新排列形成的字符串。
#
# 示例:
#   输入: ["eat","tea","tan","ate","nat","bat"]
#   输出: [["bat"],["nat","tan"],["ate","eat","tea"]]
#
# 返回的顺序不重要，只要同一组内的字符串互为字母异位词即可。

from typing import List
from collections import defaultdict

def groupAnagrams(strs: List[str]) -> List[List[str]]:
    \"\"\"把字符串数组中互为字母异位词的字符串分到同一组。\"\"\"
    groups = defaultdict(list)  # key: 排序后的字符串; value: 原字符串列表
    for s in strs:
        key = ''.join(sorted(s))  # 排序后的字符串作为签名 key
        groups[key].append(s)
    return list(groups.values())"""
explanation = "**最终结果**\n\n返回 `groups.values()` 的列表形式，即所有分组。\n\n```\n输入: [\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"]\n输出: [[\"bat\"], [\"nat\",\"tan\"], [\"ate\",\"eat\",\"tea\"]]  （顺序不固定）\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n · k log k) — 每个字符串排序 O(k log k)，共 n 个 |\n| 空间复杂度 | O(n · k) — 哈希表存储所有原字符串 |\n\n> `n` 是字符串数量，`k` 是字符串平均长度。\n\n**关键技巧：排序签名**\n\n- **异位词本质**：字符种类 + 频次完全相同\n- **规范化签名**：排序后字符串天然唯一标识一个异位词集合\n- **defaultdict(list)**：避免手动判空，让代码更紧凑\n\n**进阶优化**\n\n如果对时间复杂度要求更严格，可以用**字符计数元组**作 key：\n\n```python\nfrom collections import Counter\nkey = tuple(sorted(Counter(s).items()))  # O(k)，省去排序的 log k\n```\n\n此时时间复杂度降至 **O(n · k)**。"
visualizationType = "result"
visualizationData = { mapContents = "{aet → [eat, tea, ate], ant → [tan, nat], abt → [bat]}", arrayState = "[\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]", result = "[[\"bat\"],[\"nat\",\"tan\"],[\"ate\",\"eat\",\"tea\"]]", highlightedIndices = [0, 1, 2, 3, 4, 5] }

[algorithm.summary]
timeComplexity = "O(n · k log k)"
spaceComplexity = "O(n · k)"
approach = "排序签名 + 哈希表分组"
keyInsight = "异位词排序后字符串相同，把它作为 defaultdict 的 key 即可自动归组"