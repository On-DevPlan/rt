# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 字母异位词分组
# 给定一个字符串数组 strs，把所有字母异位词（anagram）分到同一组。
# 字母异位词: 由相同字符以相同数量重新排列形成的字符串。
#
# 示例:
#   输入: ["eat","tea","tan","ate","nat","bat"]
#   输出: [["bat"],["nat","tan"],["ate","eat","tea"]]
#
# 返回的顺序不重要，只要同一组内的字符串互为字母异位词即可。"""
explanation = "**问题分析**\n\n把字符串数组中**互为字母异位词**的字符串分到同一组。\n\n**字母异位词定义**\n\n> 两个字符串包含**相同的字符**，且**每个字符的出现次数相同**。\n\n例如：\n- `\"eat\"`、`\"tea\"`、`\"ate\"` 互为字母异位词（都包含 1 个 `a`、1 个 `e`、1 个 `t`）\n- `\"nat\"`、`\"tan\"` 互为字母异位词（都包含 1 个 `a`、1 个 `n`、1 个 `t`）\n- `\"bat\"` 单独一组\n\n**核心思路：寻找「签名 key」**\n\n两个字符串是异位词 ⇔ 它们有相同的「规范化表示」：\n\n| key 方案 | 构造方式 | 时间 |\n|---------|---------|------|\n| 排序后的字符串 | `''.join(sorted(s))` | O(k log k) |\n| 字符计数元组 | `tuple(sorted(Counter(s).items()))` | O(k) |\n\n> 其中 `k` 是字符串平均长度。本题采用排序方案作为示例，思路更直观。"
visualizationType = "intro"

