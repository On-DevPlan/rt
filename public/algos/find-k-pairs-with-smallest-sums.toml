explanation = "**第 2 步：初始化最小堆**\n\n将 `(nums1[i] + nums2[0], i, 0)` 入堆，其中：\n- `nums1[i] + nums2[0]`：对的和（堆排序依据）\n- `i`：nums1 中的索引\n- `0`：nums2 中的索引（初始都指向第一个元素）\n\n**为什么只取 `min(len(nums1), k)` 个？**\n\n```\nnums1 = [1, 7, 11], k = 2\n\n只取前 2 个：(1+2,0,0), (7+2,1,0)\n堆大小 = 2，而不是 3\n```\n\n> 因为最多只需要 `k` 对结果，初始化时只放入 `nums1` 的前 `k` 个元素即可，避免不必要的堆操作。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ─────────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "提取堆顶并扩展"
titleEn = "Extract and Expand"
code = """# 373. 查找和最小的 K 对数字
# 给定两个升序数组 nums1 和 nums2，以及整数 k
# 返回和最小的 k 对数字 (u, v)，其中 u 来自 nums1，v 来自 nums2
#
# 关键观察:
#   nums1 和 nums2 都升序 → (nums1[i], nums2[0]) 的和是递增的
#   初始化堆为 (nums1[i] + nums2[0], i, 0)，i 从 0 开始
#   每次取堆顶，然后将 (i, j+1) 入堆（如果 j+1 < len(nums2)）
#
# 示例:
#   nums1 = [1,7,11], nums2 = [2,4,6], k = 3
#   初始化堆: [(1+2,0,0), (7+2,1,0), (11+2,2,0)] = [(3,0,0), (9,1,0), (13,2,0)]
#   取堆顶 (3,0,0) → [1,2]，推入 (1+4,0,1) = (5,0,1)
#   取堆顶 (5,0,1) → [1,4]，推入 (1+6,0,2) = (7,0,2)
#   取堆顶 (7,0,2) → [1,6]，j+1 = 3 >= len(nums2)，不推入
#   结果: [[1,2],[1,4],[1,6]]

import heapq
from typing import List

def kSmallestPairs(nums1: List[int], nums2: List[int], k: int) -> List[List[int]]:
    \"\"\"返回和最小的 k 对数字。\"\"\"
    if not nums1 or not nums2:
        return []
    heap = [(nums1[i] + nums2[0], i, 0) for i in range(min(len(nums1), k))]
    heapq.heapify(heap)
    result = []

    while heap and len(result) < k:
        _, i, j = heapq.heappop(heap)
        result.append([nums1[i], nums2[j]])"""
explanation = "**第 3 步：提取最小对并添加到结果**\n\n**循环条件**\n\n```python\nwhile heap and len(result) < k:\n```\n\n| 条件 | 含义 |\n|------|------|\n| `heap` | 堆非空 |\n| `len(result) < k` | 还未取够 k 对 |\n\n**每次迭代：**\n\n1. `heapq.heappop(heap)`：取出和最小的对\n2. `result.append([nums1[i], nums2[j]])`：添加到结果\n\n**示例执行：**\n\n```\n初始堆: [(3,0,0), (9,1,0), (13,2,0)]\n\n第 1 次循环:\n  heappop → (3,0,0)\n  result = [[1,2]]\n\n第 2 次循环:\n  heappop → (5,0,1)  （如果在步骤 4 推入了）\n  result = [[1,2], [1,4]]\n```"
visualizationType = "code-only"

# ── Step 4: 扩展下一元素 ─────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "推入下一个候选"
titleEn = "Push Next Candidate"
code = """# 373. 查找和最小的 K 对数字
# 给定两个升序数组 nums1 和 nums2，以及整数 k
# 返回和最小的 k 对数字 (u, v)，其中 u 来自 nums1，v 来自 nums2
#
# 关键观察:
#   nums1 和 nums2 都升序 → (nums1[i], nums2[0]) 的和是递增的
#   初始化堆为 (nums1[i] + nums2[0], i, 0)，i 从 0 开始
#   每次取堆顶，然后将 (i, j+1) 入堆（如果 j+1 < len(nums2)）
#
# 示例:
#   nums1 = [1,7,11], nums2 = [2,4,6], k = 3
#   初始化堆: [(1+2,0,0), (7+2,1,0), (11+2,2,0)] = [(3,0,0), (9,1,0), (13,2,0)]
#   取堆顶 (3,0,0) → [1,2]，推入 (1+4,0,1) = (5,0,1)
#   取堆顶 (5,0,1) → [1,4]，推入 (1+6,0,2) = (7,0,2)
#   取堆顶 (7,0,2) → [1,6]，j+1 = 3 >= len(nums2)，不推入
#   结果: [[1,2],[1,4],[1,6]]

import heapq
from typing import List

def kSmallestPairs(nums1: List[int], nums2: List[int], k: int) -> List[List[int]]:
    \"\"\"返回和最小的 k 对数字。\"\"\"
    if not nums1 or not nums2:
        return []
    heap = [(nums1[i] + nums2[0], i, 0) for i in range(min(len(nums1), k))]
    heapq.heapify(heap)
    result = []

    while heap and len(result) < k:
        _, i, j = heapq.heappop(heap)
        result.append([nums1[i], nums2[j]])
        if j + 1 < len(nums2):
            heapq.heappush(heap, (nums1[i] + nums2[j + 1], i, j + 1))"""
explanation = "**第 4 步：推入下一个候选对**\n\n取出 `(i, j)` 后，推入 `(i, j+1)` 作为候选。\n\n**条件检查：**\n\n```python\nif j + 1 < len(nums2):\n    heapq.heappush(heap, (nums1[i] + nums2[j + 1], i, j + 1))\n```\n\n| 条件 | 含义 |\n|------|------|\n| `j + 1 < len(nums2)` | nums2 中还有下一个元素 |\n\n**完整执行流程：**\n\n```\nnums1 = [1,7,11], nums2 = [2,4,6], k = 3\n\n初始化堆:\n  [(1+2,0,0), (7+2,1,0), (11+2,2,0)]\n  = [(3,0,0), (9,1,0), (13,2,0)]\n\n第 1 次循环:\n  heappop → (3,0,0)\n  result = [[1,2]]\n  j+1=1 < 3 → push (1+4,0,1) = (5,0,1)\n  堆: [(5,0,1), (9,1,0), (13,2,0)]\n\n第 2 次循环:\n  heappop → (5,0,1)\n  result = [[1,2],[1,4]]\n  j+1=2 < 3 → push (1+6,0,2) = (7,0,2)\n  堆: [(7,0,2), (9,1,0), (13,2,0)]\n\n第 3 次循环:\n  heappop → (7,0,2)\n  result = [[1,2],[1,4],[1,6]]\n  j+1=3 >= 3 → 不推入\n  len(result)=3 >= k → 循环结束\n```"
visualizationType = "code-only"

# ── Step 5: 完成 ──────────────────────────────────────────────────
[[algorithm.steps]]
id = 5
title = "完成"
titleEn = "Complete"
code = """# 373. 查找和最小的 K 对数字
# 给定两个升序数组 nums1 和 nums2，以及整数 k
# 返回和最小的 k 对数字 (u, v)，其中 u 来自 nums1，v 来自 nums2
#
# 关键观察:
#   nums1 和 nums2 都升序 → (nums1[i], nums2[0]) 的和是递增的
#   初始化堆为 (nums1[i] + nums2[0], i, 0)，i 从 0 开始
#   每次取堆顶，然后将 (i, j+1) 入堆（如果 j+1 < len(nums2)）
#
# 示例:
#   nums1 = [1,7,11], nums2 = [2,4,6], k = 3
#   初始化堆: [(1+2,0,0), (7+2,1,0), (11+2,2,0)] = [(3,0,0), (9,1,0), (13,2,0)]
#   取堆顶 (3,0,0) → [1,2]，推入 (1+4,0,1) = (5,0,1)
#   取堆顶 (5,0,1) → [1,4]，推入 (1+6,0,2) = (7,0,2)
#   取堆顶 (7,0,2) → [1,6]，j+1 = 3 >= len(nums2)，不推入
#   结果: [[1,2],[1,4],[1,6]]

import heapq
from typing import List

def kSmallestPairs(nums1: List[int], nums2: List[int], k: int) -> List[List[int]]:
    \"\"\"返回和最小的 k 对数字。\"\"\"
    if not nums1 or not nums2:
        return []
    heap = [(nums1[i] + nums2[0], i, 0) for i in range(min(len(nums1), k))]
    heapq.heapify(heap)
    result = []

    while heap and len(result) < k:
        _, i, j = heapq.heappop(heap)
        result.append([nums1[i], nums2[j]])
        if j + 1 < len(nums2):
            heapq.heappush(heap, (nums1[i] + nums2[j + 1], i, j + 1))

    return result"""
explanation = "**最终结果**\n\n✅ 完整最小堆解法\n\n```\n输入: nums1 = [1,7,11], nums2 = [2,4,6], k = 3\n输出: [[1,2], [1,4], [1,6]]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(k log k) — 堆操作 O(log k)，最多 k 次 |\n| 空间复杂度 | O(k) — 堆最多存储 k 个元素 |\n\n**核心要点**\n\n1. **初始化策略**：只取 `min(len(nums1), k)` 个元素，避免不必要的堆空间\n2. **扩展策略**：每次推入 `(i, j+1)`，利用数组有序性保证扩展顺序正确\n3. **终止条件**：堆空或取够 `k` 对\n\n> 为什么这样设计？因为 `nums1` 和 `nums2` 都升序，所以 `(nums1[i], nums2[j])` 的和随 `j` 增加而单调递增。每次扩展同一行的下一列，堆自然维护全局最小和。"
visualizationType = "result"
