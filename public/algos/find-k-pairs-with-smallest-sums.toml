# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 373. 查找和最小的 K 对数字
# 给定两个升序数组 nums1 和 nums2，以及整数 k
# 返回和最小的 k 对数字 (u, v)，其中 u 来自 nums1，v 来自 nums2
#
# 关键观察:
#   nums1 和 nums2 都升序 → (nums1[i], nums2[0]) 的和是递增的
#   初始化堆为 (nums1[i] + nums2[0], i, 0)，i 从 0 开始
#   每次取堆顶，然后将 (i, j+1) 入堆（如果 j+1 < len(nums2)）
#
# 示例:
#   nums1 = [1,7,11], nums2 = [2,4,6], k = 3
#   初始化堆: [(1+2,0,0), (7+2,1,0), (11+2,2,0)] = [(3,0,0), (9,1,0), (13,2,0)]
#   取堆顶 (3,0,0) → [1,2]，推入 (1+4,0,1) = (5,0,1)
#   取堆顶 (5,0,1) → [1,4]，推入 (1+6,0,2) = (7,0,2)
#   取堆顶 (7,0,2) → [1,6]，j+1 = 3 >= len(nums2)，不推入
#   结果: [[1,2],[1,4],[1,6]]"""
explanation = "**问题分析**\n\n给定两个升序数组 `nums1` 和 `nums2`，找出和最小的 `k` 对数字。\n\n**示例理解：**\n\n```\nnums1 = [1, 7, 11]\nnums2 = [2, 4, 6]\nk = 3\n\n所有组合：\n1+2=3  → [1,2]\n1+4=5  → [1,4]\n1+6=7  → [1,6]\n7+2=9  → [7,2]\n...\n\n和最小的 3 对：[[1,2], [1,4], [1,6]]\n```\n\n**核心思路：最小堆**\n\n| 传统方法 | 最小堆方法 |\n|---------|-----------|\n| 暴力枚举 O(m×n) | 只扩展必要元素 O(k log k) |\n| 全排序 O(mn log mn) | 堆自动有序 |\n\n> 关键洞察：`nums1` 和 `nums2` 都升序，所以 `(nums1[i], nums2[0])` 的和是递增的。初始化堆为这些候选对，每次取堆顶后推入同行的下一个元素。"
visualizationType = "intro"

