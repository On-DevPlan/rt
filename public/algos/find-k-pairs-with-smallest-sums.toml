[[algorithm.steps]]
id = 2
title = "初始化最小堆"
titleEn = "Initialize Heap"
code = """# 373. 查找和最小的 K 对数字
# 给定两个升序数组 nums1 和 nums2，以及整数 k
# 返回和最小的 k 对数字 (u, v)，其中 u 来自 nums1，v 来自 nums2
#
# 关键观察:
#   nums1 和 nums2 都升序 → (nums1[i], nums2[0]) 的和是递增的
#   初始化堆为 (nums1[i] + nums2[0], i, 0)，i 从 0 开始
#   每次取堆顶，然后将 (i, j+1) 入堆（如果 j+1 < len(nums2)）
#
# 示例:
#   nums1 = [1,7,11], nums2 = [2,4,6], k = 3
#   初始化堆: [(1+2,0,0), (7+2,1,0), (11+2,2,0)] = [(3,0,0), (9,1,0), (13,2,0)]
#   取堆顶 (3,0,0) → [1,2]，推入 (1+4,0,1) = (5,0,1)
#   取堆顶 (5,0,1) → [1,4]，推入 (1+6,0,2) = (7,0,2)
#   取堆顶 (7,0,2) → [1,6]，j+1 = 3 >= len(nums2)，不推入
#   结果: [[1,2],[1,4],[1,6]]

import heapq
from typing import List

def kSmallestPairs(nums1: List[int], nums2: List[int], k: int) -> List[List[int]]:
    \"\"\"返回和最小的 k 对数字。\"\"\"
    if not nums1 or not nums2:
        return []
    heap = [(nums1[i] + nums2[0], i, 0) for i in range(min(len(nums1), k))]
    heapq.heapify(heap)
