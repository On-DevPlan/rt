# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 102. 二叉树的层序遍历
# 给定二叉树的根节点 root，返回其节点值的层序遍历
# 即逐层地，从左到右访问所有节点，每层节点值打包为一个子列表
#
# 示例:
#   root = [3, 9, 20, null, null, 15, 7]
#
#   树形结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   期望输出: [[3], [9, 20], [15, 7]]"""
explanation = "**问题分析**\n\n输入是二叉树的根节点 `root`，输出是按层组织的节点值列表：\n\n| 层 | 节点 | 子列表 |\n|----|------|--------|\n| 0 | 3 | `[3]` |\n| 1 | 9, 20 | `[9, 20]` |\n| 2 | 15, 7 | `[15, 7]` |\n\n**关键思路：BFS 层序 + 每层收集**\n\n> 用队列做 BFS 天然按层访问。难点是：**怎么把同一层的节点打包到同一个子列表？**\n>\n> 解法：进入下一层之前，用 `size = len(q)` 记录当前层节点数，循环恰好 `size` 次弹完本层，同时把所有子节点入队。这样 `size` 次循环内的所有节点值就是同一层。\n\n**复杂度预估**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点恰好入队出队一次 |\n| 空间复杂度 | O(w) — `w` 为最大层宽（队列峰值长度） |"
visualizationType = "intro"

# ── Step 1: 函数签名 + TreeNode + 边界 ──────────────────────
[[algorithm.steps]]
id = 1
title = "签名与边界"
titleEn = "Signature and Edge Case"
code = """# 102. 二叉树的层序遍历
# 给定二叉树的根节点 root，返回其节点值的层序遍历
# 即逐层地，从左到右访问所有节点，每层节点值打包为一个子列表
#
# 示例:
#   root = [3, 9, 20, null, null, 15, 7]
#
#   树形结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   期望输出: [[3], [9, 20], [15, 7]]

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def levelOrder(root: Optional[TreeNode]) -> List[List[int]]:
    \"\"\"返回二叉树的层序遍历（每层一个子列表）\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    return res"""
explanation = "**第 1 步：定义数据结构 + 边界处理**\n\n- `TreeNode`：标准二叉树节点（`val`、`left`、`right`）\n- `levelOrder(root)`：返回 `List[List[int]]`\n- **边界**：空树直接返回 `[]`\n- 初始化 `res` 收集每层子列表，`q = deque([root])` 放入根节点\n\n> 用 `deque` 是因为 `popleft()` 是 O(1)，比 `list.pop(0)` 快得多。"
visualizationType = "code-only"

# ── Step 2: while 循环 + size + level + 收集 ─────────────────
[[algorithm.steps]]
id = 2
title = "按层切片"
titleEn = "Slice by Level"
code = """# 102. 二叉树的层序遍历
# 给定二叉树的根节点 root，返回其节点值的层序遍历
# 即逐层地，从左到右访问所有节点，每层节点值打包为一个子列表
#
# 示例:
#   root = [3, 9, 20, null, null, 15, 7]
#
#   树形结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   期望输出: [[3], [9, 20], [15, 7]]

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def levelOrder(root: Optional[TreeNode]) -> List[List[int]]:
    \"\"\"返回二叉树的层序遍历（每层一个子列表）\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    while q:
        size = len(q)
        level = []
        for _ in range(size):
            node = q.popleft()
            level.append(node.val)
            if node.left:
                q.append(node.left)
            if node.right:
                q.append(node.right)
    return res"""
explanation = "**第 2 步：核心循环结构**\n\n```python\nwhile q:\n    size = len(q)        # 当前层节点数（关键！）\n    level = []           # 收集本层所有节点值\n    for _ in range(size):\n        node = q.popleft()\n        level.append(node.val)\n        if node.left:  q.append(node.left)\n        if node.right: q.append(node.right)\n```\n\n**为什么需要 `size`？**\n\n进入 `while` 时队列里装着「当前层 + 下一层」的混合节点。\n- `size = len(q)` 在循环开始时**快照**当前层节点数\n- 接下来的 `for _ in range(size)` 只处理这 `size` 个本层节点\n- 处理过程中把子节点入队，恰好不会影响本轮循环次数\n\n| 时刻 | 队列内容 | size |\n|------|----------|------|\n| 初始 | `[3]` | 1 |\n| 第 1 轮后 | `[9, 20]` | 2 |\n| 第 2 轮后 | `[15, 7]` | 2 |\n| 第 3 轮后 | `[]` | 0 → 退出 |"
visualizationType = "code-only"

# ── Step 3: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "完成"
titleEn = "Complete"
code = """# 102. 二叉树的层序遍历
# 给定二叉树的根节点 root，返回其节点值的层序遍历
# 即逐层地，从左到右访问所有节点，每层节点值打包为一个子列表
#
# 示例:
#   root = [3, 9, 20, null, null, 15, 7]
#
#   树形结构:
#         3
#        / \\
#       9   20
#          /  \\
#         15    7
#
#   期望输出: [[3], [9, 20], [15, 7]]

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def levelOrder(root: Optional[TreeNode]) -> List[List[int]]:
    \"\"\"返回二叉树的层序遍历（每层一个子列表）\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    while q:
        size = len(q)
        level = []
        for _ in range(size):
            node = q.popleft()
            level.append(node.val)
            if node.left:
                q.append(node.left)
            if node.right:
                q.append(node.right)
        res.append(level)
    return res"""
explanation = "**最终结果**\n\n✅ BFS 层序遍历完成\n\n```\n输入: root = [3,9,20,null,null,15,7]\n输出: [[3], [9, 20], [15, 7]]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点恰好入队、出队一次 |\n| 空间复杂度 | O(w) — `w` 为最大层宽，即队列峰值长度 |\n\n**核心要点回顾**\n\n- **BFS 天然按层访问**：队列是 FIFO，先入队的先处理 → 父节点先于子节点 → 同层按入队顺序处理\n- **`size` 切片每层**：进入下一层前快照 `len(q)`，确保 `for` 循环只跑本层节点数\n- **每层打包子列表**：临时 `level` 列表收集本层所有 `val`，循环结束 `res.append(level)`\n\n**易错点**\n\n- ❌ 用 `len(q)` 在 `for` 循环里读取（会随 `popleft` 变化）→ 必须先存到 `size`\n- ❌ 用 `list.pop(0)` 代替 `deque.popleft()` → O(n) 退化\n- ❌ 忘记处理 `None` 子节点 → `if node.left` 守卫是必需的"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[[3], [9, 20], [15, 7]]", result = "[[3], [9, 20], [15, 7]]", highlightedIndices = [0, 1, 2, 3, 4] }

