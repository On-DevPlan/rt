# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 230. 二叉搜索树中第 K 小的元素
# 给定一个 BST 的根节点 root，和一个整数 k
# 请返回树中按升序排列的第 k 小的元素值
#
# BST 性质:
#   左子树所有节点 < 根节点 < 右子树所有节点
#
# 示例:
#   root = [3, 1, 4, null, 2], k = 1
#   中序遍历: 1 → 2 → 3 → 4
#   第 1 小的元素: 1"""
explanation = "**问题重述**\n\n给定一棵二叉搜索树（BST）的根节点 `root` 和一个整数 `k`，返回树中按节点值升序排列后的第 `k` 小元素。\n\n**输入与输出**\n\n- 输入：`root`（BST 根节点）、`k`（`1 <= k <= 节点总数`）\n- 输出：第 `k` 小的节点值\n- 边界：`k = 1` 返回最小值；`k = 节点总数` 返回最大值；BST 中不存在值相等的节点（或按题目约定处理）\n\n**示例走查**\n\n给定 `root = [3,1,4,null,2]`，`k = 1`：\n\n```\n        3\n       / \\\n      1   4\n       \\\n        2\n```\n\n按照 BST 中序遍历（左 → 根 → 右）访问顺序为：`1 → 2 → 3 → 4`。\n\n| k | 第 k 小 |\n|---|---------|\n| 1 | 1 |\n| 2 | 2 |\n| 3 | 3 |\n| 4 | 4 |\n\n因此 `k = 1` 时答案是 `1`。\n\n**关键洞察**\n\nBST 的中序遍历天然产生升序序列。因此「找第 `k` 小」等价于「中序遍历时第 `k` 个访问到的节点」。配合计数器，可以在找到答案后立即剪枝，不必遍历整棵树。\n\n**方法预览**\n\n| 项目 | 内容 |\n|------|------|\n| 算法 | BST 中序遍历 + 计数器 |\n| 时间复杂度 | O(h + k)，最坏 O(n) |\n| 空间复杂度 | O(h)，递归栈深度 |\n| 核心技巧 | `cnt` 记录访问次序，`cnt == k` 时记录答案并立即返回 |"
visualizationType = "intro"

# ── Step 1: 函数签名 + 全局变量 + 嵌套函数定义 ──────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 230. 二叉搜索树中第 K 小的元素
# 给定一个 BST 的根节点 root，和一个整数 k
# 请返回树中按升序排列的第 k 小的元素值
#
# BST 性质:
#   左子树所有节点 < 根节点 < 右子树所有节点
#
# 示例:
#   root = [3, 1, 4, null, 2], k = 1
#   中序遍历: 1 → 2 → 3 → 4
#   第 1 小的元素: 1

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def kthSmallest(root: Optional[TreeNode], k: int) -> int:
    \"\"\"返回 BST 中升序第 k 小的元素\"\"\"
    cnt = 0
    ans = 0
    def inorder(node: Optional[TreeNode]) -> None:
        nonlocal cnt, ans
        if not node or cnt >= k:
            return"""
explanation = "**第 1 步：搭建框架**\n\n- 定义 `TreeNode` 节点结构（`val`、`left`、`right`）\n- `kthSmallest` 是入口函数，返回 `int`\n- 用 `cnt` 记录已访问节点数，`ans` 存最终答案\n- 嵌套函数 `inorder` 负责中序遍历，通过 `nonlocal` 修改外层变量\n\n**递归基线（base case）：**\n\n| 条件 | 含义 |\n|------|------|\n| `not node` | 空节点：跳过 |\n| `cnt >= k` | 已找到答案：剪枝 |\n\n> 第二个条件是**提前剪枝**的关键，找到答案后不再继续遍历。"
visualizationType = "code-only"

# ── Step 2: 遍历左子树 + 计数 ────────────────────────────────
[[algorithm.steps]]
id = 2
title = "遍历左子树"
titleEn = "Traverse Left Subtree"
code = """# 230. 二叉搜索树中第 K 小的元素
# 给定一个 BST 的根节点 root，和一个整数 k
# 请返回树中按升序排列的第 k 小的元素值
#
# BST 性质:
#   左子树所有节点 < 根节点 < 右子树所有节点
#
# 示例:
#   root = [3, 1, 4, null, 2], k = 1
#   中序遍历: 1 → 2 → 3 → 4
#   第 1 小的元素: 1

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def kthSmallest(root: Optional[TreeNode], k: int) -> int:
    \"\"\"返回 BST 中升序第 k 小的元素\"\"\"
    cnt = 0
    ans = 0
    def inorder(node: Optional[TreeNode]) -> None:
        nonlocal cnt, ans
        if not node or cnt >= k:
            return
        inorder(node.left)
        cnt += 1"""
explanation = "**第 2 步：左 → 计数**\n\n中序遍历的标准顺序是 **左 → 根 → 右**：\n\n1. `inorder(node.left)` — 先递归遍历左子树（左子树所有值都更小）\n2. `cnt += 1` — 访问完左子树后，根节点是第 `cnt` 个访问到的节点\n\n**为什么先访问左子树？**\n\n- BST 性质：`左 < 根 < 右`\n- 中序遍历左子树会得到所有比当前节点小的值\n- 所以第 `cnt` 次访问到的节点，就是升序第 `cnt` 小的节点\n\n> `cnt` 从 0 开始，第一次访问根节点时变为 1。"
visualizationType = "code-only"

# ── Step 3: 判定 + 遍历右子树 ────────────────────────────────
[[algorithm.steps]]
id = 3
title = "判定与剪枝"
titleEn = "Check and Prune"
code = """# 230. 二叉搜索树中第 K 小的元素
# 给定一个 BST 的根节点 root，和一个整数 k
# 请返回树中按升序排列的第 k 小的元素值
#
# BST 性质:
#   左子树所有节点 < 根节点 < 右子树所有节点
#
# 示例:
#   root = [3, 1, 4, null, 2], k = 1
#   中序遍历: 1 → 2 → 3 → 4
#   第 1 小的元素: 1

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def kthSmallest(root: Optional[TreeNode], k: int) -> int:
    \"\"\"返回 BST 中升序第 k 小的元素\"\"\"
    cnt = 0
    ans = 0
    def inorder(node: Optional[TreeNode]) -> None:
        nonlocal cnt, ans
        if not node or cnt >= k:
            return
        inorder(node.left)
        cnt += 1
        if cnt == k:
            ans = node.val
            return
        inorder(node.right)"""
explanation = "**第 3 步：判定答案 + 遍历右子树**\n\n访问完根节点后做两件事：\n\n**判定**：`if cnt == k: ans = node.val; return`\n\n- 当前节点是第 `cnt` 个访问到的，正好等于 `k`\n- 记录答案到 `ans`，**立即 `return`** 触发剪枝\n- 后续节点不会被访问\n\n**继续**：`inorder(node.right)`\n\n- 若 `cnt < k`，递归遍历右子树\n- 右子树所有节点都比当前根大，自然对应升序序列的后续部分\n\n**执行示例（k=1）：**\n\n```\ninorder(3)\n  inorder(1)\n    inorder(null)  → cnt=0\n    cnt=1, cnt==k? 是 → ans=1, return ✓\n  return（剪枝）\ninorder(4)  → 不再执行\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 230. 二叉搜索树中第 K 小的元素
# 给定一个 BST 的根节点 root，和一个整数 k
# 请返回树中按升序排列的第 k 小的元素值
#
# BST 性质:
#   左子树所有节点 < 根节点 < 右子树所有节点
#
# 示例:
#   root = [3, 1, 4, null, 2], k = 1
#   中序遍历: 1 → 2 → 3 → 4
#   第 1 小的元素: 1

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def kthSmallest(root: Optional[TreeNode], k: int) -> int:
    \"\"\"返回 BST 中升序第 k 小的元素\"\"\"
    cnt = 0
    ans = 0
    def inorder(node: Optional[TreeNode]) -> None:
        nonlocal cnt, ans
        if not node or cnt >= k:
            return
        inorder(node.left)
        cnt += 1
        if cnt == k:
            ans = node.val
            return
        inorder(node.right)
    inorder(root)
    return ans"""
explanation = "**最终结果**\n\n```\n输入: root = [3, 1, 4, null, 2], k = 1\n中序: 1, 2, 3, 4\n输出: 1 ✓\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(h + k)，最坏 O(n) |\n| 空间复杂度 | O(h)，递归栈深度 |\n\n> `h` 是树高。平均情况下只需访问 `k` 个节点就 return，比完整遍历省时间。\n\n**关键技巧**\n\n- **中序遍历**：把「按值找第 k 小」转化为「按访问次序找第 k 个」\n- **计数器 `cnt`**：每访问一个节点 `cnt += 1`，到 `k` 即答案\n- **剪枝 `cnt >= k`**：找到答案立刻停止，不必遍历整棵树"
visualizationType = "result"
