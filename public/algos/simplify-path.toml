# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 简化路径
# 给定一个 Unix 风格的文件绝对路径 path
# 化简为规范路径（canonical path）
#
# 规则:
#   一个点 '.'  表示当前目录，忽略
#   两个点 '..' 表示上一级目录，需回退（弹出）
#   多个连续 '/' 视为单个 '/'
#   路径始终以 '/' 开头
#   末尾不能有 '/'（根目录除外）
#
# 示例:
#   /home/                  -> /home
#   /../                    -> /
#   /home//foo/             -> /home/foo
#   /a/./b/../../c/         -> /c"""
explanation = "**问题分析**\n\n输入是一个 Unix 风格的绝对路径字符串，需要输出化简后的规范路径。\n\n**三种特殊片段：**\n\n| 片段 | 含义 | 处理方式 |\n|------|------|----------|\n| `.` | 当前目录 | 忽略 |\n| `..` | 上一级目录 | 弹出一个目录（若栈为空则不动）|\n| `''` | 连续斜杠产生的空段 | 忽略 |\n| 其他 | 目录名 | 入栈 |\n\n**核心思路：栈**\n\n- 按 `/` 分割成片段\n- 遍历片段，按规则入栈或弹栈\n- 最后用 `/` 拼接栈内目录\n\n> 这是一个经典的**栈应用**：路径回退天然契合 LIFO 语义。"
visualizationType = "intro"

