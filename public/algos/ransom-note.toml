[algorithm]
id = "ransom-note"
title = "赎金信"
titleEn = "Ransom Note"
difficulty = "easy"
tags = ["hash-table", "string", "counting"]
testCase = "ransomNote = \"aab\", magazine = \"baa\""
expectedOutput = "true"

# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 赎金信 (LeetCode 383)
# 给定一个赎金信字符串 ransomNote 和一个杂志字符串 magazine
# 判断 ransomNote 能否由 magazine 中的字符构成
#
# 约束:
#   每个字符只能使用一次
#   magazine 中的字符可以被多次使用，但每个字符只能贡献一次
#
# 示例:
#   ransomNote = "a",   magazine = "b"   -> false
#   ransomNote = "aa",  magazine = "ab"  -> false
#   ransomNote = "aa",  magazine = "aab" -> true
#   ransomNote = "aab", magazine = "baa" -> true"""
explanation = "**问题重述** — 给定赎金信字符串 ransomNote 和杂志字符串 magazine，判断 ransomNote 能否由 magazine 中的字符构成（每个字符只能使用一次）。\n\n**输入与输出**\n- 输入：ransomNote（赎金信内容），magazine（杂志内容）\n- 输出：bool — ransomNote 能否由 magazine 的字符构成\n- 边界情况：ransomNote 为空字符串时直接返回 true；magazine 为空但 ransomNote 非空时返回 false；区分大小写，每个字符只能使用一次\n\n**示例走查**（testCase: `ransomNote = \"aab\", magazine = \"baa\"`，expectedOutput: `true`）\n- 统计 magazine 中各字符：`Counter({'a': 2, 'b': 1})`\n- 遍历 ransomNote 的第一个字符 'a'：cnt['a']=2 > 0，扣减后变为 1\n- 遍历 ransomNote 的第二个字符 'a'：cnt['a']=1 > 0，扣减后变为 0\n- 遍历 ransomNote 的第三个字符 'b'：cnt['b']=1 > 0，扣减后变为 0\n- 所有字符都能被满足，最终返回 `true`\n- 若 ransomNote = \"aac\"，第三步检查 cnt['c']=0，直接返回 `false`\n\n**关键洞察**\n- 用 `Counter` 统计 magazine 的字符频率，缺失的键返回 0 而非抛出 KeyError\n- 一旦某字符 cnt[c] == 0 时又需要使用，立即返回 false（无需等到遍历完）\n- 本题字符集仅为 26 个小写字母，也可以用长度为 26 的数组代替 Counter，空间同样 O(1)\n\n**方法预览**\n- 数据结构：哈希表（Counter）或长度为 26 的数组\n- 时间复杂度：O(m + n)，m = len(ransomNote)，n = len(magazine)\n- 空间复杂度：O(1)（数组方案，字符集大小固定）"
visualizationType = "intro"

# ── Step 1: 函数签名 ──────────────────────────────────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 赎金信 (LeetCode 383)
# 给定一个赎金信字符串 ransomNote 和一个杂志字符串 magazine
# 判断 ransomNote 能否由 magazine 中的字符构成
#
# 约束:
#   每个字符只能使用一次
#   magazine 中的字符可以被多次使用，但每个字符只能贡献一次
#
# 示例:
#   ransomNote = "a",   magazine = "b"   -> false
#   ransomNote = "aa",  magazine = "ab"  -> false
#   ransomNote = "aa",  magazine = "aab" -> true
#   ransomNote = "aab", magazine = "baa" -> true

from collections import Counter

def canConstruct(ransomNote: str, magazine: str) -> bool:
    \"\"\"判断 ransomNote 能否由 magazine 构成。\"\"\"
    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 接收两个字符串：`ransomNote` 和 `magazine`\n- 返回 `bool`：能否构成\n- 导入 `Counter` 用于字符计数\n- 文档字符串描述函数用途\n- `pass` 占位，下一步填充逻辑"
visualizationType = "code-only"

# ── Step 2: 统计 magazine 字符数 ──────────────────────────────
[[algorithm.steps]]
id = 2
title = "统计字符"
titleEn = "Count Characters"
code = """# 赎金信 (LeetCode 383)
# 给定一个赎金信字符串 ransomNote 和一个杂志字符串 magazine
# 判断 ransomNote 能否由 magazine 中的字符构成
#
# 约束:
#   每个字符只能使用一次
#   magazine 中的字符可以被多次使用，但每个字符只能贡献一次
#
# 示例:
#   ransomNote = "a",   magazine = "b"   -> false
#   ransomNote = "aa",  magazine = "ab"  -> false
#   ransomNote = "aa",  magazine = "aab" -> true
#   ransomNote = "aab", magazine = "baa" -> true

from collections import Counter

def canConstruct(ransomNote: str, magazine: str) -> bool:
    \"\"\"判断 ransomNote 能否由 magazine 构成。\"\"\"
    pass
    cnt = Counter(magazine)"""
explanation = "**第 2 步：统计 magazine 中各字符数量**\n\n新增一行：\n\n```python\ncnt = Counter(magazine)\n```\n\n以 `magazine = \"baa\"` 为例：\n\n```\nCounter({'a': 2, 'b': 1})\n```\n\n| 字符 | 计数 |\n|------|------|\n| `a` | 2 |\n| `b` | 1 |\n\n> `Counter` 是 `dict` 的子类，缺失键时返回 0（不会抛 `KeyError`），非常适合此类字符统计场景。"
visualizationType = "map-create"
visualizationData = { mapContents = "{a → 2, b → 1}", arrayState = "magazine = [b, a, a]", currentIndex = -1 }

# ── Step 3: 遍历 ransomNote 扣减计数 ─────────────────────────
[[algorithm.steps]]
id = 3
title = "扣减计数"
titleEn = "Decrement Counter"
code = """# 赎金信 (LeetCode 383)
# 给定一个赎金信字符串 ransomNote 和一个杂志字符串 magazine
# 判断 ransomNote 能否由 magazine 中的字符构成
#
# 约束:
#   每个字符只能使用一次
#   magazine 中的字符可以被多次使用，但每个字符只能贡献一次
#
# 示例:
#   ransomNote = "a",   magazine = "b"   -> false
#   ransomNote = "aa",  magazine = "ab"  -> false
#   ransomNote = "aa",  magazine = "aab" -> true
#   ransomNote = "aab", magazine = "baa" -> true

from collections import Counter

def canConstruct(ransomNote: str, magazine: str) -> bool:
    \"\"\"判断 ransomNote 能否由 magazine 构成。\"\"\"
    pass
    cnt = Counter(magazine)
    for c in ransomNote:
        if cnt[c] == 0:
            return False
        cnt[c] -= 1
    return True"""
explanation = "**第 3 步：遍历 ransomNote 逐个扣减**\n\n新增核心循环：\n\n```python\nfor c in ransomNote:\n    if cnt[c] == 0:\n        return False\n    cnt[c] -= 1\nreturn True\n```\n\n执行过程（`ransomNote = \"aab\"`）：\n\n| 步骤 | 当前字符 `c` | `cnt[c]` 扣减前 | 操作 |\n|------|------------|---------------|------|\n| 1 | `a` | 2 | 2 → 1 |\n| 2 | `a` | 1 | 1 → 0 |\n| 3 | `b` | 1 | 1 → 0 |\n\n循环结束未触发 `return False`，最终返回 `True`。\n\n> 若某字符在 `magazine` 中不存在（`cnt[c] == 0`），说明无法构成，立刻返回 `false`。"
visualizationType = "result"
visualizationData = { mapContents = "{a → 0, b → 0}", arrayState = "ransomNote = [a, a, b]", result = "true", highlightedIndices = [0, 1, 2] }

[algorithm.summary]
timeComplexity = "O(m + n)"
spaceComplexity = "O(1)"
approach = "Counter 字符计数 + 遍历扣减"
keyInsight = "用 Counter 统计 magazine 字符数，遍历 ransomNote 逐个扣减，计数不足即返回 false"
