# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 单词规律 (lc290)
# 给定一种 pattern 字符串和一个字符串 s
# 判断 s 是否遵循相同的规律，即 pattern 中的字符与 s 中
# 空格分隔的单词之间是否存在一一对应（双射）关系。
#
# 示例:
#   pattern = "abba", s = "dog cat cat dog"   → true
#   pattern = "abba", s = "dog cat cat fish"  → false
#   pattern = "aaaa", s = "dog cat cat dog"   → false"""
explanation = "**问题分析**\n\n- `pattern` 是字符序列，`s` 是空格分隔的单词序列\n- 要求字符 ↔ 单词的**一一对应（双射）**：\n  - 不同字符必须映射到不同单词\n  - 同一字符必须映射到同一单词\n\n**与 lc205「同构字符串」完全相同**，只是把字符换成单词、字符串换成 `s.split()`。\n\n> 仅当 `len(pattern) == len(words)` 时才可能匹配，因此首先做长度检查。"
visualizationType = "intro"

