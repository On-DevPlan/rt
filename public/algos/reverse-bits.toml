# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "逐位颠倒"
titleEn = "Reverse Bit by Bit"
code = """# 190. 颠倒二进制位
# 颠倒给定的 32 位无符号整数的二进制位
#
# 示例:
#   输入: n = 0b00000010100101000001111010011100 (43261596)
#   输出: 0b00111001011110000010100101000000 (964176192)
#
# 二进制表示:
#   输入: 00000010100101000001111010011100
#   输出: 00111001011110000010100101000000
#           ↑                        ↑
#        第 31 位                  第 0 位

def reverseBits(n: int) -> int:
    \"\"\"返回颠倒后的整数。\"\"\"
    pass
    result = 0
    for _ in range(32):
        result = (result << 1) | (n & 1)
        n >>= 1"""
explanation = "**第 3 步：逐位颠倒**\n\n循环 32 次，每次处理一个二进制位：\n\n| 操作 | 作用 |\n|------|------|\n| `result << 1` | result 左移一位，腾出最低位空间 |\n| `n & 1` | 取 n 的最低位（0 或 1） |\n| `\\|` | 将取出的位放入 result 的最低位 |\n| `n >>= 1` | n 右移一位，准备处理下一位 |\n\n**示例执行（前 3 次）：**\n\n```\n初始: n = ...10011100, result = 0\n\n第 1 次: result = (0 << 1) | 0 = 0, n = ...01001110\n第 2 次: result = (0 << 1) | 0 = 0, n = ...00100111\n第 3 次: result = (0 << 1) | 1 = 1, n = ...00010011\n```\n\n每次迭代：\n1. `result` 左移腾出空间\n2. 取 `n` 的最低位\n3. 用 OR 操作放入 `result`\n4. `n` 右移准备下一位"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 190. 颠倒二进制位
# 颠倒给定的 32 位无符号整数的二进制位
#
# 示例:
#   输入: n = 0b00000010100101000001111010011100 (43261596)
#   输出: 0b00111001011110000010100101000000 (964176192)
#
# 二进制表示:
#   输入: 00000010100101000001111010011100
#   输出: 00111001011110000010100101000000
#           ↑                        ↑
#        第 31 位                  第 0 位

def reverseBits(n: int) -> int:
    \"\"\"返回颠倒后的整数。\"\"\"
    pass
    result = 0
    for _ in range(32):
        result = (result << 1) | (n & 1)
        n >>= 1
    return result"""
explanation = "**最终结果**\n\n✅ 逐位颠倒完成\n\n```\n输入:  43261596 = 0b00000010100101000001111010011100\n输出:  964176192 = 0b00111001011110000010100101000000\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(1) — 固定 32 次循环 |\n| 空间复杂度 | O(1) — 只用了一个变量 |\n\n**核心思想**\n\n- 每次取 `n` 的最低位（`n & 1`）\n- `result` 左移腾出空间后 OR 当前位\n- 循环 32 次，从最低位到最高位逐个处理"
