# ── Step 2: 初始化变量 ────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化变量"
titleEn = "Initialize Variables"
code = """# 跳跃游戏 II
# 给定一个长度为 n 的非负整数数组 nums
# 初始位置为 nums[0]，每个元素 nums[i] 表示在位置 i 可跳跃的最大长度
# 要求返回到达 nums[n-1] 的最小跳跃次数
#
# 假设: 总是可以到达 nums[n-1]
#
# 示例:
#   nums = [2,3,1,1,4]  →  2
#   解释: 跳到下标 1（再跳 3 步到末尾），共 2 跳

from typing import List

def jump(nums: List[int]) -> int:
    \"\"\"返回到达最后一个下标的最小跳跃次数。\"\"\"
    n = len(nums)
    end = 0      # 当前这一跳能到达的最远边界
    farthest = 0 # 下一跳能到达的最远位置
    jumps = 0    # 已执行的跳跃次数"""
explanation = "**第 2 步：定义三个核心变量**\n\n| 变量 | 含义 | 初值 |\n|------|------|------|\n| `end` | 当前这一跳的覆盖范围边界 | `0` |\n| `farthest` | 在当前范围内，下一跳能扩展到的最远位置 | `0` |\n| `jumps` | 已执行的跳跃次数 | `0` |\n\n> 类比 BFS：`end` 类似当前层的右边界，`farthest` 类似下一层的右边界。"
visualizationType = "code-only"

# ── Step 3: 主循环 ────────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历扩展"
titleEn = "Iterate and Extend"
code = """# 跳跃游戏 II
# 给定一个长度为 n 的非负整数数组 nums
# 初始位置为 nums[0]，每个元素 nums[i] 表示在位置 i 可跳跃的最大长度
# 要求返回到达 nums[n-1] 的最小跳跃次数
#
# 假设: 总是可以到达 nums[n-1]
#
# 示例:
#   nums = [2,3,1,1,4]  →  2
#   解释: 跳到下标 1（再跳 3 步到末尾），共 2 跳

from typing import List

def jump(nums: List[int]) -> int:
    \"\"\"返回到达最后一个下标的最小跳跃次数。\"\"\"
    n = len(nums)
    end = 0      # 当前这一跳能到达的最远边界
    farthest = 0 # 下一跳能到达的最远位置
    jumps = 0    # 已执行的跳跃次数

    for i in range(n - 1):
        farthest = max(farthest, i + nums[i])
        if i == end:
            jumps += 1
            end = farthest"""
explanation = "**第 3 步：遍历并扩展最远位置**\n\n循环到 `n - 1` 即可（已到达终点不需要再跳）。\n\n**关键逻辑**\n\n1. 每次进入新位置 `i`，都尝试更新 `farthest = max(farthest, i + nums[i])`\n2. 当 `i == end` 时说明**当前这一跳的覆盖范围用完了**，必须再跳一次：\n   - `jumps += 1`\n   - `end = farthest`（下一跳的边界是当前能扩展到的最远处）\n\n**示例 `nums = [2,3,1,1,4]`**\n\n```\ni=0: farthest = max(0, 0+2) = 2;  i==end(0)  → jumps=1, end=2\ni=1: farthest = max(2, 1+3) = 4;  i!=end(2)\ni=2: farthest = max(4, 2+1) = 4;  i==end(2)  → jumps=2, end=4\ni=3: farthest = max(4, 3+1) = 4;  i!=end(4)\n循环结束（i 已到 n-2）\n返回 jumps = 2\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 跳跃游戏 II
# 给定一个长度为 n 的非负整数数组 nums
# 初始位置为 nums[0]，每个元素 nums[i] 表示在位置 i 可跳跃的最大长度
# 要求返回到达 nums[n-1] 的最小跳跃次数
#
# 假设: 总是可以到达 nums[n-1]
#
# 示例:
#   nums = [2,3,1,1,4]  →  2
#   解释: 跳到下标 1（再跳 3 步到末尾），共 2 跳

from typing import List

def jump(nums: List[int]) -> int:
    \"\"\"返回到达最后一个下标的最小跳跃次数。\"\"\"
    n = len(nums)
    end = 0      # 当前这一跳能到达的最远边界
    farthest = 0 # 下一跳能到达的最远位置
    jumps = 0    # 已执行的跳跃次数

    for i in range(n - 1):
        farthest = max(farthest, i + nums[i])
        if i == end:
            jumps += 1
            end = farthest

    return jumps"""
explanation = "**最终结果**\n\n✅ 最小跳跃次数已求得\n\n```\n输入: nums = [2, 3, 1, 1, 4]\n输出: 2\n路径: 0 → 1 → 4\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 单次遍历 |\n| 空间复杂度 | O(1) — 仅用三个变量 |\n\n**为什么是贪心？**\n\n- 在当前覆盖范围内，每个位置都贡献自己的最大延伸\n- 只要当前范围被走完（`i == end`），下一跳的边界必然是**当前能跳到的最远**\n- 局部最优 → 全局最优，因此是最小跳跃次数"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[2, 3, 1, 1, 4]", result = "2", highlightedIndices = [0, 1, 4] }

