# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 跳跃游戏 II
# 给定一个长度为 n 的非负整数数组 nums
# 初始位置为 nums[0]，每个元素 nums[i] 表示在位置 i 可跳跃的最大长度
# 要求返回到达 nums[n-1] 的最小跳跃次数
#
# 假设: 总是可以到达 nums[n-1]
#
# 示例:
#   nums = [2,3,1,1,4]  →  2
#   解释: 跳到下标 1（再跳 3 步到末尾），共 2 跳"""
explanation = "**问题重述**\n\n给定一个长度为 `n` 的非负整数数组 `nums`，初始位于下标 `0`，`nums[i]` 表示从位置 `i` 最多可以向前跳跃的步数。假设一定能到达末尾，求到达 `nums[n-1]` 所需的最少跳跃次数。\n\n**输入与输出**\n\n- 输入：`nums = [2,3,1,1,4]`，长度 `n = 5`。\n- 输出：最小跳跃次数 `2`。\n- 边界：当 `n = 1` 时，已经在终点，跳跃次数为 `0`。\n\n**示例走查**\n\n以 `nums = [2,3,1,1,4]` 为例：\n\n1. 从下标 `0` 出发，`nums[0] = 2`，可以跳到 `1` 或 `2`。\n2. 选择跳到 `1`，`nums[1] = 3`，从 `1` 可以直接跳到 `4`（末尾）。\n3. 路径为 `0 → 1 → 4`，共 `2` 跳，这是最小值。\n\n**关键洞察**\n\n本题不是「能否到达」，而是「最少跳几次」。可以把每次跳跃想象成一层 BFS，在当前跳跃覆盖范围内，不断更新下一跳能到达的最远位置；当走到当前层边界时，跳跃次数加一并进入下一层。\n\n**方法预览**\n\n| 方法 | 思路 | 时间复杂度 | 空间复杂度 |\n|------|------|----------|----------|\n| 反向贪心 | 从终点往回找能一步到达当前目标的最远起点 | `O(n²)` | `O(1)` |\n| BFS 分层 | 按跳跃次数分层扩展可达区间 | `O(n)` | `O(n)` |\n| 正向贪心 | 维护当前边界 `end` 与下一跳最远 `farthest` | `O(n)` | `O(1)` |\n\n> 推荐正向贪心：只需一次遍历，在 `i == end` 时更新边界并增加跳跃次数。"
visualizationType = "intro"

