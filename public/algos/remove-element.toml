    return k"""
explanation = "**最终结果**\n\n✅ `nums = [3, 2, 2, 3]`, `val = 3` → 返回 `2`，数组前两位为 `[2, 2]`\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 一次遍历 |\n| 空间复杂度 | O(1) — 只用了两个指针 |\n\n**快慢指针技巧**\n- 适用于需要**原地筛选**的场景\n- 慢指针 `k` 标记「已确认的好元素」边界\n- 快指针 `i` 扫描整个数组做决策\n- 核心思想：**用覆盖代替删除**"
visualizationType = "result"
