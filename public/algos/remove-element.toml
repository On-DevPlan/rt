#
# 示例:
#   nums = [3, 2, 2, 3], val = 3
#   返回 2, nums 前两个元素为 [2, 2]

from typing import List

def remove_element(nums: List[int], val: int) -> int:
    \"\"\"原地移除所有等于 val 的元素，返回新长度。\"\"\"
    k = 0  # 慢指针：记录不等于 val 的元素个数"""
explanation = "**第 2 步：初始化慢指针**\n\n```\nk = 0  ← 指向待填充的位置，也表示「已确认的非 val 元素个数」\n```\n\n`k` 同时承担两个角色：\n1. **慢指针** — 指向下一个非 `val` 元素应放的位置\n2. **计数器** — 最终返回的值就是 `k`\n\n> 快指针由 `for` 循环隐式提供，不需要额外变量。"
visualizationType = "code-only"

# ── Step 3: 遍历并覆盖 ─────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历并覆盖"
titleEn = "Iterate and Overwrite"
code = """# 移除元素
# 给你一个数组 nums 和一个值 val
# 原地移除所有等于 val 的元素，返回移除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   元素的顺序可以改变
#   返回新长度 k，前 k 个元素不含 val
#
# 示例:
#   nums = [3, 2, 2, 3], val = 3
#   返回 2, nums 前两个元素为 [2, 2]

from typing import List

def remove_element(nums: List[int], val: int) -> int:
    \"\"\"原地移除所有等于 val 的元素，返回新长度。\"\"\"
    k = 0  # 慢指针：记录不等于 val 的元素个数

    for i in range(len(nums)):
        if nums[i] != val:
            nums[k] = nums[i]
            k += 1
    return k"""
explanation = "**第 3 步：快指针遍历，慢指针填充**\n\n```\nfor i in range(len(nums)):     ← i 是快指针，遍历整个数组\n    if nums[i] != val:         ← 遇到不等于 val 的元素\n        nums[k] = nums[i]      ← 将它放到 k 位置\n        k += 1                 ← k 向前移动\nreturn k                       ← k 就是新长度\n```\n\n**执行过程**（`nums = [3, 2, 2, 3]`, `val = 3`）：\n\n```\ni=0: nums[0]=3 == val → 跳过\n     nums = [3, 2, 2, 3], k=0\n\ni=1: nums[1]=2 != val → nums[0]=2, k=1\n     nums = [2, 2, 2, 3], k=1\n\ni=2: nums[2]=2 != val → nums[1]=2, k=2\n     nums = [2, 2, 2, 3], k=2\n\ni=3: nums[3]=3 == val → 跳过\n     nums = [2, 2, 2, 3], k=2\n\n返回 k=2, 前两个元素是 [2, 2] ✓\n```\n\n> 注意：`i` 总是跑在 `k` 前面，所以覆盖未处理的元素是安全的。"
visualizationType = "code-only"

