# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 移除元素
# 给你一个数组 nums 和一个值 val
# 原地移除所有等于 val 的元素，返回移除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   元素的顺序可以改变
#   返回新长度 k，前 k 个元素不含 val
#
# 示例:
#   nums = [3, 2, 2, 3], val = 3
#   返回 2, nums 前两个元素为 [2, 2]"""
explanation = "**问题分析**\n\n给定 `nums = [3, 2, 2, 3]` 和 `val = 3`：\n- 需要移除所有值为 `3` 的元素\n- 返回移除后数组的新长度 `k`\n- 前 `k` 个位置放不等于 `val` 的元素\n\n**两种常见解法**\n\n| 方法 | 时间 | 空间 | 特点 |\n|------|------|------|------|\n| 双指针（快慢） | O(n) | O(1) | 保持相对顺序 |\n| 双指针（首尾） | O(n) | O(1) | 元素少时更少移动 |\n\n> 这里用快慢指针，慢指针指向待填充位置，快指针遍历数组。"
visualizationType = "intro"

