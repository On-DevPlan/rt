# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 移除元素
# 给你一个数组 nums 和一个值 val
# 原地移除所有等于 val 的元素，返回移除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   元素的顺序可以改变
#   返回新长度 k，前 k 个元素不含 val
#
# 示例:
#   nums = [3, 2, 2, 3], val = 3
#   返回 2, nums 前两个元素为 [2, 2]"""
explanation = "**问题重述**\n\n给定一个整数数组 `nums` 和一个目标值 `val`，原地移除数组中所有等于 `val` 的元素，返回移除后数组的新长度 `k`。注意必须原地修改，不能开辟额外数组空间，且前 `k` 个元素必须不含 `val`。\n\n**输入与输出**\n\n- 输入：数组 `nums`、目标值 `val`\n- 输出：新长度 `k`，且 `nums` 的前 `k` 个元素为所有不等于 `val` 的元素\n- 边界：`nums` 为空时返回 0；所有元素都等于 `val` 时返回 0；没有元素等于 `val` 时返回原长度\n\n**示例走查**\n\n以 `nums = [3, 2, 2, 3]`、`val = 3` 为例：\n\n- `i = 0`：`nums[0] = 3` 等于 `val`，跳过\n- `i = 1`：`nums[1] = 2` 不等于 `val`，将其放到 `nums[0]`，`k` 变为 1\n- `i = 2`：`nums[2] = 2` 不等于 `val`，将其放到 `nums[1]`，`k` 变为 2\n- `i = 3`：`nums[3] = 3` 等于 `val`，跳过\n\n最终 `k = 2`，数组前两位为 `[2, 2]`，即返回 `2 (nums = [2,2,_,_])`。\n\n**关键洞察**\n\n- 不需要真正「删除」元素，用「覆盖」即可：把不等于 `val` 的元素依次写到数组前面\n- 快指针负责扫描整个数组做决策，慢指针负责指向下一个待填充位置\n- 因为快指针始终领先或等于慢指针，覆盖不会破坏尚未检查的数据\n\n**方法预览**\n\n| 项目 | 说明 |\n|------|------|\n| 算法 | 快慢指针原地覆盖 |\n| 时间复杂度 | O(n)，一次遍历 |\n| 空间复杂度 | O(1)，仅使用两个指针 |"
visualizationType = "intro"

