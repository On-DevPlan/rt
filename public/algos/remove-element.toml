titleEn = "Initialize Pointer"
code = """# 移除元素
# 给你一个数组 nums 和一个值 val
# 原地移除所有等于 val 的元素，返回移除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
