# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 173. 二叉搜索树迭代器
# 实现一个 BST 迭代器，按中序遍历顺序返回 next()
#
# 关键点:
#   next() 返回 BST 中下一个最小的数
#   hasNext() 返回是否还有元素
#   平均时间复杂度要求 O(1)，空间 O(h)
#
# 示例:
#   BST = [7, 3, 15, null, null, 9, 20]
#   中序遍历: 3, 7, 9, 15, 20
#   next() 调用依次返回 3, 7, 9, 15, 20"""
explanation = "**问题分析**\n\n**二叉搜索树（BST）迭代器**：\n\n- BST 的中序遍历结果是**升序**序列\n- 需要实现 `next()` 和 `hasNext()` 两个方法\n- 调用 `next()` 返回当前最小的元素\n- 调用 `hasNext()` 判断是否还有未访问元素\n\n**示例 BST**\n\n```\n        7\n       / \\\\\n      3   15\n         /  \\\\\n        9    20\n\n中序遍历: 3, 7, 9, 15, 20\n```\n\n**设计要求**\n\n| 指标 | 要求 |\n|------|------|\n| `next()` 平均时间 | **O(1)** |\n| `next()` 最坏时间 | O(h) |\n| 空间复杂度 | O(h) |\n| 额外条件 | 不能一次性展开为数组 |\n\n> 关键思路：受控中序遍历 + 显式栈，让 `next()` 真正做到平均 O(1)。"
visualizationType = "intro"

# ── Step 1: 函数签名 + TreeNode + 类骨架 ─────────────────────
[[algorithm.steps]]
id = 1
title = "类与签名"
titleEn = "Class & Signature"
code = """# 173. 二叉搜索树迭代器
# 实现一个 BST 迭代器，按中序遍历顺序返回 next()
#
# 关键点:
#   next() 返回 BST 中下一个最小的数
#   hasNext() 返回是否还有元素
#   平均时间复杂度要求 O(1)，空间 O(h)
#
# 示例:
#   BST = [7, 3, 15, null, null, 9, 20]
#   中序遍历: 3, 7, 9, 15, 20
#   next() 调用依次返回 3, 7, 9, 15, 20

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

class BSTIterator:
    \"\"\"BST 迭代器：中序遍历\"\"\"
    def __init__(self, root: Optional[TreeNode]):
        self.stack = []
        self._push_left(root)"""
explanation = "**第 1 步：定义类与构造函数**\n\n**TreeNode**\n\n- 标准二叉树节点结构：`val`、`left`、`right`\n\n**BSTIterator**\n\n- `self.stack`：显式栈，存储「待访问」的节点\n- 构造函数中调用 `_push_left(root)`：\n  - 把从 `root` 开始的所有左孩子依次入栈\n  - 完成后栈顶就是中序遍历的第一个节点（最小的）\n\n**示例**：对 `[7,3,15,null,null,9,20]` 调用构造函数后，栈内容为 `[7, 3]`（栈顶为 `3`）。"
visualizationType = "code-only"

# ── Step 2: 实现 _push_left 辅助方法 ─────────────────────────
[[algorithm.steps]]
id = 2
title = "推入左孩子"
titleEn = "Push Left Children"
code = """# 173. 二叉搜索树迭代器
# 实现一个 BST 迭代器，按中序遍历顺序返回 next()
#
# 关键点:
#   next() 返回 BST 中下一个最小的数
#   hasNext() 返回是否还有元素
#   平均时间复杂度要求 O(1)，空间 O(h)
#
# 示例:
#   BST = [7, 3, 15, null, null, 9, 20]
#   中序遍历: 3, 7, 9, 15, 20
#   next() 调用依次返回 3, 7, 9, 15, 20

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

class BSTIterator:
    \"\"\"BST 迭代器：中序遍历\"\"\"
    def __init__(self, root: Optional[TreeNode]):
        self.stack = []
        self._push_left(root)

    def _push_left(self, node: Optional[TreeNode]) -> None:
        while node:
            self.stack.append(node)
            node = node.left"""
explanation = "**第 2 步：实现 `_push_left` 辅助方法**\n\n**作用**：把从 `node` 开始的整条左孩子链全部入栈。\n\n**为什么需要它？**\n\n中序遍历的规则是：左 → 根 → 右。在访问一个节点前，必须先把它路径上的所有左孩子入栈。\n\n**示例调用**：`_push_left(7)`\n\n```\nstack 变化:\n[] -> [7] -> [7, 3] -> [7, 3, 3.left]\n                    (3.left 是 None, 退出 while)\n最终: stack = [7, 3], 栈顶 3 是中序遍历第一个节点\n```\n\n> 每个节点最多被 `_push_left` 入栈一次，总成本 O(n)。"
visualizationType = "code-only"

# ── Step 3: 实现 next 方法 ───────────────────────────────────
[[algorithm.steps]]
id = 3
title = "next 方法"
titleEn = "next() Method"
code = """# 173. 二叉搜索树迭代器
# 实现一个 BST 迭代器，按中序遍历顺序返回 next()
#
# 关键点:
#   next() 返回 BST 中下一个最小的数
#   hasNext() 返回是否还有元素
#   平均时间复杂度要求 O(1)，空间 O(h)
#
# 示例:
#   BST = [7, 3, 15, null, null, 9, 20]
#   中序遍历: 3, 7, 9, 15, 20
#   next() 调用依次返回 3, 7, 9, 15, 20

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

class BSTIterator:
    \"\"\"BST 迭代器：中序遍历\"\"\"
    def __init__(self, root: Optional[TreeNode]):
        self.stack = []
        self._push_left(root)

    def _push_left(self, node: Optional[TreeNode]) -> None:
        while node:
            self.stack.append(node)
            node = node.left

    def next(self) -> int:
        cur = self.stack.pop()
        self._push_left(cur.right)
        return cur.val"""
explanation = "**第 3 步：实现 `next()` 方法**\n\n**核心逻辑（三步走）**：\n\n1. **弹栈**：`cur = self.stack.pop()` —— 栈顶就是中序遍历下一个该访问的节点\n2. **推右子树左孩子**：`self._push_left(cur.right)` —— 访问完 `cur` 后，下一个最小元素一定在 `cur` 的右子树中最左的位置\n3. **返回值**：`return cur.val`\n\n**示例执行**\n\n```\n初始 stack = [7, 3]\n\nnext() ①:\n  cur = 3 弹出\n  push_left(3.right=None) -> 无变化\n  stack = [7]\n  返回 3\n\nnext() ②:\n  cur = 7 弹出\n  push_left(7.right=15) -> 15 入栈, 15.left=9 入栈, 9.left=None 停\n  stack = [15, 9]\n  返回 7\n```\n\n> 关键洞察：每次 `next()` 的栈操作总量是 O(1) 均摊。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 173. 二叉搜索树迭代器
# 实现一个 BST 迭代器，按中序遍历顺序返回 next()
#
# 关键点:
#   next() 返回 BST 中下一个最小的数
#   hasNext() 返回是否还有元素
#   平均时间复杂度要求 O(1)，空间 O(h)
#
# 示例:
#   BST = [7, 3, 15, null, null, 9, 20]
#   中序遍历: 3, 7, 9, 15, 20
#   next() 调用依次返回 3, 7, 9, 15, 20

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

class BSTIterator:
    \"\"\"BST 迭代器：中序遍历\"\"\"
    def __init__(self, root: Optional[TreeNode]):
        self.stack = []
        self._push_left(root)

    def _push_left(self, node: Optional[TreeNode]) -> None:
        while node:
            self.stack.append(node)
            node = node.left

    def next(self) -> int:
        cur = self.stack.pop()
        self._push_left(cur.right)
        return cur.val

    def hasNext(self) -> bool:
        return len(self.stack) > 0"""
explanation = "**最终结果**\n\n✅ BST 迭代器实现完成\n\n**完整执行流**\n\n```\n调用序列: next(), next(), hasNext(), next(), hasNext(), next(), next(), next()\n返回:      3,     7,     True,     9,     True,     15,    20,    异常\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| `next()` 平均时间 | **O(1)** — 摊还分析 |\n| `next()` 最坏时间 | O(h) — 单次可能走完一条左链 |\n| `hasNext()` 时间 | **O(1)** |\n| 空间复杂度 | **O(h)** — 栈最多 h 层 |\n\n**关键技巧：受控中序遍历**\n\n- 不一次性递归遍历整棵树，而是把工作分散到每次 `next()` 调用\n- 每次 `next()` 把 cur 的右子树「准备好」——把右子树的所有左孩子入栈\n- 总操作数 O(n)，但分散到 n 次 `next()`，均摊 O(1)"
