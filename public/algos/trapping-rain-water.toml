# ── Step 2: 初始化双指针与左右最高 ────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 接雨水
# 给定 n 个非负整数表示宽度为 1 的柱子的高度图
# 计算按此排列的柱子，下雨之后能接多少雨水
#
# 关键观察:
#   每个位置 i 处的积水量 = min(左侧最高, 右侧最高) - height[i]
#   只有当 height[i] < 两侧最高时才能积水
#
# 示例:
#   height = [0,1,0,2,1,0,1,3,2,1,2,1]
#   结果: 6
#
#   █         █
#   █   █ █ █ █
#   █ █ █ █ █ █ █
#   ─────────────
#   0 1 0 2 1 0 1 3 2 1 2 1

from typing import List

def trap(height: List[int]) -> int:
    \"\"\"计算柱状图能接住的雨水总量。\"\"\"
    left, right = 0, len(height) - 1  # 左右指针
    left_max = right_max = 0  # 两侧已知的最高高度
    water = 0  # 累计接住的雨水量"""
explanation = "**第 2 步：初始化双指针与状态**\n\n```\nheight: [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]\n         L                              R\n         ↑                              ↑\n        left                          right\n```\n\n| 变量 | 含义 | 初值 |\n|------|------|------|\n| `left` | 左指针 | `0` |\n| `right` | 右指针 | `len(height) - 1` |\n| `left_max` | 左侧已遍历区域的最高柱 | `0` |\n| `right_max` | 右侧已遍历区域的最高柱 | `0` |\n| `water` | 累计接住的雨水量 | `0` |\n\n> 核心思想：哪一侧最高较小，就先处理哪一侧——水位由较矮的一侧决定。"
visualizationType = "code-only"

# ── Step 3: 核心双指针循环 ────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "双指针推进"
titleEn = "Two-Pointer Sweep"
code = """# 接雨水
# 给定 n 个非负整数表示宽度为 1 的柱子的高度图
# 计算按此排列的柱子，下雨之后能接多少雨水
#
# 关键观察:
#   每个位置 i 处的积水量 = min(左侧最高, 右侧最高) - height[i]
#   只有当 height[i] < 两侧最高时才能积水
#
# 示例:
#   height = [0,1,0,2,1,0,1,3,2,1,2,1]
#   结果: 6
#
#   █         █
#   █   █ █ █ █
#   █ █ █ █ █ █ █
#   ─────────────
#   0 1 0 2 1 0 1 3 2 1 2 1

from typing import List

def trap(height: List[int]) -> int:
    \"\"\"计算柱状图能接住的雨水总量。\"\"\"
    left, right = 0, len(height) - 1  # 左右指针
    left_max = right_max = 0  # 两侧已知的最高高度
    water = 0  # 累计接住的雨水量

    while left <= right:
        if height[left] < height[right]:
            if height[left] >= left_max:
                left_max = height[left]
            else:
                water += left_max - height[left]
            left += 1
        else:
            if height[right] >= right_max:
                right_max = height[right]
            else:
                water += right_max - height[right]
            right -= 1"""
explanation = "**第 3 步：双指针向中间推进**\n\n循环不变式：始终处理 `left_max` 和 `right_max` 中较小的一侧。\n\n**为什么这样可行？**\n\n- 若 `height[left] < height[right]`，则左侧当前位置的积水量**只由 `left_max` 决定**\n  - 因为右侧必有一个 ≥ `height[right]` 的\"墙\"挡水\n- 反之 `height[left] >= height[right]` 时，处理右侧\n\n**单侧处理逻辑**\n\n| 条件 | 操作 | 含义 |\n|------|------|------|\n| `height[left] >= left_max` | `left_max = height[left]` | 刷新最高，无水可接 |\n| 否则 | `water += left_max - height[left]` | 当前位置能接水 |\n\n> 每步只新增一行；指针只移动到已被结算的位置——这是双指针法的关键。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 接雨水
# 给定 n 个非负整数表示宽度为 1 的柱子的高度图
# 计算按此排列的柱子，下雨之后能接多少雨水
#
# 关键观察:
#   每个位置 i 处的积水量 = min(左侧最高, 右侧最高) - height[i]
#   只有当 height[i] < 两侧最高时才能积水
#
# 示例:
#   height = [0,1,0,2,1,0,1,3,2,1,2,1]
#   结果: 6
#
#   █         █
#   █   █ █ █ █
#   █ █ █ █ █ █ █
#   ─────────────
#   0 1 0 2 1 0 1 3 2 1 2 1

from typing import List

def trap(height: List[int]) -> int:
    \"\"\"计算柱状图能接住的雨水总量。\"\"\"
    left, right = 0, len(height) - 1  # 左右指针
    left_max = right_max = 0  # 两侧已知的最高高度
    water = 0  # 累计接住的雨水量

    while left <= right:
        if height[left] < height[right]:
            if height[left] >= left_max:
                left_max = height[left]
            else:
                water += left_max - height[left]
            left += 1
        else:
            if height[right] >= right_max:
                right_max = height[right]
            else:
                water += right_max - height[right]
            right -= 1
    return water"""
explanation = "**最终结果**\n\n✅ 双指针法完成接雨水计算\n\n```\n输入: height = [0,1,0,2,1,0,1,3,2,1,2,1]\n输出: 6\n\n水量分布: 0 + 0 + 1 + 0 + 1 + 2 + 1 + 0 + 0 + 1 + 0 + 0 = 6\n```\n\n**算法复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | O(n) | 每个位置最多访问一次 |\n| 空间复杂度 | O(1) | 仅用 5 个变量 |\n\n**双指针法 vs 前后缀数组法**\n\n- 前后缀数组需要 `O(n)` 额外空间存 `leftMax` / `rightMax`\n- 双指针**在线**维护两侧最高，无需预存\n- 单调栈法按\"找凹槽\"思路，`O(n)` 时间 `O(n)` 空间\n\n> **关键洞察**：处理顺序由两侧最大值的较小者决定——水位永远受限于更矮的墙。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]", result = "6", highlightedIndices = [2, 4, 5, 6, 9] }

