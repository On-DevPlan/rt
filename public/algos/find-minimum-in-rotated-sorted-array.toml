from typing import List

def findMin(nums: List[int]) -> int:
    \"\"\"返回旋转数组中的最小值。\"\"\"
    left, right = 0, len(nums) - 1"""
explanation = "**第 2 步：设置搜索边界**\n\n```\nnums = [3, 4, 5, 1, 2]\n         ↑        ↑\n       left    right\n```\n\n| 变量 | 初始值 | 含义 |\n|------|--------|------|\n| `left` | `0` | 搜索区间左端 |\n| `right` | `len(nums) - 1` | 搜索区间右端 |\n\n> 二分查找的标准初始化，搜索范围为整个数组。"
visualizationType = "code-only"

# ── Step 3: 二分循环框架 ────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "二分查找"
titleEn = "Binary Search Loop"
code = """# 153. 寻找旋转排序数组中的最小值
# 在旋转过的升序数组中查找最小值
#
# 题目说明:
#   原本升序排列的数组被旋转过（例如 [0,1,2,4,5,6,7] 可变为 [4,5,6,7,0,1,2]）
#   要求在 O(log n) 时间内找出最小元素
#   数组中不存在重复元素
#
# 示例:
#   输入: nums = [3,4,5,1,2]
#   输出: 1

from typing import List

def findMin(nums: List[int]) -> int:
    \"\"\"返回旋转数组中的最小值。\"\"\"
    left, right = 0, len(nums) - 1
    while left < right:
        mid = (left + right) // 2
        if nums[mid] > nums[right]:
            left = mid + 1
        else:
            right = mid"""
explanation = "**第 3 步：实现二分逻辑**\n\n**终止条件**：`while left < right` — 当 `left == right` 时就找到最小值了。\n\n**关键判断：比较 `nums[mid]` 与 `nums[right]`**\n\n| 条件 | 含义 | 操作 |\n|------|------|------|\n| `nums[mid] > nums[right]` | 最小值在右半边 | `left = mid + 1` |\n| 否则 | 最小值在左半边或 `mid` 就是 | `right = mid` |\n\n**为什么比 `nums[right]` 而不是 `nums[mid]`？**\n\n```\n情况1: nums = [4, 5, 6, 7, 0, 1, 2]\n         left=0, right=6, mid=3\n         nums[mid]=7 > nums[right]=2 → 最小值在右边\n         left = 4\n\n情况2: nums = [3, 4, 5, 1, 2]\n         left=0, right=4, mid=2\n         nums[mid]=5 > nums[right]=2 → 最小值在右边\n         left = 3\n```\n\n> 用 `right` 作为参照点可以稳定判断最小值在哪一侧。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 153. 寻找旋转排序数组中的最小值
# 在旋转过的升序数组中查找最小值
#
# 题目说明:
#   原本升序排列的数组被旋转过（例如 [0,1,2,4,5,6,7] 可变为 [4,5,6,7,0,1,2]）
#   要求在 O(log n) 时间内找出最小元素
#   数组中不存在重复元素
#
# 示例:
#   输入: nums = [3,4,5,1,2]
#   输出: 1

from typing import List

def findMin(nums: List[int]) -> int:
    \"\"\"返回旋转数组中的最小值。\"\"\"
    left, right = 0, len(nums) - 1
    while left < right:
        mid = (left + right) // 2
        if nums[mid] > nums[right]:
            left = mid + 1
        else:
            right = mid
    return nums[left]"""
explanation = "**最终结果**\n\n✅ 二分查找完成，返回 `nums[left]`（此时 `left == right`）。\n\n**执行示例：**\n\n```\nnums = [3, 4, 5, 1, 2]\n\n初始: left=0, right=4\n第1轮: mid=2, nums[2]=5 > nums[4]=2? 是 → left=3\n第2轮: left=3, right=4, mid=3, nums[3]=1 > nums[4]=2? 否 → right=3\n终止: left==right==3 → return nums[3]=1 ✓\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(log n) — 标准二分 |\n| 空间复杂度 | O(1) — 只用两个指针 |\n\n**核心思想**\n\n- 比较 `nums[mid]` 与 `nums[right]` 判断哪边有最小值\n- `nums[mid] > nums[right]` → 右边有更小的值\n- 否则 → 左边（含 `mid`）有最小值\n- 不断缩小区间直到 `left == right`"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[3, 4, 5, 1, 2]", result = "1", highlightedIndices = [3] }

