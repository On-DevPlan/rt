# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 153. 寻找旋转排序数组中的最小值
# 在旋转过的升序数组中查找最小值
#
# 题目说明:
#   原本升序排列的数组被旋转过（例如 [0,1,2,4,5,6,7] 可变为 [4,5,6,7,0,1,2]）
#   要求在 O(log n) 时间内找出最小元素
#   数组中不存在重复元素
#
# 示例:
#   输入: nums = [3,4,5,1,2]
#   输出: 1"""
explanation = "**问题重述**\n\n给定一个旋转过的升序数组（无重复元素），找出其中的最小值。\n\n**输入与输出**\n\n- 输入：旋转升序数组 `nums`（元素互不重复）\n- 输出：最小元素值（整数）\n- 边界：`nums` 至少有一个元素；未旋转时数组仍升序\n\n**示例走查**\n\n测试用例：`nums = [3, 4, 5, 1, 2]`\n\n原始数组 `[1, 2, 3, 4, 5]` 旋转后得到 `[3, 4, 5, 1, 2]`。最小值 `1` 出现在两段升序的断点处，即右半段起点。\n\n期望输出：`1`\n\n**关键洞察**\n\n旋转数组由两段升序拼接而成，最小值是全局断点。比 `nums[right]` 更小的区间一定包含最小值——这是二分判断的核心依据。若 `nums[mid] > nums[right]`，说明最小值在右侧；否则在左侧（含 mid）。\n\n**方法预览**\n\n二分查找：每次比较 `nums[mid]` 与 `nums[right]` 缩小区间，直到 `left == right`。\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(log n) |\n| 空间复杂度 | O(1) |"
visualizationType = "intro"

