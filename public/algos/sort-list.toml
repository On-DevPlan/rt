explanation = "**最终结果**\n\n✅ 链表已成功排序\n\n```\n输入: head = [4, 2, 1, 3]\n输出: [1, 2, 3, 4]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n log n) — 每层合并 O(n)，共 log n 层 |\n| 空间复杂度 | O(log n) — 自顶向下递归栈 |\n\n**关键技巧**\n\n- **归并排序优于快排**：链表不支持随机访问，归并只需 O(1) 断链与拼接\n- **快慢指针找中点**：slow 走 1 步、fast 走 2 步，O(n) 时间找到中点\n- **哨兵节点**：消除合并时 `head` 为空的边界处理\n- **自顶向下 vs 自底向上**：自顶向下代码更直观，递归栈仅 O(log n)，符合常数级空间的要求"
