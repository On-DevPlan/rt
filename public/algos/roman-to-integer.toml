# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 罗马数字转整数
# 给定一个罗马数字字符串 s，将其转换为对应的整数
#
# 罗马字符与基本值:
#   I=1, V=5, X=10, L=50, C=100, D=500, M=1000
#
# 规则: 左减右加
#   当 s[i] < s[i+1] 时, s[i] 取负
#   否则正常相加
#
# 示例:
#   III        -> 3
#   IV         -> 4
#   IX         -> 9
#   LVIII      -> 58
#   MCMXCIV    -> 1994"""
explanation = "**问题重述**\n\n给定一个合法的罗马数字字符串 `s`，将其转换为对应的整数并返回。罗马数字由 `I(1)`、`V(5)`、`X(10)`、`L(50)`、`C(100)`、`D(500)`、`M(1000)` 组成，并遵循「左减右加」规则。\n\n**输入与输出**\n\n- 输入：罗马数字字符串 `s`\n- 输出：对应的整数值\n- 边界：空字符串返回 0；单个字符直接返回对应数值；题目保证输入为合法罗马数字\n\n**示例走查**\n\n以 `s = \"MCMXCIV\"` 为例，从左到右逐个字符处理：\n\n- `M(1000)` 后面是 `C(100)`，左大右小，加 1000，累计 1000\n- `C(100)` 后面是 `M(1000)`，左小右大，减 100，累计 900\n- `M(1000)` 后面是 `X(10)`，左大右小，加 1000，累计 1900\n- `X(10)` 后面是 `C(100)`，左小右大，减 10，累计 1890\n- `C(100)` 后面是 `I(1)`，左大右小，加 100，累计 1990\n- `I(1)` 后面是 `V(5)`，左小右大，减 1，累计 1989\n- `V(5)` 是最后一个字符，没有右邻，加 5，累计 1994\n\n因此返回 `1994`。\n\n**关键洞察**\n\n- 罗马数字的减法组合只有 6 种：`IV`、`IX`、`XL`、`XC`、`CD`、`CM`，无需逐一特判\n- 统一规则：若当前字符代表的值小于下一个字符，则当前值取负；否则取正\n- 字符串末位字符没有右邻，必然做加法\n\n**方法预览**\n\n| 项目 | 说明 |\n|------|------|\n| 算法 | 哈希表映射 + 一次遍历左减右加 |\n| 时间复杂度 | O(n)，n 为字符串长度 |\n| 空间复杂度 | O(1)，字符映射表大小固定 |"
visualizationType = "intro"

