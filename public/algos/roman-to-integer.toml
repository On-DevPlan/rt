#   MCMXCIV    -> 1994

def romanToInt(s: str) -> int:
    \"\"\"将罗马数字字符串转换为整数。\"\"\"
    values = {'I':1, 'V':5, 'X':10, 'L':50, 'C':100, 'D':500, 'M':1000}
    total = 0
    for i in range(len(s)):
        if i + 1 < len(s) and values[s[i]] < values[s[i+1]]:
            total -= values[s[i]]
        else:
            total += values[s[i]]
    return total"""
explanation = "**最终结果**\n\n✅ `romanToInt(\"MCMXCIV\")` 返回 `1994`\n\n**测试用例验证**\n\n| 输入 | 输出 |\n|------|------|\n| `III` | 3 |\n| `IV` | 4 |\n| `IX` | 9 |\n| `LVIII` | 58 |\n| `MCMXCIV` | 1994 |\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 一次遍历 |\n| 空间复杂度 | O(1) — 字典常量大小 |\n\n**关键技巧：左减右加**\n\n- 不需要枚举 6 种「减法」组合（IV/IX/XL/XC/CD/CM）\n- 用统一的「比较相邻字符」规则即可\n- 末位字符必然「右加」（没有右邻了）"
visualizationType = "result"
