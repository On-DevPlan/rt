# ── Step 3: 遍历判断左减右加 ───────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历累加"
titleEn = "Iterate and Accumulate"
code = """# 罗马数字转整数
# 给定一个罗马数字字符串 s，将其转换为对应的整数
#
# 罗马字符与基本值:
#   I=1, V=5, X=10, L=50, C=100, D=500, M=1000
#
# 规则: 左减右加
#   当 s[i] < s[i+1] 时, s[i] 取负
#   否则正常相加
#
# 示例:
#   III        -> 3
#   IV         -> 4
#   IX         -> 9
#   LVIII      -> 58
#   MCMXCIV    -> 1994

def romanToInt(s: str) -> int:
    \"\"\"将罗马数字字符串转换为整数。\"\"\"
    values = {'I':1, 'V':5, 'X':10, 'L':50, 'C':100, 'D':500, 'M':1000}
    total = 0
    for i in range(len(s)):
        if i + 1 < len(s) and values[s[i]] < values[s[i+1]]:
            total -= values[s[i]]
        else:
            total += values[s[i]]"""
explanation = "**第 3 步：左减右加遍历**\n\n```python\ntotal = 0\nfor i in range(len(s)):\n    if i + 1 < len(s) and values[s[i]] < values[s[i+1]]:\n        total -= values[s[i]]   # 左减\n    else:\n        total += values[s[i]]   # 右加\n```\n\n**两个条件**\n\n1. `i + 1 < len(s)` — 当前字符不是最后一个（避免越界）\n2. `values[s[i]] < values[s[i+1]]` — 出现了「小字符在大字符左边」的情况\n\n**示例：`MCMXCIV`**\n\n```\ni=0: M(1000) < C(100)?  否 → +1000, total=1000\ni=1: C(100)  < M(1000)? 是 → -100,  total=900\ni=2: M(1000) < X(10)?   否 → +1000, total=1900\ni=3: X(10)   < C(100)?  是 → -10,   total=1890\ni=4: C(100)  < I(1)?    否 → +100,  total=1990\ni=5: I(1)    < V(5)?    是 → -1,    total=1989\ni=6: V(5)   (末位)      否 → +5,    total=1994 ✓\n```"
visualizationType = "code-only"

