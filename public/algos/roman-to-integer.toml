def romanToInt(s: str) -> int:
    \"\"\"将罗马数字字符串转换为整数。\"\"\"
    values = {'I':1, 'V':5, 'X':10, 'L':50, 'C':100, 'D':500, 'M':1000}"""
explanation = "**第 2 步：建立字符到数值的映射**\n\n用 Python 字典 `values` 记录每个罗马字符对应的基础值：\n\n```python\nvalues = {'I':1, 'V':5, 'X':10, 'L':50, 'C':100, 'D':500, 'M':1000}\n```\n\n| 键 | 值 |\n|------|------|\n| `I` | 1 |\n| `V` | 5 |\n| `X` | 10 |\n| `L` | 50 |\n| `C` | 100 |\n| `D` | 500 |\n| `M` | 1000 |\n\n> 后续查询用 `values[ch]` 即可拿到对应数值。"
