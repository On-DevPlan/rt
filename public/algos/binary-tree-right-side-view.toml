# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 199. 二叉树的右视图
# 给定一棵二叉树的根节点 root
# 返回从右侧看这棵二叉树时能看到的节点值列表
# 即: 自顶向下, 每层最右边的节点
#
# 示例:
#   root = [1, 2, 3, null, 5, null, 4]
#
#   树形结构:
#            1
#          /   \\
#         2     3
#          \\      \\
#           5      4
#
#   从右侧看: 第一层看到 1, 第二层看到 3, 第三层看到 4
#   结果: [1, 3, 4]"""
explanation = "**问题分析**\n\n想象你站在二叉树的右侧，向左看过去：\n- 同一层中，**最右边的节点**会挡住同层其他节点\n- 自顶向下逐层记录「最右节点」即得右视图\n\n**示例**\n\n```\n    1           ← 第 1 层最右: 1\n   / \\\n  2   3         ← 第 2 层最右: 3\n   \\   \\\n    5   4       ← 第 3 层最右: 4\n\n输出: [1, 3, 4]\n```\n\n**核心思路：BFS 层序 + 每层最后一个**\n\n| 方法 | 关键点 |\n|------|--------|\n| BFS 层序遍历 | 用队列天然按层访问 |\n| 记录每层最后一个 | `size-1` 索引对应的节点 |\n\n> 也可以用 DFS（右优先），但 BFS 与「右视图」的「自顶向下」语义最贴合。"
visualizationType = "intro"

# ── Step 1: 函数签名 + 边界 + 队列 ────────────────────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 199. 二叉树的右视图
# 给定一棵二叉树的根节点 root
# 返回从右侧看这棵二叉树时能看到的节点值列表
# 即: 自顶向下, 每层最右边的节点
#
# 示例:
#   root = [1, 2, 3, null, 5, null, 4]
#
#   树形结构:
#            1
#          /   \\
#         2     3
#          \\      \\
#           5      4
#
#   从右侧看: 第一层看到 1, 第二层看到 3, 第三层看到 4
#   结果: [1, 3, 4]

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def rightSideView(root: Optional[TreeNode]) -> List[int]:
    \"\"\"返回二叉树右视图。\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    pass"""
explanation = "**第 1 步：搭建函数骨架**\n\n- **边界处理**：`root is None` 直接返回空列表\n- **结果容器** `res`：存放每层最右节点的值\n- **BFS 队列** `q`：初始化时放入根节点，天然按层展开\n\n```python\nq = deque([root])\n```\n\n> `deque` 的 `popleft()` 是 O(1)，比 `list.pop(0)` 快得多。"
visualizationType = "code-only"

# ── Step 2: while 循环 + size ─────────────────────────────────
[[algorithm.steps]]
id = 2
title = "BFS 主循环"
titleEn = "BFS Main Loop"
code = """# 199. 二叉树的右视图
# 给定一棵二叉树的根节点 root
# 返回从右侧看这棵二叉树时能看到的节点值列表
# 即: 自顶向下, 每层最右边的节点
#
# 示例:
#   root = [1, 2, 3, null, 5, null, 4]
#
#   树形结构:
#            1
#          /   \\
#         2     3
#          \\      \\
#           5      4
#
#   从右侧看: 第一层看到 1, 第二层看到 3, 第三层看到 4
#   结果: [1, 3, 4]

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def rightSideView(root: Optional[TreeNode]) -> List[int]:
    \"\"\"返回二叉树右视图。\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    while q:
        size = len(q)
        pass"""
explanation = "**第 2 步：BFS 主循环 + 层大小**\n\n```python\nwhile q:\n    size = len(q)\n```\n\n**为什么需要 `size`？**\n\n队列 `q` 在遍历过程中会**动态变化**（出队旧节点、入队新层节点）。在每轮 `while` 开头先「快照」当前队列长度 `size`，它就代表**当前层节点总数**。\n\n| 变量 | 含义 |\n|------|------|\n| `q` | 动态队列，跨层混合 |\n| `size` | 本轮 while 起始时的队列长度 = 当前层节点数 |\n\n> 关键：`size` 必须在 `for` 循环前固定，不能在循环内 `len(q)`（会被入队的新节点污染）。"
visualizationType = "code-only"

# ── Step 3: for 循环 + 加入 res + 入队子节点 ──────────────────
[[algorithm.steps]]
id = 3
title = "处理每层节点"
titleEn = "Process Each Level"
code = """# 199. 二叉树的右视图
# 给定一棵二叉树的根节点 root
# 返回从右侧看这棵二叉树时能看到的节点值列表
# 即: 自顶向下, 每层最右边的节点
#
# 示例:
#   root = [1, 2, 3, null, 5, null, 4]
#
#   树形结构:
#            1
#          /   \\
#         2     3
#          \\      \\
#           5      4
#
#   从右侧看: 第一层看到 1, 第二层看到 3, 第三层看到 4
#   结果: [1, 3, 4]

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def rightSideView(root: Optional[TreeNode]) -> List[int]:
    \"\"\"返回二叉树右视图。\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    while q:
        size = len(q)
        for i in range(size):
            node = q.popleft()
            if i == size - 1:
                res.append(node.val)
            if node.left:
                q.append(node.left)
            if node.right:
                q.append(node.right)
    pass"""
explanation = "**第 3 步：遍历当前层 + 收集 + 入队**\n\n**三件事**：\n\n1. **遍历当前层**：`for i in range(size)` 精确处理 `size` 个节点\n2. **记录最右**：`if i == size - 1` 时把 `node.val` 加入 `res`\n3. **入队下一层**：`node.left`、`node.right` 按顺序入队（左后右）\n\n**示例：第 1 层**\n\n```\nq = [1], size = 1\n  i=0: node=1, i==size-1(0==0) → res.append(1) → res=[1]\n       入队 2, 3 → q = [2, 3]\n```\n\n**示例：第 2 层**\n\n```\nq = [2, 3], size = 2\n  i=0: node=2, i!=size-1 → 不加入 res\n       入队 5 → q = [3, 5]\n  i=1: node=3, i==size-1(1==1) → res.append(3) → res=[1, 3]\n       入队 4 → q = [5, 4]\n```\n\n> 左后右入队可以保证同层节点从左到右处理，**最后一个被处理的就是最右**。"
visualizationType = "code-only"

# ── Step 4: 返回结果 ──────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 199. 二叉树的右视图
# 给定一棵二叉树的根节点 root
# 返回从右侧看这棵二叉树时能看到的节点值列表
# 即: 自顶向下, 每层最右边的节点
#
# 示例:
#   root = [1, 2, 3, null, 5, null, 4]
#
#   树形结构:
#            1
#          /   \\
#         2     3
#          \\      \\
#           5      4
#
#   从右侧看: 第一层看到 1, 第二层看到 3, 第三层看到 4
#   结果: [1, 3, 4]

from typing import Optional, List
from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def rightSideView(root: Optional[TreeNode]) -> List[int]:
    \"\"\"返回二叉树右视图。\"\"\"
    if not root:
        return []
    res = []
    q = deque([root])
    while q:
        size = len(q)
        for i in range(size):
            node = q.popleft()
            if i == size - 1:
                res.append(node.val)
            if node.left:
                q.append(node.left)
            if node.right:
                q.append(node.right)
    return res"""
explanation = "**最终结果**\n\n```\n输入: root = [1, 2, 3, null, 5, null, 4]\n输出: [1, 3, 4]\n```\n\n**算法复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | O(n) | 每个节点恰好入队/出队一次 |\n| 空间复杂度 | O(w) | w = 树的最大层宽（队列最大长度） |\n\n**关键技巧回顾**\n\n- `size = len(q)` 必须在 `while` 开头固定，标识当前层节点数\n- `i == size - 1` 判定「当前层最后一个节点」\n- 左后右入队保证最后一个处理的是最右节点\n\n> DFS 替代方案：右优先 DFS（先递归 right，再 left），记录每个深度第一次访问的节点 — 同样可得右视图。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 3, 4]", result = "[1, 3, 4]", highlightedIndices = [0, 1, 2] }

