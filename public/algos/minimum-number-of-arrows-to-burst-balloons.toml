    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 入参 `points: List[List[int]]` — 每个内层列表是 `[x_start, x_end]`\n- 返回值 `int` — 最少箭数\n- 使用 `List` 类型注解\n- 文档字符串简述函数用途"
visualizationType = "code-only"

# ── Step 2: 排序 + 初始化 ─────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "排序与初始化"
titleEn = "Sort and Initialize"
code = """# 用最少数量的箭引爆气球
# 每个气球是一个水平直径区间 [x_start, x_end]
# 一支箭垂直射在某 x 坐标处，会把该 x 上所有气球射爆
# 求射爆所有气球所需的最少箭数
#
# 示例:
#   points = [[10,16],[2,8],[1,6],[7,12]]  →  2
#   解释: 在 x=6 射一支箭引爆 [2,8] 与 [1,6]
#         在 x=11 射一支箭引爆 [10,16] 与 [7,12]

from typing import List

def findMinArrowShots(points: List[List[int]]) -> int:
    \"\"\"返回射爆所有气球所需的最少箭数。\"\"\"
    if not points:
        return 0
    points.sort(key=lambda x: x[1])  # 按右端点升序
    arrows = 1                       # 至少需要一支箭
    end = points[0][1]               # 当前箭所在位置 = 第一个气球的右端点"""
explanation = "**第 2 步：边界检查 + 排序 + 初始化**\n\n```\npoints = [[10,16],[2,8],[1,6],[7,12]]\n\n排序后（按 end 升序）:\n[[1,6], [2,8], [7,12], [10,16]]\n  end=6  end=8   end=12    end=16\n```\n\n| 变量 | 含义 | 初值 |\n|------|------|------|\n| `arrows` | 已使用的箭数 | `1`（至少要一支） |\n| `end` | 当前箭射中的 x 坐标 | 排序后第一个气球的右端点 |\n\n> 为什么按 `end` 升序？因为当前箭射在**最早结束**的位置上，可以覆盖尽可能多的后续区间。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历射箭"
titleEn = "Iterate and Shoot"
code = """# 用最少数量的箭引爆气球
# 每个气球是一个水平直径区间 [x_start, x_end]
# 一支箭垂直射在某 x 坐标处，会把该 x 上所有气球射爆
# 求射爆所有气球所需的最少箭数
#
# 示例:
#   points = [[10,16],[2,8],[1,6],[7,12]]  →  2
#   解释: 在 x=6 射一支箭引爆 [2,8] 与 [1,6]
#         在 x=11 射一支箭引爆 [10,16] 与 [7,12]

from typing import List

def findMinArrowShots(points: List[List[int]]) -> int:
    \"\"\"返回射爆所有气球所需的最少箭数。\"\"\"
    if not points:
        return 0
    points.sort(key=lambda x: x[1])  # 按右端点升序
    arrows = 1                       # 至少需要一支箭
    end = points[0][1]               # 当前箭所在位置 = 第一个气球的右端点

    for s, e in points[1:]:
        if s > end:                  # 当前箭射不到，射新箭
            arrows += 1
            end = e                  # 把新箭放在新区间的右端点"""
explanation = "**第 3 步：遍历，决定是否需要新箭**\n\n**判断条件 `s > end`**\n\n- 如果当前气球起点 `s` **大于**箭的位置 `end` → 当前箭射不中 → 必须射新箭\n- 否则 → 当前箭能射爆该气球（因为 `s <= end <= e`，区间在 end 左侧相接也能射爆）\n\n> 关键：`s == end` 时**仍可射爆**（区间在端点处相切），所以用严格大于 `>`。\n\n**示例执行 `[[1,6],[2,8],[7,12],[10,16]]`**\n\n```\n初始化: arrows=1, end=6\n(2,8):    s=2 <= 6       → 不射新箭\n(7,12):   s=7 >  6       → arrows=2, end=12\n(10,16):  s=10 <= 12     → 不射新箭\n返回 arrows = 2 ✓\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 用最少数量的箭引爆气球
# 每个气球是一个水平直径区间 [x_start, x_end]
# 一支箭垂直射在某 x 坐标处，会把该 x 上所有气球射爆
# 求射爆所有气球所需的最少箭数
#
# 示例:
#   points = [[10,16],[2,8],[1,6],[7,12]]  →  2
#   解释: 在 x=6 射一支箭引爆 [2,8] 与 [1,6]
#         在 x=11 射一支箭引爆 [10,16] 与 [7,12]

from typing import List

def findMinArrowShots(points: List[List[int]]) -> int:
    \"\"\"返回射爆所有气球所需的最少箭数。\"\"\"
    if not points:
        return 0
    points.sort(key=lambda x: x[1])  # 按右端点升序
    arrows = 1                       # 至少需要一支箭
    end = points[0][1]               # 当前箭所在位置 = 第一个气球的右端点

    for s, e in points[1:]:
        if s > end:                  # 当前箭射不到，射新箭
            arrows += 1
            end = e                  # 把新箭放在新区间的右端点

    return arrows"""
explanation = "**最终结果**\n\n✅ 最少箭数已求得\n\n```\n输入: points = [[10,16],[2,8],[1,6],[7,12]]\n输出: 2\n射箭点: x=6 (引爆 [1,6] 与 [2,8])\n       x=11 (引爆 [7,12] 与 [10,16])\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n log n) — 排序主导 |\n| 空间复杂度 | O(1) — 排序原地，仅用两个变量 |\n\n**为什么是贪心？**\n\n- 局部最优：每支箭都射在**当前未射气球中最早的右端点**\n- 全局最优：这种选择最大化每支箭覆盖的气球数，因此总箭数最少\n- 排序让候选解空间按 `end` 单调推进，避免回溯\n\n> 与「无重叠区间」是同一类题，只是这里要求**接触也算覆盖**（`s == end` 仍可一箭双雕）。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[[1,6],[2,8],[7,12],[10,16]]", result = "2", highlightedIndices = [0, 1, 2, 3] }

