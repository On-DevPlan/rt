# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 用最少数量的箭引爆气球
# 每个气球是一个水平直径区间 [x_start, x_end]
# 一支箭垂直射在某 x 坐标处，会把该 x 上所有气球射爆
# 求射爆所有气球所需的最少箭数
#
# 示例:
#   points = [[10,16],[2,8],[1,6],[7,12]]  →  2
#   解释: 在 x=6 射一支箭引爆 [2,8] 与 [1,6]
#         在 x=11 射一支箭引爆 [10,16] 与 [7,12]"""
explanation = "**问题重述**\n\n给定一组气球区间 `points = [x_start, x_end]`，一支箭垂直射在 x 坐标处可射爆所有覆盖该点的气球，求最少需要几支箭。\n\n**输入与输出**\n\n- 输入：`points = List[List[int]]`，每个气球为 `[x_start, x_end]`（闭区间）\n- 输出：射爆所有气球所需的最少箭数（整数）\n- 边界：`points` 为空 → 返回 0\n\n**示例走查**\n\n```\ntestCase: points = [[10,16],[2,8],[1,6],[7,12]]\n按 end 排序后: [[1,6],[2,8],[7,12],[10,16]]\n遍历:\n  初始箭射在 end=6，覆盖 [1,6] 和 [2,8] ✓\n  下一个 [7,12] 的 start=7 > 6，需新箭，射在 end=12\n  [10,16] 的 start=10 ≤ 12，被第二箭覆盖 ✓\n结果: 2\nexpectedOutput: 2 ✓\n```\n\n**关键洞察**\n\n- 把箭射在**最早结束的右端点**，可覆盖最多后续气球（局部最优 → 全局最少箭）\n- 按 end 升序排列，贪心地决定何时需要新箭\n- `s == end` 时仍可一箭双雕（区间在端点处相切），用严格大于 `>` 判断需新箭\n\n**方法预览**\n\n| 方法 | 时间 | 空间 |\n|------|------|------|\n| 暴力枚举 | 指数级 | — |\n| **贪心 + 按 end 排序** | **O(n log n)** | **O(1)** |"
visualizationType = "intro"

