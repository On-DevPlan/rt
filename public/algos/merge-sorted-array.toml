explanation = "**第 1 步：编写函数签名**\n\n- 接收四个参数：`nums1`、`m`、`nums2`、`n`\n- 返回值类型为 `None`，要求**原地修改** `nums1`\n- 使用类型注解明确参数类型\n- 文档字符串描述函数用途"
