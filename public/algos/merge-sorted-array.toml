# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 合并两个有序数组
# 给定两个非递减顺序排列的整数数组 nums1 和 nums2
# 将 nums2 合并到 nums1 中，使结果仍为非递减顺序
#
# 特殊条件:
#   nums1 的长度为 m + n，前 m 个是有效元素，后 n 个是 0（占位）
#   nums2 的长度为 n
#   要求原地修改 nums1，不返回新数组
#
# 示例:
#   nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3
#   结果: [1,2,2,3,5,6]"""
explanation = "**问题重述**\n\n将有序数组 `nums2` 合并到有序数组 `nums1` 中，结果仍为非递减顺序。\n\n**输入与输出**\n\n- 输入：`nums1`（长 m+n，前 m 个有效、后 n 个为 0 占位）、`nums2`（长 n）\n- 输出：原地修改 `nums1`，不返回；结果为非递减序列\n- 边界：m=0 或 n=0；两数组均可能为空\n\n**示例走查**\n\n```\ntestCase: nums1 = [1,2,3,0,0,0], m=3, nums2 = [2,5,6], n=3\n合并过程（从后往前填充）:\n  比较 3 vs 6 → 填 6；比较 3 vs 5 → 填 5；比较 3 vs 2 → 填 3\n  比较 2 vs 2 → 填 2（相等也填 nums2）；剩余 [1,2,3] 本身有序\n结果: [1,2,2,3,5,6]\nexpectedOutput: [1,2,2,3,5,6] ✓\n```\n\n**关键洞察**\n\n- `nums1` 尾部有 n 个空闲位置，充分利用这一空间，**从后往前填充**，无需额外数组\n- 三指针：`p1` 指向 nums1 有效元素末尾，`p2` 指向 nums2 末尾，`p` 指向 nums1 末尾\n- `p2 < 0` 时循环终止，此时 `nums1` 前部已自然有序无需处理\n\n**方法预览**\n\n| 方法 | 时间 | 空间 |\n|------|------|------|\n| 从前向后合并 | O(m+n) | O(m) — 需额外数组 |\n| **三指针从后向前** | **O(m+n)** | **O(1)** |"
visualizationType = "intro"

