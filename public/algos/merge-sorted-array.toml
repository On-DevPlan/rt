# ── Step 2: 初始化三指针 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 合并两个有序数组
# 给定两个非递减顺序排列的整数数组 nums1 和 nums2
# 将 nums2 合并到 nums1 中，使结果仍为非递减顺序
#
# 特殊条件:
#   nums1 的长度为 m + n，前 m 个是有效元素，后 n 个是 0（占位）
#   nums2 的长度为 n
#   要求原地修改 nums1，不返回新数组
#
# 示例:
#   nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3
#   结果: [1,2,2,3,5,6]

from typing import List

def merge(nums1: List[int], m: int, nums2: List[int], n: int) -> None:
    \"\"\"将 nums2 合并到 nums1 中，原地修改。\"\"\"
    p1 = m - 1  # nums1 最后一个有效元素的索引
    p2 = n - 1  # nums2 最后一个元素的索引
    p = m + n - 1  # nums1 最后一个位置的索引"""
explanation = "**第 2 步：设置三个指针**\n\n```\nnums1: [1, 2, 3, 0, 0, 0]\n        ↑        ↑\n        p1       p\n               (m+n-1)\n\nnums2: [2, 5, 6]\n               ↑\n               p2\n```\n\n| 指针 | 指向 | 初始值 |\n|------|------|--------|\n| `p1` | nums1 最后一个有效元素 | `m - 1` |\n| `p2` | nums2 最后一个元素 | `n - 1` |\n| `p` | nums1 最后一个位置 | `m + n - 1` |\n\n> 从后往前填充，p 始终指向待填充的位置。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "比较并填充"
titleEn = "Compare and Fill"
code = """# 合并两个有序数组
# 给定两个非递减顺序排列的整数数组 nums1 和 nums2
# 将 nums2 合并到 nums1 中，使结果仍为非递减顺序
#
# 特殊条件:
#   nums1 的长度为 m + n，前 m 个是有效元素，后 n 个是 0（占位）
#   nums2 的长度为 n
#   要求原地修改 nums1，不返回新数组
#
# 示例:
#   nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3
#   结果: [1,2,2,3,5,6]

from typing import List

def merge(nums1: List[int], m: int, nums2: List[int], n: int) -> None:
    \"\"\"将 nums2 合并到 nums1 中，原地修改。\"\"\"
    p1 = m - 1  # nums1 最后一个有效元素的索引
    p2 = n - 1  # nums2 最后一个元素的索引
    p = m + n - 1  # nums1 最后一个位置的索引

    while p2 >= 0:
        if p1 >= 0 and nums1[p1] > nums2[p2]:
            nums1[p] = nums1[p1]
            p1 -= 1
        else:
            nums1[p] = nums2[p2]
            p2 -= 1
        p -= 1"""
explanation = "**第 3 步：从后往前合并**\n\n循环条件 `while p2 >= 0`：nums2 的元素都处理完就结束。\n\n**比较逻辑**\n\n每次取 `nums1[p1]` 和 `nums2[p2]` 中较大的那个，放到 `nums1[p]`：\n\n| 条件 | 操作 |\n|------|------|\n| `nums1[p1] > nums2[p2]` | `nums1[p] = nums1[p1]; p1 -= 1` |\n| 否则 | `nums1[p] = nums2[p2]; p2 -= 1` |\n| 无论哪种 | `p -= 1` |\n\n**示例执行：**\n\n```\nnums1 = [1, 2, 3, 0, 0, 0], m = 3\nnums2 = [2, 5, 6], n = 3\n\np1=2, p2=2, p=5:  nums1[2]=3 > nums2[2]=6? 否 → nums1[5]=6, p2=1, p=4\np1=2, p2=1, p=4:  nums1[2]=3 > nums2[1]=5? 否 → nums1[4]=5, p2=0, p=3\np1=2, p2=0, p=3:  nums1[2]=3 > nums2[0]=2? 是 → nums1[3]=3, p1=1, p=2\np1=1, p2=0, p=2:  nums1[1]=2 > nums2[0]=2? 否 → nums1[2]=2, p2=-1, p=1\n循环结束 → nums1 = [1, 2, 2, 3, 5, 6] ✓\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 合并两个有序数组
# 给定两个非递减顺序排列的整数数组 nums1 和 nums2
# 将 nums2 合并到 nums1 中，使结果仍为非递减顺序
#
# 特殊条件:
#   nums1 的长度为 m + n，前 m 个是有效元素，后 n 个是 0（占位）
#   nums2 的长度为 n
#   要求原地修改 nums1，不返回新数组
#
# 示例:
#   nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3
#   结果: [1,2,2,3,5,6]

from typing import List

def merge(nums1: List[int], m: int, nums2: List[int], n: int) -> None:
    \"\"\"将 nums2 合并到 nums1 中，原地修改。\"\"\"
    p1 = m - 1  # nums1 最后一个有效元素的索引
    p2 = n - 1  # nums2 最后一个元素的索引
    p = m + n - 1  # nums1 最后一个位置的索引

    while p2 >= 0:
        if p1 >= 0 and nums1[p1] > nums2[p2]:
            nums1[p] = nums1[p1]
            p1 -= 1
        else:
            nums1[p] = nums2[p2]
            p2 -= 1
        p -= 1"""
explanation = "**最终结果**\n\n✅ 原地合并完成\n\n```\n输入: nums1 = [1,2,3,0,0,0], nums2 = [2,5,6]\n输出: [1,2,2,3,5,6]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(m+n) — 每个元素最多比较一次 |\n| 空间复杂度 | O(1) — 只用了三个指针 |\n\n**关键技巧：从后往前**\n\n- 避免了从前向后合并需要额外 O(m) 空间的问题\n- 充分利用 `nums1` 尾部空闲空间\n- 当 `p2 < 0` 时循环自动结束，`nums1` 前面的元素自然有序无需处理"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 2, 2, 3, 5, 6]", result = "[1,2,2,3,5,6]", highlightedIndices = [0, 1, 2, 3, 4, 5] }

