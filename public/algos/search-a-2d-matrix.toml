# ── Step 2: 初始化边界 ────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化边界"
titleEn = "Initialize Boundaries"
code = """# 搜索二维矩阵
# 在每行升序、每行首大于前行末的矩阵中查找目标
# 关键：二分查找（一维化）
#
# 矩阵特性:
#   每行从左到右升序
#   每行首元素大于前一行末元素
#   整体展平后严格升序
#
# 示例:
#   matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3
#   展平: [1, 3, 5, 7, 10, 11, 16, 20, 23, 30, 34, 60]
#   结果: true

from typing import List

def searchMatrix(matrix: List[List[int]], target: int) -> bool:
    \"\"\"判断目标是否在矩阵中。\"\"\"
    m, n = len(matrix), len(matrix[0])
    left, right = 0, m * n"""
explanation = "**第 2 步：设置搜索边界**\n\n```\n矩阵: 3行 × 4列 = 12个元素\n\n一维索引范围: [0, 12)\n  left = 0\n  right = 12\n```\n\n| 变量 | 含义 | 值 |\n|------|------|------|\n| `m` | 行数 | `len(matrix)` |\n| `n` | 列数 | `len(matrix[0])` |\n| `left` | 搜索区间左边界（包含） | `0` |\n| `right` | 搜索区间右边界（不包含） | `m * n` |\n\n> 使用左闭右开区间 `[left, right)`，终止条件为 `left == right`。"
visualizationType = "code-only"

# ── Step 3: 二分查找核心逻辑 ──────────────────────────────────
[[algorithm.steps]]
id = 3
title = "二分查找"
titleEn = "Binary Search"
code = """# 搜索二维矩阵
# 在每行升序、每行首大于前行末的矩阵中查找目标
# 关键：二分查找（一维化）
#
# 矩阵特性:
#   每行从左到右升序
#   每行首元素大于前一行末元素
#   整体展平后严格升序
#
# 示例:
#   matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3
#   展平: [1, 3, 5, 7, 10, 11, 16, 20, 23, 30, 34, 60]
#   结果: true

from typing import List

def searchMatrix(matrix: List[List[int]], target: int) -> bool:
    \"\"\"判断目标是否在矩阵中。\"\"\"
    m, n = len(matrix), len(matrix[0])
    left, right = 0, m * n
    while left < right:
        mid = (left + right) // 2
        val = matrix[mid // n][mid % n]
        if val < target:
            left = mid + 1
        elif val > target:
            right = mid
        else:
            return True"""
explanation = "**第 3 步：实现二分查找**\n\n**循环条件**：`while left < right`\n\n当 `left == right` 时，区间为空，说明未找到目标。\n\n**坐标映射**\n\n```\nmid = 5, n = 4\n行 = mid // n = 5 // 4 = 1\n列 = mid % n  = 5 % 4  = 1\nval = matrix[1][1] = 11\n```\n\n**二分逻辑**\n\n| 条件 | 操作 | 区间变化 |\n|------|------|----------|\n| `val < target` | `left = mid + 1` | 去掉左半部分 |\n| `val > target` | `right = mid` | 去掉右半部分 |\n| `val == target` | `return True` | 找到目标 |\n\n**示例执行**（target=3）：\n\n```\n初始: left=0, right=12\n\n第1轮: mid=6, val=16 > 3 → right=6\n第2轮: mid=3, val=7  > 3 → right=3\n第3轮: mid=1, val=3  = 3 → return True ✓\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 搜索二维矩阵
# 在每行升序、每行首大于前行末的矩阵中查找目标
# 关键：二分查找（一维化）
#
# 矩阵特性:
#   每行从左到右升序
#   每行首元素大于前一行末元素
#   整体展平后严格升序
#
# 示例:
#   matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3
#   展平: [1, 3, 5, 7, 10, 11, 16, 20, 23, 30, 34, 60]
#   结果: true

from typing import List

def searchMatrix(matrix: List[List[int]], target: int) -> bool:
    \"\"\"判断目标是否在矩阵中。\"\"\"
    m, n = len(matrix), len(matrix[0])
    left, right = 0, m * n
    while left < right:
        mid = (left + right) // 2
        val = matrix[mid // n][mid % n]
        if val < target:
            left = mid + 1
        elif val > target:
            right = mid
        else:
            return True
    return False"""
explanation = "**最终结果**\n\n✅ 二分查找完成\n\n```\n输入: matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3\n输出: true\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(log(m×n)) — 每次区间减半 |\n| 空间复杂度 | O(1) — 只用了四个变量 |\n\n**核心技巧：一维化映射**\n\n- 将二维矩阵视为严格升序的一维数组\n- 通过 `mid // n` 和 `mid % n` 实现一维索引到二维坐标的映射\n- 避免了先二分行、再二分列的两次查找"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]]", result = "true", highlightedIndices = [0, 1] }

