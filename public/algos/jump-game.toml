# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 跳跃游戏
# 给定一个非负整数数组 nums，初始位置在下标 0
# 数组中每个元素 nums[i] 表示在位置 i 可以跳跃的最大长度
# 判断是否能够到达最后一个下标
#
# 关键点:
#   nums[i] 是「最大跳跃长度」，不是「必须跳」的长度
#   题目只要求「能否到达」，不要求「最少跳几次」
#   所有 nums[i] >= 0
#
# 示例 1:
#   nums = [2, 3, 1, 1, 4] → true
#   路径: 0 → 1 → 4
#
# 示例 2:
#   nums = [3, 2, 1, 0, 4] → false
#   到达下标 3 后，最大只能跳 0，无法到 4"""
explanation = "**问题分析**\n\n给定非负整数数组 `nums`，从下标 `0` 出发，每个位置 `i` 上可以跳 `0` 到 `nums[i]` 步，判断能否到达最后一个下标。\n\n**贪心思路**\n\n不需要记录具体路径，只关心**最远能到哪里**。\n\n- 维护变量 `far`：当前能到达的最远下标\n- 遍历数组时，如果当前位置 `i` 超出 `far`，说明前面跳不到这里\n- 否则用 `i + nums[i]` 更新 `far`\n\n> 这是经典的「最远可达位置」贪心模式，时间 O(n)，空间 O(1)。"
visualizationType = "intro"

