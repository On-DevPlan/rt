explanation = "**第 1 步：函数签名**\n\n- 只接收 `nums` 一个参数（数组已排序）\n- 返回 `int`（去重后的长度）\n- 原地修改，保持相对顺序\n\n> 数组已排序是关键前提，未排序的数组需要用不同的方法。"
visualizationType = "code-only"

# ── Step 2: 边界条件 ──────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "边界条件"
titleEn = "Edge Case"
code = """# 删除有序数组中的重复项
# 给你一个非严格递增排列的数组 nums
# 原地删除重复出现的元素，使每个元素只出现一次
# 返回删除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   相对顺序必须保持
#   返回新长度 k，前 k 个元素不含重复值
#
# 示例:
#   nums = [0, 0, 1, 1, 1, 2, 2, 3, 3, 4]
#   返回 5, nums 前五个元素为 [0, 1, 2, 3, 4]

from typing import List

