# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 删除有序数组中的重复项
# 给你一个非严格递增排列的数组 nums
# 原地删除重复出现的元素，使每个元素只出现一次
# 返回删除后数组的新长度
#
# 要求:
#   原地修改，不能使用额外数组空间
#   相对顺序必须保持
#   返回新长度 k，前 k 个元素不含重复值
#
# 示例:
#   nums = [0, 0, 1, 1, 1, 2, 2, 3, 3, 4]
#   返回 5, nums 前五个元素为 [0, 1, 2, 3, 4]"""
explanation = "**问题分析**\n\n数组**已排序**（非严格递增），重复元素必然相邻。\n\n`nums = [0, 0, 1, 1, 1, 2, 2, 3, 3, 4]`\n\n**利用有序性**\n\n- 有序 → 重复元素相邻 → 只需比较当前元素与上一个保留元素\n- 用快慢指针：慢指针指向最后一个「已确认的唯一元素」\n- 快指针扫描，遇到不同的就放到慢指针后面\n\n> 与「移除元素」类似，只是筛选条件从「不等于 val」变成了「不等于上一个保留值」。"
visualizationType = "intro"

