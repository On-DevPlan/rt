    pass"""
explanation = "**第 1 步：函数签名**\n\n- 入参：两个等长数组 `gas` 和 `cost`，长度均为 `n`\n- 返回值：`int`，合法的出发站下标（`0 <= start < n`），无解返回 `-1`\n- 文档字符串明确语义\n\n> 题目保证 `gas` 和 `cost` 长度一致且非空。"
