# ── Step 2: 初始化三变量 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化变量"
titleEn = "Initialize Variables"
code = """# 加油站
# 在一条环形路上有 n 个加油站，第 i 个加油站有 gas[i] 升油
# 从第 i 站开到第 i+1 站需要消耗 cost[i] 升油
# 找到唯一的出发站下标，使得按环形顺序走一周油箱不会变负
# 若不存在则返回 -1
#
# 示例:
#   gas  = [1, 5, 3, 3, 5, 3, 1, 4]
#   cost = [3, 2, 5, 3, 1, 1, 1, 5]
#   输出: 3 (从 3 出发即可绕环一周)

from typing import List

def can_complete_circuit(gas: List[int], cost: List[int]) -> int:
    \"\"\"返回能绕环一周的唯一出发站，无解则返回 -1。\"\"\"
    n = len(gas)
    total_tank = 0  # 全程净油量总和，判断是否有解
    curr_tank = 0   # 从 start 出发到当前的净油量
    start = 0       # 候选出发站"""
explanation = "**第 2 步：初始化三个变量**\n\n| 变量 | 含义 | 初始值 |\n|------|------|--------|\n| `total_tank` | 全程累计净油量（`gas[i]-cost[i]` 之和） | `0` |\n| `curr_tank` | 从 `start` 出发到当前的累计净油 | `0` |\n| `start` | 候选出发站下标 | `0` |\n\n> `total_tank` 用于最后判断「全局是否够油」；`curr_tank` 用于中途判断「从 start 出发是否已经失败」。"
visualizationType = "code-only"

# ── Step 3: 遍历 + 贪心重置 ──────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历并贪心重置"
titleEn = "Iterate and Greedy Reset"
code = """# 加油站
# 在一条环形路上有 n 个加油站，第 i 个加油站有 gas[i] 升油
# 从第 i 站开到第 i+1 站需要消耗 cost[i] 升油
# 找到唯一的出发站下标，使得按环形顺序走一周油箱不会变负
# 若不存在则返回 -1
#
# 示例:
#   gas  = [1, 5, 3, 3, 5, 3, 1, 4]
#   cost = [3, 2, 5, 3, 1, 1, 1, 5]
#   输出: 3 (从 3 出发即可绕环一周)

from typing import List

def can_complete_circuit(gas: List[int], cost: List[int]) -> int:
    \"\"\"返回能绕环一周的唯一出发站，无解则返回 -1。\"\"\"
    n = len(gas)
    total_tank = 0  # 全程净油量总和，判断是否有解
    curr_tank = 0   # 从 start 出发到当前的净油量
    start = 0       # 候选出发站

    for i in range(n):
        diff = gas[i] - cost[i]
        total_tank += diff
        curr_tank += diff
        if curr_tank < 0:
            start = i + 1  # start..i 都失败，下一站重试
            curr_tank = 0"""
explanation = "**第 3 步：单次遍历 + 贪心重置**\n\n每次累加净油 `diff = gas[i] - cost[i]`，分两路统计：\n\n- `total_tank += diff`：全程净油总和，最终判断是否有解\n- `curr_tank += diff`：当前候选起点累积的净油\n\n**贪心重置逻辑**\n\n```python\nif curr_tank < 0:\n    start = i + 1\n    curr_tank = 0\n```\n\n> 含义：如果从 `start` 出发累积到第 `i` 站就油不够了，那么 `start..i` 之间任何一站出发都会失败（因为它们的累计净油更少）。**直接跳过整段**，把候选起点改为 `i+1`。\n\n**示例执行**（`gas=[1,5,3,3,5,3,1,4]`, `cost=[3,2,5,3,1,1,1,5]`）\n\n```\ni=0: diff=-2 → total=-2, curr=-2 < 0 → start=1, curr=0\ni=1: diff= 3 → total= 1, curr= 3\ni=2: diff=-2 → total=-1, curr= 1\ni=3: diff= 0 → total=-1, curr= 1\ni=4: diff= 4 → total= 3, curr= 5\ni=5: diff= 2 → total= 5, curr= 7\ni=6: diff= 0 → total= 5, curr= 7\ni=7: diff=-1 → total= 4, curr= 6\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 加油站
# 在一条环形路上有 n 个加油站，第 i 个加油站有 gas[i] 升油
# 从第 i 站开到第 i+1 站需要消耗 cost[i] 升油
# 找到唯一的出发站下标，使得按环形顺序走一周油箱不会变负
# 若不存在则返回 -1
#
# 示例:
#   gas  = [1, 5, 3, 3, 5, 3, 1, 4]
#   cost = [3, 2, 5, 3, 1, 1, 1, 5]
#   输出: 3 (从 3 出发即可绕环一周)

from typing import List

def can_complete_circuit(gas: List[int], cost: List[int]) -> int:
    \"\"\"返回能绕环一周的唯一出发站，无解则返回 -1。\"\"\"
    n = len(gas)
    total_tank = 0  # 全程净油量总和，判断是否有解
    curr_tank = 0   # 从 start 出发到当前的净油量
    start = 0       # 候选出发站

    for i in range(n):
        diff = gas[i] - cost[i]
        total_tank += diff
        curr_tank += diff
        if curr_tank < 0:
            start = i + 1  # start..i 都失败，下一站重试
            curr_tank = 0
    return start if total_tank >= 0 else -1"""
explanation = "**最终结果**\n\n✅ `gas=[1,5,3,3,5,3,1,4]`, `cost=[3,2,5,3,1,1,1,5]` → `3`\n\n遍历结束后：\n- 如果 `total_tank >= 0`，说明全程油够用，`start` 就是唯一合法起点\n- 否则整个环都跑不完，返回 `-1`\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 单次遍历 |\n| 空间复杂度 | O(1) — 只用三个变量 |\n\n**贪心核心**\n\n- **失败剪枝**：`curr_tank < 0` 时，`start..i` 全段跳过，下次从 `i+1` 重试\n- **唯一性**：题目保证答案唯一，因此找到的 `start` 就是最终解\n- **充分性**：若 `total_tank >= 0`，从 `start` 出发一定能走完（已跳过所有失败前缀）"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 5, 3, 3, 5, 3, 1, 4]", result = "3", highlightedIndices = [3] }

[algorithm.summary]
timeComplexity = "O(n)"
