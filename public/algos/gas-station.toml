# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 加油站
# 在一条环形路上有 n 个加油站，第 i 个加油站有 gas[i] 升油
# 从第 i 站开到第 i+1 站需要消耗 cost[i] 升油
# 找到唯一的出发站下标，使得按环形顺序走一周油箱不会变负
# 若不存在则返回 -1
#
# 示例:
#   gas  = [1, 5, 3, 3, 5, 3, 1, 4]
#   cost = [3, 2, 5, 3, 1, 1, 1, 5]
#   输出: 3 (从 3 出发即可绕环一周)"""
explanation = "**问题分析**\n\n环形加油站问题：\n- `gas[i]`：在第 `i` 站能加的油\n- `cost[i]`：从第 `i` 站开到第 `i+1` 站消耗的油（`cost[n-1]` 是回到第 0 站的消耗）\n- 题目保证**有唯一解**或无解\n\n**两个关键观察**\n\n1. **总油量必须够**：`sum(gas) < sum(cost)` 一定无解\n2. **贪心剪枝**：如果从 `start` 出发到 `i` 就失败了，那么 `start..i` 之间任何站点出发都会失败——因为 `start..i` 的累计净油量已经够抵消，下一个尝试必然在 `i+1`\n\n> 这是 O(n) 的单次遍历算法，只需要 `total_tank`、`curr_tank`、`start` 三个变量。"
visualizationType = "intro"

