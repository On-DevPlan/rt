# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 汇总区间
# 给定一个无重复元素的有序整数数组 nums
# 返回恰好覆盖数组中所有数字的最小有序区间列表
#
# 输出规则:
#   nums 中每个数字都恰好被某个区间覆盖，且不被覆盖到不属于 nums 的数字
#   区间用 "a->b" 表示两端都包含；单个数字用 "a"
#
# 示例:
#   nums = [0, 1, 2, 4, 5, 7]   → ["0->2", "4->5", "7"]
#   nums = [0, 2, 3, 4, 6, 8, 9] → ["0", "2->4", "6", "8->9"]"""
explanation = "**问题分析**\n\n给定**无重复、有序**的整数数组，把连续的数字合并成区间：\n\n- 连续区间：`a, a+1, a+2, ..., b` 写成 `\"a->b\"`\n- 单独数字：直接写成 `\"a\"`\n\n**关键观察**\n\n| 输入 | 输出 |\n|------|------|\n| `[0, 1, 2, 4, 5, 7]` | `[\"0->2\", \"4->5\", \"7\"]` |\n| `[0, 2, 3, 4, 6, 8, 9]` | `[\"0\", \"2->4\", \"6\", \"8->9\"]` |\n\n> 有序 + 无重复 → 相邻两个数字是否连续，仅需判断 `nums[i+1] == nums[i] + 1`。\n\n> 这是一道典型的**区间合并**问题，与「合并区间」共享相同的思路。"

visualizationType = "intro"

