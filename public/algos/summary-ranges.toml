# ── Step 2: 初始化指针 ──────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 汇总区间
# 给定一个无重复元素的有序整数数组 nums
# 返回恰好覆盖数组中所有数字的最小有序区间列表
#
# 输出规则:
#   nums 中每个数字都恰好被某个区间覆盖，且不被覆盖到不属于 nums 的数字
#   区间用 "a->b" 表示两端都包含；单个数字用 "a"
#
# 示例:
#   nums = [0, 1, 2, 4, 5, 7]   → ["0->2", "4->5", "7"]
#   nums = [0, 2, 3, 4, 6, 8, 9] → ["0", "2->4", "6", "8->9"]

from typing import List

def summaryRanges(nums: List[int]) -> List[str]:
    \"\"\"将有序无重复数组中的连续数字合并成区间。\"\"\"
    res = []
    i = 0
    n = len(nums)"""
explanation = "**第 2 步：初始化**\n\n```python\nres = []    # 收集每个区间字符串\ni = 0       # 当前扫描位置\nn = len(nums)  # 数组长度缓存\n```\n\n**双指针思路**\n\n| 变量 | 含义 |\n|------|------|\n| `i` | 当前扫描位置（快指针，向后探连续段尾） |\n| `start` | 当前区间的起始位置（慢指针） |\n| `res` | 收集结果 |\n\n> 外层 `while i < n` 每轮处理一个区间，处理完 `i` 自增进入下一段。"
visualizationType = "code-only"

# ── Step 3: 延伸区间 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "延伸区间"
titleEn = "Extend Range"
code = """# 汇总区间
# 给定一个无重复元素的有序整数数组 nums
# 返回恰好覆盖数组中所有数字的最小有序区间列表
#
# 输出规则:
#   nums 中每个数字都恰好被某个区间覆盖，且不被覆盖到不属于 nums 的数字
#   区间用 "a->b" 表示两端都包含；单个数字用 "a"
#
# 示例:
#   nums = [0, 1, 2, 4, 5, 7]   → ["0->2", "4->5", "7"]
#   nums = [0, 2, 3, 4, 6, 8, 9] → ["0", "2->4", "6", "8->9"]

from typing import List

def summaryRanges(nums: List[int]) -> List[str]:
    \"\"\"将有序无重复数组中的连续数字合并成区间。\"\"\"
    res = []
    i = 0
    n = len(nums)
    while i < n:
        start = i
        while i + 1 < n and nums[i+1] == nums[i] + 1:
            i += 1"""
explanation = "**第 3 步：内层循环延伸连续段**\n\n```python\nwhile i < n:                       # 外层：每个区间一轮\n    start = i                     # 记下区间起点\n    while i + 1 < n and nums[i+1] == nums[i] + 1:\n        i += 1                    # 内层：不断后移直到连续中断\n```\n\n**延伸条件** `nums[i+1] == nums[i] + 1`\n\n- 数组有序 → 下一个数比当前数大 1 即连续\n- 跳出内层时，`i` 指向当前区间的**末端**\n\n**示例** `nums = [0, 1, 2, 4, 5, 7]`：\n\n```\ni=0, start=0: nums[1]=1 == nums[0]+1=1 ✓ → i=1\ni=1, start=0: nums[2]=2 == nums[1]+1=2 ✓ → i=2\ni=2, start=0: nums[3]=4 == nums[2]+1=3? 否 → 跳出\n现在 i=2, start=0  → 区间 [0..2] = \"0->2\"\n```"
visualizationType = "code-only"

# ── Step 4: 输出区间并推进 ──────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "输出区间"
titleEn = "Output Range"
code = """# 汇总区间
# 给定一个无重复元素的有序整数数组 nums
# 返回恰好覆盖数组中所有数字的最小有序区间列表
#
# 输出规则:
#   nums 中每个数字都恰好被某个区间覆盖，且不被覆盖到不属于 nums 的数字
#   区间用 "a->b" 表示两端都包含；单个数字用 "a"
#
# 示例:
#   nums = [0, 1, 2, 4, 5, 7]   → ["0->2", "4->5", "7"]
#   nums = [0, 2, 3, 4, 6, 8, 9] → ["0", "2->4", "6", "8->9"]

from typing import List

def summaryRanges(nums: List[int]) -> List[str]:
    \"\"\"将有序无重复数组中的连续数字合并成区间。\"\"\"
    res = []
    i = 0
    n = len(nums)
    while i < n:
        start = i
        while i + 1 < n and nums[i+1] == nums[i] + 1:
            i += 1
        if start == i:
            res.append(str(nums[start]))
        else:
            res.append(f"{nums[start]}->{nums[i]}")
        i += 1
    return res"""
explanation = "**第 4 步：输出区间并推进 `i`**\n\n```python\nif start == i:                          # 单个数字\n    res.append(str(nums[start]))\nelse:                                   # 连续区间\n    res.append(f\"{nums[start]}->{nums[i]}\")\ni += 1                                  # 进入下一个区间起点\n```\n\n**判断逻辑**\n\n| 条件 | 输出格式 | 示例 |\n|------|---------|------|\n| `start == i` | `\"a\"` | `7` → `\"7\"` |\n| 否则 | `\"a->b\"` | `0,1,2` → `\"0->2\"` |\n\n**示例** `nums = [0, 1, 2, 4, 5, 7]`：\n\n```\nstart=0, i=2 → start≠i → res += \"0->2\" → i=3\nstart=3, i=4 → start≠i → res += \"4->5\" → i=5\nstart=5, i=5 → start==i → res += \"7\"  → i=6 → 循环结束\nres = [\"0->2\", \"4->5\", \"7\"] ✓\n```"
visualizationType = "code-only"

# ── Step 5: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 5
title = "完成"
titleEn = "Complete"
code = """# 汇总区间
# 给定一个无重复元素的有序整数数组 nums
# 返回恰好覆盖数组中所有数字的最小有序区间列表
#
# 输出规则:
#   nums 中每个数字都恰好被某个区间覆盖，且不被覆盖到不属于 nums 的数字
#   区间用 "a->b" 表示两端都包含；单个数字用 "a"
#
# 示例:
#   nums = [0, 1, 2, 4, 5, 7]   → ["0->2", "4->5", "7"]
#   nums = [0, 2, 3, 4, 6, 8, 9] → ["0", "2->4", "6", "8->9"]

from typing import List

def summaryRanges(nums: List[int]) -> List[str]:
    \"\"\"将有序无重复数组中的连续数字合并成区间。\"\"\"
    res = []
    i = 0
    n = len(nums)
    while i < n:
        start = i
        while i + 1 < n and nums[i+1] == nums[i] + 1:
            i += 1
        if start == i:
            res.append(str(nums[start]))
        else:
            res.append(f"{nums[start]}->{nums[i]}")
        i += 1
    return res"""
explanation = "**最终结果**\n\n✅ `nums = [0, 1, 2, 4, 5, 7]` → `[\"0->2\", \"4->5\", \"7\"]`\n\n✅ `nums = [0, 2, 3, 4, 6, 8, 9]` → `[\"0\", \"2->4\", \"6\", \"8->9\"]`\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个元素最多被访问两次（外层 + 内层） |\n| 空间复杂度 | O(1) — 不计输出，仅用常数个变量 |\n\n**核心思想**\n\n- 利用**有序 + 无重复**两个前提，相邻数字只需比较 `nums[i+1] == nums[i] + 1`\n- 内层 while 向后延伸连续段，外层 while 处理下一段\n- 单元素与区间通过 `start == i` 区分——简洁而自然"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[0, 1, 2, 4, 5, 7]", result = "[\"0->2\", \"4->5\", \"7\"]", highlightedIndices = [0, 1, 2, 3, 4, 5] }

