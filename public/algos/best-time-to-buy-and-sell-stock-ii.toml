# ── Step 2: 初始化变量 ────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化利润累加器"
titleEn = "Initialize Profit"
code = """# 买卖股票的最佳时机 II
# 给定一个整数数组 prices，其中 prices[i] 表示某支股票第 i 天的价格
# 可以在任意一天买入或卖出，但同时最多只能持有一股股票
# 求能获得的最大利润
#
# 与 lc121 的区别：本题可以多次买卖，但同一时刻只能持有一股
#
# 示例:
#   prices = [7,1,5,3,6,4]
#   最佳交易: 第 2 天买入 (1), 第 3 天卖出 (5), 利润 4
#             第 4 天买入 (3), 第 5 天卖出 (6), 利润 3
#   总利润: 4 + 3 = 7

from typing import List

def maxProfit(prices: List[int]) -> int:
    \"\"\"计算可多次买卖时能获得的最大利润。\"\"\"
    profit = 0  # 累计利润"""
explanation = "**第 2 步：初始化累加器**\n\n只需一个变量 `profit` 累计所有上涨波段的差值：\n\n```\nprices = [7, 1, 5, 3, 6, 4]\n          ↓  ↓  ↓  ↓  ↓  ↓\ndiff[i] = prices[i] - prices[i-1]\n        = [_, -6, 4, -2, 3, -2]\nprofit = max(0,-6) + max(0,4) + max(0,-2) + max(0,3) + max(0,-2)\n       = 0 + 4 + 0 + 3 + 0 = 7\n```\n\n| 变量 | 用途 | 初始值 |\n|------|------|--------|\n| `profit` | 累计利润总和 | `0` |\n\n> 不用单独维护「是否持仓」状态——贪心把每段上涨单独结算即可。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历并累加"
titleEn = "Iterate and Accumulate"
code = """# 买卖股票的最佳时机 II
# 给定一个整数数组 prices，其中 prices[i] 表示某支股票第 i 天的价格
# 可以在任意一天买入或卖出，但同时最多只能持有一股股票
# 求能获得的最大利润
#
# 与 lc121 的区别：本题可以多次买卖，但同一时刻只能持有一股
#
# 示例:
#   prices = [7,1,5,3,6,4]
#   最佳交易: 第 2 天买入 (1), 第 3 天卖出 (5), 利润 4
#             第 4 天买入 (3), 第 5 天卖出 (6), 利润 3
#   总利润: 4 + 3 = 7

from typing import List

def maxProfit(prices: List[int]) -> int:
    \"\"\"计算可多次买卖时能获得的最大利润。\"\"\"
    profit = 0  # 累计利润
    for i in range(1, len(prices)):
        diff = prices[i] - prices[i - 1]
        if diff > 0:
            profit += diff"""
explanation = "**第 3 步：遍历计算相邻差，只累加正差**\n\n从 `i = 1` 开始遍历每一天，计算与前一天的价差：\n\n```python\ndiff = prices[i] - prices[i - 1]\nif diff > 0:\n    profit += diff\n```\n\n**示例执行：**\n\n```\nprices = [7, 1, 5, 3, 6, 4]\n\ni=1: diff = 1 - 7 = -4  → 不操作\ni=2: diff = 5 - 1 =  4  → profit = 4\ni=3: diff = 3 - 5 = -2  → 不操作\ni=4: diff = 6 - 3 =  3  → profit = 7\ni=5: diff = 4 - 6 = -2  → 不操作\n\n最终 profit = 7\n```\n\n**贪心正确性**\n\n| 等价解释 | 说明 |\n|---------|------|\n| 上涨段累加 | 把 `[1→5→6]` 看作两段独立上涨 |\n| 局部最优 = 全局最优 | 每段上升都「吃满」，不与其它段冲突 |\n\n> 如果不喜欢 `if`，可以一行写成 `profit += max(0, diff)`。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 买卖股票的最佳时机 II
# 给定一个整数数组 prices，其中 prices[i] 表示某支股票第 i 天的价格
# 可以在任意一天买入或卖出，但同时最多只能持有一股股票
# 求能获得的最大利润
#
# 与 lc121 的区别：本题可以多次买卖，但同一时刻只能持有一股
#
# 示例:
#   prices = [7,1,5,3,6,4]
#   最佳交易: 第 2 天买入 (1), 第 3 天卖出 (5), 利润 4
#             第 4 天买入 (3), 第 5 天卖出 (6), 利润 3
#   总利润: 4 + 3 = 7

from typing import List

def maxProfit(prices: List[int]) -> int:
    \"\"\"计算可多次买卖时能获得的最大利润。\"\"\"
    profit = 0  # 累计利润
    for i in range(1, len(prices)):
        diff = prices[i] - prices[i - 1]
        if diff > 0:
            profit += diff
    return profit"""
explanation = "**最终结果**\n\n✅ 贪心累加完成\n\n```\n输入: prices = [7, 1, 5, 3, 6, 4]\n输出: 7\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 一次遍历 |\n| 空间复杂度 | O(1) — 只用一个累加器 |\n\n**贪心正确性回顾**\n\n- 任意「低买高卖」段都可以拆解为一系列相邻上涨 `(a[i-1], a[i])`\n- 段内利润 `= sum(正向差)`\n- 因此「最大化总利润」等价于「把所有正向差加起来」\n\n**扩展：DP 解法对比**\n\n若改用 DP，可定义 `cash`（不持仓最大利润）和 `hold`（持仓最大利润）：\n\n```python\ncash, hold = 0, -prices[0]\nfor p in prices[1:]:\n    cash = max(cash, hold + p)\n    hold = max(hold, cash - p)\nreturn cash\n```\n\n> DP 与贪心在此题上**得到相同结果**，因为「无交易手续费、无冷却期」的约束让两者等价。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[7, 1, 5, 3, 6, 4]", result = "7", highlightedIndices = [1, 2, 3, 4] }

[algorithm.summary]
timeComplexity = "O(n)"
spaceComplexity = "O(1)"
approach = "贪心（累加所有正向相邻差）"
keyInsight = "所有上涨波段之和 = 最大利润，等价于累加 max(0, prices[i] - prices[i-1])"