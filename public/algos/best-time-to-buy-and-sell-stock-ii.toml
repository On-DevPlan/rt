# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 买卖股票的最佳时机 II
# 给定一个整数数组 prices，其中 prices[i] 表示某支股票第 i 天的价格
# 可以在任意一天买入或卖出，但同时最多只能持有一股股票
# 求能获得的最大利润
#
# 与 lc121 的区别：本题可以多次买卖，但同一时刻只能持有一股
#
# 示例:
#   prices = [7,1,5,3,6,4]
#   最佳交易: 第 2 天买入 (1), 第 3 天卖出 (5), 利润 4
#             第 4 天买入 (3), 第 5 天卖出 (6), 利润 3
#   总利润: 4 + 3 = 7"""
explanation = "**问题分析**\n\n给定股票每天的价格数组 `prices`：\n- 每天可以**买入、卖出或不操作**\n- **同一时刻最多持有一股**（不能同时持有多股）\n- 目标是最大化累计利润\n\n**贪心核心思想**\n\n把所有**上涨**的波段都抓住，所有下跌的波段都跳过：\n\n| 策略 | 说明 |\n|------|------|\n| 价格上涨 | 持有昨日 + 今日差价 = 当日卖出 |\n| 价格下跌 | 不操作（昨日已卖则无损失） |\n\n> 数学等价：把问题拆成 `(n-1)` 个相邻差，只取正的差累加。\n> 结果与「寻找所有上升段」的解完全相同，但实现更简洁。"
visualizationType = "intro"

