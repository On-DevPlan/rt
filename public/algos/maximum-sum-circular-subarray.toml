# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 918. 环形子数组的最大和
# 给定一个环形数组，求其最大子数组和
# 环形数组指：数组尾部连接头部，形成环状
#
# 关键思路:
#   最大子数组有两种情况：
#   1. 不跨越尾部 — 普通最大子数组和（Kadane）
#   2. 跨越尾部 — 总和 - 最小子数组和
#   特殊情况: 全负数时，结果就是普通最大子数组
#
# 示例:
#   nums = [1,-2,3,-2]
#   普通最大子数组: [3] = 3
#   环形最大子数组: [3] + [1] = 4（但实际是 3）
#   结果: 3"""
explanation = "**问题分析**\n\n环形数组的特点是**尾部连接头部**，最大子数组有两种情况：\n\n| 类型 | 说明 | 示例（`[1,-2,3,-2]`） |\n|------|------|------------------------|\n| 不跨越尾部 | 普通最大子数组 | `[3]` = 3 |\n| 跨越尾部 | 总和 - 最小子数组 | `1+(-2)+3+(-2) - (-2) = 0` |\n\n**核心算法：Kadane 变体**\n\n需要同时计算：\n- `max_sum`：普通最大子数组和\n- `min_sum`：最小子数组和（用于环形情况）\n- `total`：数组总和\n\n> 环形最大和 = `max(max_sum, total - min_sum)`\n> \n> 特殊情况：如果所有数都是负数，`total - min_sum = 0`（空子数组），但题目不允许空子数组，所以直接返回 `max_sum`"
visualizationType = "intro"

