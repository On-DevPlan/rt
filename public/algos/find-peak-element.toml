# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 162. 寻找峰值
# 找出数组中的峰值元素（峰值 > 相邻元素）
#
# 问题定义:
#   给定一个长度为 n 的数组 nums
#   峰值是指严格大于相邻元素的元素
#   nums[-1] = nums[n] = -∞（边界外视为负无穷）
#   返回任意一个峰值的索引
#
# 示例:
#   nums = [1,2,3,1]
#   峰值是 3（索引 2），因为 3 > 2 且 3 > 1
#   返回 2"""
explanation = "**问题分析**\n\n给定数组 `nums = [1,2,3,1]`：\n- `3`（索引 2）是峰值，因为 `3 > 2` 且 `3 > 1`\n- 边界外视为 `-∞`，所以首尾元素也可能是峰值\n- 返回**任意一个**峰值索引即可\n\n**关键洞察**\n\n| 暴力 | 二分查找（爬坡） |\n|------|-------------------|\n| O(n) 遍历 | **O(log n)** |\n| 逐个比较相邻 | 比较中点与右侧 |\n\n> 二分查找的核心：比较 `mid` 与 `mid+1`，判断哪边有峰值。\n\n- 如果 `nums[mid] < nums[mid+1]`：在**上升**，峰值在**右边**\n- 否则：峰值在**左边**或 `mid` 就是峰值"
visualizationType = "intro"

