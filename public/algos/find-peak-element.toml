# ── Step 3: 二分查找循环 ────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "二分查找"
titleEn = "Binary Search"
code = """# 162. 寻找峰值
# 找出数组中的峰值元素（峰值 > 相邻元素）
#
# 问题定义:
#   给定一个长度为 n 的数组
#   峰值是指严格大于相邻元素的元素
#   nums[-1] = nums[n] = -∞（边界外视为负无穷）
#   返回任意一个峰值的索引
#
# 示例:
#   nums = [1,2,3,1]
#   峰值是 3（索引 2），因为 3 > 2 且 3 > 1
#   返回 2

from typing import List

def findPeakElement(nums: List[int]) -> int:
    \"\"\"返回峰值索引。\"\"\"
    left, right = 0, len(nums) - 1
    while left < right:
        mid = (left + right) // 2"""
explanation = "**第 3 步：设置二分循环**\n\n**循环条件：`left < right`**\n\n- 当 `left == right` 时，区间收敛为一个元素，它就是峰值\n- `while left < right` 保证至少有两个元素时继续二分\n\n**中点计算**\n\n```\nmid = (left + right) // 2\n```\n\n对于 `nums = [1,2,3,1]`：\n- 初始：`left=0, right=3, mid=1`（值 2）"
visualizationType = "code-only"

# ── Step 4: 爬坡逻辑 ────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "爬坡逻辑"
titleEn = "Climbing Logic"
code = """# 162. 寻找峰值
# 找出数组中的峰值元素（峰值 > 相邻元素）
#
# 问题定义:
#   给定一个长度为 n 的数组
#   峰值是指严格大于相邻元素的元素
#   nums[-1] = nums[n] = -∞（边界外视为负无穷）
#   返回任意一个峰值的索引
#
# 示例:
#   nums = [1,2,3,1]
#   峰值是 3（索引 2），因为 3 > 2 且 3 > 1
#   返回 2

from typing import List

def findPeakElement(nums: List[int]) -> int:
    \"\"\"返回峰值索引。\"\"\"
    left, right = 0, len(nums) - 1
    while left < right:
        mid = (left + right) // 2
        if nums[mid] < nums[mid + 1]:
            left = mid + 1
        else:
            right = mid
    return left"""
explanation = "**第 4 步：实现爬坡逻辑**\n\n**核心判断**\n\n```\nif nums[mid] < nums[mid + 1]:\n    left = mid + 1  # 在上升，峰值在右边\nelse:\n    right = mid     # 在下降，峰值在左边或就是 mid\n```\n\n| 情况 | 判断 | 动作 | 原因 |\n|------|------|------|------|\n| 上升 | `nums[mid] < nums[mid+1]` | `left = mid + 1` | 峰值在右边 |\n| 下降 | `nums[mid] >= nums[mid+1]` | `right = mid` | 峰值在左边或 mid |\n\n**示例执行：**\n\n```\nnums = [1, 2, 3, 1]\n\nleft=0, right=3, mid=1:  nums[1]=2 < nums[2]=3? 是 → left=2\nleft=2, right=3, mid=2:  nums[2]=3 < nums[3]=1? 否 → right=2\nleft == right → 返回 2（峰值索引） ✓\n```"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 2, 3, 1]", result = "2", highlightedIndices = [2] }

