# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 201. 数字范围按位与
# 计算区间 [left, right] 所有数字的按位与
#
# 示例:
#   left = 5, right = 7
#   计算: 5 & 6 & 7
#   5  = 101 (二进制)
#   6  = 110
#   7  = 111
#   结果: 101 & 110 & 111 = 100 = 4
#
# 关键观察: 当 left != right 时，范围内至少有两个数字
# 某些位既有 0 也有 1，按位与后这些位变成 0
# 只保留 left 和 right 的公共前缀"""
explanation = "**问题分析**\\n\\n给定区间 `[left, right]`，计算所有数字的按位与。\\n\\n**暴力解法的问题**\\n\\n| 方法 | 时间 | 空间 |\\n|------|------|------|\\n| 遍历区间逐个与运算 | O(right-left) | O(1) |\\n\\n当区间很大时（如 `[1, 2147483647]`），会超时。\\n\\n**关键观察：找公共前缀**\\n\\n```\\nleft  = 5  = 101\\nright = 7  = 111\\n              ^^^\\n              公共前缀 = 1\\n\\n不断右移直到相等:\\n101 → 10 → 1\\n111 → 11 → 1\\n\\nshift = 2，最后左移 2 位: 1 << 2 = 100 = 4\\n```\\n\\n> 当 `left != right` 时，最低位一定有差异（既有 0 也有 1），该位最终结果是 0。不断右移消除最低位差异，直到 `left == right`，剩下的就是公共前缀。"
visualizationType = "intro"

