# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 找出字符串中第一个匹配项的下标
# 给定两个字符串 haystack 和 needle
# 在 haystack 中找出 needle 第一次出现的下标
# 若 needle 不是 haystack 的一部分，返回 -1
#
# 特殊条件:
#   若 needle 为空字符串，返回 0
#   needle 长度大于 haystack 时直接返回 -1
#
# 示例:
#   haystack = "sadbutsad", needle = "sad"  → 0
#   haystack = "leetcode",  needle = "leeto" → -1"""
explanation = "**问题分析**\n\n- 输入：`haystack`（主串）、`needle`（模式串）\n- 输出：`needle` 首次出现在 `haystack` 中的**下标**\n- 若不存在则返回 `-1`；`needle` 为空串时返回 `0`\n\n**三种解法对比**\n\n| 方法 | 时间 | 空间 | 思路 |\n|------|------|------|------|\n| **内置 `find`** | 通常 O(m+n) | O(1) | 调库，CPython 内部用混合实现 |\n| 朴素匹配 | O(m·n) | O(1) | 逐位滑动，逐字符比对 |\n| **KMP** | **O(m+n)** | O(n) | 预处理 next 数组，跳过已知匹配 |\n\n> 本题实际工程中直接用 `haystack.find(needle)` 即可，复杂度足够。理解**朴素匹配**有助于理解 **KMP** 的优化点。"
visualizationType = "intro"

