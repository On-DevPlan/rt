# ── Step 2: 边界检查 + 获取长度 ────────────────────────────────
[[algorithm.steps]]
id = 2
title = "边界与初始化"
titleEn = "Edge Cases and Init"
code = """# 找出字符串中第一个匹配项的下标
# 给定两个字符串 haystack 和 needle
# 在 haystack 中找出 needle 第一次出现的下标
# 若 needle 不是 haystack 的一部分，返回 -1
#
# 特殊条件:
#   若 needle 为空字符串，返回 0
#   needle 长度大于 haystack 时直接返回 -1
#
# 示例:
#   haystack = "sadbutsad", needle = "sad"  → 0
#   haystack = "leetcode",  needle = "leeto" → -1

from typing import List

def strStr(haystack: str, needle: str) -> int:
    \"\"\"返回 needle 在 haystack 中首次出现的下标，不存在则返回 -1。\"\"\"
    m, n = len(haystack), len(needle)
    if n == 0:
        return 0
    if n > m:
        return -1"""
explanation = "**第 2 步：边界检查 + 长度记录**\n\n```python\nm, n = len(haystack), len(needle)   # 主串长 m，模式串长 n\nif n == 0:  return 0                 # 空串视为下标 0 处匹配\nif n > m:   return -1                # 模式串更长，不可能匹配\n```\n\n**为什么主循环范围是 `m - n + 1`？**\n\n最后一个可能的起始位置是 `m - n`：再往后切 `n` 个字符就越界了，所以上限开区间到 `m - n + 1`（不含）。\n\n> 边界先行可以避免后面切片时再做越界判断，代码更简洁。"
visualizationType = "code-only"

# ── Step 3: 朴素匹配核心 ──────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "朴素匹配"
titleEn = "Naive Match"
code = """# 找出字符串中第一个匹配项的下标
# 给定两个字符串 haystack 和 needle
# 在 haystack 中找出 needle 第一次出现的下标
# 若 needle 不是 haystack 的一部分，返回 -1
#
# 特殊条件:
#   若 needle 为空字符串，返回 0
#   needle 长度大于 haystack 时直接返回 -1
#
# 示例:
#   haystack = "sadbutsad", needle = "sad"  → 0
#   haystack = "leetcode",  needle = "leeto" → -1

from typing import List

def strStr(haystack: str, needle: str) -> int:
    \"\"\"返回 needle 在 haystack 中首次出现的下标，不存在则返回 -1。\"\"\"
    m, n = len(haystack), len(needle)
    if n == 0:
        return 0
    if n > m:
        return -1
    for i in range(m - n + 1):
        if haystack[i:i+n] == needle:
            return i"""
explanation = "**第 3 步：朴素匹配 — 滑动窗口**\n\n```python\nfor i in range(m - n + 1):\n    if haystack[i:i+n] == needle:\n        return i\nreturn -1\n```\n\n**核心动作**：\n\n| 步骤 | 操作 |\n|------|------|\n| 1 | 起始位置 `i` 从 0 滑到 `m-n` |\n| 2 | 取窗口 `haystack[i:i+n]`（长度恒为 `n`） |\n| 3 | 与 `needle` 比对，命中即返回 `i` |\n\n**示例执行（`haystack=\"sadbutsad\"`, `needle=\"sad\"`）：**\n\n```\ni=0: \"sad\" == \"sad\"  → 命中，返回 0\n\n（若 needle=\"leeto\"）\ni=0: \"leetc\" != \"leeto\"\ni=1: \"eetco\" != \"leeto\"\n... 全部失配 → 返回 -1\n```\n\n> 切片 `haystack[i:i+n]` 在 Python 中是 O(n) 操作，朴素匹配总体仍是 O(m·n)。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 找出字符串中第一个匹配项下标
# 给定两个字符串 haystack 和 needle
# 在 haystack 中找出 needle 第一次出现的下标
# 若 needle 不是 haystack 的一部分，返回 -1
#
# 特殊条件:
#   若 needle 为空字符串，返回 0
#   needle 长度大于 haystack 时直接返回 -1
#
# 示例:
#   haystack = "sadbutsad", needle = "sad"  → 0
#   haystack = "leetcode",  needle = "leeto" → -1

from typing import List

def strStr(haystack: str, needle: str) -> int:
    \"\"\"返回 needle 在 haystack 中首次出现的下标，不存在则返回 -1。\"\"\"
    m, n = len(haystack), len(needle)
    if n == 0:
        return 0
    if n > m:
        return -1
    for i in range(m - n + 1):
        if haystack[i:i+n] == needle:
            return i
    return -1"""
explanation = "**最终结果**\n\n✅ 完整的朴素匹配实现\n\n**Python 一行版（工程实践）：**\n\n```python\nreturn haystack.find(needle)    # 等价行为：未找到返回 -1\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 朴素匹配 | O(m·n) 时间 / O(1) 空间 |\n| KMP | O(m+n) 时间 / O(n) 空间 |\n| 内置 `find` | 通常 O(m+n) / O(1) |\n\n**三种解法权衡**\n\n- **面试手写**：朴素匹配 → 易讲清；进阶可提 KMP\n- **工程实战**：直接 `haystack.find(needle)`，CPython 内部用 Two-Way + 优化\n- **KMP 适用**：多次匹配同一 `needle`（预计算 next 数组后均摊 O(m+n)）\n\n**关键技巧**\n\n- 边界先行：空串返回 0，长度不足直接 -1\n- 滑动窗口：循环范围 `m - n + 1` 是闭区间上限\n- 切片 `s[i:i+n]` 自动处理越界（不会抛异常），省去判断"
