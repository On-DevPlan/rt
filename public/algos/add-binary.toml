# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 二进制求和
# 给定两个二进制字符串，返回它们的和（也表示为二进制字符串）
#
# 示例:
#   输入: a = \"11\", b = \"1\"
#   输出: \"100\"
#
#   11 (3)
# +  1 (1)
# ──────
#  100 (4)"""
explanation = "**问题分析**\n\n将两个二进制字符串相加，返回二进制结果。\n\n**核心思路：模拟手工加法**\n\n从右向左逐位相加，维护进位。每位计算 sum = bit_a + bit_b + carry，当前位为 sum % 2，进位为 sum // 2。\n\n| 方法 | 时间 | 空间 |\n|------|------|------|\n| 转十进制再转回 | O(max(m,n)) | O(max(m,n)) |\n| **直接模拟加法** | **O(max(m,n))** | **O(max(m,n))** |"
visualizationType = "intro"

