# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 105. 从前序与中序遍历序列构造二叉树
# 给定一棵树的前序遍历与中序遍历，请构造二叉树并返回其根节点
#
# 假设树中节点的值互不相同
#
# 示例:
#   preorder = [3, 9, 20, 15, 7]
#   inorder  = [9, 3, 15, 20, 7]
#   重建的二叉树 (层序):
#         3
#        / \\
#       9   20
#          /  \\
#         15   7
#   期望输出: [3, 9, 20, null, null, 15, 7]"""
explanation = "**问题分析**\n\n已知一棵二叉树的**前序遍历**（根-左-右）和**中序遍历**（左-根-右），还原这棵二叉树。\n\n**关键观察**\n\n- 前序遍历的第一个元素一定是**当前子树的根**\n- 在中序遍历中找到该根的位置，**左侧是左子树的中序**，**右侧是右子树的中序**\n- 由此可确定左子树的节点数量 `left_size`，从而把前序数组也切分成左/右子树部分\n- 递归构造即可\n\n**算法策略**\n\n| 步骤 | 操作 |\n|------|------|\n| 1 | `preorder[0]` 为根 |\n| 2 | 在 `inorder` 中定位根 → 切分左右子树 |\n| 3 | 哈希表 `idx_map` 把 O(n) 查找降到 O(1) |\n| 4 | 递归构造左右子树 |\n\n> 难点是**边界计算**。下面用 `pre_l / pre_r / in_l / in_r` 四个下标把递归写清爽。"
visualizationType = "intro"

# ── Step 1: 签名 + TreeNode + 哈希表 + build + base case ────
[[algorithm.steps]]
id = 1
title = "签名与骨架"
