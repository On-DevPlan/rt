    \"\"\"由前序+中序遍历重建二叉树\"\"\"
    idx_map = {v: i for i, v in enumerate(inorder)}
    def build(pre_l: int, pre_r: int, in_l: int, in_r: int) -> Optional[TreeNode]:
        if pre_l > pre_r:
            return None
        pass
    return build(0, len(preorder) - 1, 0, len(inorder) - 1)"""
explanation = "**第 1 步：搭建代码骨架**\n\n- 定义 `TreeNode` 节点类\n- 用 `idx_map` 把 `inorder` 中每个值映射到下标 → **O(1) 定位**\n- 内层 `build(pre_l, pre_r, in_l, in_r)` 用**闭区间下标**描述当前子树在前序/中序数组里的范围\n- `pre_l > pre_r` 表示区间为空（base case）\n- 最外层 `buildTree` 调用 `build(0, n-1, 0, n-1)` 启动\n\n> 用闭区间下标可以避免频繁 `slice`（切片会复制数组，是 O(n) 的）。"
visualizationType = "code-only"

# ── Step 2: 选根 + 查 idx + 算 left_size ────────────────────
[[algorithm.steps]]
id = 2
title = "确定根与左子树规模"
titleEn = "Pick Root and Left Size"
code = """# 105. 从前序与中序遍历序列构造二叉树
# 给定一棵树的前序遍历与中序遍历，请构造二叉树并返回其根节点
#
# 假设树中节点的值互不相同
#
# 示例:
#   preorder = [3, 9, 20, 15, 7]
#   inorder  = [9, 3, 15, 20, 7]
#   重建的二叉树 (层序):
#         3
#        / \\
#       9   20
#          /  \\
#         15   7
#   期望输出: [3, 9, 20, null, null, 15, 7]

from typing import List, Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def buildTree(preorder: List[int], inorder: List[int]) -> Optional[TreeNode]:
    \"\"\"由前序+中序遍历重建二叉树\"\"\"
    idx_map = {v: i for i, v in enumerate(inorder)}
    def build(pre_l: int, pre_r: int, in_l: int, in_r: int) -> Optional[TreeNode]:
        if pre_l > pre_r:
            return None
        root_val = preorder[pre_l]
        root = TreeNode(root_val)
        idx = idx_map[root_val]
        left_size = idx - in_l
        return root
    return build(0, len(preorder) - 1, 0, len(inorder) - 1)"""
explanation = "**第 2 步：选根 + 定位 + 算左子树规模**\n\n```\npreorder: [3, 9, 20, 15, 7]    pre_l=0, pre_r=4\ninorder:  [9, 3, 15, 20, 7]   in_l=0,  in_r=4\n```\n\n| 变量 | 含义 | 示例值 |\n|------|------|--------|\n| `root_val` | 前序首位 = 当前根 | `3` |\n| `root` | 新建根节点 | `TreeNode(3)` |\n| `idx` | 根在中序中的位置 | `1`（`inorder[1]=3`）|\n| `left_size` | 左子树节点数 = `idx - in_l` | `1 - 0 = 1` |\n\n> `left_size` 是后续切分前序数组的关键。"
visualizationType = "code-only"

# ── Step 3: 递归调用 + 赋值 left/right ──────────────────────
[[algorithm.steps]]
id = 3
title = "递归构造左右子树"
titleEn = "Recurse on Left and Right"
code = """# 105. 从前序与中序遍历序列构造二叉树
# 给定一棵树的前序遍历与中序遍历，请构造二叉树并返回其根节点
#
# 假设树中节点的值互不相同
#
# 示例:
#   preorder = [3, 9, 20, 15, 7]
#   inorder  = [9, 3, 15, 20, 7]
#   重建的二叉树 (层序):
#         3
#        / \\
#       9   20
#          /  \\
#         15   7
#   期望输出: [3, 9, 20, null, null, 15, 7]

from typing import List, Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def buildTree(preorder: List[int], inorder: List[int]) -> Optional[TreeNode]:
    \"\"\"由前序+中序遍历重建二叉树\"\"\"
    idx_map = {v: i for i, v in enumerate(inorder)}
    def build(pre_l: int, pre_r: int, in_l: int, in_r: int) -> Optional[TreeNode]:
        if pre_l > pre_r:
            return None
        root_val = preorder[pre_l]
        root = TreeNode(root_val)
        idx = idx_map[root_val]
        left_size = idx - in_l
        root.left = build(pre_l + 1, pre_l + left_size, in_l, idx - 1)
        root.right = build(pre_l + left_size + 1, pre_r, idx + 1, in_r)
        return root
    return build(0, len(preorder) - 1, 0, len(inorder) - 1)"""
explanation = "**第 3 步：递归构造左右子树**\n\n以 `pre_l + left_size` 为分界，把前序切成「左子树段」和「右子树段」：\n\n| 子树 | 前序范围 | 中序范围 |\n|------|----------|----------|\n| 左 | `[pre_l+1, pre_l+left_size]` | `[in_l, idx-1]` |\n| 右 | `[pre_l+left_size+1, pre_r]` | `[idx+1, in_r]` |\n\n**示例切分**\n\n```\nleft_size = 1\npreorder:  [3 | 9 | 20, 15, 7]   ← 左=1个元素，右=3个元素\ninorder:   [9 | 3 | 15, 20, 7]   ← idx=1，左=[0..0]=9，右=[2..4]=15,20,7\n```\n\n> 中序的左/右切分很自然（`in_l..idx-1` / `idx+1..in_r`），前序的切分则用 `left_size` 偏移。\n> 递归返回后 `root.left` / `root.right` 自然挂上，函数返回 `root`。"
visualizationType = "code-only"

