# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 合并两个有序链表
# 将两个升序链表合并为一个升序链表，返回新链表的头节点。
#
# 链表节点定义:
#   class ListNode:
#       def __init__(self, x):
#           self.val = x
#           self.next = None
#
# 示例:
#   l1 = [1, 2, 4]
#   l2 = [1, 3, 4]
#   结果: [1, 1, 2, 3, 4, 4]"""
explanation = "**问题分析**\n\n输入是两个**已按升序排列**的链表，需要把它们合并成一条仍然升序的链表。\n\n**直观思路**\n\n- 像拉拉链一样，两个指针 `l1` / `l2` 分别指向当前待比较的节点\n- 每次把较小（或相等）的节点接到结果链表尾部，对应指针前进一步\n- 直到某一条链表耗尽，再把另一条剩余的整段接上\n\n**为什么用 dummy 节点？**\n\n| 方式 | 代码 | 体验 |\n|------|------|------|\n| 不带 dummy | 需特判第一个节点 | 边界繁琐 |\n| **带 dummy** | `dummy = ListNode(0)`，最后返回 `dummy.next` | 统一处理，代码更简洁 |\n\n> **关键洞察**：dummy 充当哨兵，让结果链表的头节点处理与其他节点完全一致。"
visualizationType = "intro"

