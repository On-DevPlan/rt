    pass"""
explanation = "**第 1 步：定义节点与函数签名**\n\n- `ListNode`：标准的链表节点，包含 `val` 和 `next`\n- `mergeTwoLists` 接收两个 `Optional[ListNode]`，返回合并后的链表头\n- 类型注解明确输入输出，方便静态检查\n- 文档字符串说明用途"
