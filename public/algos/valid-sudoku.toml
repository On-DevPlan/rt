# ── Step 2: 初始化三个集合数组 ─────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化集合"
titleEn = "Initialize Sets"
code = """# 有效的数独
# 判断一个 9x9 数独棋盘是否有效（不要求可解）
# 规则:
#   - 数字 1-9 在每一行只能出现一次
#   - 数字 1-9 在每一列只能出现一次
#   - 数字 1-9 在每个 3x3 子宫内只能出现一次
#   - 空格子用 '.' 表示
#
# 示例 (有效):
#   board = [
#     ["5","3",".",".","7",".",".",".","."],
#     ["6",".",".","1","9","5",".",".","."],
#     [".","9","8",".",".",".",".","6","."],
#     ["8",".",".",".","6",".",".",".","3"],
#     ["4",".",".","8",".","3",".",".","1"],
#     ["7",".",".",".","2",".",".",".","6"],
#     [".","6",".",".",".",".","2","8","."],
#     [".",".",".","4","1","9",".",".","5"],
#     [".",".",".",".","8",".",".","7","9"]
#   ]
#   结果: True

from typing import List

def isValidSudoku(board: List[List[str]]) -> bool:
    \"\"\"判断 9x9 数独棋盘是否有效。\"\"\"
    rows = [set() for _ in range(9)]
    cols = [set() for _ in range(9)]
    boxes = [set() for _ in range(9)]"""
explanation = "**第 2 步：初始化三组集合**\n\n为「行」「列」「宫」各准备一个长度为 9 的集合数组，每个集合记录该位置已出现的数字。\n\n```python\nrows  = [set() for _ in range(9)]   # 9 行\ncols  = [set() for _ in range(9)]   # 9 列\nboxes = [set() for _ in range(9)]   # 9 个 3x3 宫\n```\n\n**为什么用 set？**\n\n- `set` 的 `in` / `add` 操作平均 **O(1)**\n- 自动去重，天然适配「不能重复」的约束\n\n**结构示意**\n\n| 索引 | 含义 |\n|------|------|\n| `rows[i]` | 第 `i` 行已出现的数字 |\n| `cols[j]` | 第 `j` 列已出现的数字 |\n| `boxes[bi]` | 第 `bi` 个 3x3 宫已出现的数字 |"
visualizationType = "code-only"

# ── Step 3: 遍历检查 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历检查"
titleEn = "Iterate and Check"
code = """# 有效的数独
# 判断一个 9x9 数独棋盘是否有效（不要求可解）
# 规则:
#   - 数字 1-9 在每一行只能出现一次
#   - 数字 1-9 在每一列只能出现一次
#   - 数字 1-9 在每个 3x3 子宫内只能出现一次
#   - 空格子用 '.' 表示
#
# 示例 (有效):
#   board = [
#     ["5","3",".",".","7",".",".",".","."],
#     ["6",".",".","1","9","5",".",".","."],
#     [".","9","8",".",".",".",".","6","."],
#     ["8",".",".",".","6",".",".",".","3"],
#     ["4",".",".","8",".","3",".",".","1"],
#     ["7",".",".",".","2",".",".",".","6"],
#     [".","6",".",".",".",".","2","8","."],
#     [".",".",".","4","1","9",".",".","5"],
#     [".",".",".",".","8",".",".","7","9"]
#   ]
#   结果: True

from typing import List

def isValidSudoku(board: List[List[str]]) -> bool:
    \"\"\"判断 9x9 数独棋盘是否有效。\"\"\"
    rows = [set() for _ in range(9)]
    cols = [set() for _ in range(9)]
    boxes = [set() for _ in range(9)]
    for i in range(9):
        for j in range(9):
            v = board[i][j]
            if v == '.': continue
            bi = (i // 3) * 3 + (j // 3)
            if v in rows[i] or v in cols[j] or v in boxes[bi]:
                return False
            rows[i].add(v); cols[j].add(v); boxes[bi].add(v)"""
explanation = "**第 3 步：双重循环遍历棋盘**\n\n对每个格子 `(i, j)`：\n\n1. 跳过空格 `'.'`\n2. 计算宫索引 `bi = (i // 3) * 3 + (j // 3)`\n3. 检查 `v` 是否已在 `rows[i]` / `cols[j]` / `boxes[bi]` 中\n4. 若已存在 → 冲突，直接返回 `False`\n5. 否则把 `v` 加入三个集合\n\n**示例执行片段**\n\n```\ni=0, j=0, v='5' → bi=0\n  rows[0]={}, cols[0]={}, boxes[0]={}\n  5 不在 → 添加: rows[0]={5}, cols[0]={5}, boxes[0]={5}\n\ni=0, j=1, v='3' → bi=0\n  rows[0]={5}, cols[1]={}, boxes[0]={5}\n  3 不在 → 添加: rows[0]={5,3}, cols[1]={3}, boxes[0]={5,3}\n\n... 依次推进 ...\n```\n\n> 若某次检查发现 `v` 已经存在于任意一个集合中，立即返回 `False`，无需遍历完整棋盘。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 有效的数独
# 判断一个 9x9 数独棋盘是否有效（不要求可解）
# 规则:
#   - 数字 1-9 在每一行只能出现一次
#   - 数字 1-9 在每一列只能出现一次
#   - 数字 1-9 在每个 3x3 子宫内只能出现一次
#   - 空格子用 '.' 表示
#
# 示例 (有效):
#   board = [
#     ["5","3",".",".","7",".",".",".","."],
#     ["6",".",".","1","9","5",".",".","."],
#     [".","9","8",".",".",".",".","6","."],
#     ["8",".",".",".","6",".",".",".","3"],
#     ["4",".",".","8",".","3",".",".","1"],
#     ["7",".",".",".","2",".",".",".","6"],
#     [".","6",".",".",".",".","2","8","."],
#     [".",".",".","4","1","9",".",".","5"],
#     [".",".",".",".","8",".",".","7","9"]
#   ]
#   结果: True

from typing import List

def isValidSudoku(board: List[List[str]]) -> bool:
    \"\"\"判断 9x9 数独棋盘是否有效。\"\"\"
    rows = [set() for _ in range(9)]
    cols = [set() for _ in range(9)]
    boxes = [set() for _ in range(9)]
    for i in range(9):
        for j in range(9):
            v = board[i][j]
            if v == '.': continue
            bi = (i // 3) * 3 + (j // 3)
            if v in rows[i] or v in cols[j] or v in boxes[bi]:
                return False
            rows[i].add(v); cols[j].add(v); boxes[bi].add(v)
    return True"""
explanation = "**最终结果**\n\n遍历结束未触发冲突 → 返回 `True`\n\n```\n输入: 一个合法的 9x9 数独棋盘\n输出: True\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(81) = O(1) — 固定 81 个格子，最多一次遍历 |\n| 空间复杂度 | O(81) = O(1) — 9 行 + 9 列 + 9 宫 = 27 个集合 |\n\n**关键技巧：三组集合一次遍历**\n\n- 用 `rows[i]`、`cols[j]`、`boxes[bi]` 三组 set 同时维护约束\n- 宫索引 `bi = (i // 3) * 3 + (j // 3)` 把二维坐标映射到 0~8\n- 一旦发现重复立即 `return False`，提前终止\n\n**易错点**\n\n- 宫索引公式错误会导致 3×3 划分错位\n- 忘记跳过 `'.'`，会把空格也加入集合造成误判"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[]", result = "True", highlightedIndices = [] }

[algorithm.summary]
timeComplexity = "O(81) = O(1)"
spaceComplexity = "O(81) = O(1)"
approach = "一次遍历 + 三组哈希集合（行 / 列 / 宫）"
keyInsight = "用 row/col/box 三组 set 一次扫描，遇到重复立即返回 False"