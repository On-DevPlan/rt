# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 有效的数独
# 判断一个 9x9 数独棋盘是否有效（不要求可解）
# 规则:
#   - 数字 1-9 在每一行只能出现一次
#   - 数字 1-9 在每一列只能出现一次
#   - 数字 1-9 在每个 3x3 子宫内只能出现一次
#   - 空格子用 '.' 表示
#
# 示例 (有效):
#   board = [
#     ["5","3",".",".","7",".",".",".","."],
#     ["6",".",".","1","9","5",".",".","."],
#     [".","9","8",".",".",".",".","6","."],
#     ["8",".",".",".","6",".",".",".","3"],
#     ["4",".",".","8",".","3",".",".","1"],
#     ["7",".",".",".","2",".",".",".","6"],
#     [".","6",".",".",".",".","2","8","."],
#     [".",".",".","4","1","9",".",".","5"],
#     [".",".",".",".","8",".",".","7","9"]
#   ]
#   结果: True"""
explanation = "**问题分析**\n\n判断一个 9×9 数独棋盘是否**有效**（注意：只需判断当前已填数字是否冲突，**不要求可解**）。\n\n**三条规则**\n\n- 数字 `1-9` 在每一行只能出现一次\n- 数字 `1-9` 在每一列只能出现一次\n- 数字 `1-9` 在每个 `3×3` 子宫内只能出现一次\n\n> 空格用 `'.'` 占位，可跳过。\n\n**关键观察**\n\n- 棋盘大小固定 `9×9`，共有 `81` 个格子\n- 一次遍历即可完成检查（**O(81) = O(1)**）\n- 需要为「行」「列」「宫」各自维护一个集合来记录已出现的数字\n\n**3×3 宫索引公式**\n\n`bi = (i // 3) * 3 + (j // 3)`\n\n| 行块 | 列块 | 宫索引 bi |\n|------|------|-----------|\n| i ∈ [0,2] | j ∈ [0,2] | 0 |\n| i ∈ [0,2] | j ∈ [3,5] | 1 |\n| i ∈ [0,2] | j ∈ [6,8] | 2 |\n| i ∈ [3,5] | j ∈ [0,2] | 3 |\n| ... | ... | ... |\n| i ∈ [6,8] | j ∈ [6,8] | 8 |"
visualizationType = "intro"

