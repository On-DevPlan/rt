[algorithm]
id = "edit-distance"
title = "编辑距离"
titleEn = "Edit Distance"
difficulty = "medium"
tags = ["string", "dynamic-programming"]
testCase = "word1 = \"horse\", word2 = \"ros\""
expectedOutput = "3"

# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 72. 编辑距离
# 给定两个单词 word1 和 word2，计算出将 word1 转换成 word2 的最少操作数
#
# 允许的三种操作:
#   1. 插入一个字符
#   2. 删除一个字符
#   3. 替换一个字符
#
# 示例:
#   word1 = "horse", word2 = "ros"
#   horse → rorse (替换 'h' 为 'r')
#   rorse → rose (删除 'r')
#   rose → ros (删除 'e')
#   结果: 3"""
explanation = "**问题分析**\n\n需要找到将 `word1` 转换为 `word2` 的最少操作步骤。\n\n**操作类型**\n\n| 操作 | 说明 |\n|------|------|\n| 插入 | 在任意位置插入一个字符 |\n| 删除 | 删除任意位置的字符 |\n| 替换 | 将一个字符替换为另一个 |\n\n**示例分析：`horse` → `ros`**\n\n```\nhorse → rorse (替换 h → r)\nrorse → rose  (删除 r)\nrose  → ros   (删除 e)\n```\n\n最少需要 **3 步**。\n\n> 这是一个经典的**二维动态规划**问题。\n\n**关键思路：dp[i][j] 的含义**\n\n`dp[i][j]` 表示 `word1[0:i]` → `word2[0:j]` 的最少操作数。\n\n- `i` 从 0 到 m（m = len(word1)）\n- `j` 从 0 到 n（n = len(word2)）"
visualizationType = "intro"

# ── Step 1: 函数签名和初始化 ────────────────────────────────────
[[algorithm.steps]]
id = 1
title = "初始化DP表"
titleEn = "Initialize DP Table"
code = """# 72. 编辑距离
# 给定两个单词 word1 和 word2，计算出将 word1 转换成 word2 的最少操作数
#
# 允许的三种操作:
#   1. 插入一个字符
#   2. 删除一个字符
#   3. 替换一个字符
#
# 示例:
#   word1 = "horse", word2 = "ros"
#   horse → rorse (替换 'h' 为 'r')
#   rorse → rose (删除 'r')
#   rose → ros (删除 'e')
#   结果: 3

from typing import List

def minDistance(word1: str, word2: str) -> int:
    \"\"\"返回 word1 转换为 word2 的最少操作数。\"\"\"
    m, n = len(word1), len(word2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j"""
explanation = "**第 1 步：初始化 DP 表和边界条件**\n\n**dp 表结构**（以 `horse` 和 `ros` 为例）\n\n```\n      ''  r   o   s\n'' [ 0,  1,  2,  3]\nh   [ 1,  ?,  ?,  ?]\no   [ 2,  ?,  ?,  ?]\nr   [ 3,  ?,  ?,  ?]\ns   [ 4,  ?,  ?,  ?]\ne   [ 5,  ?,  ?,  ?]\n```\n\n**初始化逻辑**\n\n| 边界 | 含义 | 值 |\n|------|------|------|\n| `dp[i][0]` | 将 `word1[0:i]` 变为空串 | 删除 i 个字符 = `i` |\n| `dp[0][j]` | 将空串变为 `word2[0:j]` | 插入 j 个字符 = `j` |\n| `dp[0][0]` | 空串变空串 | 0 |\n\n> 第一行和第一列是「一个串为空」的特殊情况，操作数就是另一个串的长度。"
visualizationType = "code-only"

# ── Step 2: 双层循环 ────────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "字符相同处理"
titleEn = "Handle Same Character"
code = """# 72. 编辑距离
# 给定两个单词 word1 和 word2，计算出将 word1 转换成 word2 的最少操作数
#
# 允许的三种操作:
#   1. 插入一个字符
#   2. 删除一个字符
#   3. 替换一个字符
#
# 示例:
#   word1 = "horse", word2 = "ros"
#   horse → rorse (替换 'h' 为 'r')
#   rorse → rose (删除 'r')
#   rose → ros (删除 'e')
#   结果: 3

from typing import List

def minDistance(word1: str, word2: str) -> int:
    \"\"\"返回 word1 转换为 word2 的最少操作数。\"\"\"
    m, n = len(word1), len(word2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if word1[i - 1] == word2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]"""
explanation = "**第 2 步：处理字符相同的情况**\n\n**状态转移方程（字符相同时）**\n\n当 `word1[i-1] == word2[j-1]` 时：\n\n```\ndp[i][j] = dp[i-1][j-1]\n```\n\n**含义**：当前字符相同，无需任何操作，直接继承左上角的值。\n\n**示例：计算 dp[1][1]**（`h` vs `r`）\n\n```\n      ''  r\n'' [ 0,  1]\nh   [ 1,  ?]\n```\n\n- `word1[0] = 'h'`\n- `word2[0] = 'r'`\n- `'h' != 'r'` → 进入下一步（字符不同的处理）"
visualizationType = "code-only"

# ── Step 3: 字符不同处理 ────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "字符不同处理"
titleEn = "Handle Different Character"
code = """# 72. 编辑距离
# 给定两个单词 word1 和 word2，计算出将 word1 转换成 word2 的最少操作数
#
# 允许的三种操作:
#   1. 插入一个字符
#   2. 删除一个字符
#   3. 替换一个字符
#
# 示例:
#   word1 = "horse", word2 = "ros"
#   horse → rorse (替换 'h' 为 'r')
#   rorse → rose (删除 'r')
#   rose → ros (删除 'e')
#   结果: 3

from typing import List

def minDistance(word1: str, word2: str) -> int:
    \"\"\"返回 word1 转换为 word2 的最少操作数。\"\"\"
    m, n = len(word1), len(word2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if word1[i - 1] == word2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                dp[i][j] = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])"""
explanation = "**第 3 步：处理字符不同的情况**\n\n**状态转移方程（字符不同时）**\n\n```\ndp[i][j] = 1 + min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1])\n```\n\n**三种操作的含义**\n\n| 取值 | 操作 | 说明 |\n|------|------|------|\n| `dp[i-1][j]` | 删除 | 删除 `word1[i-1]`，然后匹配 `word2[0:j]` |\n| `dp[i][j-1]` | 插入 | 插入 `word2[j-1]`，然后继续匹配 |\n| `dp[i-1][j-1]` | 替换 | 替换 `word1[i-1]` 为 `word2[j-1]` |\n\n**图示**（以 dp[1][1] 为例，`h` vs `r`）\n\n```\n      ''  r\n'' [ 0,  1]\nh   [ 1,  1]  ← 1 + min(dp[0][1]=1, dp[1][0]=1, dp[0][0]=0) = 1\n```\n\n> 三种操作取最小值再加 1（当前操作）。\n\n**计算过程（部分）**\n\n```\ndp[1][1] (h vs r): 1 + min(1, 1, 0) = 1\ndp[2][1] (o vs r): 1 + min(1, 2, 1) = 2\ndp[3][1] (r vs r): 字符相同 → dp[2][0] = 2\n...继续填充整个表...\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ────────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 72. 编辑距离
# 给定两个单词 word1 和 word2，计算出将 word1 转换成 word2 的最少操作数
#
# 允许的三种操作:
#   1. 插入一个字符
#   2. 删除一个字符
#   3. 替换一个字符
#
# 示例:
#   word1 = "horse", word2 = "ros"
#   horse → rorse (替换 'h' 为 'r')
#   rorse → rose (删除 'r')
#   rose → ros (删除 'e')
#   结果: 3

from typing import List

def minDistance(word1: str, word2: str) -> int:
    \"\"\"返回 word1 转换为 word2 的最少操作数。\"\"\"
    m, n = len(word1), len(word2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if word1[i - 1] == word2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                dp[i][j] = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])

    return dp[m][n]"""
explanation = "**最终结果**\n\n✅ 动态规划完成，返回 `dp[m][n]`。\n\n**完整 DP 表（`horse` → `ros`）**\n\n```\n      ''  r   o   s\n'' [ 0,  1,  2,  3]\nh   [ 1,  1,  2,  3]\no   [ 2,  2,  1,  2]\nr   [ 3,  2,  2,  2]\ns   [ 4,  3,  3,  2]\ne   [ 5,  4,  4,  3]\n                     ↑\n                   答案\n```\n\n**答案验证**\n\n```\nhorse → rorse (替换 h → r)\nrorse → rose  (删除 r)\nrose  → ros   (删除 e)\n```\n\n最少操作数 = **3** ✓\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(m×n) — 填充整个 DP 表 |\n| 空间复杂度 | O(m×n) — 存储 DP 表 |\n\n**关键技巧**\n\n- 字符相同 → 继承左上角（无需操作）\n- 字符不同 → 三种操作取最小 + 1\n- 边界条件：一个串为空时，操作数为另一个串长度"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[\"h\", \"o\", \"r\", \"s\", \"e\"]", result = "3", highlightedIndices = [0, 1, 2, 3, 4] }

