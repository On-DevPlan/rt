# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 快乐数
# 给定一个整数 n，对它各位数字的平方求和得到下一个数
# 重复这个过程：
#   - 最终能到达 1，则是快乐数（happy number）
#   - 否则会陷入一个不含 1 的循环
# 判断 n 是不是快乐数
#
# 示例 1（快乐数）:
#   19 → 1²+9²=82 → 8²+2²=68 → 6²+8²=100 → 1²+0²+0²=1 ✓
#
# 示例 2（不快乐数，进入循环）:
#   2 → 4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4 循环 ✗"""
explanation = "**问题分析**\n\n对 `n` 反复执行「各位数字平方求和」，序列要么：\n\n- 终止于 `1` → 快乐数\n- 陷入一个不含 `1` 的循环 → 不是快乐数\n\n**为什么一定会循环？**\n\n> 对于任意 `n`，下一个数 `f(n)` 由各位数字平方决定。\n> 一个 `k` 位数的最大可能平方和是 `81 * k`。\n> 当 `n ≥ 10^k` 时，`f(n)` 一定小于 `10^k`。\n> 因此序列必然进入 `[1, 810]` 这个有限区间——鸽巢原理保证必然重复，从而形成循环。\n\n**两种解法对比**\n\n| 解法 | 数据结构 | 空间 |\n|------|----------|------|\n| Hash Set 检测 | `set` | O(logn) |\n| **快慢指针（Floyd）** | 仅两个变量 | **O(1)** |\n\n下面采用快慢指针：每次 `slow` 走一步，`fast` 走两步。若相遇则进入循环；若 `fast` 先到达 `1`，则是快乐数。"
visualizationType = "intro"

