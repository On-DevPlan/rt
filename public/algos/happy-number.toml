# ── Step 2: 辅助函数 next_num ─────────────────────────────────
[[algorithm.steps]]
id = 2
title = "平方求和函数"
titleEn = "Square-Sum Helper"
code = """# 快乐数
# 给定一个整数 n，对它各位数字的平方求和得到下一个数
# 重复这个过程：
#   - 最终能到达 1，则是快乐数（happy number）
#   - 否则会陷入一个不含 1 的循环
# 判断 n 是不是快乐数
#
# 示例 1（快乐数）:
#   19 → 1²+9²=82 → 8²+2²=68 → 6²+8²=100 → 1²+0²+0²=1 ✓
#
# 示例 2（不快乐数，进入循环）:
#   2 → 4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4 循环 ✗

def isHappy(n: int) -> bool:
    \"\"\"判断 n 是否为快乐数。\"\"\"
    def next_num(x):
        s = 0
        while x:
            d = x % 10
            s += d * d
            x //= 10
        return s
    pass"""
explanation = "**第 2 步：实现「平方求和」辅助函数**\n\n```python\ndef next_num(x):\n    s = 0\n    while x:\n        d = x % 10\n        s += d * d\n        x //= 10\n    return s\n```\n\n**逻辑拆解**\n\n| 语句 | 作用 |\n|------|------|\n| `d = x % 10` | 取个位数字 |\n| `s += d * d` | 累加平方 |\n| `x //= 10` | 去掉个位 |\n\n**验证**：`next_num(19) = 1² + 9² = 82` ✓"
visualizationType = "code-only"

# ── Step 3: 快慢指针循环 ──────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "快慢指针判环"
titleEn = "Floyd Cycle Detection"
code = """# 快乐数
# 给定一个整数 n，对它各位数字的平方求和得到下一个数
# 重复这个过程：
#   - 最终能到达 1，则是快乐数（happy number）
#   - 否则会陷入一个不含 1 的循环
# 判断 n 是不是快乐数
#
# 示例 1（快乐数）:
#   19 → 1²+9²=82 → 8²+2²=68 → 6²+8²=100 → 1²+0²+0²=1 ✓
#
# 示例 2（不快乐数，进入循环）:
#   2 → 4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4 循环 ✗

def isHappy(n: int) -> bool:
    \"\"\"判断 n 是否为快乐数。\"\"\"
    def next_num(x):
        s = 0
        while x:
            d = x % 10
            s += d * d
            x //= 10
        return s
    slow = next_num(n)
    fast = next_num(next_num(n))
    while slow != fast and fast != 1:
        slow = next_num(slow)
        fast = next_num(next_num(fast))
    pass"""
explanation = "**第 3 步：Floyd 快慢指针判环**\n\n```python\nslow = next_num(n)             # slow 起步：1 步\nfast = next_num(next_num(n))   # fast 起步：2 步\nwhile slow != fast and fast != 1:\n    slow = next_num(slow)\n    fast = next_num(next_num(fast))\n```\n\n**Floyd 判环原理**\n\n> 把序列想象成一条「链表」：每个节点 `x` 的下一个节点是 `next_num(x)`。\n> 快乐数最终到达 `1`（自环），不快乐数进入循环。\n> 快指针每次走两步、慢指针走一步——若存在环，快慢指针必然相遇。\n\n**循环条件**\n\n| 条件 | 含义 |\n|------|------|\n| `slow != fast` | 还未相遇（仍在推进） |\n| `fast != 1` | fast 已到达 1，立刻判定为快乐数 |\n\n**示例追踪（n=19）**\n\n```\nslow=82, fast=68     (slow 走 1 步, fast 走 2 步)\nslow=68, fast=1      → fast == 1，退出循环 → True ✓\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 快乐数
# 给定一个整数 n，对它各位数字的平方求和得到下一个数
# 重复这个过程：
#   - 最终能到达 1，则是快乐数（happy number）
#   - 否则会陷入一个不含 1 的循环
# 判断 n 是不是快乐数
#
# 示例 1（快乐数）:
#   19 → 1²+9²=82 → 8²+2²=68 → 6²+8²=100 → 1²+0²+0²=1 ✓
#
# 示例 2（不快乐数，进入循环）:
#   2 → 4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4 循环 ✗

def isHappy(n: int) -> bool:
    \"\"\"判断 n 是否为快乐数。\"\"\"
    def next_num(x):
        s = 0
        while x:
            d = x % 10
            s += d * d
            x //= 10
        return s
    slow = next_num(n)
    fast = next_num(next_num(n))
    while slow != fast and fast != 1:
        slow = next_num(slow)
        fast = next_num(next_num(fast))
    return fast == 1 or slow == 1"""
explanation = "**最终结果**\n\n```python\nreturn fast == 1 or slow == 1\n```\n\n退出循环有两种情况：\n\n| 退出原因 | 判定 |\n|----------|------|\n| `fast == 1` | 是快乐数 → `True` |\n| `slow == fast`（且 `≠ 1`） | 陷入循环 → `False` |\n\n**示例验证**\n\n```\nn = 19 → True   (1²+9²=82 → ... → 1)\nn = 2  → False  (进入 4 → 16 → 37 → ... 循环)\n```\n\n**复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | **O(log n)** | 每步 `next_num` 处理 `O(log n)` 位，且指针至多走 `O(log n)` 步 |\n| 空间复杂度 | **O(1)** | 仅使用两个整数变量 |\n\n**核心洞察**\n\n> 不快乐数不是「趋于无穷」，而是必然进入 `[1, 810]` 内的有限循环——\n> 把序列视为链表，用 Floyd 判环即可，无需额外空间。"
