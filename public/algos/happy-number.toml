# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 快乐数
# 给定一个整数 n，对它各位数字的平方求和得到下一个数
# 重复这个过程：
#   - 最终能到达 1，则是快乐数（happy number）
#   - 否则会陷入一个不含 1 的循环
# 判断 n 是不是快乐数
#
# 示例 1（快乐数）:
#   19 → 1²+9²=82 → 8²+2²=68 → 6²+8²=100 → 1²+0²+0²=1 ✓
#
# 示例 2（不快乐数，进入循环）:
#   2 → 4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4 循环 ✗"""
explanation = "**问题重述**\n\n给定一个整数 `n`，反复对它做「各位数字的平方和」得到下一个数。如果序列最终能到达 `1`，则 `n` 是快乐数，返回 `true`；否则会陷入不含 `1` 的循环，返回 `false`。\n\n**输入与输出**\n\n- 输入：一个整数 `n`（通常 `n > 0`）\n- 输出：`bool`，`true` 表示 `n` 是快乐数，`false` 表示不是\n- 边界：`n = 1` 直接是快乐数；非快乐数一定会进入循环，不会无限增大\n\n**示例走查**\n\n对于 `n = 19`：\n\n```\n19 → 1² + 9² = 82\n82 → 8² + 2² = 68\n68 → 6² + 8² = 100\n100 → 1² + 0² + 0² = 1\n```\n\n序列到达 `1`，所以 `19` 是快乐数，返回 `true`。\n\n**关键洞察**\n\n不快乐数不会趋于无穷。一个 `k` 位数的各位平方和最大为 `81k`，当 `n` 足够大时下一步必然变小，因此序列最终会落入有限区间 `[1, 810]`，根据鸽巢原理必然重复，形成循环。\n\n**方法预览**\n\n| 项目 | 内容 |\n|------|------|\n| 算法 | 快慢指针（Floyd 判环） |\n| 时间复杂度 | O(log n) |\n| 空间复杂度 | O(1) |\n| 核心操作 | `next_num`：取各位数字平方和；`slow` 走 1 步，`fast` 走 2 步 |"
visualizationType = "intro"

