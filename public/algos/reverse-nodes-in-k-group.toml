# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# K 个一组翻转链表
# 给定一个链表的头节点 head 和整数 k
# 每 k 个节点一组进行翻转，不足 k 的节点保持原样
#
# 示例:
#   head = [1,2,3,4,5], k = 2  →  [2,1,4,3,5]
#   head = [1,2,3,4,5], k = 3  →  [3,2,1,4,5]
#
# 边界:
#   - 剩余节点不足 k 时，原样保留（不翻转）
#   - k == 1 时链表不变
#   - 链表为空或只有 1 个节点时直接返回"""
explanation = "**问题分析**\n\n给定链表 `head` 和整数 `k`，按每 `k` 个一组翻转链表：\n\n- `[1,2,3,4,5]`, `k=2` → `[2,1,4,3,5]`\n- `[1,2,3,4,5]`, `k=3` → `[3,2,1,4,5]`\n\n**关键边界：不足 k 保持原样**\n\n```\nk=3 时:\n  [1,2,3,4,5]\n   └───┘    ↑ 剩 2 个，不足 3 → 保持 [4,5]\n  翻转这一组\n  → [3,2,1,4,5]\n```\n\n> 最后一组如果节点数 `< k`，**整体不翻转**，这是与「翻转全部」的核心区别。\n\n**解法对比**\n\n| 解法 | 时间 | 空间 | 思路 |\n|------|------|------|------|\n| **递归** | O(n) | O(n) | 每组反转后递归接剩余 |\n| 迭代 + 区间反转 | O(n) | O(1) | dummy + pre 指针 |\n\n> 推荐递归版：思路直接，代码更短。"
visualizationType = "intro"

