[algorithm]
id = "median-of-two-sorted-arrays"
title = "寻找两个正序数组的中位数"
titleEn = "Median of Two Sorted Arrays"
difficulty = "hard"
tags = ["array", "binary-search", "divide-and-conquer"]
testCase = "nums1 = [1,3], nums2 = [2]"
expectedOutput = "2.0"

# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 寻找两个正序数组的中位数
# 给定两个大小分别为 m 和 n 的正序数组 nums1 和 nums2
# 找出并返回这两个正序数组的中位数
#
# 要求: 时间复杂度为 O(log (m+n))
#
# 示例:
#   nums1 = [1, 3], nums2 = [2]
#   中位数 = 2.0
#
#   nums1 = [1, 2], nums2 = [3, 4]
#   中位数 = (2 + 3) / 2 = 2.5"""
explanation = "**问题分析**\n\n有两个升序数组，需要找到合并后的中位数。\n\n**中位数定义**\n\n| 总长度 | 中位数 |\n|--------|--------|\n| 奇数 | 中间位置的值 |\n| 偶数 | 中间两个值的平均值 |\n\n**暴力方法**\n\n| 方法 | 时间 | 空间 |\n|------|------|------|\n| 合并后查找 | O(m+n) | O(m+n) |\n| 二分查找 | **O(log(min(m,n)))** | **O(1)** |\n\n> 题目要求 O(log(m+n))，提示使用**二分查找**。\n\n**核心思路：划界**\n\n将两个数组分别分成左右两半，使得：\n- 左半边的元素 ≤ 右半边的元素\n- 左半边元素个数 = 右半边元素个数（奇数时左边多一个）"
visualizationType = "intro"

# ── Step 1: 函数签名 ──────────────────────────────────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 寻找两个正序数组的中位数
# 给定两个大小分别为 m 和 n 的正序数组 nums1 和 nums2
# 找出并返回这两个正序数组的中位数
#
# 要求: 时间复杂度为 O(log (m+n))
#
# 示例:
#   nums1 = [1, 3], nums2 = [2]
#   中位数 = 2.0
#
#   nums1 = [1, 2], nums2 = [3, 4]
#   中位数 = (2 + 3) / 2 = 2.5

from typing import List

def findMedianSortedArrays(nums1: List[int], nums2: List[int]) -> float:
    \"\"\"返回两个升序数组的中位数。\"\"\"
    # 确保 nums1 是较短的数组，减少二分范围
    m, n = len(nums1), len(nums2)
    if m > n:
        return findMedianSortedArrays(nums2, nums1)
    left, right = 0, m
    pass"""
explanation = "**第 1 步：编写函数签名**\n\n- 接收两个升序数组 `nums1` 和 `nums2`\n- 返回中位数（`float` 类型）\n\n**优化：确保 m ≤ n**\n\n如果 `nums1` 比 `nums2` 长，交换参数：\n\n```python\nif m > n:\n    return findMedianSortedArrays(nums2, nums1)\n```\n\n好处：在较短的数组上二分，减少查找范围。\n\n**初始化二分边界**\n\n```\nleft = 0      # nums1 的最小分割位置\nright = m     # nums1 的最大分割位置\n```"
visualizationType = "code-only"

# ── Step 2: 二分循环 + 计算分割点 ──────────────────────────────
[[algorithm.steps]]
id = 2
title = "二分查找"
titleEn = "Binary Search"
code = """# 寻找两个正序数组的中位数
# 给定两个大小分别为 m 和 n 的正序数组 nums1 和 nums2
# 找出并返回这两个正序数组的中位数
#
# 要求: 时间复杂度为 O(log (m+n))
#
# 示例:
#   nums1 = [1, 3], nums2 = [2]
#   中位数 = 2.0
#
#   nums1 = [1, 2], nums2 = [3, 4]
#   中位数 = (2 + 3) / 2 = 2.5

from typing import List

def findMedianSortedArrays(nums1: List[int], nums2: List[int]) -> float:
    \"\"\"返回两个升序数组的中位数。\"\"\"
    # 确保 nums1 是较短的数组，减少二分范围
    m, n = len(nums1), len(nums2)
    if m > n:
        return findMedianSortedArrays(nums2, nums1)
    left, right = 0, m

    while left <= right:
        # nums1 的分割点 i：左边有 i 个元素
        i = (left + right) // 2
        # nums2 的分割点 j：左边有 j 个元素
        j = (m + n + 1) // 2 - i

        # 处理边界情况（某个数组在分割点一侧为空）
        maxLeft1 = nums1[i - 1] if i > 0 else float('-inf')
        minRight1 = nums1[i] if i < m else float('inf')
        maxLeft2 = nums2[j - 1] if j > 0 else float('-inf')
        minRight2 = nums2[j] if j < n else float('inf')
        pass"""
explanation = "**第 2 步：二分查找分割点**\n\n**分割点计算**\n\n```\ni = (left + right) // 2          # nums1 的分割点\nj = (m + n + 1) // 2 - i         # nums2 的分割点\n```\n\n`+1` 的作用：保证左半边元素个数 ≥ 右半边（奇数情况）\n\n**边界值处理**\n\n当分割点在数组边缘时，使用 `±∞` 作为边界值：\n\n| 变量 | 含义 | 边界情况 |\n|------|------|----------|\n| `maxLeft1` | nums1 左半边最大值 | `i=0` 时为 `-∞` |\n| `minRight1` | nums1 右半边最小值 | `i=m` 时为 `+∞` |\n| `maxLeft2` | nums2 左半边最大值 | `j=0` 时为 `-∞` |\n| `minRight2` | nums2 右半边最小值 | `j=n` 时为 `+∞` |\n\n**划界条件**\n\n理想的分割满足：\n```\nmaxLeft1 ≤ minRight2  且  maxLeft2 ≤ minRight1\n```"
visualizationType = "code-only"

# ── Step 3: 划界条件 + 计算中位数 ──────────────────────────────
[[algorithm.steps]]
id = 3
title = "划界条件"
titleEn = "Partition Condition"
code = """# 寻找两个正序数组的中位数
# 给定两个大小分别为 m 和 n 的正序数组 nums1 和 nums2
# 找出并返回这两个正序数组的中位数
#
# 要求: 时间复杂度为 O(log (m+n))
#
# 示例:
#   nums1 = [1, 3], nums2 = [2]
#   中位数 = 2.0
#
#   nums1 = [1, 2], nums2 = [3, 4]
#   中位数 = (2 + 3) / 2 = 2.5

from typing import List

def findMedianSortedArrays(nums1: List[int], nums2: List[int]) -> float:
    \"\"\"返回两个升序数组的中位数。\"\"\"
    # 确保 nums1 是较短的数组，减少二分范围
    m, n = len(nums1), len(nums2)
    if m > n:
        return findMedianSortedArrays(nums2, nums1)
    left, right = 0, m

    while left <= right:
        # nums1 的分割点 i：左边有 i 个元素
        i = (left + right) // 2
        # nums2 的分割点 j：左边有 j 个元素
        j = (m + n + 1) // 2 - i

        # 处理边界情况（某个数组在分割点一侧为空）
        maxLeft1 = nums1[i - 1] if i > 0 else float('-inf')
        minRight1 = nums1[i] if i < m else float('inf')
        maxLeft2 = nums2[j - 1] if j > 0 else float('-inf')
        minRight2 = nums2[j] if j < n else float('inf')

        # 划界条件：左半边所有元素 ≤ 右半边所有元素
        if maxLeft1 <= minRight2 and maxLeft2 <= minRight1:
            # 奇数：取左半边最大值
            if (m + n) % 2 == 1:
                return max(maxLeft1, maxLeft2)
            # 偶数：取左右半边中点平均值
            return (max(maxLeft1, maxLeft2) + min(minRight1, minRight2)) / 2
        pass"""
explanation = "**第 3 步：检查划界条件并计算中位数**\n\n**划界成功**\n\n当 `maxLeft1 ≤ minRight2` 且 `maxLeft2 ≤ minRight1` 时，分割位置正确。\n\n**中位数计算**\n\n| 总长度 | 中位数 | 公式 |\n|--------|--------|------|\n| 奇数 | 左半边最大值 | `max(maxLeft1, maxLeft2)` |\n| 偶数 | 左右中点平均 | `(max(maxLeft1, maxLeft2) + min(minRight1, minRight2)) / 2` |\n\n**示例：nums1 = [1, 3], nums2 = [2]**\n\n```\nm=2, n=1, 总长度=3 (奇数)\n\n尝试 i=1, j=1:\n  nums1: [1 | 3]      maxLeft1=1, minRight1=3\n  nums2: [| 2]        maxLeft2=-∞, minRight2=2\n  检查: 1 ≤ 2 ✓ 且 -∞ ≤ 3 ✓\n  奇数中位数 = max(1, -∞) = 1? 不对！\n\n尝试 i=0, j=2:\n  nums1: [| 1, 3]    maxLeft1=-∞, minRight1=1\n  nums2: [2 | ]       maxLeft2=2, minRight2=∞\n  检查: -∞ ≤ 1 ✓ 且 2 ≤ 1? ✗ 不满足\n\n尝试 i=1, j=1 (修正):\n  nums1: [1 | 3]      maxLeft1=1, minRight1=3\n  nums2: [2 | ]       maxLeft2=2, minRight2=∞\n  检查: 1 ≤ ∞ ✓ 且 2 ≤ 3 ✓\n  奇数中位数 = max(1, 2) = 2.0 ✓\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 寻找两个正序数组的中位数
# 给定两个大小分别为 m 和 n 的正序数组 nums1 和 nums2
# 找出并返回这两个正序数组的中位数
#
# 要求: 时间复杂度为 O(log (m+n))
#
# 示例:
#   nums1 = [1, 3], nums2 = [2]
#   中位数 = 2.0
#
#   nums1 = [1, 2], nums2 = [3, 4]
#   中位数 = (2 + 3) / 2 = 2.5

from typing import List

def findMedianSortedArrays(nums1: List[int], nums2: List[int]) -> float:
    \"\"\"返回两个升序数组的中位数。\"\"\"
    # 确保 nums1 是较短的数组，减少二分范围
    m, n = len(nums1), len(nums2)
    if m > n:
        return findMedianSortedArrays(nums2, nums1)
    left, right = 0, m

    while left <= right:
        # nums1 的分割点 i：左边有 i 个元素
        i = (left + right) // 2
        # nums2 的分割点 j：左边有 j 个元素
        j = (m + n + 1) // 2 - i

        # 处理边界情况（某个数组在分割点一侧为空）
        maxLeft1 = nums1[i - 1] if i > 0 else float('-inf')
        minRight1 = nums1[i] if i < m else float('inf')
        maxLeft2 = nums2[j - 1] if j > 0 else float('-inf')
        minRight2 = nums2[j] if j < n else float('inf')

        # 划界条件：左半边所有元素 ≤ 右半边所有元素
        if maxLeft1 <= minRight2 and maxLeft2 <= minRight1:
            # 奇数：取左半边最大值
            if (m + n) % 2 == 1:
                return max(maxLeft1, maxLeft2)
            # 偶数：取左右半边中点平均值
            return (max(maxLeft1, maxLeft2) + min(minRight1, minRight2)) / 2
        elif maxLeft1 > minRight2:
            # nums1 的左边太大，分割点向左移
            right = i - 1
        else:
            # nums2 的左边太大（即 nums1 的左边太小），分割点向右移
            left = i + 1
    return 0.0"""
explanation = "**最终结果**\n\n✅ 二分查找完成\n\n```\n输入: nums1 = [1, 3], nums2 = [2]\n输出: 2.0\n```\n\n**二分调整逻辑**\n\n当划界条件不满足时，调整分割点：\n\n| 条件 | 调整 | 原因 |\n|------|------|------|\n| `maxLeft1 > minRight2` | `right = i - 1` | nums1 左边太大，i 需减小 |\n| 否则 | `left = i + 1` | nums1 左边太小，i 需增大 |\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(log(min(m,n))) — 在较短数组上二分 |\n| 空间复杂度 | O(1) — 只用常量额外空间 |\n\n**关键技巧**\n\n1. **交换确保 m ≤ n**：减少二分范围\n2. **j 由 i 决定**：保证左右两边元素个数平衡\n3. **±∞ 处理边界**：避免数组越界\n4. **划界条件**：保证左半边 ≤ 右半边"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 3] + [2]", result = "2.0", highlightedIndices = [0, 1] }

