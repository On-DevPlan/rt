[[algorithm.steps]]
id =4
title = "完成"
titleEn = "Complete"
code = """#最后一个单词的长度
# 给定一个字符串 s，由若干英文单词组成，单词之间用空格分隔
# 返回字符串中最后一个单词的长度
#
#单词定义：仅由字母组成、不含空格的连续子串
#字符串可能以空格开头或结尾，也可能包含多个连续空格
#
# 示例:
# "Hello World" →5
# " fly me to the moon " →4

def lengthOfLastWord(s: str) -> int:
 \"\"\"返回字符串 s 中最后一个单词的长度。\"\"\"
 i = len(s) -1
 while i >=0 and s[i] == ' ':
 i -=1
 end = i
 while i >=0 and s[i] != ' ':
 i -=1
 return end - i"""
explanation = "**最终结果**\n\n✅ 单次反向扫描完成\n\n```\n输入: \"Hello World\"\n输出:5\n\n输入: \" fly me to the moon \"\n输出:4\n```\n\n**算法复杂度**\n\n|指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) —最多扫描两遍（先跳空格再数单词） |\n|空间复杂度 | O(1) — 仅使用常数个指针 |\n\n**关键技巧：从后向前**\n\n-天然跳过尾部空格的边界问题\n- 两个 `while`循环合起来仍是单次扫描\n-避免了 `split()`产生的 O(n)额外空间"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[\" \", \" \", \" \", \"f\", \"l\", \"y\", \" \", \"m\", \"e\", \" \", \" \", \" \", \"t\", \"o\", \" \", \" \", \" \", \"t\", \"h\", \"e\", \" \", \"m\", \"o\", \"o\", \"n\", \" \", \" \"]", result = "4", highlightedIndices = [21,22,23,24] }

[algorithm.summary]
timeComplexity = "O(n)"
spaceComplexity = "O(1)"
approach = "从后向前扫描，跳过尾部空格后统计单词长度"
keyInsight = "反向扫描天然避开尾部空格的边界条件，无需 split也能 O(1)空间"
