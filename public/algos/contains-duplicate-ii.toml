# ── Step 2: 初始化哈希表 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化哈希表"
titleEn = "Initialize Hash Table"
code = """# 存在重复元素 II (Contains Duplicate II)
# 给定一个整数数组 nums 和一个整数 k
# 判断数组中是否存在两个相同元素，且下标差的绝对值 ≤ k
#
# 示例:
#   nums = [1, 2, 3, 1], k = 3
#   nums[0] = nums[3] = 1，且 |3 - 0| = 3 ≤ 3
#   所以返回 true
#
#   nums = [1, 2, 3, 1, 2, 3], k = 2
#   重复元素的下标差都 > 2，返回 false

from typing import List

def containsNearbyDuplicate(nums: List[int], k: int) -> bool:
    \"\"\"判断数组中是否存在两个相同元素且下标差 ≤ k。\"\"\"
    last = {}  # value -> 最近一次出现的索引
    pass"""
explanation = "**第 2 步：创建哈希表**\n\n```python\nlast = {}  # 空字典\n```\n\n**为什么用字典？**\n\n| 操作 | 列表 | 字典 |\n|------|------|------|\n| 判断元素是否出现过 | O(n) | O(1) |\n| 取出最近索引 | O(n) | O(1) |\n\n- **键**：数组元素的值\n- **值**：该元素**最近一次**出现的下标（每次覆盖更新）\n\n> 每次只保留最近下标——因为只有最近一次出现的下标最有可能满足距离约束。"
visualizationType = "map-create"
visualizationData = { mapContents = "{}", arrayState = "[1, 2, 3, 1]", currentIndex = -1 }

# ── Step 3: 遍历并检查距离 ────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历检查"
titleEn = "Iterate & Check Distance"
code = """# 存在重复元素 II (Contains Duplicate II)
# 给定一个整数数组 nums 和一个整数 k
# 判断数组中是否存在两个相同元素，且下标差的绝对值 ≤ k
#
# 示例:
#   nums = [1, 2, 3, 1], k = 3
#   nums[0] = nums[3] = 1，且 |3 - 0| = 3 ≤ 3
#   所以返回 true
#
#   nums = [1, 2, 3, 1, 2, 3], k = 2
#   重复元素的下标差都 > 2，返回 false

from typing import List

def containsNearbyDuplicate(nums: List[int], k: int) -> bool:
    \"\"\"判断数组中是否存在两个相同元素且下标差 ≤ k。\"\"\"
    last = {}  # value -> 最近一次出现的索引

    for i, v in enumerate(nums):
        if v in last and i - last[v] <= k:
            return True
        last[v] = i
    return False"""
explanation = "**第 3 步：遍历并检查距离**\n\n对每个元素 `v`（索引 `i`）：\n\n1. **判断** `v` 是否已在 `last` 中\n   - **在**：计算距离 `i - last[v]`\n     - 若 `≤ k` → 满足条件，立即返回 `True`\n   - **不在**：跳过距离判断\n2. **更新** `last[v] = i`（无论是否命中，都更新最近下标）\n\n**前 3 步执行轨迹：**\n\n| i | v | `v in last` | 距离判断 | 操作 |\n|---|------|------------|----------|------|\n| 0 | 1 | False | 跳过 | `last[1] = 0` |\n| 1 | 2 | False | 跳过 | `last[2] = 1` |\n| 2 | 3 | False | 跳过 | `last[3] = 2` |\n\n> 因为 `i ≥ last[v]`，所以 `i - last[v]` 就是正向距离，不需要取绝对值。"
visualizationType = "map-add"
visualizationData = { mapContents = "{1 → 0, 2 → 1, 3 → 2}", arrayState = "[1, 2, 3, 1]", currentIndex = 2, mapKey = 3, mapValue = 2 }

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 存在重复元素 II (Contains Duplicate II)
# 给定一个整数数组 nums 和一个整数 k
# 判断数组中是否存在两个相同元素，且下标差的绝对值 ≤ k
#
# 示例:
#   nums = [1, 2, 3, 1], k = 3
#   nums[0] = nums[3] = 1，且 |3 - 0| = 3 ≤ 3
#   所以返回 true
#
#   nums = [1, 2, 3, 1, 2, 3], k = 2
#   重复元素的下标差都 > 2，返回 false

from typing import List

def containsNearbyDuplicate(nums: List[int], k: int) -> bool:
    \"\"\"判断数组中是否存在两个相同元素且下标差 ≤ k。\"\"\"
    last = {}  # value -> 最近一次出现的索引

    for i, v in enumerate(nums):
        if v in last and i - last[v] <= k:
            return True
        last[v] = i
    return False"""
explanation = "**第 4 步：命中 — `i=3`, `v=1`**\n\n```python\nv = 1, i = 3\n1 in last = True    # 之前 last[1] = 0\ni - last[1] = 3 - 0 = 3\n3 <= k = 3 → True!\n```\n\n✅ **命中！** 距离正好等于 `k`，返回 `True`。\n\n**反例验证：`nums = [1, 2, 3, 1, 2, 3], k = 2`**\n\n| i | v | 最近索引 | 距离 | ≤ k? |\n|---|------|----------|------|------|\n| 3 | 1 | 0 | 3 | ❌ |\n| 4 | 2 | 1 | 3 | ❌ |\n| 5 | 3 | 2 | 3 | ❌ |\n\n遍历结束返回 `False`。\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 一次遍历 |\n| 空间复杂度 | O(n) — 字典最多存 n 个键 |\n\n**替代思路：滑动窗口 + 集合**\n\n保持一个大小 ≤ k 的 `set`：\n```python\nwindow = set()\nfor i, x in enumerate(nums):\n    if i > k:\n        window.remove(nums[i - k - 1])\n    if x in window:\n        return True\n    window.add(x)\nreturn False\n```\n同样 O(n) 时间 + O(k) 空间，思路等价。"
visualizationType = "result"
visualizationData = { mapContents = "{1 → 0, 2 → 1, 3 → 2}", arrayState = "[1, 2, 3, 1]", result = "true", highlightedIndices = [0, 3] }

