explanation = "**第 1 步：编写函数签名**\n\n- 接收两个参数：`nums`（整数列表）和 `k`（整数距离上限）\n- 返回值类型为 `bool`\n- 使用类型注解明确参数和返回值类型\n- 文档字符串描述函数用途\n\n> 注意函数命名使用驼峰命名法 `containsNearbyDuplicate`（与 LeetCode 题目一致）。"
