# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 存在重复元素 II (Contains Duplicate II)
# 给定一个整数数组 nums 和一个整数 k
# 判断数组中是否存在两个相同元素，且下标差的绝对值 ≤ k
#
# 示例:
#   nums = [1, 2, 3, 1], k = 3
#   nums[0] = nums[3] = 1，且 |3 - 0| = 3 ≤ 3
#   所以返回 true
#
#   nums = [1, 2, 3, 1, 2, 3], k = 2
#   重复元素的下标差都 > 2，返回 false"""
explanation = "**问题重述**\n\n给定一个整数数组 `nums` 和一个整数 `k`，判断数组中是否存在两个**不同位置**的相同元素，其下标差的绝对值不超过 `k`。\n\n**输入与输出**\n\n- 输入：`nums`（整数数组）、`k`（最大允许距离）\n- 输出：`true`（存在满足条件的重复对）或 `false`（不存在）\n- 关键约束：`|i - j| <= k` 且 `i != j`\n- 边界情况：`k <= 0` 时直接返回 `false`；空数组或单元素数组也返回 `false`\n\n**示例走查**\n\n以测试用例 `nums = [1,2,3,1], k = 3` 为例：\n\n- 下标 0 的值为 1\n- 继续向后遍历到下标 3 时再次遇到 1\n- 两次出现的下标差为 `3 - 0 = 3`，满足 `<= k`\n\n因此 `expectedOutput = true`。\n\n**关键洞察**\n\n- 不需要记录所有出现位置，只需记录每个值**最近一次**出现的下标\n- 因为数组从左到右遍历，当前下标一定大于等于之前下标，所以距离直接用 `i - last[v]`\n- 哈希表让「查找最近下标」从 O(n) 降到 O(1)\n\n**方法预览**\n\n| 方法 | 数据结构 | 时间复杂度 | 空间复杂度 |\n|------|----------|------------|------------|\n| 哈希表记录最近下标 | 字典 | O(n) | O(n) |\n| 滑动窗口维护集合 | 集合 | O(n) | O(k) |\n\n> 与 lc217「存在重复元素」不同，本题不仅要找重复，还要满足距离约束。"
visualizationType = "intro"

