# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 判断子序列
# 给定字符串 s 和 t，判断 s 是否为 t 的子序列
#
# 子序列定义:
#   可以从 t 中删除若干字符（也可以不删除）得到 s
#   要求保持字符相对顺序，但不需要连续
#
# 示例:
#   s = "abc", t = "ahbgdc" → true
#   s = "axc", t = "ahbgdc" → false"""
explanation = "**问题分析**\n\n给定两个字符串 `s` 和 `t`，判断 `s` 是否为 `t` 的**子序列**：\n\n- 可以从 `t` 中删除若干字符得到 `s`\n- 要求保持字符相对顺序，但不需要连续\n\n**示例对照**\n\n| s | t | 结果 | 说明 |\n|---|---|------|------|\n| `\"abc\"` | `\"ahbgdc\"` | `true` | `a → b → c` 都能按顺序在 `t` 中找到 |\n| `\"axc\"` | `\"ahbgdc\"` | `false` | `x` 在 `t` 中不存在 |\n\n**思路**\n\n> 双指针遍历：`i` 指向 `s`，`j` 指向 `t`。\n> - 字符相等则 `i` 前进一步\n> - 无论是否相等，`j` 始终前进\n> - 最后判断 `i` 是否走完了 `s`"
visualizationType = "intro"

