#   nums = [5,7,7,8,8,10], target = 8
#   输出: [3, 4]（8 出现在索引 3 和 4）"""
explanation = "**问题分析**\n\n给定升序数组 `nums` 和目标值 `target`，返回 `[起始位置, 结束位置]`：\n\n- `target` 存在 → 返回其第一次和最后一次出现的索引\n- `target` 不存在 → 返回 `[-1, -1]`\n\n**约束条件**：必须 O(log n) 时间复杂度\n\n```\n示例：nums = [5, 7, 7, 8, 8, 10], target = 8\n\n索引:   0  1  2  3  4  5\n值:    [5, 7, 7, 8, 8, 10]\n              ↑        ↑\n             左边界   右边界\n\n输出: [3, 4]\n```\n\n**核心思路：两次二分查找**\n\n| 查找目标 | 二分条件 | 含义 |\n|----------|----------|------|\n| 左边界 | `nums[mid] >= target` 时收缩右边界 | 找第一个 ≥ target 的位置 |\n| 右边界 | `nums[mid] > target` 时收缩右边界 | 找第一个 > target 的位置后 -1 |"
