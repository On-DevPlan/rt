# ── Step 2: find_left 函数 + 二分逻辑 ───────────────────────────
[[algorithm.steps]]
id = 2
title = "查找左边界"
titleEn = "Find Left Boundary"
code = """# 34. 在排序数组中查找元素的第一个和最后一个位置
# 给定升序数组 nums 和目标值 target
# 返回 target 在数组中的起始和结束位置
# 如果不存在，返回 [-1, -1]
# 要求时间复杂度 O(log n)
#
# 示例:
#   nums = [5,7,7,8,8,10], target = 8
#   输出: [3, 4]（8 出现在索引 3 和 4）

from typing import List

def searchRange(nums: List[int], target: int) -> List[int]:
    \"\"\"返回 [起始位置, 结束位置]，不存在返回 [-1, -1]\"\"\"
    def find_left():
        left, right = 0, len(nums)
        while left < right:
            mid = (left + right) // 2
            if nums[mid] < target:
                left = mid + 1
            else:
                right = mid
        return left
    pass"""
explanation = "**第 2 步：实现 `find_left()` — 找第一个 ≥ target 的位置**\n\n左边界查找的二分逻辑：\n\n| 条件 | 操作 | 说明 |\n|------|------|------|\n| `nums[mid] < target` | `left = mid + 1` | 目标在右半区，缩小左边界 |\n| `nums[mid] >= target` | `right = mid` | 目标在左半区或就是 mid，缩小右边界 |\n\n终止条件 `left == right`：此时 `left` 就是第一个 ≥ target 的位置。\n\n```\nnums = [5, 7, 7, 8, 8, 10], target = 8\n\nfind_left() 执行过程：\n\n初始: left=0, right=6\nmid=2, nums[2]=7 < 8 → left=3\nmid=4, nums[4]=8 >= 8 → right=4\nmid=3, nums[3]=8 >= 8 → right=3\nleft=3, right=3 → 终止，返回 3 ✓\n```"
visualizationType = "code-only"

# ── Step 3: find_right 函数 + 二分逻辑 ──────────────────────────
[[algorithm.steps]]
id = 3
title = "查找右边界"
titleEn = "Find Right Boundary"
code = """# 34. 在排序数组中查找元素的第一个和最后一个位置
# 给定升序数组 nums 和目标值 target
# 返回 target 在数组中的起始和结束位置
# 如果不存在，返回 [-1, -1]
# 要求时间复杂度 O(log n)
#
# 示例:
#   nums = [5,7,7,8,8,10], target = 8
#   输出: [3, 4]（8 出现在索引 3 和 4）

from typing import List

def searchRange(nums: List[int], target: int) -> List[int]:
    \"\"\"返回 [起始位置, 结束位置]，不存在返回 [-1, -1]\"\"\"
    def find_left():
        left, right = 0, len(nums)
        while left < right:
            mid = (left + right) // 2
            if nums[mid] < target:
                left = mid + 1
            else:
                right = mid
        return left
    def find_right():
        left, right = 0, len(nums)
        while left < right:
            mid = (left + right) // 2
            if nums[mid] <= target:
                left = mid + 1
            else:
                right = mid
        return left
    pass"""
explanation = "**第 3 步：实现 `find_right()` — 找第一个 > target 的位置**\n\n右边界查找的二分逻辑（与 `find_left` 唯一区别是 `<=`）：\n\n| 条件 | 操作 | 说明 |\n|------|------|------|\n| `nums[mid] <= target` | `left = mid + 1` | 目标在右半区或就是 mid，继续向右 |\n| `nums[mid] > target` | `right = mid` | 目标在左半区，缩小右边界 |\n\n返回值 `left` 是第一个 **> target** 的位置，所以最后一个 `= target` 的位置是 `left - 1`。\n\n```\nnums = [5, 7, 7, 8, 8, 10], target = 8\n\nfind_right() 执行过程：\n\n初始: left=0, right=6\nmid=2, nums[2]=7 <= 8 → left=3\nmid=4, nums[4]=8 <= 8 → left=5\nmid=5, nums[5]=10 > 8 → right=5\nleft=5, right=5 → 终止，返回 5\n\n右边界 = 5 - 1 = 4 ✓\n```"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 34. 在排序数组中查找元素的第一个和最后一个位置
# 给定升序数组 nums 和目标值 target
# 返回 target 在数组中的起始和结束位置
# 如果不存在，返回 [-1, -1]
# 要求时间复杂度 O(log n)
#
# 示例:
#   nums = [5,7,7,8,8,10], target = 8
#   输出: [3, 4]（8 出现在索引 3 和 4）

from typing import List

def searchRange(nums: List[int], target: int) -> List[int]:
    \"\"\"返回 [起始位置, 结束位置]，不存在返回 [-1, -1]\"\"\"
    def find_left():
        left, right = 0, len(nums)
        while left < right:
            mid = (left + right) // 2
            if nums[mid] < target:
                left = mid + 1
            else:
                right = mid
        return left
    def find_right():
        left, right = 0, len(nums)
        while left < right:
            mid = (left + right) // 2
            if nums[mid] <= target:
                left = mid + 1
            else:
                right = mid
        return left

    l = find_left()
    r = find_right() - 1
    if l <= r and 0 <= l < len(nums) and nums[l] == target:
        return [l, r]
    return [-1, -1]"""
explanation = "**最终结果**\n\n✅ 完整算法实现\n\n**边界检查逻辑**\n\n```python\nl = find_left()         # 第一个 >= target 的位置\nr = find_right() - 1     # 最后一个 <= target 的位置\n\nif l <= r and 0 <= l < len(nums) and nums[l] == target:\n    return [l, r]\nreturn [-1, -1]\n```\n\n| 条件 | 说明 |\n|------|------|\n| `l <= r` | 左边界不能超过右边界 |\n| `0 <= l < len(nums)` | 左边界在合法范围内 |\n| `nums[l] == target` | 确认找到的就是 target |\n\n**示例验证**\n\n```\nnums = [5, 7, 7, 8, 8, 10], target = 8\n\nl = find_left() = 3\nr = find_right() - 1 = 5 - 1 = 4\n\n检查: 3 <= 4 ✓, nums[3] = 8 == 8 ✓\n输出: [3, 4] ✓\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | **O(log n)** — 两次二分查找 |\n| 空间复杂度 | **O(1)** — 只用了几个变量 |\n\n**关键技巧**\n\n- 左边界：找第一个 ≥ target（`nums[mid] >= target` 时收缩右边界）\n- 右边界：找第一个 > target（`nums[mid] > target` 时收缩右边界）后减 1\n- 两次二分可以独立定位区间两端"
