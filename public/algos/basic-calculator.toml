# ── Step 2: 初始化变量 + 处理数字与符号 ─────────────────────
[[algorithm.steps]]
id = 2
title = "累加数字与符号"
titleEn = "Accumulate Digits and Signs"
code = """# 基本计算器
# 实现一个支持 + - ( ) 和空格的整数计算器
# 不支持乘除，保证表达式合法
#
# 示例:
#   "1 + 1"             → 2
#   " 2-1 + 2 "         → 3
#   "(1+(4+5+2)-3)+(6+8)" → 23

def calculate(s: str) -> int:
    \"\"\"计算支持 + - ( ) 的整数表达式。\"\"\"
    stack = []
    num = 0
    sign = 1
    res = 0
    for c in s:
        if c.isdigit():
            num = num * 10 + int(c)
        elif c in '+-':
            res += sign * num
            num = 0
            sign = 1 if c == '+' else -1"""
explanation = "**第 2 步：累加数字与切换符号**\n\n四个核心变量：\n\n| 变量 | 含义 |\n|------|------|\n| `stack` | 保存外层（括号外）的 `(res, sign)` |\n| `num` | 正在读取的多位数 |\n| `sign` | 当前项的符号（`+1` 或 `-1`） |\n| `res` | 当前括号作用域内的累加结果 |\n\n**处理逻辑**\n\n```python\nif c.isdigit():\n    num = num * 10 + int(c)   # 累积读出完整数字\nelif c in '+-':\n    res += sign * num         # 结算前一项\n    num = 0                   # 重置 num\n    sign = 1 if c == '+' else -1   # 更新当前符号\n```\n\n> 遇 `+`/`-` 时**先结算再更新符号**：因为符号作用于下一项，而不是当前项。"
visualizationType = "code-only"

# ── Step 3: 处理括号 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "处理括号"
titleEn = "Handle Parentheses"
code = """# 基本计算器
# 实现一个支持 + - ( ) 和空格的整数计算器
# 不支持乘除，保证表达式合法
#
# 示例:
#   "1 + 1"             → 2
#   " 2-1 + 2 "         → 3
#   "(1+(4+5+2)-3)+(6+8)" → 23

def calculate(s: str) -> int:
    \"\"\"计算支持 + - ( ) 的整数表达式。\"\"\"
    stack = []
    num = 0
    sign = 1
    res = 0
    for c in s:
        if c.isdigit():
            num = num * 10 + int(c)
        elif c in '+-':
            res += sign * num
            num = 0
            sign = 1 if c == '+' else -1
        elif c == '(':
            stack.append((res, sign))
            res = 0
            sign = 1
        elif c == ')':
            res += sign * num
            num = 0
            prev_res, prev_sign = stack.pop()
            res = prev_res + prev_sign * res"""
explanation = "**第 3 步：用栈保存外层作用域**\n\n**遇到 `(`**\n\n```python\nstack.append((res, sign))   # 把当前的\"外层结果 + 外层符号\"压栈\nres = 0                       # 重置 res，开始新作用域\nsign = 1\n```\n\n**遇到 `)`**\n\n```python\nres += sign * num             # 先结算当前作用域\nnum = 0\nprev_res, prev_sign = stack.pop()\nres = prev_res + prev_sign * res   # 合并：外层结果 + 外层符号 × 本层结果\n```\n\n**核心思想**\n\n栈中保存的不是括号字符，而是**进入内层之前的外层状态**。\n\n| 操作 | 关键变量 |\n|------|----------|\n| 入栈 | `(res, sign)` —— 外层结果与外层符号 |\n| 出栈 | `prev_res + prev_sign * res` —— 合并两层的运算 |\n\n> `prev_sign * res` 体现了\"括号外的符号作用于整个括号\"这一性质。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 基本计算器
# 实现一个支持 + - ( ) 和空格的整数计算器
# 不支持乘除，保证表达式合法
#
# 示例:
#   "1 + 1"             → 2
#   " 2-1 + 2 "         → 3
#   "(1+(4+5+2)-3)+(6+8)" → 23

def calculate(s: str) -> int:
    \"\"\"计算支持 + - ( ) 的整数表达式。\"\"\"
    stack = []
    num = 0
    sign = 1
    res = 0
    for c in s:
        if c.isdigit():
            num = num * 10 + int(c)
        elif c in '+-':
            res += sign * num
            num = 0
            sign = 1 if c == '+' else -1
        elif c == '(':
            stack.append((res, sign))
            res = 0
            sign = 1
        elif c == ')':
            res += sign * num
            num = 0
            prev_res, prev_sign = stack.pop()
            res = prev_res + prev_sign * res
    return res + sign * num"""
explanation = "**最终结果**\n\n✅ 计算器实现完成\n\n```\n输入: \"1 + 1\"             → 2\n输入: \" 2-1 + 2 \"         → 3\n输入: \"(1+(4+5+2)-3)+(6+8)\" → 23\n```\n\n**为何需要 `return res + sign * num`？**\n\n循环结束时，最后一个数字可能还没被结算（因为它后面没有 `+`/`-`/`)` 触发）。\n所以返回前要补上：`res + sign * num`。\n\n**示例追踪**\n\n```\ns = \"(1+(4+5+2)-3)+(6+8)\"\n\nc='(' : 入栈 (0, 1),  res=0, sign=1\nc='1' : num=1\nc='+' : res += 1*1 = 1,  sign=1\nc='(' : 入栈 (1, 1),  res=0, sign=1\nc='4' : num=4\nc='+' : res += 1*4 = 4,  sign=1\nc='5' : num=5\nc='+' : res += 1*5 = 9,  sign=1\nc='2' : num=2\nc=')' : res += 1*2 = 11,  出栈 (1,1) → res = 1 + 1*11 = 12\nc='-' : res += 1*12 = 12, sign=-1\nc='3' : num=3\nc=')' : res += -1*3 = 9,  出栈 (0,1)  → res = 0 + 1*9 = 9\nc='+' : res += 1*9 = 9,   sign=1\nc='(' : 入栈 (9, 1),  res=0, sign=1\nc='6' : num=6\nc='+' : res += 1*6 = 6,  sign=1\nc='8' : num=8\nc=')' : res += 1*8 = 14, 出栈 (9,1)  → res = 9 + 1*14 = 23\n结束: res + sign*num = 23 + 1*0 = 23 ✓\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | **O(n)** — 每个字符遍历一次 |\n| 空间复杂度 | **O(n)** — 栈深度等于括号嵌套层数 |\n\n**关键技巧：栈存外层符号**\n\n- 栈存的不是括号本身，而是**进入内层前**的 `(res, sign)`\n- 出栈合并时用 `prev_sign * res`，把外层符号乘到内层结果上\n- 这样 `1 - (2 + 3)` 自然算出 `1 - 5 = -4`"
