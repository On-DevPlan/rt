# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 基本计算器
# 实现一个支持 + - ( ) 和空格的整数计算器
# 不支持乘除，保证表达式合法
#
# 示例:
#   "1 + 1"             → 2
#   " 2-1 + 2 "         → 3
#   "(1+(4+5+2)-3)+(6+8)" → 23"""
explanation = """
**问题重述**

给定一个只包含非负整数、`+`、`-`、`(`、`)` 和空格的合法字符串表达式 `s`，计算并返回该表达式的整数值。

**输入与输出**

- 输入：字符串 `s`，如 `"(1+(4+5+2)-3)+(6+8)"`。
- 输出：整数，表示表达式的计算结果。
- 边界：表达式合法；数字可能有多位；不含乘除；空格需忽略。

**示例走查**

以题目给出的 `s = "(1+(4+5+2)-3)+(6+8)"` 为例，预期输出为 `expectedOutput = "23"`

1. 计算最内层括号 `(4+5+2) = 11`。
2. 代入外层：`1 + 11 - 3 = 9`。
3. 再计算 `(6+8) = 14`。
4. 最后 `9 + 14 = 23`。

返回 `23`，与预期输出一致。

**关键洞察**

括号会改变符号的作用范围。如 `1 - (2 + 3)` 中，外层的 `-` 作用于整个括号结果。解决方案是用栈保存**进入括号前**的外层累加结果 `(res, sign)`，遇右括号时合并。

| 难点 | 说明 |
|------|------|
| 多位数 | 累积读取 `num = num * 10 + int(c)` |
| 符号优先 | `+`/`-` 影响下一项，非前一项 |
| 括号嵌套 | 内层结果受外层符号约束 |
| 空格 | 直接忽略 |

**方法预览**

单遍扫描 + 栈保存外层状态 `(res, sign)`。

| 指标 | 值 |
|------|------|
| 算法 | 栈保存外层 (res, sign) |
| 时间复杂度 | O(n) |
| 空间复杂度 | O(n) |
"""
visualizationType = "intro"

