# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 有效的括号
# 给定一个只包含字符 '()[]{}' 的字符串 s
# 判断字符串中的括号是否匹配（闭合顺序正确）
#
# 匹配规则:
#   1. 左括号必须用相同类型的右括号闭合
#   2. 左括号必须以正确的顺序闭合
#   3. 每个右括号都有一个对应的相同类型的左括号
#
# 示例:
#   "()"      → true
#   "()[]{}"  → true
#   "(]"      → false
#   "([)]"    → false
#   "{[]}"    → true"""
explanation = "**问题分析**\n\n给定一个只包含 `()[]{}` 六种字符的字符串，判断括号是否**正确匹配**。\n\n**匹配三原则**\n\n1. 左括号必须用**相同类型**的右括号闭合\n2. 左括号必须以**正确的顺序**闭合（后进先出）\n3. 每个右括号都有**对应**的左括号\n\n**示例对照**\n\n| 输入 | 结果 | 说明 |\n|------|------|------|\n| `\"()\"` | `true` | 简单匹配 |\n| `\"()[]{}\"` | `true` | 多个独立的括号对 |\n| `\"(]\"` | `false` | 类型不匹配 |\n| `\"([)]\"` | `false` | 交叉闭合，顺序错乱 |\n| `\"{[]}\"` | `true` | 嵌套匹配 |\n\n> 关键观察：**后进先出** → 用栈解决。"
visualizationType = "intro"

# ── Step 1: 函数签名 ──────────────────────────────────────────
[[algorithm.steps]]
id = 1
title = "函数签名"
titleEn = "Function Signature"
code = """# 有效的括号
# 给定一个只包含字符 '()[]{}' 的字符串 s
