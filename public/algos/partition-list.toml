# ── Step0:理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id =0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 分隔链表
# 给定一个链表的头节点 head 和一个特定值 x
# 将所有小于 x 的节点排在大于或等于 x 的节点之前
# 注意:保持节点相对顺序即可，不需要完全排序
#
# 示例:
# head = [1,4,3,2,5,2], x =3
# 结果: [1,2,2,4,3,5]
# <3 <3 ≥3 ≥3"""
explanation = "**问题分析**\n\n给定链表和一个值 `x`，把链表分成两段：\n- 前段：所有 **小于** `x` 的节点\n- 后段：所有 **大于或等于** `x` 的节点\n\n**关键点**\n\n- 不要求完全排序，只需按 `x`切分\n-保持节点原有**相对顺序**\n- 必须**稳定**地处理相同大小的节点\n\n| 输入 | x | 输出 |\n|------|---|------|\n| `[1,4,3,2,5,2]` | `3` | `[1,2,2,4,3,5]` |\n\n> 双虚拟头 +一次遍历 +拼接 是这道题最优雅的解法。"
visualizationType = "intro"

