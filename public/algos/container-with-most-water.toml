# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 盛最多水的容器
# 给定一个长度为 n 的整数数组 height
# 数组中的每条线 height[i] 表示第 i 条垂线的高度
# 找两条垂线，与 x 轴共同构成一个容器，能盛最多的水
#
# 容器容量公式:
#   area(i, j) = min(height[i], height[j]) * (j - i)
#   即: 短板高度 × 两线水平距离
#
# 示例:
#   height = [1, 8, 6, 2, 5, 4, 8, 3, 7]
#   最优解: i=1 (高 8), j=8 (高 7)
#   容量 = min(8, 7) * (8 - 1) = 7 * 7 = 49
#
#   █
#   █           █     █
#   █     █     █     █   █
#   █     █   █ █     █   █
#   █     █ █ █ █   █ █ █ █
#   ─────────────────────────
#   0 1 2 3 4 5 6 7 8 ..."""
explanation = "**问题分析**\n\n在 `height` 数组中任选两条垂线，与 x 轴围成木桶。容量 = **短板高度 × 水平距离**。\n\n**暴力枚举**\n\n枚举所有 `(i, j)` 对，O(n²) 时间，太慢。\n\n**贪心双指针思路**\n\n> 从最外侧 `(0, n-1)` 开始，每次向内移动**较矮的那条线**——因为容器容量受限于短板，宽度又在持续缩小。\n\n| 状态 | 时间 | 空间 | 思路 |\n|------|------|------|------|\n| 暴力枚举 | O(n²) | O(1) | 遍历所有 (i, j) |\n| **双指针贪心** | **O(n)** | **O(1)** | 每次只移动短板 |\n\n> 每条线最多被访问一次，n-1 步内必有答案。"
visualizationType = "intro"

