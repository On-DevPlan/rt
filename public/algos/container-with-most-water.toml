# ── Step 2: 初始化双指针 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 盛最多水的容器
# 给定一个长度为 n 的整数数组 height
# 数组中的每条线 height[i] 表示第 i 条垂线的高度
# 找两条垂线，与 x 轴共同构成一个容器，能盛最多的水
#
# 容器容量公式:
#   area(i, j) = min(height[i], height[j]) * (j - i)
#   即: 短板高度 × 两线水平距离
#
# 示例:
#   height = [1, 8, 6, 2, 5, 4, 8, 3, 7]
#   最优解: i=1 (高 8), j=8 (高 7)
#   容量 = min(8, 7) * (8 - 1) = 7 * 7 = 49
#
#   █
#   █           █     █
#   █     █     █     █   █
#   █     █   █ █     █   █
#   █     █ █ █ █   █ █ █ █
#   ─────────────────────────
#   0 1 2 3 4 5 6 7 8 ...

from typing import List

def maxArea(height: List[int]) -> int:
    \"\"\"返回两条垂线与 x 轴构成容器的最大容量。\"\"\"
    l, r = 0, len(height) - 1  # 左右指针
    ans = 0  # 当前找到的最大容量"""
explanation = "**第 2 步：初始化双指针**\n\n```\nheight: [1, 8, 6, 2, 5, 4, 8, 3, 7]\n         L                 R\n         ↑                 ↑\n         l                 r\n         (0)               (8)\n```\n\n| 变量 | 含义 | 初值 |\n|------|------|------|\n| `l` | 左指针 | `0` |\n| `r` | 右指针 | `len(height) - 1` |\n| `ans` | 当前最大容量 | `0` |\n\n> 从最宽的窗口开始，宽度 = `r - l`，向内收敛。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "移动短板"
titleEn = "Move the Shorter Side"
code = """# 盛最多水的容器
# 给定一个长度为 n 的整数数组 height
# 数组中的每条线 height[i] 表示第 i 条垂线的高度
# 找两条垂线，与 x 轴共同构成一个容器，能盛最多的水
#
# 容器容量公式:
#   area(i, j) = min(height[i], height[j]) * (j - i)
#   即: 短板高度 × 两线水平距离
#
# 示例:
#   height = [1, 8, 6, 2, 5, 4, 8, 3, 7]
#   最优解: i=1 (高 8), j=8 (高 7)
#   容量 = min(8, 7) * (8 - 1) = 7 * 7 = 49
#
#   █
#   █           █     █
#   █     █     █     █   █
#   █     █   █ █     █   █
#   █     █ █ █ █   █ █ █ █
#   ─────────────────────────
#   0 1 2 3 4 5 6 7 8 ...

from typing import List

def maxArea(height: List[int]) -> int:
    \"\"\"返回两条垂线与 x 轴构成容器的最大容量。\"\"\"
    l, r = 0, len(height) - 1  # 左右指针
    ans = 0  # 当前找到的最大容量

    while l < r:
        h = min(height[l], height[r])
        ans = max(ans, h * (r - l))  # 更新最大容量
        if height[l] < height[r]: l += 1  # 左矮就右移左指针
        else: r -= 1  # 否则左移右指针（包含等高）"""
explanation = "**第 3 步：移动短板**\n\n**为什么移动短板而不是长板？**\n\n> 容量 = `min(h[l], h[r]) * (r - l)`，宽度 `(r-l)` 每次都减 1。\n> 决定容量的是**短板**：若移动长板，短板不变，宽度减小 → 容量**必然减小**。\n> 若移动短板，则可能遇到更高的线，**有机会扩大容量**。\n\n**单步逻辑**\n\n| 条件 | 操作 | 原因 |\n|------|------|------|\n| `height[l] < height[r]` | `l += 1` | 左是短板，放弃左线 |\n| `height[l] >= height[r]` | `r -= 1` | 右是短板（等高任选），放弃右线 |\n\n**示例执行** (`height = [1, 8, 6, 2, 5, 4, 8, 3, 7]`)\n\n| 步 | l,r | h, w | area | ans | 移动 |\n|----|-----|------|------|-----|------|\n| 1 | 0,8 | 1, 8 | 8 | 8 | l→1 (左矮) |\n| 2 | 1,8 | 7, 7 | 49 | 49 | r→7 (等高右) |\n| 3 | 1,7 | 3, 6 | 18 | 49 | r→6 |\n| ... | ... | ... | ... | 49 | ... |"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 盛最多水的容器
# 给定一个长度为 n 的整数数组 height
# 数组中的每条线 height[i] 表示第 i 条垂线的高度
# 找两条垂线，与 x 轴共同构成一个容器，能盛最多的水
#
# 容器容量公式:
#   area(i, j) = min(height[i], height[j]) * (j - i)
#   即: 短板高度 × 两线水平距离
#
# 示例:
#   height = [1, 8, 6, 2, 5, 4, 8, 3, 7]
#   最优解: i=1 (高 8), j=8 (高 7)
#   容量 = min(8, 7) * (8 - 1) = 7 * 7 = 49
#
#   █
#   █           █     █
#   █     █     █     █   █
#   █     █   █ █     █   █
#   █     █ █ █ █   █ █ █ █
#   ─────────────────────────
#   0 1 2 3 4 5 6 7 8 ...

from typing import List

def maxArea(height: List[int]) -> int:
    \"\"\"返回两条垂线与 x 轴构成容器的最大容量。\"\"\"
    l, r = 0, len(height) - 1  # 左右指针
    ans = 0  # 当前找到的最大容量

    while l < r:
        h = min(height[l], height[r])
        ans = max(ans, h * (r - l))  # 更新最大容量
        if height[l] < height[r]: l += 1  # 左矮就右移左指针
        else: r -= 1  # 否则左移右指针（包含等高）
    return ans"""
explanation = "**最终结果**\n\n✅ 双指针法找到最大盛水容器\n\n```\n输入: height = [1, 8, 6, 2, 5, 4, 8, 3, 7]\n输出: 49\n最优: i=1 (高 8), j=8 (高 7), 面积 = 7 * 7 = 49\n```\n\n**算法复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | O(n) | 左右指针各最多移动 n 次 |\n| 空间复杂度 | O(1) | 仅用 3 个变量 |\n\n**为什么移动短板一定不会漏掉最优解？**\n\n- 若当前短板在 l，假设答案是 `(l, k)`，其中 `k > r` 不存在（`r` 已是右端）\n- 若答案与当前 l 无关：移动 l 不影响\n- 若答案与当前 l 有关：必须有一个 `k > r` 且 `min(h[l], h[k]) > h[l]`，\n  但 `h[k] <= h[r]`（已被探测过 `min(h[l], h[r]) = h[l]`），所以**以 l 为短板的最大面积**就是当前面积\n- 结论：移动 l 后，`l` 已被\"结算\"，不再可能产生更大面积\n\n> **关键洞察**：短板决定当前桶高，长板已被充分利用，移动长板只会让桶更窄更浅——所以贪心地放弃短板，**让宽度让步给高度**。"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[1, 8, 6, 2, 5, 4, 8, 3, 7]", result = "49", highlightedIndices = [1, 8] }

[algorithm.summary]
timeComplexity = "O(n)"
spaceComplexity = "O(1)"
approach = "双指针贪心（移动短板）"
keyInsight = "容量受限于短板且宽度递减，移动长板只会更糟，因此每次放弃短板以寻找更高的线"
