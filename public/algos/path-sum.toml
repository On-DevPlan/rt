# ── Step0:理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id =0
title = "理解问题"
titleEn = "Understand the Problem"
code = """#112.路径总和
# 给定一棵二叉树的根节点 root 和一个目标值 targetSum
# 判断是否存在从根节点到叶子节点的路径
# 使得这条路径上所有节点值之和等于 targetSum
#
#叶子节点: 没有子节点的节点
#
# 示例:
# root = [5,4,8,11,null,13,4,7,2,null,null,null,1]
# targetSum =22
# 输出: true
# (路径:5 →4 →11 →2, 和 =22)"""
explanation = "**问题分析**\n\n给定一棵二叉树和一个目标值 `targetSum`，判断是否存在一条 **根到叶子** 的路径，使路径节点值之和等于 `targetSum`。\n\n**关键约束**\n\n-路径必须从 **根节点** 开始\n-路径必须到 **叶子节点**结束（不能中途终止）\n-路径上所有节点值 **逐个累加**\n\n**示例**：\n\n```\n5\n / \\\n48\n / / \\\n11134\n / \\ \\\n721\n\ntargetSum =22\n路径5→4→11→2:5+4+11+2 =22 ✓\n```\n\n**核心思路**：DFS递归，每层把 `targetSum`减去当前节点值。"
visualizationType = "intro"

# ── Step1: 函数签名 + TreeNode + 空节点 base case ───────────
[[algorithm.steps]]
id =1
title = "签名与空节点"
titleEn = "Signature & Empty Base Case"
code = """#112.路径总和
# 给定一棵二叉树的根节点 root 和一个目标值 targetSum
# 判断是否存在从根节点到叶子节点的路径
# 使得这条路径上所有节点值之和等于 targetSum
#
#叶子节点: 没有子节点的节点
#
# 示例:
# root = [5,4,8,11,null,13,4,7,2,null,null,null,1]
# targetSum =22
# 输出: true
# (路径:5 →4 →11 →2, 和 =22)

from typing import Optional

class TreeNode:
 def __init__(self, val=0, left=None, right=None):
 self.val = val
 self.left = left
 self.right = right

def hasPathSum(root: Optional[TreeNode], targetSum: int) -> bool:
 \"\"\"判断是否存在根到叶路径和等于 targetSum\"\"\"
 if not root:
 return False"""
explanation = "**第1步：定义结构与函数签名**\n\n```python\nclass TreeNode:\n def __init__(self, val=0, left=None, right=None): ...\n\ndef hasPathSum(root, targetSum) -> bool: ...\n```\n\n- `TreeNode`：标准二叉树节点定义\n- `Optional[TreeNode]`：根可能为空\n- 返回 `bool`\n\n**第一个 base case：空节点**\n\n```python\nif not root:\n return False\n```\n\n>根为空表示树不存在，显然不可能存在满足条件的路径，直接返回 `False`。\n\n**文档字符串**用 `\"\"\"...\"\"\"` 转义写法（TOML 多行字符串规范）。"
visualizationType = "code-only"

# ── Step2:叶子节点 base case ───────────────────────────────
[[algorithm.steps]]
id =2
title = "叶子节点判定"
titleEn = "Leaf Node Check"
code = """#112.路径总和
# 给定一棵二叉树的根节点 root 和一个目标值 targetSum
# 判断是否存在从根节点到叶子节点的路径
# 使得这条路径上所有节点值之和等于 targetSum
#
#叶子节点: 没有子节点的节点
#
# 示例:
# root = [5,4,8,11,null,13,4,7,2,null,null,null,1]
# targetSum =22
# 输出: true
# (路径:5 →4 →11 →2, 和 =22)

from typing import Optional

class TreeNode:
 def __init__(self, val=0, left=None, right=None):
 self.val = val
 self.left = left
 self.right = right

def hasPathSum(root: Optional[TreeNode], targetSum: int) -> bool:
 \"\"\"判断是否存在根到叶路径和等于 targetSum\"\"\"
 if not root:
 return False
 if not root.left and not root.right:
 return root.val == targetSum"""
explanation = "**第2步：叶子节点判定**\n\n```python\nif not root.left and not root.right:\n return root.val == targetSum\n```\n\n**为何用 `targetSum` 而不是累加和？**\n\n题目要求「路径和等于 `targetSum`」。我们采用 **减法传递**：每层把 `targetSum`减去当前节点值。\n\n| 当前节点 |剩余目标 | 说明 |\n|---------|---------|------|\n|叶子节点 |0 | `val == targetSum` 即命中 |\n|叶子节点 | ≠0 | `val != targetSum` 未命中 |\n\n**为什么只在叶子节点比较？**\n\n>题目规定路径必须终止于叶子节点。如果中途节点值相等也不能算答案（例如根值为5、target 为5，但根不是叶子）。"
visualizationType = "code-only"

# ── Step3:递归调用 +短路或 ───────────────────────────────
[[algorithm.steps]]
id =3
title = "递归与短路或"
titleEn = "Recursion with Short-Circuit OR"
code = """#112.路径总和
# 给定一棵二叉树的根节点 root 和一个目标值 targetSum
# 判断是否存在从根节点到叶子节点的路径
# 使得这条路径上所有节点值之和等于 targetSum
#
#叶子节点: 没有子节点的节点
#
# 示例:
# root = [5,4,8,11,null,13,4,7,2,null,null,null,1]
# targetSum =22
# 输出: true
# (路径:5 →4 →11 →2, 和 =22)

from typing import Optional

class TreeNode:
 def __init__(self, val=0, left=None, right=None):
 self.val = val
 self.left = left
 self.right = right

def hasPathSum(root: Optional[TreeNode], targetSum: int) -> bool:
 \"\"\"判断是否存在根到叶路径和等于 targetSum\"\"\"
 if not root:
 return False
 if not root.left and not root.right:
 return root.val == targetSum
 remaining = targetSum - root.val
 return (hasPathSum(root.left, remaining) or
 hasPathSum(root.right, remaining))"""
explanation = "**第3步：递归左右子树**\n\n```python\nremaining = targetSum - root.val\nreturn (hasPathSum(root.left, remaining) or\n hasPathSum(root.right, remaining))\n```\n\n**核心：减法传递**\n\n- 当前节点贡献 `root.val`，把 `targetSum`减去这个值\n-向下传递 `remaining`，递归询问子树\n\n**短路或 (`or`) 的妙用**\n\n- 如果左子树已经命中（即找到了合法路径），**直接返回 `True`，不再递归右子树**\n-节省不必要的遍历，提升平均性能\n\n**示例追踪**（targetSum =22）：\n\n```\nhasPathSum(5,22)\n remaining =17\n → hasPathSum(4,17)\n remaining =13\n → hasPathSum(11,13)\n remaining =2\n → hasPathSum(2,2) ←叶子,2 ==2 ✓ True\n```"
visualizationType = "code-only"

# ── Step4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id =4
title = "完成"
titleEn = "Complete"
code = """#112.路径总和
# 给定一棵二叉树的根节点 root 和一个目标值 targetSum
# 判断是否存在从根节点到叶子节点的路径
# 使得这条路径上所有节点值之和等于 targetSum
#
#叶子节点: 没有子节点的节点
#
# 示例:
# root = [5,4,8,11,null,13,4,7,2,null,null,null,1]
# targetSum =22
# 输出: true
# (路径:5 →4 →11 →2, 和 =22)

from typing import Optional

class TreeNode:
 def __init__(self, val=0, left=None, right=None):
 self.val = val
 self.left = left
 self.right = right

def hasPathSum(root: Optional[TreeNode], targetSum: int) -> bool:
 \"\"\"判断是否存在根到叶路径和等于 targetSum\"\"\"
 if not root:
 return False
 if not root.left and not root.right:
 return root.val == targetSum
 remaining = targetSum - root.val
 return (hasPathSum(root.left, remaining) or
 hasPathSum(root.right, remaining))"""
explanation = "**最终结果**\n\n✅ DFS递归完成\n\n```\n输入: root = [5,4,8,11,null,13,4,7,2,null,null,null,1], targetSum =22\n输出: true\n路径:5 →4 →11 →2 (5+4+11+2 =22)\n```\n\n**算法复杂度**\n\n|指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点最多访问一次 |\n|空间复杂度 | O(h) —递归栈深度（h 为树高） |\n\n**核心技巧总结**\n\n- **减法传递**：递归时把 `targetSum - node.val` 作为新的目标，递归体不再做加法\n- **叶子终止**：只有叶子节点才比较 `val == targetSum`，避免误判中途节点\n- **短路或**：用 `or` 连接左右子树递归，找到答案立即停止"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[5,4,8,11,13,4,7,2,1]", result = "true", highlightedIndices = [0,1,3,6,7] }

