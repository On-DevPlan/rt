# 节点值：0 ~ 9
#
# 示例:
#   l1 = [2, 4, 3]   -> 表示数字 342
#   l2 = [5, 6, 4]   -> 表示数字 465
#   相加: 342 + 465 = 807
#   结果: [7, 0, 8]   (逆序存储，所以个位 7 在头部)"""
explanation = "**问题分析**\n\n两个链表节点按 **逆序** 存储数字的每一位：\n\n```\n342  ->  l1: 2 -> 4 -> 3 -> None\n465  ->  l2: 5 -> 6 -> 4 -> None\n807  ->  res: 7 -> 0 -> 8 -> None\n```\n\n**关键约束**\n\n- 数字顺序与链表顺序相反，所以**头节点就是个位**\n- 需要处理**进位** `carry`，最高位可能产生新的节点（如 `5 + 5 = 10`）\n- 两链表长度可能不同，需要处理剩余部分\n\n> 逆序存储的好处：从链表头开始处理正好是数学加法的个位到高位顺序。"
visualizationType = "intro"

