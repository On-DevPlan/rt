# ── Step 2: 初始化哑节点与指针 ──────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化指针"
titleEn = "Initialize Pointers"
code = """# 两数相加 (LeetCode 2)
# 给定两个非空链表 l1 和 l2，表示两个非负整数
# 每一位数字都是按 逆序 存储的：个位在链表头部
# 节点数：每个链表 1 ~ 100
# 节点值：0 ~ 9
#
# 示例:
#   l1 = [2, 4, 3]   -> 表示数字 342
#   l2 = [5, 6, 4]   -> 表示数字 465
#   相加: 342 + 465 = 807
#   结果: [7, 0, 8]   (逆序存储，所以个位 7 在头部)

from typing import Optional

class ListNode:
    def __init__(self, x):
        self.val = x
        self.next = None

def addTwoNumbers(l1: Optional[ListNode], l2: Optional[ListNode]) -> Optional[ListNode]:
    \"\"\"返回两数相加后的链表头节点。\"\"\"
    dummy = ListNode(0)   # 哑节点，简化头节点处理
    cur = dummy           # 当前结果链表末尾指针
    carry = 0             # 进位"""
explanation = "**第 2 步：准备三个变量**\n\n| 变量 | 作用 | 初值 |\n|------|------|------|\n| `dummy` | 哑节点，简化头节点插入逻辑 | `ListNode(0)` |\n| `cur` | 当前结果链表末尾指针 | 指向 `dummy` |\n| `carry` | 进位（0 或 1） | `0` |\n\n**为什么用哑节点？**\n\n- 第一个结果节点也需要同样的插入逻辑\n- 没有哑节点就要单独处理头节点，代码会复杂\n- 最终返回 `dummy.next` 即可"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历与进位"
titleEn = "Traverse with Carry"
code = """# 两数相加 (LeetCode 2)
# 给定两个非空链表 l1 和 l2，表示两个非负整数
# 每一位数字都是按 逆序 存储的：个位在链表头部
# 节点数：每个链表 1 ~ 100
# 节点值：0 ~ 9
#
# 示例:
#   l1 = [2, 4, 3]   -> 表示数字 342
#   l2 = [5, 6, 4]   -> 表示数字 465
#   相加: 342 + 465 = 807
#   结果: [7, 0, 8]   (逆序存储，所以个位 7 在头部)

from typing import Optional

class ListNode:
    def __init__(self, x):
        self.val = x
        self.next = None

def addTwoNumbers(l1: Optional[ListNode], l2: Optional[ListNode]) -> Optional[ListNode]:
    \"\"\"返回两数相加后的链表头节点。\"\"\"
    dummy = ListNode(0)   # 哑节点，简化头节点处理
    cur = dummy           # 当前结果链表末尾指针
    carry = 0             # 进位

    while l1 or l2 or carry:
        s = carry
        if l1: s += l1.val; l1 = l1.next
        if l2: s += l2.val; l2 = l2.next
        carry, val = divmod(s, 10)
        cur.next = ListNode(val)
        cur = cur.next
    return dummy.next"""
explanation = "**第 3 步：核心循环 — 同时遍历 + 维护进位**\n\n**循环条件**：`l1 or l2 or carry`\n\n- 任一链表未走完，或还有进位就继续\n\n**每轮三步**\n\n1. **累加**：`s = carry + (l1.val if l1 else 0) + (l2.val if l2 else 0)`\n2. **拆分**：`(carry, val) = divmod(s, 10)` — 进位与当前位\n3. **追加**：`cur.next = ListNode(val); cur = cur.next`\n\n**示例追踪** `l1=[2,4,3], l2=[5,6,4]`\n\n| 轮 | l1 | l2 | carry | s | val | 结果 |\n|----|----|----|-------|---|-----|------|\n| 1 | 2 | 5 | 0 | 7 | 7 | [7] |\n| 2 | 4 | 6 | 0 | 10 | 0 | [7,0] |\n| 3 | 3 | 4 | 1 | 8 | 8 | [7,0,8] |\n| 4 | None | None | 0 | 0 | — | 结束 |\n\n> `divmod(s, 10)` 一次返回 `(carry, val)`，比手写 `carry = s // 10; val = s % 10` 更简洁。"
visualizationType = "code-only"

