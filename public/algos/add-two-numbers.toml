# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 两数相加 (LeetCode 2)
# 给定两个非空链表 l1 和 l2，表示两个非负整数
# 每一位数字都是按 逆序 存储的：个位在链表头部
# 节点数：每个链表 1 ~ 100
# 节点值：0 ~ 9
#
# 示例:
#   l1 = [2, 4, 3]   -> 表示数字 342
#   l2 = [5, 6, 4]   -> 表示数字 465
#   相加: 342 + 465 = 807
#   结果: [7, 0, 8]   (逆序存储，所以个位 7 在头部)"""
explanation = "**问题重述**\n\n给定两个非空链表 `l1` 和 `l2`，分别表示两个非负整数。链表的每一位数字按**逆序**存储：头节点是个位，后续节点依次是十位、百位……要求返回两数相加后的结果链表，同样以逆序形式存储。\n\n**输入与输出**\n\n- **输入**：`l1 = [2, 4, 3]`，`l2 = [5, 6, 4]`。\n- **输出**：`[7, 0, 8]`。\n- **含义**：`l1` 表示 `342`，`l2` 表示 `465`，`342 + 465 = 807`，逆序存储为 `[7, 0, 8]`。\n- **边界情况**：两链表长度可能不同；最高位相加可能产生新的进位节点（如 `5 + 5 = 10` 时结果要多一位）。\n\n**示例走查**\n\n以 `l1 = [2, 4, 3]`，`l2 = [5, 6, 4]` 为例：\n\n1. 头节点对齐个位：`2 + 5 = 7`，无进位，结果第一位为 `7`。\n2. 十位：`4 + 6 = 10`，当前位写 `0`，向高位进 `1`。\n3. 百位：`3 + 4 + 进位 1 = 8`，当前位写 `8`，无新进位。\n4. 两个链表都遍历完毕且进位为 `0`，结束。最终结果为 `[7, 0, 8]`。\n\n**关键洞察**\n\n- 逆序存储恰好与手工竖式加法的顺序一致（从个位到高位），因此可以从链表头同步遍历，逐位相加。\n- 必须维护进位 `carry`，并在遍历结束后检查是否还有剩余进位需要生成新节点。\n\n**方法预览**\n\n| 项目 | 说明 |\n|------|------|\n| 数据结构 | 单向链表 + 哑节点 |\n| 时间复杂度 | O(max(m, n))，m、n 分别为两链表长度 |\n| 空间复杂度 | O(max(m, n))，结果链表长度 |\n| 关键操作 | `s = carry + l1.val + l2.val`，`carry, val = divmod(s, 10)` |"
visualizationType = "intro"

