titleEn = "Complete"
code = """# 两数相加 (LeetCode 2)
# 给定两个非空链表 l1 和 l2，表示两个非负整数
# 每一位数字都是按 逆序 存储的：个位在链表头部
# 节点数：每个链表 1 ~ 100
# 节点值：0 ~ 9
#
# 示例:
#   l1 = [2, 4, 3]   -> 表示数字 342
#   l2 = [5, 6, 4]   -> 表示数字 465
#   相加: 342 + 465 = 807
#   结果: [7, 0, 8]   (逆序存储，所以个位 7 在头部)

from typing import Optional

class ListNode:
    def __init__(self, x):
        self.val = x
        self.next = None

def addTwoNumbers(l1: Optional[ListNode], l2: Optional[ListNode]) -> Optional[ListNode]:
    \"\"\"返回两数相加后的链表头节点。\"\"\"
    dummy = ListNode(0)   # 哑节点，简化头节点处理
    cur = dummy           # 当前结果链表末尾指针
    carry = 0             # 进位

    while l1 or l2 or carry:
        s = carry
        if l1: s += l1.val; l1 = l1.next
        if l2: s += l2.val; l2 = l2.next
        carry, val = divmod(s, 10)
        cur.next = ListNode(val)
        cur = cur.next
    return dummy.next"""
explanation = "**最终结果**\n\n```\n输入: l1 = [2,4,3], l2 = [5,6,4]\n      (表示 342 + 465)\n输出: [7,0,8]\n      (表示 807)\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(max(m, n)) — 遍历两链表各一次 |\n| 空间复杂度 | O(max(m, n)) — 结果链表 |\n\n**关键技巧**\n\n- **哑节点**：统一处理头节点插入\n- **三或条件循环**：避免处理「最后进位」边界\n- **divmod**：一步得到进位与当前位\n\n> 即使 `l1` 和 `l2` 都已经遍历完，只要 `carry = 1` 就要再生成一个新节点（如 `5 + 5 = 10`）。"
visualizationType = "result"
