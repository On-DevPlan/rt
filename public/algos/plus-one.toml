# ── Step 3: 处理非9数字 ────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "处理非9数字"
titleEn = "Handle Non-9 Digit"
code = """# 加一
# 给定一个用数组表示的非负整数，每位数字按数组元素顺序存储
# 数组最高位在索引 0，最低位在数组末尾
# 将该整数加一后，返回新的数组表示
#
# 示例:
#   digits = [1,2,3] → 整数 123 → 加一 → 124 → [1,2,4]
#   digits = [9,9,9] → 整数 999 → 加一 → 1000 → [1,0,0,0]
#
# 关键约束:
#   1. 数组不包含前导零（除数字 0 本身）
#   2. 需要处理进位

from typing import List

def plusOne(digits: List[int]) -> List[int]:
    \"\"\"返回加一后的结果\"\"\"
    n = len(digits)
    for i in range(n - 1, -1, -1):
        if digits[i] < 9:
            digits[i] += 1
            return digits"""
explanation = "**第 3 步：处理非9数字**\n\n**核心逻辑**\n\n```\nif digits[i] < 9:\n    digits[i] += 1\n    return digits\n```\n\n**示例执行：**\n\n```\ndigits = [1, 2, 3]\n\ni=2: digits[2]=3 < 9? 是 → digits[2]=4, return [1,2,4] ✓\n```\n\n| 条件 | 操作 |\n|------|------|\n| `digits[i] < 9` | 加一后直接返回，无需继续进位 |\n| `digits[i] = 9` | 需要变 0 并继续向左进位 |\n\n> 只要遇到一个小于 9 的数字，加一后就可以立即返回，后面的数字无需改变。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 加一
# 给定一个用数组表示的非负整数，每位数字按数组元素顺序存储
# 数组最高位在索引 0，最低位在数组末尾
# 将该整数加一后，返回新的数组表示
#
# 示例:
#   digits = [1,2,3] → 整数 123 → 加一 → 124 → [1,2,4]
#   digits = [9,9,9] → 整数 999 → 加一 → 1000 → [1,0,0,0]
#
# 关键约束:
#   1. 数组不包含前导零（除数字 0 本身）
#   2. 需要处理进位

from typing import List

def plusOne(digits: List[int]) -> List[int]:
    \"\"\"返回加一后的结果\"\"\"
    n = len(digits)
    for i in range(n - 1, -1, -1):
        if digits[i] < 9:
            digits[i] += 1
            return digits
        digits[i] = 0
    return [1] + digits"""
explanation = "**最终结果**\n\n✅ 完整进位逻辑实现\n\n**执行示例：**\n\n```\ncase 1: digits = [1,2,3]\n  i=2: 3<9? 是 → [1,2,4] 返回\n\ncase 2: digits = [9,9,9]\n  i=2: 9<9? 否 → digits[2]=0, 继续\n  i=1: 9<9? 否 → digits[1]=0, 继续\n  i=0: 9<9? 否 → digits[0]=0, 继续\n  循环结束 → return [1] + [0,0,0] = [1,0,0,0]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 最坏情况遍历整个数组 |\n| 空间复杂度 | O(1) — 原地修改，最坏 O(n) 返回新数组 |\n\n**关键思路**\n\n- 从右向左遍历，模拟手工进位\n- 遇到 9 变 0 继续，否则加一返回\n- 循环结束说明全是 9，头部插入 1"
visualizationType = "result"
