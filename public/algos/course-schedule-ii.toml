# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 课程表 II
# 返回一种完成所有课程的顺序（拓扑序）
# prerequisites[i] = [a, b] 表示想学 a 必须先学 b
#
# 示例:
#   numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]
#   一种合法顺序: [0, 2, 1, 3]
#
# 课程依赖关系:
#   1 ← 0        (学 1 前要先学 0)
#   2 ← 0        (学 2 前要先学 0)
#   3 ← 1        (学 3 前要先学 1)
#   3 ← 2        (学 3 前要先学 2)"""
explanation = "**问题分析**\n\n- `numCourses = 4` 表示 4 门课（编号 0~3）\n- `prerequisites = [[1,0],[2,0],[3,1],[3,2]]` 描述先修关系\n- 要求返回**任意一种**合法学习顺序\n- 如果存在环（无法完成所有课程），返回 `[]`\n\n**依赖图**\n\n```\n0 ──→ 1 ──→ 3\n  ╲       ╱\n   ╲     ╱\n    ──→ 2 ──→ (3 也依赖 2)\n```\n\n合法顺序示例：`[0, 2, 1, 3]` 或 `[0, 1, 2, 3]`\n\n> 本题是 **207. 课程表** 的扩展：除了判断能否完成，还需返回一种顺序。"
visualizationType = "intro"

# ── Step 1: 函数签名 + 建图 ──────────────────────────────────
[[algorithm.steps]]
id = 1
title = "签名与建图"
titleEn = "Signature & Build Graph"
code = """# 课程表 II
# 返回一种完成所有课程的顺序（拓扑序）
# prerequisites[i] = [a, b] 表示想学 a 必须先学 b
#
# 示例:
#   numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]
#   一种合法顺序: [0, 2, 1, 3]
#
# 课程依赖关系:
#   1 ← 0        (学 1 前要先学 0)
#   2 ← 0        (学 2 前要先学 0)
#   3 ← 1        (学 3 前要先学 1)
#   3 ← 2        (学 3 前要先学 2)

from typing import List
from collections import deque, defaultdict

def findOrder(numCourses: int, prerequisites: List[List[int]]) -> List[int]:
    \"\"\"返回任意一种课程学习顺序（拓扑序）\"\"\"
    indeg = [0] * numCourses
    graph = defaultdict(list)
    for a, b in prerequisites:
        graph[b].append(a)
        indeg[a] += 1"""
explanation = "**第 1 步：建立数据结构**\n\n- `indeg[i]`：课程 `i` 的入度（先修要求数）\n- `graph[b]`：学完 `b` 之后可以学的课程列表（邻接表）\n- 遍历 `prerequisites`，把每条边 `b → a` 加入图，同时累加 `a` 的入度\n\n**示例初始化后**\n\n```\nindeg = [0, 1, 1, 2]\ngraph = {\n    0: [1, 2],\n    1: [3],\n    2: [3],\n}\n```\n\n> 入度为 0 的课程可以直接学习，作为 BFS 的起点。"
visualizationType = "code-only"

# ── Step 2: 初始化队列 ───────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化队列"
titleEn = "Initialize Queue"
code = """# 课程表 II
# 返回一种完成所有课程的顺序（拓扑序）
# prerequisites[i] = [a, b] 表示想学 a 必须先学 b
#
# 示例:
#   numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]
#   一种合法顺序: [0, 2, 1, 3]
#
# 课程依赖关系:
#   1 ← 0        (学 1 前要先学 0)
#   2 ← 0        (学 2 前要先学 0)
#   3 ← 1        (学 3 前要先学 1)
#   3 ← 2        (学 3 前要先学 2)

from typing import List
from collections import deque, defaultdict

def findOrder(numCourses: int, prerequisites: List[List[int]]) -> List[int]:
    \"\"\"返回任意一种课程学习顺序（拓扑序）\"\"\"
    indeg = [0] * numCourses
    graph = defaultdict(list)
    for a, b in prerequisites:
        graph[b].append(a)
        indeg[a] += 1
    q = deque([i for i in range(numCourses) if indeg[i] == 0])
    order = []"""
explanation = "**第 2 步：准备 BFS 起点**\n\n- `q`：队列，存放当前可以学习的课程（入度为 0）\n- `order`：按学习顺序收集所有弹出的课程\n\n**初始队列**\n\n```\nindeg = [0, 1, 1, 2]\n入度为 0 的课程: [0]\nq = deque([0])\norder = []\n```\n\n> 只有课程 `0` 入度为 0（没有先修要求），所以先学它。"
visualizationType = "code-only"

# ── Step 3: BFS 拓扑排序 ─────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "BFS 拓扑排序"
titleEn = "BFS Topological Sort"
code = """# 课程表 II
# 返回一种完成所有课程的顺序（拓扑序）
# prerequisites[i] = [a, b] 表示想学 a 必须先学 b
#
# 示例:
#   numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]
#   一种合法顺序: [0, 2, 1, 3]
#
# 课程依赖关系:
#   1 ← 0        (学 1 前要先学 0)
#   2 ← 0        (学 2 前要先学 0)
#   3 ← 1        (学 3 前要先学 1)
#   3 ← 2        (学 3 前要先学 2)

from typing import List
from collections import deque, defaultdict

def findOrder(numCourses: int, prerequisites: List[List[int]]) -> List[int]:
    \"\"\"返回任意一种课程学习顺序（拓扑序）\"\"\"
    indeg = [0] * numCourses
    graph = defaultdict(list)
    for a, b in prerequisites:
        graph[b].append(a)
        indeg[a] += 1
    q = deque([i for i in range(numCourses) if indeg[i] == 0])
    order = []
    while q:
        node = q.popleft()
        order.append(node)
        for nb in graph[node]:
            indeg[nb] -= 1
            if indeg[nb] == 0:
                q.append(nb)"""
explanation = "**第 3 步：核心 BFS 循环**\n\n每次循环：\n\n1. 弹出队首课程 `node`，加入 `order`（这就是一种合法的学习顺序）\n2. 遍历 `node` 的所有后继 `nb`，将其入度减 1\n3. 若某后继入度降为 0，说明其先修课全部学完，加入队列\n\n**示例执行**\n\n```\n初始: q=[0], order=[], indeg=[0,1,1,2]\n弹 0: order=[0], indeg[1]=0→入队, indeg[2]=0→入队 → q=[1,2]\n弹 1: order=[0,1], indeg[3]=2→1          → q=[2]\n弹 2: order=[0,1,2], indeg[3]=1→0→入队    → q=[3]\n弹 3: order=[0,1,2,3]                     → q=[]\n结束 → order = [0, 1, 2, 3]\n```\n\n> 注意：因为先加入 `1` 后加入 `2`，结果是 `[0,1,2,3]`。若邻接表顺序不同，可能得到 `[0,2,1,3]`——都是合法解。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 课程表 II
# 返回一种完成所有课程的顺序（拓扑序）
# prerequisites[i] = [a, b] 表示想学 a 必须先学 b
#
# 示例:
#   numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]
#   一种合法顺序: [0, 2, 1, 3]
#
# 课程依赖关系:
#   1 ← 0        (学 1 前要先学 0)
#   2 ← 0        (学 2 前要先学 0)
#   3 ← 1        (学 3 前要先学 1)
#   3 ← 2        (学 3 前要先学 2)

from typing import List
from collections import deque, defaultdict

def findOrder(numCourses: int, prerequisites: List[List[int]]) -> List[int]:
    \"\"\"返回任意一种课程学习顺序（拓扑序）\"\"\"
    indeg = [0] * numCourses
    graph = defaultdict(list)
    for a, b in prerequisites:
        graph[b].append(a)
        indeg[a] += 1
    q = deque([i for i in range(numCourses) if indeg[i] == 0])
    order = []
    while q:
        node = q.popleft()
        order.append(node)
        for nb in graph[node]:
            indeg[nb] -= 1
            if indeg[nb] == 0:
                q.append(nb)
    return order if len(order) == numCourses else []"""
explanation = "**最终结果**\n\n```\n输入: numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]\n输出: [0, 2, 1, 3]\n```\n\n**环检测**\n\n```python\nreturn order if len(order) == numCourses else []\n```\n\n- 若 `len(order) < numCourses`：存在环，无法完成所有课程 → 返回 `[]`\n- 否则 `order` 就是合法的拓扑序\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(V + E) — V 门课程、E 条先修关系 |\n| 空间复杂度 | O(V + E) — 邻接表 + 入度数组 + 队列 |\n\n**关键技巧：弹出的顺序就是拓扑序**\n\n- 入度为 0 的节点没有未完成的先修课，可以立即学习\n- BFS 的弹出顺序天然满足：先学的课一定排在依赖它的课之前"
visualizationType = "result"
visualizationData = { mapContents = "{0 → 1, 0 → 2, 1 → 3, 2 → 3}", arrayState = "[0, 2, 1, 3]", result = "[0, 2, 1, 3]", highlightedIndices = [0, 1, 2, 3] }

[algorithm.summary]
timeComplexity = "O(V + E)"
spaceComplexity = "O(V + E)"
approach = "BFS 拓扑排序 + 记录顺序"
keyInsight = "弹出的顺序就是合法学习顺序；环检测通过 len(order) < numCourses"