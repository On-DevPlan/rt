# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 文本左右对齐
# 给定一个单词数组 words 和一个长度上限 maxWidth
# 将单词重新排版，每行恰好 maxWidth 个字符，左右两端对齐
#
# 规则:
#   1. 每行恰好 maxWidth 个字符
#   2. 非最后一行：空格尽量均匀分布，多出的空格从左到右分配
#   3. 最后一行：左对齐，单词间仅一个空格，行末补空格
#
# 示例:
#   words = ["This","is","an","example","of","text","justification."]
#   maxWidth = 16
#   →
#   "This    is    an"
#   "example  of text"
#   "justification.  " """
explanation = "**问题分析**\n\n给定一个单词数组和一个最大行宽，需要把单词按行排版，每行恰好填满。\n\n**三条核心规则**\n\n1. **每行恰好 `maxWidth` 个字符**（包括单词和空格）\n2. **非最后一行**：在单词之间插入空格，**尽量均分**，剩余的空格**从左到右依次多分一个**\n3. **最后一行**：**左对齐**，单词之间只放一个空格，行末用空格补齐\n\n**示例**\n\n```text\nwords = [\"This\",\"is\",\"an\",\"example\",\"of\",\"text\",\"justification.\"]\nmaxWidth = 16\n```\n\n| 行 | 内容 | 长度 |\n|----|------|------|\n| 1 | `\"This    is    an\"` | 16 |\n| 2 | `\"example  of text\"` | 16 |\n| 3 | `\"justification.  \"` | 16（最后一行，左对齐） |\n\n> 第 3 行末尾的两个空格就是「左对齐 + 行末补齐」的直接体现。"
visualizationType = "intro"

