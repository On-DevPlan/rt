#   words = ["This","is","an","example","of","text","justification."]
#   maxWidth = 16
#   →
#   "This    is    an"
#   "example  of text"
#   "justification.  "

from typing import List

def fullJustify(words: List[str], maxWidth: int) -> List[str]:
    \"\"\"将单词数组按 maxWidth 排版为左右对齐的多行文本。\"\"\"
    res, cur, n = [], [], len(words)
    i = 0
    while i < n:
        j = i
        total = 0
        while j < n and total + len(words[j]) + (j - i) <= maxWidth:
            total += len(words[j])
            j += 1
        line = []
        if j == n or j - i == 1:
            line.append(' '.join(words[i:j]))
            line[0] += ' ' * (maxWidth - len(line[0]))
        else:
            spaces = maxWidth - total
            k, r = divmod(spaces, j - i - 1)
            for p in range(j - i - 1):
                line.append(words[i + p])
                line.append(' ' * (k + (1 if p < r else 0)))
            line.append(words[j - 1])
        res.append(''.join(line))
        i = j
    return res"""
explanation = "**最终结果**\n\n```text\n输入: words = [\"This\",\"is\",\"an\",\"example\",\"of\",\"text\",\"justification.\"],\n      maxWidth = 16\n输出:\n  \"This    is    an\"\n  \"example  of text\"\n  \"justification.  \"\n```\n\n**执行流程回顾**\n\n| i | 单词区间 | total | 行类型 |\n|---|----------|-------|--------|\n| 0 | This, is, an | 7 | 普通行：`spaces=9`，`divmod(9,2)=(4,1)` |\n| 3 | example, of, text | 12 | 普通行：`spaces=4`，`divmod(4,2)=(2,0)` |\n| 6 | justification. | 14 | 最后一行：左对齐 + 行末补 2 空格 |\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个单词最多被内层 while 扫描一次 |\n| 空间复杂度 | O(n) — 结果数组与若干辅助变量 |\n\n**关键技巧**\n\n- **双指针贪心**：每行尽量装满，保证单调推进\n- **`divmod` 一行算「均分 + 余数」**：基础空格 `k` + 前 `r` 个间隙多分 1\n- **末尾单词不参与循环**：避免在最后一个单词后多加空格"
