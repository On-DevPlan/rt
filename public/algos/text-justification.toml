# ── Step 2: 主循环选词 ────────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "主循环选词"
titleEn = "Select Words for a Line"
code = """# 文本左右对齐
# 给定一个单词数组 words 和一个长度上限 maxWidth
# 将单词重新排版，每行恰好 maxWidth 个字符，左右两端对齐
#
# 规则:
#   1. 每行恰好 maxWidth 个字符
#   2. 非最后一行：空格尽量均匀分布，多出的空格从左到右分配
#   3. 最后一行：左对齐，单词间仅一个空格，行末补空格
#
# 示例:
#   words = ["This","is","an","example","of","text","justification."]
#   maxWidth = 16
#   →
#   "This    is    an"
#   "example  of text"
#   "justification.  "

from typing import List

def fullJustify(words: List[str], maxWidth: int) -> List[str]:
    \"\"\"将单词数组按 maxWidth 排版为左右对齐的多行文本。\"\"\"
    res, cur, n = [], [], len(words)
    i = 0
    while i < n:
        j = i
        total = 0
        while j < n and total + len(words[j]) + (j - i) <= maxWidth:
            total += len(words[j])
            j += 1"""
explanation = "**第 2 步：主循环挑选一行能装下的单词**\n\n**算法核心：双指针 + 累计长度**\n\n- 外层 `i` 表示当前行的起始位置，内层 `j` 向右扩展，尝试往当前行塞更多单词\n- 累加条件 `total + len(words[j]) + (j - i) <= maxWidth`：\n  - `total`：当前行所有单词字符数之和\n  - `len(words[j])`：新单词本身的字符数\n  - `(j - i)`：单词之间最少需要的空格数\n- 当条件不满足时停止，`words[i:j]` 就是这一行能装下的全部单词\n\n**示例**\n\n`words = [\"This\",\"is\",\"an\",\"example\",\"of\",\"text\",\"justification.\"]`, `maxWidth = 16`\n\n| 起始 i | 候选 words[i:j] | total | 间隙 | total+空格 | 状态 |\n|--------|-----------------|-------|------|-----------|------|\n| 0 | This, is, an | 7 | 2 | 9 ≤ 16 | 继续 → 停止前 i=0,j=3 |\n| 3 | example, of, text | 12 | 2 | 14 ≤ 16 | 继续 → 停止前 i=3,j=6 |\n| 6 | justification. | 14 | 0 | 14 ≤ 16 | 最后一行 |\n\n> 注意：内层 while 的 `total + len(words[j]) + (j - i)` 用 `(j-i)` 而不是 `(j-i-1)`，\n> 是因为加入 words[j] 后需要预留 j-i 个最小间隙。"
visualizationType = "code-only"

# ── Step 3: 非最后一行空格分配 ────────────────────────────────
[[algorithm.steps]]
id = 3
title = "空格分配"
titleEn = "Distribute Extra Spaces"
code = """# 文本左右对齐
# 给定一个单词数组 words 和一个长度上限 maxWidth
# 将单词重新排版，每行恰好 maxWidth 个字符，左右两端对齐
#
# 规则:
#   1. 每行恰好 maxWidth 个字符
#   2. 非最后一行：空格尽量均匀分布，多出的空格从左到右分配
#   3. 最后一行：左对齐，单词间仅一个空格，行末补空格
#
# 示例:
#   words = ["This","is","an","example","of","text","justification."]
#   maxWidth = 16
#   →
#   "This    is    an"
#   "example  of text"
#   "justification.  "

from typing import List

def fullJustify(words: List[str], maxWidth: int) -> List[str]:
    \"\"\"将单词数组按 maxWidth 排版为左右对齐的多行文本。\"\"\"
    res, cur, n = [], [], len(words)
    i = 0
    while i < n:
        j = i
        total = 0
        while j < n and total + len(words[j]) + (j - i) <= maxWidth:
            total += len(words[j])
            j += 1
        line = []
        if j == n or j - i == 1:
            line.append(' '.join(words[i:j]))
            line[0] += ' ' * (maxWidth - len(line[0]))
        else:
            spaces = maxWidth - total
            k, r = divmod(spaces, j - i - 1)
            for p in range(j - i - 1):
                line.append(words[i + p])
                line.append(' ' * (k + (1 if p < r else 0)))
            line.append(words[j - 1])
        res.append(''.join(line))
        i = j
    return res"""
explanation = "**第 3 步：构造当前行——区分「最后一行 / 单单词行」与「普通行」**\n\n**情况 A：最后一行 或 仅一个单词**\n\n直接用单个空格 `' '.join` 连接，行末补齐到 `maxWidth`：\n\n```python\nline.append(' '.join(words[i:j]))\nline[0] += ' ' * (maxWidth - len(line[0]))\n```\n\n**情况 B：普通行的空格分配**\n\n可分配的空格总数 `spaces = maxWidth - total`，平均分到 `j-i-1` 个间隙：\n\n```python\nk, r = divmod(spaces, j - i - 1)\n# 每个间隙至少 k 个空格，前 r 个间隙再多 1 个\nfor p in range(j - i - 1):\n    line.append(words[i + p])\n    line.append(' ' * (k + (1 if p < r else 0)))\nline.append(words[j - 1])\n```\n\n**示例：第 1 行** `[\"This\", \"is\", \"an\"]`, `total=7`, `spaces=9`, 间隙数=2\n\n`divmod(9, 2) = (4, 1)` → 基础 4 个空格，前 1 个间隙再多 1 个\n\n| p | 单词 | 空格数 |\n|---|------|--------|\n| 0 | This | 5 (=4+1) |\n| 1 | is   | 4 |\n| — | an   | （末尾单词） |\n\n结果：`\"This\" + \"     \" + \"is\" + \"    \" + \"an\"` = `\"This    is    an\"` ✓\n\n> 注意末尾单词 `words[j-1]` 在循环结束后单独追加，避免末尾再加多余空格。"
visualizationType = "code-only"

