# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 矩阵置零
# 给定一个 m x n 的矩阵，如果某元素为 0
# 则把其所在行和列的所有元素都置 0
#
# 要求原地操作：直接修改原矩阵，不能用额外矩阵复制
#
# 示例:
#   输入: [[1,1,1],[1,0,1],[1,1,1]]
#   输出: [[1,0,1],[0,0,0],[1,0,1]]"""
explanation = "**问题分析**\n\n给定一个 m x n 矩阵，如果某个位置 `(i, j)` 是 0，那么第 `i` 行和第 `j` 列所有元素都要变成 0。\n\n**关键约束**\n\n- **原地操作**：必须直接修改原矩阵，不能用额外的矩阵做 copy\n- 难点：如果先把一行置零，再遍历到这一行的 0，就会「污染」信息\n\n**两种解法对比**\n\n| 解法 | 时间 | 空间 | 思路 |\n|------|------|------|------|\n| 两个 set 记录要清零的行/列 | O(mn) | O(m+n) | 易讲清思路 |\n| **用第一行第一列做标记** | **O(mn)** | **O(1)** | 进阶，空间最优 |\n\n> 本题采用 set 法：思路直接、易懂，适合作为入门讲解。"
visualizationType = "intro"

