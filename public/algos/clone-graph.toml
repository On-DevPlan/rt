title = "理解问题"
titleEn = "Understand the Problem"
code = """# 133. 克隆图
# 深拷贝一个无向连通图，每个节点包含：
#   val        — 节点值
#   neighbors  — 邻居节点列表
#
# 要求：返回图的深拷贝，新图与原图结构完全一致但节点是全新对象
#
# 示例（4 节点环）:
#   adjList = [[2,4],[1,3],[2,4],[1,3]]
#     节点 1 → 邻居 [2, 4]
#     节点 2 → 邻居 [1, 3]
#     节点 3 → 邻居 [2, 4]
#     节点 4 → 邻居 [1, 3]
#   结果: [[2,4],[1,3],[2,4],[1,3]]"""
explanation = "**问题分析**\n\n给定一个无向连通图的**邻接表表示**，要求返回它的**深拷贝**。\n\n**难点**\n\n| 难点 | 说明 |\n|------|------|\n| 深拷贝 | 新图节点必须是**全新对象**，与原图完全独立 |\n| 避免重复 | 同一节点可能被多条路径访问 |\n| 处理环 | 图中存在环（如示例的 1-2-3-4-1），递归会陷入死循环 |\n\n**示例图结构（4 节点环）**\n\n```\n    1 ──── 2\n    │      │\n    │      │\n    4 ──── 3\n```\n\n> 关键思路：**DFS + 哈希映射**，用 `visited[原节点] = 新节点` 避免重复克隆和回环。"
visualizationType = "intro"

