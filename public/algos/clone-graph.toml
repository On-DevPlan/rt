        return None
    visited = {}"""
explanation = "**第 1 步：定义数据结构与签名**\n\n```python\nclass Node:\n    def __init__(self, val=0, neighbors=None):\n        self.val = val\n        self.neighbors = neighbors if neighbors is not None else []\n```\n\n- `Node` 类包含 `val` 与 `neighbors` 两个字段\n- `cloneGraph(node)` 接收入口节点，返回克隆后的新节点\n- 边界处理：`node` 为空直接返回 `None`\n- `visited` 字典用于建立 **原节点 → 新节点** 的映射\n\n> `visited` 是解题关键：访问过的节点直接复用，避免重复克隆和回环死循环。"
visualizationType = "code-only"

# ── Step 2: dfs 函数 + base case ──────────────────────────────
[[algorithm.steps]]
id = 2
title = "DFS 函数与基础情况"
titleEn = "DFS Function & Base Case"
code = """# 133. 克隆图
# 深拷贝一个无向连通图，每个节点包含：
#   val        — 节点值
#   neighbors  — 邻居节点列表
#
# 要求：返回图的深拷贝，新图与原图结构完全一致但节点是全新对象
#
# 示例（4 节点环）:
#   adjList = [[2,4],[1,3],[2,4],[1,3]]
#     节点 1 → 邻居 [2, 4]
#     节点 2 → 邻居 [1, 3]
#     节点 3 → 邻居 [2, 4]
#     节点 4 → 邻居 [1, 3]
#   结果: [[2,4],[1,3],[2,4],[1,3]]

from typing import Optional

class Node:
    def __init__(self, val=0, neighbors=None):
        self.val = val
        self.neighbors = neighbors if neighbors is not None else []

def cloneGraph(node: Optional['Node']) -> Optional['Node']:
    \"\"\"深拷贝无向图，返回新根节点\"\"\"
    if not node:
        return None
    visited = {}
    def dfs(orig: 'Node') -> 'Node':
        if orig in visited:
            return visited[orig]"""
explanation = "**第 2 步：定义 DFS 递归函数**\n\n```python\ndef dfs(orig: 'Node') -> 'Node':\n    if orig in visited:\n        return visited[orig]\n```\n\n**base case：已访问过**\n\n- 若 `orig` 已在 `visited` 中，说明此前已经创建过它的克隆\n- **直接返回已存在的克隆节点** —— 这同时解决了两个问题：\n  1. **避免重复克隆**（同一节点被多条路径共享）\n  2. **打破环**（节点 A 递归到 B，B 又递归回 A 时，A 已在 `visited` 中）\n\n> 这是处理图结构（带环）的经典手法 —— 用哈希表充当\"记忆\"。"
visualizationType = "code-only"

# ── Step 3: 创建 copy + 写入 visited + 递归邻居 ──────────────
[[algorithm.steps]]
id = 3
title = "克隆节点与递归邻居"
titleEn = "Clone Node & Recurse on Neighbors"
code = """# 133. 克隆图
# 深拷贝一个无向连通图，每个节点包含：
#   val        — 节点值
#   neighbors  — 邻居节点列表
#
# 要求：返回图的深拷贝，新图与原图结构完全一致但节点是全新对象
#
# 示例（4 节点环）:
#   adjList = [[2,4],[1,3],[2,4],[1,3]]
#     节点 1 → 邻居 [2, 4]
#     节点 2 → 邻居 [1, 3]
#     节点 3 → 邻居 [2, 4]
#     节点 4 → 邻居 [1, 3]
#   结果: [[2,4],[1,3],[2,4],[1,3]]

from typing import Optional

class Node:
    def __init__(self, val=0, neighbors=None):
        self.val = val
        self.neighbors = neighbors if neighbors is not None else []

def cloneGraph(node: Optional['Node']) -> Optional['Node']:
    \"\"\"深拷贝无向图，返回新根节点\"\"\"
    if not node:
        return None
    visited = {}
    def dfs(orig: 'Node') -> 'Node':
        if orig in visited:
            return visited[orig]
        copy = Node(orig.val)
        visited[orig] = copy
        for nb in orig.neighbors:
            copy.neighbors.append(dfs(nb))
        return copy"""
explanation = "**第 3 步：克隆当前节点并递归处理邻居**\n\n```python\ncopy = Node(orig.val)\nvisited[orig] = copy\nfor nb in orig.neighbors:\n    copy.neighbors.append(dfs(nb))\nreturn copy\n```\n\n**三步关键操作**\n\n| 顺序 | 操作 | 目的 |\n|------|------|------|\n| 1 | `copy = Node(orig.val)` | 创建新节点（仅复制值） |\n| 2 | `visited[orig] = copy` | **立即**登记映射（先放 visited 再递归！） |\n| 3 | `for nb in neighbors: copy.neighbors.append(dfs(nb))` | 递归克隆所有邻居并接入 |\n\n> ⚠️ **顺序很关键**：必须先把 `copy` 放入 `visited`，再递归。否则遇到回环（A→B→A）会无限递归。\n\n**执行流程（4 节点环，从节点 1 出发）**\n\n```\ndfs(1) → 创建 1', visited[1]=1'\n        dfs(2) → 创建 2', visited[2]=2'\n                dfs(1) → 命中 visited，返回 1'\n                dfs(3) → 创建 3', visited[3]=3'\n                        dfs(2) → 命中 visited，返回 2'\n                        dfs(4) → 创建 4', visited[4]=4'\n                                dfs(1) → 命中 visited，返回 1'\n                                dfs(3) → 命中 visited，返回 3'\n返回 1'（已挂载全部邻居）\n```"
visualizationType = "code-only"

# ── Step 4: 启动 DFS 并返回结果 ───────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 133. 克隆图
# 深拷贝一个无向连通图，每个节点包含：
#   val        — 节点值
#   neighbors  — 邻居节点列表
#
# 要求：返回图的深拷贝，新图与原图结构完全一致但节点是全新对象
#
# 示例（4 节点环）:
#   adjList = [[2,4],[1,3],[2,4],[1,3]]
#     节点 1 → 邻居 [2, 4]
#     节点 2 → 邻居 [1, 3]
#     节点 3 → 邻居 [2, 4]
#     节点 4 → 邻居 [1, 3]
#   结果: [[2,4],[1,3],[2,4],[1,3]]

from typing import Optional

class Node:
    def __init__(self, val=0, neighbors=None):
        self.val = val
        self.neighbors = neighbors if neighbors is not None else []

def cloneGraph(node: Optional['Node']) -> Optional['Node']:
    \"\"\"深拷贝无向图，返回新根节点\"\"\"
    if not node:
        return None
    visited = {}
    def dfs(orig: 'Node') -> 'Node':
        if orig in visited:
            return visited[orig]
        copy = Node(orig.val)
        visited[orig] = copy
        for nb in orig.neighbors:
            copy.neighbors.append(dfs(nb))
        return copy
    return dfs(node)"""
explanation = "**最终结果**\n\n```\n输入:  adjList = [[2,4],[1,3],[2,4],[1,3]]\n输出:  [[2,4],[1,3],[2,4],[1,3]]\n```\n\n以 `dfs(node)` 启动递归，从入口节点开始克隆并返回克隆后的根节点 —— 由于 `visited` 已正确登记所有映射，整张图都会被完整重建。\n\n**算法复杂度**\n\n| 指标 | 值 | 说明 |\n|------|------|------|\n| 时间复杂度 | O(V + E) | 每个节点和每条边访问一次 |\n| 空间复杂度 | O(V) | 哈希表 + 递归栈 |\n\n**关键技巧回顾**\n\n- `visited[orig] = copy` 在递归邻居**之前**写入 —— 破环\n- base case `if orig in visited: return visited[orig]` —— 复用已克隆节点\n- 克隆节点的 `neighbors` 由递归返回值累加构建\n\n> 💡 同样的思路也可用 BFS 实现：用队列替代递归栈，每出队一个节点就为它的邻居创建克隆并登记。"
visualizationType = "result"
visualizationData = { mapContents = "{1 → 1, 2 → 2, 3 → 3, 4 → 4}", arrayState = "[[2,4],[1,3],[2,4],[1,3]]", result = "[[2,4],[1,3],[2,4],[1,3]]", highlightedIndices = [0, 1, 2, 3] }

[algorithm.summary]
timeComplexity = "O(V + E)"
spaceComplexity = "O(V)  # 哈希表 + 递归栈"
approach = "DFS + 哈希映射"
keyInsight = "visited[orig] = copy 避免重复克隆和回环；递归时先放 visited 再处理邻居，防止邻接回环导致死循环"