# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 只出现一次的数字
# 给定一个非空整数数组，除某个元素只出现一次外，其余每个元素都出现两次
# 找出那个只出现一次的元素
#
# 要求: 线性时间复杂度，仅使用常量额外空间
#
# 示例:
#   输入: [2, 2, 1]
#   输出: 1
#
# 示例:
#   输入: [4, 1, 2, 1, 2]
#   输出: 4"""
explanation = "**问题分析**\n\n给定非空数组，除一个元素外其余都出现两次，找出只出现一次的元素。\n\n**约束条件**\n\n- 线性时间复杂度：O(n)\n- 常量空间复杂度：O(1)\n\n**为什么异或运算可行？**\n\n| 运算 | 结果 |\n|------|------|\n| `a ^ a` | `0` — 相同数异或为 0 |\n| `a ^ 0` | `a` — 任何数与 0 异或为自身 |\n| `a ^ b ^ a` | `b` — 异或满足交换律和结合律 |\n\n> 关键洞察：对所有元素进行异或，成对的数会互相抵消为 0，最后剩下的就是只出现一次的数。"
visualizationType = "intro"

