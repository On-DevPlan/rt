# ── Step 3: 遍历并异或 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历异或"
titleEn = "Iterate and XOR"
code = """# 只出现一次的数字
# 给定一个非空整数数组，除某个元素只出现一次外，其余每个元素都出现两次
# 找出那个只出现一次的元素
#
# 要求: 线性时间复杂度，仅使用常量额外空间
#
# 示例:
#   输入: [2, 2, 1]
#   输出: 1
#
# 示例:
#   输入: [4, 1, 2, 1, 2]
#   输出: 4

from typing import List

def singleNumber(nums: List[int]) -> int:
    \"\"\"返回只出现一次的数字。\"\"\"
    result = 0
    for num in nums:
        result ^= num"""
explanation = "**第 3 步：遍历数组并异或**\n\n- 遍历数组中每个元素 `num`\n- 将 `num` 与 `result` 异或：`result ^= num`\n\n**异或运算特性**\n\n- 交换律：`a ^ b = b ^ a`\n- 结合律：`(a ^ b) ^ c = a ^ (b ^ c)`\n- 自反：`a ^ a = 0`，`a ^ 0 = a`\n\n> 成对的数异或后为 0，互相抵消。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 只出现一次的数字
# 给定一个非空整数数组，除某个元素只出现一次外，其余每个元素都出现两次
# 找出那个只出现一次的元素
#
# 要求: 线性时间复杂度，仅使用常量额外空间
#
# 示例:
#   输入: [2, 2, 1]
#   输出: 1
#
# 示例:
#   输入: [4, 1, 2, 1, 2]
#   输出: 4

from typing import List

def singleNumber(nums: List[int]) -> int:
    \"\"\"返回只出现一次的数字。\"\"\"
    result = 0
    for num in nums:
        result ^= num
    return result"""
explanation = "**最终结果**\n\n✅ 算法完成\n\n```\n输入: [2, 2, 1]\n\n执行过程:\n  result = 0\n  result ^= 2  → result = 2\n  result ^= 2  → result = 0 (2 ^ 2 = 0)\n  result ^= 1  → result = 1 (0 ^ 1 = 1)\n\n输出: 1\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 遍历一次数组 |\n| 空间复杂度 | O(1) — 仅用变量 result |\n\n**核心思想**\n\n利用异或运算性质：\n- `a ^ a = 0`：相同数异或为 0\n- `a ^ 0 = a`：与 0 异或为自身\n- 成对的数互相抵消，剩下的就是只出现一次的数"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[2, 2, 1]", result = "1", highlightedIndices = [2] }

