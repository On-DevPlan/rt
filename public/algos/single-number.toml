# ── Step 3: 遍历并异或 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "遍历异或"
titleEn = "Iterate and XOR"
code = """# 只出现一次的数字
# 给定一个非空整数数组，除某个元素只出现一次外，其余每个元素都出现两次
# 找出那个只出现一次的元素
#
# 要求: 线性时间复杂度，仅使用常量额外空间
#
# 示例:
#   输入: [2, 2, 1]
#   输出: 1
#
# 示例:
#   输入: [4, 1, 2, 1, 2]
#   输出: 4

from typing import List

def singleNumber(nums: List[int]) -> int:
    \"\"\"返回只出现一次的数字。\"\"\"
    result = 0
    for num in nums:
        result ^= num"""
explanation = "**第 3 步：遍历数组并异或**\n\n- 遍历数组中每个元素 `num`\n- 将 `num` 与 `result` 异或：`result ^= num`\n\n**异或运算特性**\n\n- 交换律：`a ^ b = b ^ a`\n- 结合律：`(a ^ b) ^ c = a ^ (b ^ c)`\n- 自反：`a ^ a = 0`，`a ^ 0 = a`\n\n> 成对的数异或后为 0，互相抵消。"
visualizationType = "code-only"

