# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 295. 数据流的中位数
# 动态维护数据流的中位数
#
# 问题: 如何高效地在不断添加数字的数据流中找到中位数？
#
# 示例数据流: [1, 2]
#   添加 1: 中位数 = 1
#   添加 2: 中位数 = (1 + 2) / 2 = 1.5
#
# 核心挑战:
#   - 数据动态增长，不能一次性排序
#   - 需要频繁添加和查询中位数
#   - 奇数个元素: 中位数是中间值
#   - 偶数个元素: 中位数是中间两个值的平均"""
explanation = "**问题分析**\n\n数据流中位数查找的核心难点：\n\n1. **数据动态增长** — 元素逐个到达，无法一次性排序\n2. **频繁操作** — `addNum()` 和 `findMedian()` 会被调用多次\n3. **中位数定义**\n   - 奇数个元素：中间值（如 `[1,2,3]` 的中位数是 `2`）\n   - 偶数个元素：中间两数平均（如 `[1,2]` 的中位数是 `1.5`）\n\n**暴力方法的问题**\n\n| 方法 | addNum | findMedian | 问题 |\n|------|--------|------------|------|\n| 保持有序数组 | O(n) | O(1) | 插入需要移动元素 |\n| 无序数组 + 排序 | O(1) | O(n log n) | 每次查询都排序 |\n\n**双堆解法**\n\n用两个堆将数据分成两半：\n- **最大堆**：存左半边较小的数\n- **最小堆**：存右半边较大的数\n- 堆顶即中位数（或中位数之一）"
visualizationType = "intro"

