from typing import List

class MedianFinder:
    \"\"\"数据流中位数查找器\"\"\"
    def __init__(self):
        self.max_heap = []  # 左半边（最大堆，用负数模拟）
        self.min_heap = []  # 右半边（最小堆）

    def addNum(self, num: int) -> None:
        \"\"\"添加数字\"\"\"
        pass

    def findMedian(self) -> float:
        \"\"\"返回中位数\"\"\"
        pass"""
explanation = "**第 1 步：类定义和双堆初始化**\n\nPython 的 `heapq` 模块只提供最小堆，我们用**负数**模拟最大堆。\n\n```\n数据流: [1, 2, 3, 4, 5]\n\n最大堆(左):    最小堆(右):\n  3                4\n  ↓                ↓\n  1                5\n  2\n\n中位数: (3 + 4) / 2 = 3.5\n```\n\n**双堆设计**\n\n| 堆 | 存储内容 | 堆顶 |\n|------|----------|------|\n| `max_heap` | 左半边较小的数 | 左半边最大值 |\n| `min_heap` | 右半边较大的数 | 右半边最小值 |\n\n> `max_heap` 用负数实现：`heapq.heappush(max_heap, -num)`\n> 堆顶 `-max_heap[0]` 就是左半边的最大值。"
visualizationType = "code-only"

# ── Step 2: addNum - 判断入哪个堆 ────────────────────────────────
[[algorithm.steps]]
id = 2
title = "判断入哪个堆"
titleEn = "Determine Which Heap"
code = """# 295. 数据流的中位数
# 动态维护数据流的中位数
#
# 问题: 如何高效地在不断添加数字的数据流中找到中位数？
#
# 示例数据流: [1, 2]
#   添加 1: 中位数 = 1
#   添加 2: 中位数 = (1 + 2) / 2 = 1.5
#
# 核心挑战:
#   - 数据动态增长，不能一次性排序
#   - 需要频繁添加和查询中位数
#   - 奇数个元素: 中位数是中间值
#   - 偶数个元素: 中位数是中间两个值的平均

import heapq
from typing import List

class MedianFinder:
    \"\"\"数据流中位数查找器\"\"\"
    def __init__(self):
        self.max_heap = []  # 左半边（最大堆，用负数模拟）
        self.min_heap = []  # 右半边（最小堆）

    def addNum(self, num: int) -> None:
        \"\"\"添加数字\"\"\"
        if not self.max_heap or num <= -self.max_heap[0]:
            heapq.heappush(self.max_heap, -num)
        else:
            heapq.heappush(self.min_heap, num)

    def findMedian(self) -> float:
        \"\"\"返回中位数\"\"\"
        pass"""
explanation = "**第 2 步：将数字放入合适的堆**\n\n**判断逻辑**\n\n```python\nif not self.max_heap or num <= -self.max_heap[0]:\n    # 放入左半边（最大堆）\n    heapq.heappush(self.max_heap, -num)\nelse:\n    # 放入右半边（最小堆）\n    heapq.heappush(self.min_heap, num)\n```\n\n| 条件 | 操作 |\n|------|------|\n| `max_heap` 为空 | 放入 `max_heap` |\n| `num <= 左半边最大值` | 放入 `max_heap` |\n| `num > 左半边最大值` | 放入 `min_heap` |\n\n**示例：添加数字 2**\n\n```\n当前状态: max_heap = [-1] (即 {1})\n\n添加 num = 2:\n  比较: 2 <= -max_heap[0] = 1? 否\n  结果: 放入 min_heap\n\n状态: max_heap = {-1}, min_heap = {2}\n```"
visualizationType = "code-only"

# ── Step 3: addNum - 平衡堆大小 ───────────────────────────────────
[[algorithm.steps]]
id = 3
title = "平衡堆大小"
titleEn = "Balance Heap Sizes"
code = """# 295. 数据流的中位数
# 动态维护数据流的中位数
#
# 问题: 如何高效地在不断添加数字的数据流中找到中位数？
#
# 示例数据流: [1, 2]
#   添加 1: 中位数 = 1
#   添加 2: 中位数 = (1 + 2) / 2 = 1.5
#
# 核心挑战:
#   - 数据动态增长，不能一次性排序
#   - 需要频繁添加和查询中位数
#   - 奇数个元素: 中位数是中间值
#   - 偶数个元素: 中位数是中间两个值的平均

import heapq
from typing import List

class MedianFinder:
    \"\"\"数据流中位数查找器\"\"\"
    def __init__(self):
        self.max_heap = []  # 左半边（最大堆，用负数模拟）
        self.min_heap = []  # 右半边（最小堆）

    def addNum(self, num: int) -> None:
        \"\"\"添加数字\"\"\"
        if not self.max_heap or num <= -self.max_heap[0]:
            heapq.heappush(self.max_heap, -num)
        else:
            heapq.heappush(self.min_heap, num)

        # 平衡两个堆的大小
        if len(self.max_heap) > len(self.min_heap) + 1:
            heapq.heappush(self.min_heap, -heapq.heappop(self.max_heap))
        elif len(self.min_heap) > len(self.max_heap):
            heapq.heappush(self.max_heap, -heapq.heappop(self.min_heap))

    def findMedian(self) -> float:
        \"\"\"返回中位数\"\"\"
        pass"""
explanation = "**第 3 步：平衡两个堆的大小**\n\n维护不变式：**两边大小差 ≤ 1**\n\n```python\n# 情况 1: 左边比右边多 2 个以上\nif len(self.max_heap) > len(self.min_heap) + 1:\n    # 从左边移一个到右边\n    heapq.heappush(self.min_heap, -heapq.heappop(self.max_heap))\n\n# 情况 2: 右边比左边多\nelif len(self.min_heap) > len(self.max_heap):\n    # 从右边移一个到左边\n    heapq.heappush(self.max_heap, -heapq.heappop(self.min_heap))\n```\n\n**为什么这样平衡？**\n\n| 状态 | 条件 | 调整 |\n|------|------|------|\n| 左边多 2+ | `len(max_heap) > len(min_heap) + 1` | 左 → 右 |\n| 右边多 1+ | `len(min_heap) > len(max_heap)` | 右 → 左 |\n| 平衡 | 差 ≤ 1 | 不调整 |\n\n> 确保中位数始终在堆顶（奇数）或两个堆顶（偶数）。"
visualizationType = "code-only"

# ── Step 4: 完成 - findMedian 函数 ────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 295. 数据流的中位数
# 动态维护数据流的中位数
#
# 问题: 如何高效地在不断添加数字的数据流中找到中位数？
#
# 示例数据流: [1, 2]
#   添加 1: 中位数 = 1
#   添加 2: 中位数 = (1 + 2) / 2 = 1.5
#
# 核心挑战:
#   - 数据动态增长，不能一次性排序
#   - 需要频繁添加和查询中位数
#   - 奇数个元素: 中位数是中间值
#   - 偶数个元素: 中位数是中间两个值的平均

import heapq
from typing import List

class MedianFinder:
    \"\"\"数据流中位数查找器\"\"\"
    def __init__(self):
        self.max_heap = []  # 左半边（最大堆，用负数模拟）
        self.min_heap = []  # 右半边（最小堆）

    def addNum(self, num: int) -> None:
        \"\"\"添加数字\"\"\"
        if not self.max_heap or num <= -self.max_heap[0]:
            heapq.heappush(self.max_heap, -num)
        else:
            heapq.heappush(self.min_heap, num)

        # 平衡两个堆的大小
        if len(self.max_heap) > len(self.min_heap) + 1:
            heapq.heappush(self.min_heap, -heapq.heappop(self.max_heap))
        elif len(self.min_heap) > len(self.max_heap):
            heapq.heappush(self.max_heap, -heapq.heappop(self.min_heap))

    def findMedian(self) -> float:
        \"\"\"返回中位数\"\"\"
        if len(self.max_heap) > len(self.min_heap):
            return -self.max_heap[0]
        return (-self.max_heap[0] + self.min_heap[0]) / 2"""
explanation = "**最终结果**\n\n✅ 双堆动态维护中位数完成\n\n**中位数计算**\n\n```python\nif len(self.max_heap) > len(self.min_heap):\n    # 奇数：中位数在左半边堆顶\n    return -self.max_heap[0]\nelse:\n    # 偶数：中位数是两个堆顶的平均\n    return (-self.max_heap[0] + self.min_heap[0]) / 2\n```\n\n| 元素个数 | max_heap | min_heap | 中位数 |\n|----------|----------|----------|--------|\n| 1（奇数） | {1} | {} | `1` |\n| 2（偶数） | {1} | {2} | `(1 + 2) / 2 = 1.5` |\n| 3（奇数） | {2, 1} | {3} | `2` |\n\n**算法复杂度**\n\n| 指标 | addNum | findMedian |\n|------|---------|------------|\n| 时间复杂度 | O(log n) | O(1) |\n| 空间复杂度 | O(n) | - |\n\n**核心思想**\n\n- **最大堆** 存左半边，**最小堆** 存右半边\n- 两边大小差 ≤ 1，堆顶即中位数（奇数）或中位数之一（偶数）\n- 每次添加后调整平衡，确保 O(log n) 插入、O(1) 查询"
visualizationType = "result"
visualizationData = { mapContents = "{-1 → 0}", arrayState = "[1, 2]", result = "1.5", highlightedIndices = [0, 1] }

