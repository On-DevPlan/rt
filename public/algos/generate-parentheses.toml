explanation = "**最终结果**\n\n```\n输入: n = 3\n输出: [\"((()))\",\"(()())\",\"(())()\",\"()(())\",\"()()()\"]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | `O(4ⁿ / √n)` — 第 n 个卡特兰数 |\n| 空间复杂度 | `O(n)` — 递归栈深度 |\n\n**两条剪枝的作用**\n\n| 剪枝 | 含义 |\n|------|------|\n| `left < n` | 左括号总数不超过 n |\n| `right < left` | 保证任意前缀合法（左 ≥ 右） |\n\n> 两个剪枝**联合**穷举所有合法组合且**只**枚举合法组合 —— 既完备又高效。\n\n**类比：** 这道题是回溯算法的经典教学题，与「组合」「子集」「排列」并列为回溯四大模板。计数剪枝（`left/right` 计数）替代了「路径/选择列表/结束条件」中的「选择列表」，是本题的关键抽象。"
