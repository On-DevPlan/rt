# ── Step 2: 初始化最小堆 ──────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "初始化堆"
titleEn = "Initialize Heap"
code = """# 合并 K 个升序链表
# 给定 k 个升序链表，将它们合并为一个升序链表
#
# 示例:
#   输入: lists = [[1,4,5], [1,3,4], [2,6]]
#   输出: [1,1,2,3,4,4,5,6]
#
# 链表节点定义:
#   class ListNode:
#       def __init__(self, val=0, next=None):
#           self.val = val
#           self.next = next

import heapq
from typing import List, Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def mergeKLists(lists: List[Optional[ListNode]]) -> Optional[ListNode]:
    \"\"\"合并 k 个升序链表。\"\"\"
    heap = []
    for i, node in enumerate(lists):
        if node:
            heapq.heappush(heap, (node.val, i, node))"""
explanation = "**第 2 步：初始化最小堆**\n\n将所有非空链表的头节点加入堆。\n\n**为什么用 `(val, i, node)` 元组？**\n\n- Python heapq 比较元组时，从左到右逐元素比较\n- 如果两个节点 `val` 相等，继续比较下一个元素\n- 加入索引 `i` 作为「唯一标识符」，避免直接比较 ListNode 对象\n- 元组格式：`(节点值, 链表索引, 节点对象)`\n\n**示例：**\n\n```\nlists = [[1,4,5], [1,3,4], [2,6]]\n\n堆中内容:\n[(1, 0, ListNode(1)), (1, 1, ListNode(1)), (2, 2, ListNode(2))]\n             ↑ 最小堆顶\n```\n\n> 索引 `i` 确保当节点值相同时，堆有稳定的顺序。"
visualizationType = "code-only"

# ── Step 3: 核心循环 ──────────────────────────────────────────
[[algorithm.steps]]
id = 3
title = "合并过程"
titleEn = "Merge Process"
code = """# 合并 K 个升序链表
# 给定 k 个升序链表，将它们合并为一个升序链表
#
# 示例:
#   输入: lists = [[1,4,5], [1,3,4], [2,6]]
#   输出: [1,1,2,3,4,4,5,6]
#
# 链表节点定义:
#   class ListNode:
#       def __init__(self, val=0, next=None):
#           self.val = val
#           self.next = next

import heapq
from typing import List, Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def mergeKLists(lists: List[Optional[ListNode]]) -> Optional[ListNode]:
    \"\"\"合并 k 个升序链表。\"\"\"
    heap = []
    for i, node in enumerate(lists):
        if node:
            heapq.heappush(heap, (node.val, i, node))

    dummy = ListNode(0)
    cur = dummy

    while heap:
        val, i, node = heapq.heappop(heap)
        cur.next = node
        cur = cur.next"""
explanation = "**第 3 步：从堆中取出最小节点**\n\n使用「哨兵节点」技巧简化边界处理：\n\n```python\ndummy = ListNode(0)  # 哨兵节点\ncur = dummy         # 当前指针\n```\n\n**循环逻辑：**\n\n| 步骤 | 操作 |\n|------|------|\n| 1 | `heappop(heap)` 取出最小节点 `(val, i, node)` |\n| 2 | `cur.next = node` 将最小节点接到结果链表 |\n| 3 | `cur = cur.next` 移动当前指针 |\n\n**示例执行过程：**\n\n```\n初始堆: [(1,0,1), (1,1,1), (2,2,2)]\n\n第1次: 取出 (1,0,1) → 结果: 1 →\n       堆: [(1,1,1), (2,2,2)]\n\n第2次: 取出 (1,1,1) → 结果: 1 → 1 →\n       堆: [(2,2,2)]\n\n第3次: 取出 (2,2,2) → 结果: 1 → 1 → 2 →\n       堆: [(3,1,3), (4,0,4)]  (next 入堆)\n```"
visualizationType = "code-only"

# ── Step 4: 入堆下一个节点 ────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "处理下一个节点"
titleEn = "Process Next Node"
code = """# 合并 K 个升序链表
# 给定 k 个升序链表，将它们合并为一个升序链表
#
# 示例:
#   输入: lists = [[1,4,5], [1,3,4], [2,6]]
#   输出: [1,1,2,3,4,4,5,6]
#
# 链表节点定义:
#   class ListNode:
#       def __init__(self, val=0, next=None):
#           self.val = val
#           self.next = next

import heapq
from typing import List, Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def mergeKLists(lists: List[Optional[ListNode]]) -> Optional[ListNode]:
    \"\"\"合并 k 个升序链表。\"\"\"
    heap = []
    for i, node in enumerate(lists):
        if node:
            heapq.heappush(heap, (node.val, i, node))

    dummy = ListNode(0)
    cur = dummy

    while heap:
        val, i, node = heapq.heappop(heap)
        cur.next = node
        cur = cur.next
        if node.next:
            heapq.heappush(heap, (node.next.val, i, node.next))"""
explanation = "**第 4 步：将 next 节点入堆**\n\n取出当前节点后，如果它有后继节点 `node.next`，则将后继节点加入堆。\n\n**关键点：保持相同的索引 `i`**\n\n```python\nif node.next:\n    heapq.heappush(heap, (node.next.val, i, node.next))\n```\n\n使用同一个 `i` 可以保持该链表的「唯一标识符」不变。\n\n**为什么堆大小最多为 k？**\n\n- 初始时：堆中最多 k 个节点（每个链表一个）\n- 每次循环：pop 1 个，最多 push 1 个\n- 因此堆大小始终 ≤ k\n\n| 指标 | 值 |\n|------|------|\n| 堆的大小 | 最多 k |\n| 每次 heappop/heappush | O(log k) |\n| 总时间复杂度 | O(N log k) |\n\n> 当堆为空（`heap = []`）时，所有节点都已处理，循环结束。"
visualizationType = "code-only"

# ── Step 5: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 5
title = "完成"
titleEn = "Complete"
code = """# 合并 K 个升序链表
# 给定 k 个升序链表，将它们合并为一个升序链表
#
# 示例:
#   输入: lists = [[1,4,5], [1,3,4], [2,6]]
#   输出: [1,1,2,3,4,4,5,6]
#
# 链表节点定义:
#   class ListNode:
#       def __init__(self, val=0, next=None):
#           self.val = val
#           self.next = next

import heapq
from typing import List, Optional

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def mergeKLists(lists: List[Optional[ListNode]]) -> Optional[ListNode]:
    \"\"\"合并 k 个升序链表。\"\"\"
    heap = []
    for i, node in enumerate(lists):
        if node:
            heapq.heappush(heap, (node.val, i, node))

    dummy = ListNode(0)
    cur = dummy

    while heap:
        val, i, node = heapq.heappop(heap)
        cur.next = node
        cur = cur.next
        if node.next:
            heapq.heappush(heap, (node.next.val, i, node.next))

    return dummy.next"""
explanation = "**最终结果**\n\n✅ 合并完成，返回 `dummy.next`（即合并后的链表头）\n\n```\n输入: [[1,4,5], [1,3,4], [2,6]]\n输出: [1,1,2,3,4,4,5,6]\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(N log k) — N 个节点，每次堆操作 O(log k) |\n| 空间复杂度 | O(k) — 堆的大小最多为 k |\n\n**关键技巧**\n\n1. **哨兵节点**：简化边界处理，无需特殊判断头节点\n2. **元组比较**：`(val, i, node)` 避免 ListNode 直接比较\n3. **堆的大小控制**：始终保持 ≤ k，保证效率\n\n> 优先队列方法在 k 较小时性能优异，当 k 很大时可考虑分治法进一步优化。"
