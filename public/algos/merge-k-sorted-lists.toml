# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 合并 K 个升序链表
# 给定 k 个升序链表，将它们合并为一个升序链表
#
# 示例:
#   输入: lists = [[1,4,5], [1,3,4], [2,6]]
#   输出: [1,1,2,3,4,4,5,6]
#
# 链表节点定义:
#   class ListNode:
#       def __init__(self, val=0, next=None):
#           self.val = val
#           self.next = next"""
explanation = "**问题重述** — 给定 k 个升序链表的头节点，将其合并为一个升序链表并返回头节点。\n\n**输入与输出**\n- 输入：k 个升序链表（以头节点列表 `lists` 给出），k ≥ 0，可能包含空链表\n- 输出：合并后的单个升序链表的头节点\n- 边界情况：k = 0 时返回 `None`；某个链表为空时跳过；所有链表都为空时返回 `None`\n\n**示例走查**（testCase: `lists = [[1,4,5],[1,3,4],[2,6]]`，expectedOutput: `[1,1,2,3,4,4,5,6]`）\n- lists[0] = [1,4,5]，lists[1] = [1,3,4]，lists[2] = [2,6]\n- 初始堆压入三个头节点：[(1,0,node), (1,1,node), (2,2,node)]\n- 第 1 次弹出：最小值 1（来自 lists[0]） → 结果 [1]，push lists[0].next=4 → 堆变为 [(1,1,node), (2,2,node), (4,0,node)]\n- 第 2 次弹出：最小值 1（来自 lists[1]） → 结果 [1,1]，push lists[1].next=3 → 堆变为 [(2,2,node), (3,1,node), (4,0,node)]\n- 第 3 次弹出：最小值 2（来自 lists[2]） → 结果 [1,1,2]，push lists[2].next=6 → 堆变为 [(3,1,node), (4,0,node), (6,2,node)]\n- 依此类推，最终合并为 [1,1,2,3,4,4,5,6]\n\n**关键洞察**\n- 堆中最多同时有 k 个元素（每条链表最多一个代表节点），因此每次 heappop/heappush 为 O(log k)\n- 必须用 `(val, i, node)` 三元组而非 `(val, node)` 入堆，否则当两个节点 val 相同时无法比较 ListNode 对象\n- 每次弹出堆顶后，将其所属链表的下一个节点入堆，保持堆的活性\n\n**方法预览**\n- 数据结构：最小堆（优先队列）\n- 时间复杂度：O(N log k)，N 为总节点数，k 为链表数\n- 空间复杂度：O(k)，堆最多 k 个元素\n- 替代方案：分治法（两两合并），时间同样 O(N log k)，空间 O(log k)"
visualizationType = "intro"

