# ── Step0:理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id =0
title = "理解问题"
titleEn = "Understand the Problem"
code = """#环形链表
# 给定一个链表的头节点 head，判断链表中是否有环。
# 如果链表中有某个节点，可以通过连续跟踪 next指针再次到达，
# 则链表中存在环。
#
# 示例:
# head = [3,2,0,-4]，pos =1
#链表中存在环：尾节点 -4 的 next指向索引1 的节点（值为2）
# 返回 true
#
#进阶：能否用 O(1)内存解决？"""
explanation = """**问题分析**

给定链表头节点 `head`，判断链表中**是否存在环**。

**两种思路**

|思路 | 数据结构 | 时间 |空间 |
|------|----------|------|------|
|哈希表 visited | `set` | O(n) | O(n) |
| **Floyd 快慢指针** | 仅两个指针 | **O(n)** | **O(1)** |

下面采用 **Floyd 快慢指针** 解法：

>想象两个运动员在环形跑道上跑步——
> 一个跑得快，一个跑得慢。如果跑道是环形（无尽头），
> 快的人一定会从后面追上慢的人，两人相遇。
> 如果跑道是直线（有尽头），快的人会先到达终点。"""
visualizationType = "intro"

