# ── Step0:理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id =0
title = "理解问题"
titleEn = "Understand the Problem"
code = """#环形链表
# 给定一个链表的头节点 head，判断链表中是否有环。
# 如果链表中有某个节点，可以通过连续跟踪 next指针再次到达，
# 则链表中存在环。
#
# 示例:
# head = [3,2,0,-4]，pos =1
#链表中存在环：尾节点 -4 的 next指向索引1 的节点（值为2）
# 返回 true
#
#进阶：能否用 O(1)内存解决？"""
explanation = "**问题重述**\n\n给定一个链表的头节点 `head`，判断该链表中是否存在环。如果链表中的某个节点可以通过连续跟踪 `next` 指针被再次访问到，则说明链表中存在环，返回 `true`；否则返回 `false`。\n\n**输入与输出**\n\n- 输入：`head` —— 链表的头节点，可能为 `None`。\n- 输出：布尔值，`true` 表示链表存在环，`false` 表示不存在。\n- 边界：空链表或只有一个节点且无环时，返回 `false`；题目用 `pos` 描述环的入口位置（`-1` 表示无环），实际代码中不会直接传入 `pos`。\n\n**示例走查**\n\n以题目给出的 `head = [3, 2, 0, -4], pos = 1` 为例：\n\n- 链表包含 4 个节点，值依次为 `3 → 2 → 0 → -4`。\n- 尾节点 `-4` 的 `next` 指向索引为 `1` 的节点（值为 `2`），形成一个从 `2` 出发回到 `2` 的环。\n- 因此链表中存在环，返回 `true`，即 `expectedOutput = \"true\"`。\n\n**关键洞察**\n\n> 判断链表是否有环，最经典的方法是 **Floyd 快慢指针**：让 `slow` 每次走 1 步、`fast` 每次走 2 步。如果链表无环，`fast` 会先到达末尾；如果链表有环，`fast` 进入环后每轮相对 `slow` 逼近 1 步，由于环内节点有限，二者必然相遇。该方法只需两个指针，空间复杂度为 O(1)。\n\n**方法预览**\n\n| 项目 | 内容 |\n|------|------|\n| 算法 | Floyd 快慢指针判环 |\n| 时间复杂度 | O(n) |\n| 空间复杂度 | O(1) |"
visualizationType = "intro"

