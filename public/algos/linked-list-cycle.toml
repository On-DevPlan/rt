#进阶：能否用 O(1)内存解决？

from typing import Optional

class ListNode:
 def __init__(self, x):
 self.val = x
 self.next = None

def hasCycle(head: Optional[ListNode]) -> bool:
 \"\"\"判断链表是否存在环，存在返回 True。\"\"\"
 slow = fast = head
 pass"""
explanation = """**第2步：初始化快慢指针**

```python
slow = fast = head
```

两个指针**都从 head出发**：

|指针 |步长 |含义 |
|------|------|------|
| `slow` | 每轮走1步 |慢指针 |
| `fast` | 每轮走2步 | 快指针 |

> 同时起步、同一起点。后续每轮 `fast` 比 `slow` 多走一步，
>距离差距随轮次线性增长，这是「快指针最终追上慢指针」的几何基础。"""
visualizationType = "code-only"

# ── Step3:循环与相遇 ────────────────────────────────────────
[[algorithm.steps]]
id =3
title = "循环与相遇"
titleEn = "Loop and Meet"
code = """#环形链表
# 给定一个链表的头节点 head，判断链表中是否有环。
# 如果链表中有某个节点，可以通过连续跟踪 next指针再次到达，
# 则链表中存在环。
#
# 示例:
# head = [3,2,0,-4]，pos =1
#链表中存在环：尾节点 -4 的 next指向索引1 的节点（值为2）
# 返回 true
#
#进阶：能否用 O(1)内存解决？

from typing import Optional

class ListNode:
 def __init__(self, x):
 self.val = x
 self.next = None

def hasCycle(head: Optional[ListNode]) -> bool:
 \"\"\"判断链表是否存在环，存在返回 True。\"\"\"
 slow = fast = head
 while fast and fast.next:
 slow = slow.next
 fast = fast.next.next
 if slow is fast:
 return True
 pass"""
explanation = """**第3步：循环推进 +相遇判定**

```python
while fast and fast.next:
 slow = slow.next
 fast = fast.next.next
 if slow is fast:
 return True
```

**为什么循环条件是 `fast and fast.next`？**

`fast`每次走两步，所以必须保证 `fast` 和 `fast.next`都不为 `None`，
否则会出现 `AttributeError`。

**为什么有环就一定相遇？**

|情况 | 结果 |
|------|------|
| 无环 | `fast` 先走到 `None` →循环退出 |
| 有环 | `fast` 进入环后，每轮追 `slow` 一步；环是有限集合，必然追到 |

> 设 `fast` 进入环时距 `slow` 为 `k`，每轮差距减1，
> 至多 `k`轮后 `fast`追上 `slow`——**鸽巢原理**。

> `is` 比较的是**对象身份**（同一节点），不是值相等；
>链表节点用 `is` 更准确。"""
visualizationType = "code-only"

# ── Step4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id =4
title = "完成"
titleEn = "Complete"
code = """#环形链表
# 给定一个链表的头节点 head，判断链表中是否有环。
# 如果链表中有某个节点，可以通过连续跟踪 next指针再次到达，
# 则链表中存在环。
#
# 示例:
# head = [3,2,0,-4]，pos =1
#链表中存在环：尾节点 -4 的 next指向索引1 的节点（值为2）
# 返回 true
#
#进阶：能否用 O(1)内存解决？

from typing import Optional

class ListNode:
 def __init__(self, x):
 self.val = x
 self.next = None

def hasCycle(head: Optional[ListNode]) -> bool:
 \"\"\"判断链表是否存在环，存在返回 True。\"\"\"
 slow = fast = head
 while fast and fast.next:
 slow = slow.next
 fast = fast.next.next
 if slow is fast:
 return True
 return False"""
explanation = """**最终结果**

退出循环有两种情况：

|退出原因 |含义 | 返回 |
|----------|------|------|
| `slow is fast` | 在环内相遇 | `True` |
| `fast` 或 `fast.next` 为 `None` |链表无环，走到尽头 | `False` |

**示例追踪**：`head = [3,2,0,-4]`，`pos =1`（-4 →2）

```
初始: slow=3, fast=3
step1: slow=2, fast=0
step2: slow=0, fast=2 (fast: -4 →2)
step3: slow=-4, fast=0 (fast:2 →0)
step4: slow=2, fast=2 ←相遇！return True ✓
```

**复杂度**

|指标 | 值 | 说明 |
|------|------|------|
| 时间复杂度 | **O(n)** | 至多走2n步 |
|空间复杂度 | **O(1)** | 仅两个指针 |

**核心洞察**

>环是有限集合，快指针每轮相对慢指针逼近一步，
>鸽巢原理保证二者必然在环内相遇——**有环必遇、无环必止**。"""
