# ── Step 0: 理解问题 ──────────────────────────────────────────
[[algorithm.steps]]
id = 0
title = "理解问题"
titleEn = "Understand the Problem"
code = """# 236. 二叉树的最近公共祖先
# 给定一棵二叉树，找到两个指定节点 p 和 q 的最近公共祖先（LCA）
# 最近公共祖先: 两个节点的祖先集合中深度最大的那个（包含节点自身）
#
# 示例:
#   root = [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4]
#   树结构:
#             3
#           /   \\
#          5     1
#         / \\   / \\
#        6   2 0   8
#           / \\
#          7   4
#   p = 5, q = 1
#   路径:
#     5 -> 3
#     1 -> 3
#   共同祖先只有 3，所以 LCA = 3"""
explanation = "**问题分析**\n\n给定一棵二叉树和两个节点 `p`、`q`，找到它们的**最近公共祖先**（LCA）。\n\n**LCA 定义**\n\n- 同时是 `p` 和 `q` 的祖先节点（节点自身也算自己的祖先）\n- 在所有公共祖先中**深度最大**\n\n**示例输入**\n\n```\nroot = [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p = 5, q = 1\n\n            3\n          /   \\\\\n         5     1\n        / \\\\   / \\\\\n       6   2 0   8\n          / \\\\\n         7   4\n```\n\n**为什么答案是 `3`？**\n\n- `5` 的祖先：`5, 3`\n- `1` 的祖先：`1, 3`\n- 公共祖先：`3`\n- 深度最大的就是 `3`\n\n> **关键观察**：LCA 出现有 3 种情形：\n> 1. `p`、`q` 分别在当前节点的左右子树\n> 2. 当前节点是 `p`，`q` 在其子树中\n> 3. 当前节点是 `q`，`p` 在其子树中"
visualizationType = "intro"

# ── Step 1: 签名 + TreeNode + base case ──────────────────────
[[algorithm.steps]]
id = 1
title = "签名与 base case"
titleEn = "Signature & Base Case"
code = """# 236. 二叉树的最近公共祖先
# 给定一棵二叉树，找到两个指定节点 p 和 q 的最近公共祖先（LCA）
# 最近公共祖先: 两个节点的祖先集合中深度最大的那个（包含节点自身）
#
# 示例:
#   root = [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4]
#   树结构:
#             3
#           /   \\
#          5     1
#         / \\   / \\
#        6   2 0   8
#           / \\
#          7   4
#   p = 5, q = 1
#   路径:
#     5 -> 3
#     1 -> 3
#   共同祖先只有 3，所以 LCA = 3

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def lowestCommonAncestor(root: Optional[TreeNode], p: TreeNode, q: TreeNode) -> Optional[TreeNode]:
    \"\"\"返回 p 和 q 的最近公共祖先。\"\"\"
    if not root or root == p or root == q:
        return root"""
explanation = "**第 1 步：定义结构 + base case**\n\n```python\nif not root or root == p or root == q:\n    return root\n```\n\n**三种 base case 合一**\n\n| 条件 | 含义 | 返回 |\n|------|------|------|\n| `not root` | 空子树 | `None` — 没找到目标 |\n| `root == p` | 当前节点就是 p | `root` — 把 p 向上传递 |\n| `root == q` | 当前节点就是 q | `root` — 把 q 向上传递 |\n\n> 把\"找到 p 或 q\"也作为 base case 处理，是因为后续的合并逻辑需要**子树的返回值**来识别 LCA 出现的位置。\n\n**为什么 `root == p` 用等值比较即可？**\n\n- 题目保证 p、q 是树中**不同的节点**，且 `p != q`\n- 节点对象身份由 val 唯一标识，所以 `==` 与 `is` 等价"
visualizationType = "code-only"

# ── Step 2: 递归左右子树 ─────────────────────────────────────
[[algorithm.steps]]
id = 2
title = "递归左右子树"
titleEn = "Recurse Left & Right"
code = """# 236. 二叉树的最近公共祖先
# 给定一棵二叉树，找到两个指定节点 p 和 q 的最近公共祖先（LCA）
# 最近公共祖先: 两个节点的祖先集合中深度最大的那个（包含节点自身）
#
# 示例:
#   root = [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4]
#   树结构:
#             3
#           /   \\
#          5     1
#         / \\   / \\
#        6   2 0   8
#           / \\
#          7   4
#   p = 5, q = 1
#   路径:
#     5 -> 3
#     1 -> 3
#   共同祖先只有 3，所以 LCA = 3

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def lowestCommonAncestor(root: Optional[TreeNode], p: TreeNode, q: TreeNode) -> Optional[TreeNode]:
    \"\"\"返回 p 和 q 的最近公共祖先。\"\"\"
    if not root or root == p or root == q:
        return root
    left = lowestCommonAncestor(root.left, p, q)
    right = lowestCommonAncestor(root.right, p, q)"""
explanation = "**第 2 步：后序遍历 — 先递归再合并**\n\n```python\nleft  = lowestCommonAncestor(root.left, p, q)\nright = lowestCommonAncestor(root.right, p, q)\n```\n\n**为什么是后序（左右根）？**\n\n- LCA 的判定**依赖子树信息**：必须先知道左右子树是否分别包含 p、q\n- 前序遍历无法在根节点处立即获得子树结果\n\n**`left` 和 `right` 的取值含义**\n\n| 取值 | 含义 |\n|------|------|\n| `None` | 子树里既没找到 p 也没找到 q |\n| 非空（=p） | 子树里找到了 p（且没找到 q） |\n| 非空（=q） | 子树里找到了 q（且没找到 p） |\n| 非空（=某个祖先） | 该子树内部已经找到了 LCA |\n\n> 递归的本质：**把\"是否找到\"的状态从叶子向上传递**。"
visualizationType = "code-only"

# ── Step 3: 合并：判断 LCA + 返回 ─────────────────────────────
[[algorithm.steps]]
id = 3
title = "合并并返回 LCA"
titleEn = "Combine & Return LCA"
code = """# 236. 二叉树的最近公共祖先
# 给定一棵二叉树，找到两个指定节点 p 和 q 的最近公共祖先（LCA）
# 最近公共祖先: 两个节点的祖先集合中深度最大的那个（包含节点自身）
#
# 示例:
#   root = [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4]
#   树结构:
#             3
#           /   \\
#          5     1
#         / \\   / \\
#        6   2 0   8
#           / \\
#          7   4
#   p = 5, q = 1
#   路径:
#     5 -> 3
#     1 -> 3
#   共同祖先只有 3，所以 LCA = 3

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def lowestCommonAncestor(root: Optional[TreeNode], p: TreeNode, q: TreeNode) -> Optional[TreeNode]:
    \"\"\"返回 p 和 q 的最近公共祖先。\"\"\"
    if not root or root == p or root == q:
        return root
    left = lowestCommonAncestor(root.left, p, q)
    right = lowestCommonAncestor(root.right, p, q)
    if left and right:
        return root
    return left or right"""
explanation = "**第 3 步：合并 — 关键判定**\n\n```python\nif left and right:\n    return root\nreturn left or right\n```\n\n**为什么 `left and right` 时当前 root 就是 LCA？**\n\n- `left` 非空 → 左子树里**找到了 p 或 q**（或在左子树内部已发现 LCA）\n- `right` 非空 → 右子树里**找到了另一个**（或右子树内部已发现 LCA）\n- 既然 p、q 分别位于当前节点的左右两侧，那**当前节点就是它们的最近公共祖先**\n\n**为什么要 `return left or right`？**\n\n| 情况 | left | right | 返回 |\n|------|------|-------|------|\n| p、q 分居两侧 | 非空 | 非空 | `root`（上一步已处理） |\n| 两者都在左子树 | p/q/LCA | None | `left` — 沿左子树继续上传 |\n| 两者都在右子树 | None | p/q/LCA | `right` — 沿右子树继续上传 |\n| 当前 root 是 p/q | None | None | 已由 base case 返回 |\n\n> `left or right` 把\"找到的目标\"或\"子树内部已确定的 LCA\"**原封不动地向上传递**。"
visualizationType = "code-only"

# ── Step 4: 完成 ──────────────────────────────────────────────
[[algorithm.steps]]
id = 4
title = "完成"
titleEn = "Complete"
code = """# 236. 二叉树的最近公共祖先
# 给定一棵二叉树，找到两个指定节点 p 和 q 的最近公共祖先（LCA）
# 最近公共祖先: 两个节点的祖先集合中深度最大的那个（包含节点自身）
#
# 示例:
#   root = [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4]
#   树结构:
#             3
#           /   \\
#          5     1
#         / \\   / \\
#        6   2 0   8
#           / \\
#          7   4
#   p = 5, q = 1
#   路径:
#     5 -> 3
#     1 -> 3
#   共同祖先只有 3，所以 LCA = 3

from typing import Optional

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def lowestCommonAncestor(root: Optional[TreeNode], p: TreeNode, q: TreeNode) -> Optional[TreeNode]:
    \"\"\"返回 p 和 q 的最近公共祖先。\"\"\"
    if not root or root == p or root == q:
        return root
    left = lowestCommonAncestor(root.left, p, q)
    right = lowestCommonAncestor(root.right, p, q)
    if left and right:
        return root
    return left or right"""
explanation = "**最终结果**\n\n```\n输入: root = [3,5,1,6,2,0,8,null,null,7,4], p = 5, q = 1\n输出: 3\n```\n\n**执行回溯（关键节点）**\n\n```\ndfs(6):  触发 base case root == p? 否 → 递归 left/right 都 None → return None\ndfs(7):  触发 base case → return 7   (但本题 p=5，所以这里返回 None)\ndfs(4):  同上 → return None\ndfs(2):  left=7(实际为None), right=None → return None or None = None\ndfs(5):  触发 base case root == p (5==5) → return 5   ← 命中 p\ndfs(0):  return None\ndfs(8):  return None\ndfs(1):  触发 base case root == q (1==1) → return 1   ← 命中 q\ndfs(3):  left=5 (非空), right=1 (非空) → return 3       ← LCA!\n```\n\n**算法复杂度**\n\n| 指标 | 值 |\n|------|------|\n| 时间复杂度 | O(n) — 每个节点最多访问一次 |\n| 空间复杂度 | O(h) — h 为树高（递归栈） |\n\n**关键洞察**\n\n- LCA = **左右子树各自找到一目标** → 当前节点\n- base case 同时处理 `root == p/q`，让\"找到\"的状态自然向上冒泡\n- `left or right` 把单侧结果无修改地向上传递"
visualizationType = "result"
visualizationData = { mapContents = "{}", arrayState = "[3, 5, 1, 6, 2, 0, 8, 7, 4]", result = "3", highlightedIndices = [0] }

