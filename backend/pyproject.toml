[project]
name = "rt-backend"
version = "0.1.0"
description = "Generic FastAPI backend for the rt project (TTS + SICAU timetable)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "edge-tts>=7.2.8",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "respx>=0.23.1",
]
