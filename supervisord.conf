[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; mihomo 边车：priority 10 先于 backend 启动。首启无配置时复制镜像内烤好的
; stub（空节点 + MATCH,DIRECT），既不覆盖用户已有配置，也让 mihomo 无订阅可空跑。
[program:mihomo]
command=sh -c 'test -f /data/mihomo/config.yaml || { mkdir -p /data/mihomo && cp /app/mihomo-base.yaml /data/mihomo/config.yaml; }; exec /usr/local/bin/mihomo -d /data/mihomo -f /data/mihomo/config.yaml'
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/mihomo.err.log
stdout_logfile=/var/log/mihomo.out.log

[program:backend]
command=uv --directory /app/backend run uvicorn rt_backend.main:app --host 0.0.0.0 --port 8080
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=3
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
